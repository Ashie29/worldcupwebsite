<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ WC 2026 Fantasy Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── Reset & variables ───────────────────────────────────────── */
:root{
  --bg:#0a0a0a;--card:#111111;--card2:#181818;
  --gold:#e8d5a3;--gold2:#c4a96a;
  --text:#f0ede8;--muted:#6b6660;--faint:#2a2a2a;
  --border:rgba(232,213,163,0.14);--border2:rgba(255,255,255,0.07);
  --green:#4CAF50;--red:#d94f3d;--blue:#1a4a7a;--purple:#5b21b6;
  --radius:0px;
  --mono:'DM Mono',monospace;
  --sans:'DM Sans',sans-serif;
  --display:'Bebas Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{overflow-x:hidden;max-width:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);
  font-weight:300;min-height:100vh;overflow-x:hidden;max-width:100%;}
/* noise overlay */
body::before{content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity:0.025;pointer-events:none;z-index:9000;}
a{color:var(--gold);text-decoration:none;}

/* ── Nav ─────────────────────────────────────────────────────── */
.nav{background:rgba(10,10,10,0.95);border-bottom:1px solid var(--border2);
  display:flex;align-items:center;gap:2px;padding:0 20px;
  position:sticky;top:0;z-index:100;height:52px;overflow-x:auto;
  backdrop-filter:blur(12px);}
.nav-brand{font-family:var(--display);letter-spacing:0.1em;color:var(--gold);
  font-size:22px;margin-right:16px;white-space:nowrap;flex-shrink:0;}
.nav-tab{background:transparent;border:none;color:var(--muted);cursor:pointer;
  padding:6px 14px;font-size:11px;white-space:nowrap;transition:color .2s;
  font-family:var(--mono);letter-spacing:0.12em;text-transform:uppercase;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{color:var(--gold);border-bottom:1px solid var(--gold);}
.nav-tabs{display:flex;align-items:center;flex:1;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-user{font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:0.08em;}
.nav-signout{background:transparent;border:1px solid var(--faint);color:var(--muted);
  cursor:pointer;padding:5px 12px;font-size:10px;font-family:var(--mono);
  letter-spacing:0.1em;text-transform:uppercase;transition:all .2s;}
.nav-signout:hover{border-color:var(--red);color:var(--red);}

/* ── Layout ──────────────────────────────────────────────────── */
.page{max-width:900px;margin:0 auto;padding:32px 20px 80px;}
.page.page-dashboard{max-width:1240px;}
.page-title{font-family:var(--display);color:var(--gold);font-size:42px;
  letter-spacing:0.06em;margin-bottom:24px;line-height:1;}

/* ── Dashboard side-by-side layout ──────────────────────────────── */
.dashboard-grid{display:flex;flex-direction:row-reverse;gap:24px;align-items:flex-start;}
.dashboard-main{flex:1;min-width:0;}
.dashboard-side{width:300px;flex-shrink:0;}
@media (max-width:1100px){
  .dashboard-grid{flex-direction:column;align-items:stretch;}
  .dashboard-side{width:100%;}
}

/* ── Cards ───────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border2);padding:20px;margin-bottom:16px;box-sizing:border-box;word-break:break-word;}
.card-title{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--gold);
  margin-bottom:16px;letter-spacing:0.2em;text-transform:uppercase;
  display:flex;align-items:center;gap:12px;}
.card-title::before{content:'';width:24px;height:1px;background:var(--gold);}

/* ── Buttons ─────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;
  padding:10px 22px;border:none;cursor:pointer;
  font-size:10px;font-weight:500;transition:all .15s;
  font-family:var(--mono);letter-spacing:0.15em;text-transform:uppercase;}
.btn-gold{background:var(--gold);color:var(--bg);}
.btn-gold:hover{background:var(--gold2);}
.btn-outline{background:transparent;color:var(--muted);border:1px solid var(--faint);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}
.btn-sm{padding:5px 14px;font-size:10px;}
.btn-danger{background:rgba(217,79,61,.12);color:var(--red);border:1px solid var(--red);}
.btn-danger:hover{background:rgba(217,79,61,.25);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ── Inputs ──────────────────────────────────────────────────── */
.input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border2);
  color:var(--text);padding:12px 14px;font-size:14px;font-family:var(--sans);font-weight:300;
  outline:none;transition:border-color .2s;}
.input:focus{border-color:var(--gold);}
.input::placeholder{color:var(--faint);}
.input option{background:#1e1e1e;color:#f0ede8;}
.label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;
  font-family:var(--mono);letter-spacing:0.15em;text-transform:uppercase;}
.field{margin-bottom:14px;}
.err-box{background:rgba(217,79,61,.08);border:1px solid rgba(217,79,61,.3);
  color:#e88a80;padding:10px 14px;font-size:12px;margin-bottom:12px;}
.ok-box{background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.3);
  color:#a5d6a7;padding:10px 14px;font-size:12px;margin-bottom:12px;}

/* ── Pill selector (round tabs) ───────────────────────────────── */
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.pill{background:transparent;border:1px solid var(--faint);color:var(--muted);
  cursor:pointer;padding:5px 14px;font-size:10px;font-weight:500;
  transition:all .2s;font-family:var(--mono);letter-spacing:0.12em;text-transform:uppercase;}
.pill:hover{border-color:var(--gold);color:var(--gold);}
.pill.active{background:var(--gold);border-color:var(--gold);color:var(--bg);}
.pill.locked{border-color:#ff7043;color:#ff7043;}
.pill.locked.active{background:#ff7043;border-color:#ff7043;color:#fff;}

/* ── Match rows ───────────────────────────────────────────────── */
.match-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px 0;border-bottom:1px solid var(--border2);}
.match-row:last-child{border-bottom:none;}
.team-btn{background:rgba(255,255,255,.03);border:1px solid var(--border2);
  color:var(--muted);padding:6px 12px;cursor:pointer;
  font-size:11px;font-weight:500;font-family:var(--mono);
  transition:all .15s;white-space:nowrap;letter-spacing:0.06em;}
.team-btn:hover:not(:disabled){background:rgba(255,255,255,.07);color:var(--text);}
.team-btn.sel{background:rgba(26,74,122,0.5);border-color:rgba(100,160,220,0.5);color:#90caf9;}
.team-btn.correct{background:rgba(46,125,50,0.4);border-color:#66bb6a;color:#a5d6a7;}
.team-btn.wrong{background:rgba(74,0,0,0.4);border-color:var(--red);color:#e88a80;}
.team-btn.draw{border-color:rgba(232,213,163,.2);color:var(--muted);}
.team-btn.draw.sel{background:rgba(93,64,55,0.4);border-color:var(--gold);color:var(--gold);}
.team-btn.draw.correct{background:rgba(46,125,50,0.4);border-color:#66bb6a;color:#a5d6a7;}
.team-btn.draw.wrong{background:rgba(74,0,0,0.4);border-color:var(--red);color:#e88a80;}
.team-btn:disabled{cursor:default;opacity:.75;}
.vs{color:var(--faint);font-size:10px;flex-shrink:0;font-family:var(--mono);}
.score-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.score-in{width:34px;height:28px;background:rgba(255,255,255,.04);
  border:1px solid var(--border2);color:var(--text);
  text-align:center;font-size:13px;font-weight:400;outline:none;
  font-family:var(--mono);}
.score-in:disabled{opacity:.5;cursor:default;}
.pts-badge{font-size:10px;padding:3px 8px;font-weight:500;font-family:var(--mono);
  white-space:nowrap;margin-left:auto;letter-spacing:0.08em;}
.pts-ok{background:rgba(46,125,50,0.25);color:#a5d6a7;border:1px solid rgba(102,187,106,0.3);}
.pts-part{background:rgba(26,74,122,0.3);color:#90caf9;border:1px solid rgba(100,160,220,0.3);}
.pts-bad{background:rgba(74,0,0,0.25);color:#e88a80;border:1px solid rgba(217,79,61,0.3);}

/* ── Bonus questions ──────────────────────────────────────────── */
.bonus-section{margin-top:18px;padding:16px;background:rgba(232,213,163,.03);
  border:1px solid rgba(232,213,163,.1);}
.bonus-title{font-size:10px;color:var(--gold);font-weight:500;margin-bottom:12px;
  font-family:var(--mono);letter-spacing:0.2em;text-transform:uppercase;}
.bonus-q{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border2);}
.bonus-q:last-child{border-bottom:none;margin-bottom:0;}
.bonus-q-text{font-size:13px;color:var(--text);margin-bottom:7px;font-weight:300;}
.bonus-opts{display:flex;flex-wrap:wrap;gap:5px;}
.bopt{background:transparent;border:1px solid var(--faint);color:var(--muted);
  padding:4px 12px;font-size:10px;font-weight:500;
  cursor:pointer;font-family:var(--mono);transition:all .15s;letter-spacing:0.08em;}
.bopt:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
.bonus-note{margin-top:8px;padding:8px 10px;background:rgba(255,255,255,0.03);
  border-left:2px solid rgba(255,255,255,0.12);font-size:11px;color:var(--muted);line-height:1.6;}
.bonus-tag-pip{display:inline-block;font-size:8px;font-family:var(--mono);letter-spacing:.06em;
  padding:1px 6px;border-radius:2px;border:1px solid color-mix(in srgb,var(--tc) 50%,transparent);
  background:color-mix(in srgb,var(--tc) 12%,transparent);color:var(--tc);margin-right:4px;margin-bottom:4px;vertical-align:middle;}
.bonus-tag-btn{font-size:9px;padding:2px 8px;cursor:pointer;font-family:var(--mono);letter-spacing:.05em;
  margin:2px;border:1px solid color-mix(in srgb,var(--tc,#888) 50%,transparent);
  color:color-mix(in srgb,var(--tc,#888) 70%,var(--muted));background:transparent;transition:all .15s;}
.bonus-tag-btn:hover{border-color:var(--tc,#888);color:var(--tc,#888);}
.bonus-tag-btn.tag-active{background:color-mix(in srgb,var(--tc,#888) 18%,transparent);
  border-color:var(--tc,#888);color:var(--tc,#888);}
.bopt.sel{background:rgba(26,74,122,0.4);border-color:rgba(100,160,220,0.5);color:#90caf9;}
.bopt.correct{background:rgba(46,125,50,0.4);border-color:#66bb6a;color:#a5d6a7;}
.bopt.wrong{background:rgba(74,0,0,0.3);border-color:var(--red);color:#e88a80;}
.bopt:disabled{cursor:default;opacity:.75;}
.wager-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.wager-in{width:60px;height:26px;background:rgba(232,213,163,.05);
  border:1px solid rgba(232,213,163,.25);color:var(--gold);
  text-align:center;font-size:13px;font-weight:400;outline:none;font-family:var(--mono);}
.wager-in:disabled{opacity:.5;cursor:default;}
.wager-hint{font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.06em;}

/* ── Leaderboard ─────────────────────────────────────────────── */
.lb-table{width:100%;border-collapse:collapse;}
.lb-table th{color:var(--muted);font-size:10px;padding:7px 10px;font-family:var(--mono);
  border-bottom:1px solid var(--gold);text-align:left;letter-spacing:0.15em;text-transform:uppercase;white-space:nowrap;}
.lb-table th:last-child,.lb-table td:last-child{text-align:right;}
.lb-table td{padding:10px 10px;border-bottom:1px solid var(--border2);font-size:13px;white-space:nowrap;}
.lb-table tr:hover td{background:rgba(255,255,255,.02);cursor:pointer;}
.lb-table tr.gold-row td{background:rgba(232,213,163,.05);}
.rank-icon{font-size:16px;}
.lb-pts{color:var(--green);font-weight:500;font-size:15px;font-family:var(--mono);white-space:nowrap;}
.lb-bar-wrap{height:2px;background:rgba(255,255,255,.06);width:80px;display:inline-block;}
.lb-dots{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.lb-badge-dot-wrap{width:14px;height:14px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.lb-badge-dot{width:8px;height:8px;border-radius:50%;display:block;flex-shrink:0;}
@keyframes lb-pulse{0%{transform:translate(-50%,-50%) scale(1);opacity:.7}70%{transform:translate(-50%,-50%) scale(2.2);opacity:0}100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
.lb-badge-dot-wrap.winner::after{content:'';position:absolute;top:50%;left:50%;width:8px;height:8px;border-radius:50%;background:var(--dot-color,#ffd700);transform:translate(-50%,-50%);animation:lb-pulse 2s ease-out infinite;}
.lb-ach-col{display:flex;align-items:center;gap:3px;}
.lb-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));}

/* ── Admin ───────────────────────────────────────────────────── */
.admin-match-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 0;border-bottom:1px solid var(--border2);}
.admin-match-row:last-child{border-bottom:none;}
.admin-match-label{font-size:11px;color:var(--muted);min-width:140px;flex:1;
  font-family:var(--mono);letter-spacing:0.05em;word-break:break-word;}
.admin-select{background:var(--card2);border:1px solid rgba(255,112,67,.35);color:var(--text);
  padding:4px 8px;font-size:11px;font-family:var(--mono);}
.admin-score{width:38px;height:26px;background:var(--card2);border:1px solid rgba(255,112,67,.35);
  color:var(--text);text-align:center;font-size:12px;font-family:var(--mono);}
.lock-badge{font-size:10px;padding:3px 10px;font-weight:500;white-space:nowrap;
  flex-shrink:0;font-family:var(--mono);letter-spacing:0.08em;}
.lock-badge.locked{background:rgba(255,112,67,.12);color:#ff7043;border:1px solid rgba(255,112,67,.3);}
.lock-badge.countdown{background:rgba(232,213,163,.08);color:var(--gold);border:1px solid rgba(232,213,163,.25);}
.lock-badge.urgent{background:rgba(217,79,61,.1);color:#e88a80;border:1px solid rgba(217,79,61,.3);}
.round-dates{font-size:10px;color:var(--muted);margin:-8px 0 14px;padding-left:2px;
  font-family:var(--mono);letter-spacing:0.12em;}
.lock-badge.open{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--faint);}

/* ── Auth page ───────────────────────────────────────────────── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:var(--bg);}
.auth-card{background:var(--card);border:1px solid var(--border);
  padding:40px 36px;width:100%;max-width:400px;}
.auth-logo{text-align:center;font-size:44px;margin-bottom:12px;}
.auth-title{text-align:center;color:var(--gold);font-size:28px;font-weight:400;margin-bottom:4px;
  font-family:var(--display);letter-spacing:0.1em;}
.auth-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:28px;
  font-family:var(--mono);letter-spacing:0.08em;}
.auth-switch{text-align:center;font-size:11px;color:var(--muted);margin-top:16px;
  font-family:var(--mono);}
.auth-switch span{color:var(--gold);cursor:pointer;}
.auth-switch span:hover{text-decoration:underline;}

/* ── Notice banner ───────────────────────────────────────────── */
.notice{background:rgba(232,213,163,.05);border:1px solid var(--border);
  padding:8px 14px;font-size:11px;color:var(--gold);margin-bottom:12px;
  font-family:var(--mono);letter-spacing:0.06em;}
.locked-notice{background:rgba(255,112,67,.06);border:1px solid rgba(255,112,67,.2);
  padding:10px 14px;font-size:12px;color:#ff7043;margin-bottom:14px;
  font-family:var(--mono);}

/* ── Spinner ─────────────────────────────────────────────────── */
.spin{display:flex;align-items:center;justify-content:center;padding:80px;
  font-size:40px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:0.4}}
.live-dot{display:inline-block;animation:livepulse 1.2s ease-in-out infinite;}

/* ── Hamburger & Sidebar ──────────────────────────────────────── */
.hamburger{background:transparent;border:none;cursor:pointer;
  padding:6px 8px;display:flex;flex-direction:column;
  gap:5px;flex-shrink:0;margin-right:4px;}
.hamburger span{display:block;width:18px;height:1px;background:var(--muted);}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:200;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.sidebar-overlay.open{opacity:1;pointer-events:auto;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;
  background:var(--card);border-right:1px solid var(--border2);
  z-index:201;transform:translateX(-100%);transition:transform 0.3s ease;
  display:flex;flex-direction:column;overflow-y:auto;}
.sidebar.open{transform:translateX(0);}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border2);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.sidebar-close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;}
.sidebar-section{padding:16px 20px;border-bottom:1px solid var(--border2);}
.sidebar-section-label{color:var(--muted);font-size:9px;font-weight:500;letter-spacing:0.2em;
  text-transform:uppercase;margin:0 0 10px;font-family:var(--mono);}
.sidebar-nav-btn{width:100%;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:transparent;
  border:1px solid var(--border2);color:var(--text);
  cursor:pointer;font-size:11px;margin-bottom:6px;
  font-family:var(--mono);letter-spacing:0.08em;
  transition:all .15s;text-align:left;}
.sidebar-nav-btn:hover{background:rgba(255,255,255,.04);border-color:var(--gold);color:var(--gold);}
.sidebar-nav-btn.active{background:rgba(232,213,163,.07);border-color:rgba(232,213,163,.25);color:var(--gold);}

/* ── Dashboard ───────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:2px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border2);padding:16px;}
.stat-icon{font-size:20px;margin-bottom:8px;}
.stat-value{font-size:22px;font-weight:400;margin-bottom:2px;font-family:var(--display);
  letter-spacing:0.05em;color:var(--text);}
.stat-label{font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.12em;text-transform:uppercase;}
.mini-bar-wrap{height:2px;background:rgba(255,255,255,0.06);flex:1;overflow:hidden;}
.mini-bar{height:100%;background:var(--gold);}
.player-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;
  padding:4px 6px;transition:background .15s;}
.highlight-card{background:var(--card);border:1px solid var(--border2);padding:16px;}
.highlight-label{color:var(--muted);font-size:10px;margin-bottom:8px;
  font-family:var(--mono);letter-spacing:0.15em;text-transform:uppercase;}
.highlight-name{color:var(--text);font-weight:400;font-size:14px;margin-bottom:2px;}
.highlight-stat{color:var(--gold);font-size:11px;font-family:var(--mono);}
.rounds-table{width:100%;border-collapse:collapse;font-size:12px;}
.rounds-table th{color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border2);
  text-align:center;white-space:nowrap;font-family:var(--mono);
  font-size:10px;letter-spacing:0.12em;text-transform:uppercase;}
.rounds-table th:first-child{text-align:left;}
.rounds-table td{padding:8px 8px;border-bottom:1px solid var(--border2);text-align:center;}
.rounds-table td:first-child{text-align:left;color:var(--text);}
.rounds-table tr:hover td{background:rgba(255,255,255,0.02);}

/* ── Bracket ─────────────────────────────────────────────────── */
.bracket-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:2px;margin-bottom:4px;}
.bracket-match{background:rgba(255,255,255,0.03);border:1px solid var(--border2);

function getActiveQuestions(rid) {
  return S.customBonusQs[rid] || ROUNDS[rid]?.bonusQuestions || [];
}

// Bonus questions auto-lock 1 hour before the round's first match kickoff (or earlier via admin override)
function isBonusLocked(rid) {
  const round = ROUNDS[rid];
  if (!round) return false;
  if (S.roundSettings?.[rid]?.locked) return true;
  if (round.special === 'pretournament') {
    const cutoffPassed = !!(S.registrationCutoff && Date.now() >= new Date(S.registrationCutoff).getTime());
    // Also treat pre-tournament as locked once the tournament has actually begun,
    // regardless of the registration cutoff date (covers cutoffs set in the future for late signups)
    const tournamentStarted = Object.values(ROUNDS).some(r => r.matches.some(m => S.results[r.id]?.[m.id]?.winner));
    return cutoffPassed || tournamentStarted;
  }
  const roundKickoffs = round.matches
    .map(m => getKickoff(m.id, m.kickoff))
    .filter(Boolean)
    .map(k => new Date(k).getTime())
    .sort((a,b) => a - b);
  const firstKickoff = roundKickoffs[0] || null;
  const override = S.bonusLockOverrides[rid];
  const lockAt = override ? new Date(override).getTime() : (firstKickoff ? firstKickoff - 3600000 : null);
  return !!(lockAt && Date.now() >= lockAt);
}

function getMultipliers(rid) {
  return { match: S.multipliers[rid]?.match ?? 1, bonus: S.multipliers[rid]?.bonus ?? 1 };
}

// Parses tri-state multicheck result: "correct:A,C|wrong:B" → {correctSet, wrongSet}
function parseMcResult(answer) {
  const correctSet = new Set();
  const wrongSet   = new Set();
  (answer || '').split('|').forEach(part => {
    const p = part.trim();
    if (p.startsWith('correct:')) p.slice(8).split(',').map(s=>s.trim()).filter(Boolean).forEach(v=>correctSet.add(v));
    else if (p.startsWith('wrong:'))  p.slice(6).split(',').map(s=>s.trim()).filter(Boolean).forEach(v=>wrongSet.add(v));
  });
  return { correctSet, wrongSet };
}

// Serialises correctSet/wrongSet back to storage string
function serializeMcResult(correctSet, wrongSet) {
  const parts = [];
  if (correctSet.size) parts.push('correct:' + [...correctSet].join(','));
  if (wrongSet.size)   parts.push('wrong:'   + [...wrongSet].join(','));
  return parts.join('|');
}

function saveCustomQuestions() {
  localStorage.setItem('wc26:customBonusQs', JSON.stringify(S.customBonusQs));
  for (const [rid, qs] of Object.entries(S.customBonusQs)) {
    sb.from('round_settings').upsert(
      { round_id: rid, tournament_id: S.tournamentId, custom_questions: JSON.stringify(qs) },
      { onConflict: 'round_id,tournament_id' }
    ).then(({ error }) => {
      if (error) console.warn('saveCustomQuestions failed for', rid, error.message);
    });
  }
}

// Returns the actual team name for a bracket slot, falling back to the placeholder
function getBracketTeam(mid, side, defaultName) {
  return S.bracketTeams[mid]?.[side] || defaultName;
}

// Returns the winner (or loser) of the Nth match (1-based) in a given round, once its result is entered
function getRoundMatchOutcome(rid, idx, wantLoser) {
  const round = ROUNDS[rid];
  const m = round?.matches[idx - 1];
  if (!m) return null;
  const res = S.results[rid]?.[m.id];
  if (!res?.winner) return null;
  if (!wantLoser) return res.winner;
  const homeTeam = getBracketTeam(m.id, 'home', m.home);
  const awayTeam = getBracketTeam(m.id, 'away', m.away);
  return res.winner === homeTeam ? awayTeam : homeTeam;
}

// Returns true if a slot's literal home/away text is still a placeholder code
// (e.g. "1A", "W R32-3", "QF2", "Best 3rd (1)", "Winner gs1-3") rather than a confirmed team name
function isPlaceholderSlot(rid, placeholder) {
  const hasPrev = !!(S._roundSources?.[rid]);
  // Group-stage position references (for rounds that read from groups)
  if (/^([12])([A-L])$/.test(placeholder)) return true;
  if (/^Best 3rd \(\d+\)$/.test(placeholder)) return true;
  if (/^3[A-L]+$/.test(placeholder)) return true;
  // WC2026-specific knockout labels
  if (hasPrev && /^W R32-(\d+)$/.test(placeholder)) return true;
  if (hasPrev && /^QF(\d+)$/.test(placeholder)) return true;
  if (hasPrev && /^SF Loser (\d+)$/.test(placeholder)) return true;
  if (hasPrev && /^SF(\d+)$/.test(placeholder)) return true;
  if (hasPrev && /^Finalist (\d+)$/.test(placeholder)) return true;
  // Generic pattern for custom rounds: "Winner [roundId]-[N]" or "Loser [roundId]-[N]"
  if (/^(Winner|Loser) \S+-\d+$/.test(placeholder)) return true;
  // Group-stage generic: "1st Group A", "Runner-up Group B" etc.
  if (/^(1st|2nd|3rd|Runner-up) Group [A-Z]$/.test(placeholder)) return true;
  return false;
}

// Returns 3rd-place finishers across all groups, ranked by pts → GD → GF (same rule the
// Groups tab uses to highlight the best 8 thirds), restricted to groups whose group stage
// is fully complete (every team has played all 3 group matches)
function getRankedThirdPlaceTeams() {
  const standings = computeGroupStandings();
  return Object.entries(standings)
    .filter(([, teams]) => teams.every(t => t.played >= 3))
    .map(([g, teams]) => ({ g, ...teams[2] }))
    .filter(t => t.team)
    .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
}

// Computes { mid, side, team } fills for a knockout round's placeholder slots, reading from
// either group results (r32) or the previous round's match results (r16, qf, sf, final).
// "Best 3rd"/"3XXXX" slots are intentionally skipped here — ranking which specific 3rd-place
// team fills which of the 8 slots needs a human decision, made via the dropdown below.
function computeBracketAutoFill(rid) {
  const round = ROUNDS[rid];
  if (!round) return [];

  // Walk the source chain, skipping any disabled rounds, to find the effective previous round
  const rawPrev = S._roundSources?.[rid];
  const prevRid  = rawPrev ? resolveSourceRound(rawPrev) : null;
  const prevRound = prevRid ? ROUNDS[prevRid] : null;

  // Use group standings when this round (or its effective source) reads from a group-stage round
  const sourceIsGroup = prevRound && !prevRound.knockout && prevRound.special !== 'pretournament';
  const standings = (!prevRid || sourceIsGroup) ? computeGroupStandings() : null;

  const fills = [];
  round.matches.forEach(m => {
    ['home', 'away'].forEach(side => {
      if (S.bracketTeams[m.id]?.[side]) return; // never overwrite a manual edit
      const ph = m[side];
      let team = null;
      let mm;

      // Group-stage position references → use standings
      if (standings && (mm = /^([12])([A-L])$/.exec(ph))) {
        const [, pos, g] = mm;
        const grp = standings[g];
        const complete = grp && grp.every(t => t.played >= (S.tournamentConfig?.groupSize ?? 4) - 1);
        team = complete ? grp[Number(pos) - 1]?.team || null : null;

      } else if (standings && (mm = /^(1st|2nd|3rd|Runner-up) Group ([A-Z])$/.exec(ph))) {
        const posMap = { '1st': 0, '2nd': 1, 'Runner-up': 1, '3rd': 2 };
        const grp = standings[mm[2]];
        const complete = grp && grp.every(t => t.played >= (S.tournamentConfig?.groupSize ?? 4) - 1);
        team = complete ? grp[posMap[mm[1]]]?.team || null : null;

      // WC2026-style knockout labels → use prevRid
      } else if (prevRid && (mm = /^W R32-(\d+)$/.exec(ph))) {
        team = getRoundMatchOutcome(prevRid, Number(mm[1]), false);
      } else if (prevRid && (mm = /^QF(\d+)$/.exec(ph))) {
        team = getRoundMatchOutcome(prevRid, Number(mm[1]), false);
      } else if (prevRid && (mm = /^SF Loser (\d+)$/.exec(ph))) {
        team = getRoundMatchOutcome(prevRid, Number(mm[1]), true);
      } else if (prevRid && (mm = /^SF(\d+)$/.exec(ph))) {
        team = getRoundMatchOutcome(prevRid, Number(mm[1]), false);
      } else if (prevRid && (mm = /^Finalist (\d+)$/.exec(ph))) {
        team = getRoundMatchOutcome(prevRid, Number(mm[1]), false);

      // Generic custom-round reference: "Winner [roundId]-[N]" or "Loser [roundId]-[N]"
      } else if ((mm = /^(Winner|Loser) (\S+)-(\d+)$/.exec(ph))) {
        const [, outcome, srcRid, idx] = mm;
        const effectiveSrc = resolveSourceRound(srcRid);
        if (effectiveSrc) team = getRoundMatchOutcome(effectiveSrc, Number(idx), outcome === 'Loser');
      }

      if (team) fills.push({ mid: m.id, side, team });
    });
  });
  return fills;
}

// Removes saved bracketTeams overrides for slots whose round data already has a real,
// confirmed team name baked in directly (no longer a placeholder code) — fixes stale
// overrides left over from before a schedule update replaced placeholders with real teams
function clearStaleBracketOverrides(rid) {
  const round = ROUNDS[rid];
  let cleared = 0;
  round.matches.forEach(m => {
    ['home', 'away'].forEach(side => {
      if (!S.bracketTeams[m.id]?.[side]) return;
      if (isPlaceholderSlot(rid, m[side])) return; // still a placeholder — override is legitimate
      delete S.bracketTeams[m.id][side];
      cleared++;
    });
    if (S.bracketTeams[m.id] && !S.bracketTeams[m.id].home && !S.bracketTeams[m.id].away) {
      delete S.bracketTeams[m.id];
    }
  });
  return cleared;
}

// Returns the effective kickoff ISO string for a match (override takes priority)
function getKickoff(mid, defaultKickoff) {
  return S.kickoffOverrides[mid] || defaultKickoff || null;
}

// Convert UTC ISO string → datetime-local input value (local time)
function toDatetimeLocal(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// Returns a human-readable countdown string (e.g. "in 2h 30m", "in 4d 3h", "PASSED")
function scheduleCountdown(isoStr) {
  if (!isoStr) return '';
  const diff = new Date(isoStr).getTime() - Date.now();
  if (diff <= 0) return 'PASSED';
  const totalMins = Math.floor(diff / 60000);
  const hrs = Math.floor(totalMins / 60);
  const mins = totalMins % 60;
  if (hrs >= 48) return `in ${Math.floor(hrs/24)}d ${hrs%24}h`;
  if (hrs >= 1)  return `in ${hrs}h ${mins}m`;
  return `in ${mins}m`;
}

async function checkLockSchedules() {
  const now = Date.now();
  let changed = false;
  for (const rid of Object.keys(ROUNDS)) {
    const sched = S.lockSchedules[rid];
    if (!sched) continue;
    const locked = S.roundSettings[rid]?.locked || false;

    if (sched.lockAt && !locked && now >= new Date(sched.lockAt).getTime()) {
      // Time to auto-lock
      if (!S.roundSettings[rid]) S.roundSettings[rid] = {};
      S.roundSettings[rid].locked = true;
      try {
        await sb.from('round_settings').upsert({ round_id: rid, tournament_id: S.tournamentId, locked: true }, { onConflict: 'round_id,tournament_id' });
      } catch(e) { S.roundSettings[rid].locked = false; }
      delete S.lockSchedules[rid].lockAt;
      changed = true;
    }

    if (sched.unlockAt && locked && now >= new Date(sched.unlockAt).getTime()) {
      // Time to auto-unlock
      if (!S.roundSettings[rid]) S.roundSettings[rid] = {};
      S.roundSettings[rid].locked = false;
      try {
        await sb.from('round_settings').upsert({ round_id: rid, tournament_id: S.tournamentId, locked: false }, { onConflict: 'round_id,tournament_id' });
      } catch(e) { S.roundSettings[rid].locked = true; }
      delete S.lockSchedules[rid].unlockAt;
      changed = true;
    }
  }
  if (changed) { saveLockSchedules(); render(); }
}

function matchCountdown(kickoff) {
  if (!kickoff) return '';
  const kickoffDate = new Date(kickoff);
  const lockTime = kickoffDate.getTime() - 3600000; // 1 hr before kickoff
  const diff = lockTime - Date.now();
  // Local kickoff time in browser's own timezone — automatically correct for everyone
  const localTime = kickoffDate.toLocaleString(undefined, {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  if (diff <= 0) return `<span class="lock-badge locked" title="Kicked off ${localTime} (your time)">🔒 Locked</span>`;
  const totalMins = Math.floor(diff / 60000);
  const hrs = Math.floor(totalMins / 60);
  const mins = totalMins % 60;
  const tip = `title="Kicks off ${localTime} (your local time)"`;
  if (hrs >= 48) return `<span class="lock-badge countdown" ${tip}>🕐 Locks in ${Math.floor(hrs/24)}d ${hrs%24}h</span>`;
  if (hrs >= 1)  return `<span class="lock-badge ${hrs < 3 ? 'urgent' : 'countdown'}" ${tip}>🕐 Locks in ${hrs}h ${mins}m</span>`;
  return `<span class="lock-badge urgent" ${tip}>⚠️ Locks in ${mins}m</span>`;
}

// ════════════════════════════════════════════════════════════════
// 6. SCORING
// ════════════════════════════════════════════════════════════════
// Score-line points for a single match pick:
// - Exact score match (home & away both correct) = 1 pt, counts as an "exact score"
// - "Hedge" — scoreline correct but home/away swapped (e.g. picked 3-1, actual 1-3),
//   excluding draws where swap === exact = 1 pt, but does NOT count as an "exact score"
// - Otherwise 0 pts
function scoreLinePoints(pick, result) {
  const sh = String(pick.score_home ?? '').trim(), sa = String(pick.score_away ?? '').trim();
  const rh = String(result.score_home ?? '').trim(), ra = String(result.score_away ?? '').trim();
  if (sh === '' || sa === '' || rh === '' || ra === '') return { pts: 0, exact: false };
  const ish = parseInt(sh,10), isa = parseInt(sa,10), irh = parseInt(rh,10), ira = parseInt(ra,10);
  if (ish === irh && isa === ira) return { pts: S.scoring.exactScorePts, exact: true };
  if (ish === ira && isa === irh && ish !== isa) return { pts: S.scoring.scoreWrongTeamPts, exact: false };
  return { pts: 0, exact: false };
}

function calcScore(uid) {
  let total = 0, correctPicks = 0, exactScores = 0;

  // Pre-tournament picks scoring
  const ptBa = S.bonusAnswers[uid]?.['pt'] || {};
  const ptBr = S.bonusResults['pt'] || {};
  for (const g of Object.keys(GROUPS)) {
    const p1 = ptBa[`pt_${g}_1`]?.answer, p2 = ptBa[`pt_${g}_2`]?.answer;
    const r1 = ptBr[`pt_${g}_1`]?.answer,  r2 = ptBr[`pt_${g}_2`]?.answer;
    if (!r1 && !r2) continue;
    const qualified = new Set([r1, r2].filter(Boolean));
    if (p1) { if (p1 === r1) total += S.scoring.ptGroupFirstPts; else if (qualified.has(p1)) total += S.scoring.ptGroupQualPts; }
    if (p2) { if (p2 === r2) total += S.scoring.ptGroupFirstPts; else if (qualified.has(p2)) total += S.scoring.ptGroupQualPts; }
  }
  const winPts = S.scoring.ptWinnerPts;
  const winPick = ptBa['pt_winner']?.answer, winRes = ptBr['pt_winner']?.answer;
  if (winPick && winRes && winPick === winRes) total += winPts;

  // Pre-tournament custom bonus questions
  for (const bq of getActiveQuestions('pt')) {
    const ans     = S.bonusAnswers[uid]?.['pt']?.[bq.id];
    const correct = S.bonusResults['pt']?.[bq.id];
    if (!ans || !correct || !correct.answer || !ans.answer) continue;
    if (ans.answer === correct.answer) total += bq.pts;
  }

  for (const round of Object.values(ROUNDS)) {
    if (round.special === 'pretournament') continue;
    const rid = round.id;
    const { match: mMult, bonus: bMult } = getMultipliers(rid);
    for (const m of round.matches) {
      const pick   = S.picks[uid]?.[rid]?.[m.id];
      const result = S.results[rid]?.[m.id];
      if (!pick || !result || !result.winner) continue;
      if (pick.winner && pick.winner === result.winner) { total += S.scoring.winnerPts * mMult; correctPicks++; }
      // Score-line points are independent of the winner pick
      const slp = scoreLinePoints(pick, result);
      if (slp.pts) { total += slp.pts * mMult; if (slp.exact) exactScores++; }
    }
    for (const bq of getActiveQuestions(rid)) {
      const ans     = S.bonusAnswers[uid]?.[rid]?.[bq.id];
      const correct = S.bonusResults[rid]?.[bq.id];
      if (!ans || !correct || !correct.answer || !ans.answer) continue;
      const isOU     = bq.type === 'overunder';
      const isMC     = bq.type === 'multicheck';
      const hasWager = bq.wager === true;
      const stake    = hasWager ? (Number(ans.wager) || 0) : (bq.pts * bMult);
      if (isMC) {
        // +2 per correct pick, -1 per explicitly-wrong pick, 0 for pending/unpicked
        const { correctSet, wrongSet } = parseMcResult(correct.answer);
        const picked = new Set((ans.answer || '').split(',').map(s => s.trim()).filter(Boolean));
        let mcPts = 0;
        for (const p of picked) {
          if (correctSet.has(p)) mcPts += 2;
          else if (wrongSet.has(p)) mcPts -= 1;
          // pending (neither set) = 0
        }
        total += mcPts * bMult;
      } else if (isOU) {
        if (ans.answer === 'Abstain') { /* 0 pts */ }
        else if (ans.answer === correct.answer) total += stake;
        else total -= stake;
      } else {
        if (ans.answer === correct.answer) total += stake;
        // wrong on normal = 0
      }
    }
  }
  // Admin-set points override (stored in profiles.points_override)
  const override = parseInt(S.profiles.find(p => p.id === uid)?.points_override ?? 0, 10) || 0;
  total += override;
  return { total, correctPicks, exactScores };
}

function getLeaderboard() {
  const sorted = S.profiles
    .map(p => ({ ...p, ...calcScore(p.id) }))
    .sort((a,b) => b.total - a.total || b.correctPicks - a.correctPicks || b.exactScores - a.exactScores);
  const result = [];
  for (let i = 0; i < sorted.length; i++) {
    const p = sorted[i];
    const prev = result[i - 1];
    const tied = i > 0 && p.total === sorted[i-1].total && p.correctPicks === sorted[i-1].correctPicks && p.exactScores === sorted[i-1].exactScores;
    result.push({ ...p, rank: tied ? prev.rank : i + 1 });
  }
  return result;
}

// ════════════════════════════════════════════════════════════════
// 6. SUPABASE DATA LAYER
// ════════════════════════════════════════════════════════════════
function abbrevTournamentName(name) {
  if (!name) return 'POOL';
  return name
    .replace(/\bFIFA\b\s*/gi, '')
    .replace(/\bWorld Cup\b/gi, 'WC')
    .replace(/\bEuropean Championship\b/gi, 'EURO')
    .replace(/\s+/g, '')
    .toUpperCase()
    .slice(0, 8);
}

// Rebuild ROUNDS from the base template + tournament structure config.
// Called after config is loaded (or when config changes) so all ROUNDS consumers
// automatically see the filtered/relabelled round set.
function applyTournamentConfig() {
  const base = ROUNDS_MAP[S.tournamentId] || {};
  const cfg  = S.tournamentConfig;
  const disabled = new Set(cfg.disabledRounds || []);

  // Filtered + relabelled base rounds
  const filteredBase = Object.fromEntries(
    Object.entries(base)
      .filter(([id]) => !disabled.has(id))
      .map(([id, r]) => {
        const label = cfg.roundLabels?.[id];
        return [id, label ? { ...r, label } : r];
      })
  );

  // Merge custom rounds (always included — admin manages them explicitly)
  const customById = {};
  for (const cr of (cfg.customRounds || [])) {
    customById[cr.id] = {
      id: cr.id,
      label: cr.label,
      knockout: !!cr.knockout,
      dateRange: cr.dateRange || '',
      sourceRound: cr.sourceRound || null,
      matches: cr.matches || [],
      bonusQuestions: cr.bonusQuestions || [],
      _custom: true,
    };
  }

  ROUNDS = { ...filteredBase, ...customById };

  // Build roundSources map: stores where each round's bracket winners come from.
  // For base rounds use the explicit config; auto-derive for custom rounds.
  S._roundSources = { ...(cfg.roundSources || {}) };
  for (const cr of (cfg.customRounds || [])) {
    if (cr.sourceRound) S._roundSources[cr.id] = cr.sourceRound;
  }
  // Auto-derive source chain for base rounds based on the ordered round list
  // (each knockout round implicitly reads from the previous round)
  const orderedBase = Object.values(base);
  for (let i = 1; i < orderedBase.length; i++) {
    const r = orderedBase[i];
    if (!S._roundSources[r.id] && r.knockout) {
      S._roundSources[r.id] = orderedBase[i - 1].id;
    }
  }
}

// Walk the roundSources chain upward, skipping disabled rounds, to find
// the nearest enabled ancestor of a given round. Used by getBracketTeam.
function resolveSourceRound(rid) {
  const disabled = new Set(S.tournamentConfig?.disabledRounds || []);
  let cur = rid;
  const seen = new Set();
  while (cur && !seen.has(cur)) {
    seen.add(cur);
    if (!disabled.has(cur)) return cur;
    cur = S._roundSources?.[cur];
  }
  return null;
}

async function loadAllData() {
  // tournament status + name
  const { data: tData } = await sb.from('tournaments').select('status,name').eq('id', S.tournamentId).single();
  S.tournamentClosed = tData?.status === 'closed';
  S.tournamentName  = tData?.name || 'WC 2026';
  S.tournamentShort = abbrevTournamentName(S.tournamentName);

  // tournament registrations (graceful fallback if table doesn't exist yet)
  const { data: regs, error: regErr } = await sb.from('tournament_registrations')
    .select('user_id').eq('tournament_id', S.tournamentId);
  const registeredIds = regErr ? null : new Set((regs || []).map(r => r.user_id));
  if (S.user && !S.profile?.is_admin) {
    S.isRegistered = registeredIds ? registeredIds.has(S.user.id) : true;
  } else {
    S.isRegistered = true;
  }

  // profiles — scoped to registered players only (or all if table not yet set up)
  const { data: profiles } = await sb.from('profiles').select('*');
  S.profiles = (profiles || []).filter(p =>
    !p.is_admin && (registeredIds ? registeredIds.has(p.id) : true)
  );

  // picks — fetch per round to stay under Supabase's 1000-row server cap
  S.picks = {};
  const roundIds = Object.keys(ROUNDS);
  const pickResults = await Promise.all(
    roundIds.map(rid => sb.from('picks').select('*').eq('round_id', rid).eq('tournament_id', S.tournamentId))
  );
  pickResults.forEach(({ data, error }, i) => {
    if (error) console.error('[WC26] picks fetch failed for round', roundIds[i], ':', error.message, error.code);
  });
  for (const { data } of pickResults) {
    for (const p of (data || [])) {
      if (!S.picks[p.user_id]) S.picks[p.user_id] = {};
      if (!S.picks[p.user_id][p.round_id]) S.picks[p.user_id][p.round_id] = {};
      S.picks[p.user_id][p.round_id][p.match_id] = { winner: p.winner, score_home: p.score_home, score_away: p.score_away };
    }
  }

  // bonus answers — fetch per round to stay under Supabase's 1000-row server cap
  S.bonusAnswers = {};
  const bonusResults = await Promise.all(
    roundIds.map(rid => sb.from('bonus_answers').select('*').eq('round_id', rid).eq('tournament_id', S.tournamentId))
  );
  bonusResults.forEach(({ error }, i) => {
    if (error) console.error('[WC26] bonus_answers fetch failed for round', roundIds[i], ':', error.message, error.code);
  });
  for (const { data } of bonusResults) {
    for (const b of (data || [])) {
      if (!S.bonusAnswers[b.user_id]) S.bonusAnswers[b.user_id] = {};
      if (!S.bonusAnswers[b.user_id][b.round_id]) S.bonusAnswers[b.user_id][b.round_id] = {};
      S.bonusAnswers[b.user_id][b.round_id][b.question_id] = { answer: b.answer, wager: b.wager };
    }
  }

  // results
  const { data: results } = await sb.from('results').select('*').eq('tournament_id', S.tournamentId);
  S.results = {};
  for (const r of (results || [])) {
    if (!r.winner) continue; // skip empty/stale rows
    if (!S.results[r.round_id]) S.results[r.round_id] = {};
    S.results[r.round_id][r.match_id] = { winner: r.winner, score_home: r.score_home, score_away: r.score_away };
  }

  // bonus results
  const { data: bres } = await sb.from('bonus_results').select('*').eq('tournament_id', S.tournamentId);
  S.bonusResults = {};
  for (const b of (bres || [])) {
    if (!S.bonusResults[b.round_id]) S.bonusResults[b.round_id] = {};
    S.bonusResults[b.round_id][b.question_id] = { answer: b.answer };
  }

  // round settings + custom bonus questions (stored in custom_questions column)
  const { data: rs } = await sb.from('round_settings').select('*').eq('tournament_id', S.tournamentId);
  S.roundSettings = {};
  for (const r of (rs || [])) {
    S.roundSettings[r.round_id] = { locked: r.locked, deadline: r.deadline };
    if (r.custom_questions) {
      try {
        const qs = JSON.parse(r.custom_questions);
        if (Array.isArray(qs) && qs.length > 0) S.customBonusQs[r.round_id] = qs;
      } catch(e) {}
    }
    if (r.bonus_progress) {
      try {
        const bp = JSON.parse(r.bonus_progress);
        if (bp && typeof bp === 'object') S.bonusProgress[r.round_id] = bp;
      } catch(e) {}
    }
    if (r.multipliers) {
      try {
        const m = JSON.parse(r.multipliers);
        if (m && typeof m === 'object') S.multipliers[r.round_id] = m;
      } catch(e) {}
    }
  }

  // registration cutoff (stored in round_settings with special round_id '__config__')
  const { data: regCfg } = await sb.from('round_settings').select('deadline').eq('round_id','__config__').eq('tournament_id', S.tournamentId).single();
  S.registrationCutoff = regCfg?.deadline || null;

  // notice board (stored in round_settings with special round_id '__notice__')
  const { data: noticeCfg } = await sb.from('round_settings').select('notice').eq('round_id','__notice__').eq('tournament_id', S.tournamentId).single();
  S.noticeBoard = noticeCfg?.notice || '';

  // rank snapshot — totals as of just before the most recent result/bonus edit (stored under '__rank_snapshot__')
  const { data: rankCfg } = await sb.from('round_settings').select('rank_snapshot').eq('round_id','__rank_snapshot__').eq('tournament_id', S.tournamentId).single();
  if (rankCfg?.rank_snapshot) {
    try {
      const rs = JSON.parse(rankCfg.rank_snapshot);
      if (rs && typeof rs === 'object') S.rankSnapshot = rs;
    } catch(e) {}
  }

  // lock schedules (stored under '__schedules__' so all players see the unlock countdown)
  const { data: schedCfg } = await sb.from('round_settings').select('lock_schedules').eq('round_id','__schedules__').eq('tournament_id', S.tournamentId).single();
  if (schedCfg?.lock_schedules) {
    try {
      const ls = JSON.parse(schedCfg.lock_schedules);
      if (ls && typeof ls === 'object') S.lockSchedules = ls;
    } catch(e) {}
  } else if (Object.keys(S.lockSchedules).length) {
    // Migrate schedules previously saved only to this admin's localStorage
    saveLockSchedules();
  }

  // kickoff overrides (stored under '__kickoffs__' so all players see delayed/rescheduled match times)
  const { data: koCfg } = await sb.from('round_settings').select('kickoff_overrides').eq('round_id','__kickoffs__').eq('tournament_id', S.tournamentId).single();
  if (koCfg?.kickoff_overrides) {
    try {
      const ko = JSON.parse(koCfg.kickoff_overrides);
      if (ko && typeof ko === 'object') S.kickoffOverrides = ko;
    } catch(e) {}
  } else if (Object.keys(S.kickoffOverrides).length) {
    saveKickoffOverrides();
  }

  // bracket team overrides (stored under '__bracket_teams__' so all players see the real team names)
  const { data: btCfg } = await sb.from('round_settings').select('bracket_teams').eq('round_id','__bracket_teams__').eq('tournament_id', S.tournamentId).single();
  if (btCfg?.bracket_teams) {
    try {
      const bt = JSON.parse(btCfg.bracket_teams);
      if (bt && typeof bt === 'object') S.bracketTeams = bt;
    } catch(e) {}
  } else if (Object.keys(S.bracketTeams).length) {
    // Migrate bracket teams previously saved only to this admin's localStorage
    saveBracketTeams();
  }

  // prize configuration (stored in round_settings with special round_id '__prizes__')
  const { data: prizeCfg } = await sb.from('round_settings').select('prizes').eq('round_id','__prizes__').eq('tournament_id', S.tournamentId).single();
  if (prizeCfg?.prizes) {
    try {
      const pz = JSON.parse(prizeCfg.prizes);
      if (pz && typeof pz === 'object') S.prizes = pz;
    } catch(e) {}
  } else if (S.prizes?.entries?.length) {
    // Migrate prizes previously saved only to this admin's localStorage
    savePrizes();
  }

  // scoring & tab visibility settings
  const { data: scoringCfg } = await sb.from('round_settings').select('prizes').eq('round_id','__scoring__').eq('tournament_id', S.tournamentId).single();
  if (scoringCfg?.prizes) {
    try {
      const cfg = JSON.parse(scoringCfg.prizes);
      if (cfg.scoring) S.scoring = { ...S.scoring, ...cfg.scoring };
      if (Array.isArray(cfg.hiddenTabs)) S.hiddenTabs = cfg.hiddenTabs;
      if (cfg.tagDescs && typeof cfg.tagDescs === 'object') S.tagDescs = cfg.tagDescs;
    } catch(e) {}
  }

  // tournament structure config (disabled rounds, label overrides, group settings)
  const { data: structCfg } = await sb.from('round_settings').select('prizes').eq('round_id','__structure__').eq('tournament_id', S.tournamentId).single();
  if (structCfg?.prizes) {
    try {
      const cfg = JSON.parse(structCfg.prizes);
      if (cfg && typeof cfg === 'object') S.tournamentConfig = { ...S.tournamentConfig, ...cfg };
    } catch(e) {}
  }
  applyTournamentConfig();

  // current user's own feedback submission
  if (S.user?.id) {
    const { data: fbRow } = await sb.from('feedback').select('*').eq('user_id', S.user.id).single();
    S.myFeedback = fbRow || null;
  }
}

// Current leaderboard totals for all non-admin players, keyed by user id
function snapshotTotals() {
  const totals = {};
  S.profiles.filter(p => !p.is_admin).forEach(p => { totals[p.id] = calcScore(p.id).total; });
  return totals;
}

// Write current leaderboard order (with tiebreakers) to tournaments.final_standings
function saveFinalStandings() {
  const lb = getLeaderboard();
  const standings = lb.map(p => ({ name: p.nickname || p.name, pts: p.total }));
  sb.from('tournaments').update({ final_standings: standings }).eq('id', S.tournamentId)
    .then(({ error }) => { if (error) console.warn('saveFinalStandings failed:', error.message); });
}

// Persist the current totals as the "before the latest edit" snapshot for the movement badge
function saveRankSnapshot() {
  S.rankSnapshot = snapshotTotals();
  sb.from('round_settings').upsert(
    { round_id: '__rank_snapshot__', tournament_id: S.tournamentId, rank_snapshot: JSON.stringify(S.rankSnapshot) },
    { onConflict: 'round_id,tournament_id' }
  ).then(({ error }) => {
    if (error) console.warn('saveRankSnapshot failed:', error.message);
  });
}

// Snapshot leaderboard totals before an edit, but only once per "match" — if the
// admin makes several edits in quick succession to the same match (e.g. set the
// winner, then fill in the score), they're treated as one entry and only the
// combined effect shows up in the movement badge.
const SNAPSHOT_GROUP_WINDOW = 60000; // ms
function maybeSnapshotBeforeEdit(key) {
  const now = Date.now();
  if (S._snapshotKey === key && (now - (S._snapshotTime || 0)) < SNAPSHOT_GROUP_WINDOW) {
    S._snapshotTime = now;
    return;
  }
  S._snapshotKey = key;
  S._snapshotTime = now;
  saveRankSnapshot();
}

// Admin-only: fetch recent activity logs (pick/bonus answer changes) for the Logs tab
async function loadActivityLogs() {
  const { data, error } = await sb.from('activity_logs')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(500);
  if (!error) S.activityLogs = data || [];
  S.activityLogsLoaded = true;
}

// Fire-and-forget activity log entry — records who changed what, from what, to what, and when.
function logActivity(rid, itemType, itemId, field, oldVal, newVal) {
  const row = {
    user_id: S.user.id, round_id: rid, item_type: itemType, item_id: itemId,
    field, old_value: oldVal == null ? '' : String(oldVal), new_value: newVal == null ? '' : String(newVal),
    tournament_id: S.tournamentId,
  };
  sb.from('activity_logs').insert(row).then(({ error }) => {
    if (error) console.warn('activity log failed:', error.message);
  });
}

function upsertPick(rid, mid, winner, sh, sa) {
  // Capture previous values for change-logging
  const prev = S.picks[S.user.id]?.[rid]?.[mid] || {};
  const newSh = String(sh), newSa = String(sa);
  if ((prev.winner || '') !== (winner || '')) logActivity(rid, 'pick', mid, 'winner', prev.winner, winner);
  if ((prev.score_home ?? '') !== newSh)       logActivity(rid, 'pick', mid, 'score_home', prev.score_home, newSh);
  if ((prev.score_away ?? '') !== newSa)       logActivity(rid, 'pick', mid, 'score_away', prev.score_away, newSa);

  // Update local state immediately so the UI responds instantly
  if (!S.picks[S.user.id]) S.picks[S.user.id] = {};
  if (!S.picks[S.user.id][rid]) S.picks[S.user.id][rid] = {};
  S.picks[S.user.id][rid][mid] = { winner, score_home: newSh, score_away: newSa };
  // Sync to Supabase in the background with one retry
  const row = { user_id: S.user.id, round_id: rid, match_id: mid, tournament_id: S.tournamentId,
    winner, score_home: newSh, score_away: newSa };
  const doWrite = () => sb.from('picks').upsert(row, { onConflict: 'user_id,round_id,match_id,tournament_id' });
  doWrite().then(({ error }) => {
    if (error) { setTimeout(() => doWrite(), 3000); } // retry once after 3s
  });
}

function upsertBonusAnswer(rid, qid, answer, wager) {
  // Capture previous values for change-logging
  const prev = S.bonusAnswers[S.user.id]?.[rid]?.[qid] || {};
  const newWager = Number(wager) || 0;
  if ((prev.answer || '') !== (answer || ''))   logActivity(rid, 'bonus', qid, 'answer', prev.answer, answer);
  if ((Number(prev.wager) || 0) !== newWager)   logActivity(rid, 'bonus', qid, 'wager', prev.wager, newWager);

  // Update local state immediately so the UI responds instantly
  if (!S.bonusAnswers[S.user.id]) S.bonusAnswers[S.user.id] = {};
  if (!S.bonusAnswers[S.user.id][rid]) S.bonusAnswers[S.user.id][rid] = {};
  S.bonusAnswers[S.user.id][rid][qid] = { answer, wager: newWager };
  // Sync to Supabase in the background with one retry
  const row = { user_id: S.user.id, round_id: rid, question_id: qid, tournament_id: S.tournamentId,
    answer, wager: newWager };
  const doWrite = () => sb.from('bonus_answers').upsert(row, { onConflict: 'user_id,round_id,question_id,tournament_id' });
  doWrite().then(({ error }) => {
    if (error) { setTimeout(() => doWrite(), 3000); } // retry once after 3s
  });
}

async function upsertResult(rid, mid, winner, sh, sa) {
  // Snapshot leaderboard totals as they were just before this match's result edits began,
  // so the dashboard's +/- movement badge reflects this match as a whole
  maybeSnapshotBeforeEdit(`${rid}:${mid}`);

  // Update local state immediately
  if (!S.results[rid]) S.results[rid] = {};
  S.results[rid][mid] = { winner, score_home: String(sh), score_away: String(sa) };

  // Don't persist empty results to Supabase — if winner is cleared, delete the row instead
  if (!winner) {
    await sb.from('results').delete().eq('round_id', rid).eq('match_id', mid).eq('tournament_id', S.tournamentId);
    delete S.results[rid][mid];
    return;
  }

  const { error } = await sb.from('results').upsert(
    { round_id: rid, match_id: mid, tournament_id: S.tournamentId, winner, score_home: String(sh), score_away: String(sa) },
    { onConflict: 'round_id,match_id,tournament_id' }
  );
  if (error) {
    console.error('upsertResult failed:', error);
    showAdminError(`❌ DB write failed: ${error.message} — Run the Supabase SQL fix (see scoring preview card).`);
  } else {
    autoCheckAchievements();
    saveFinalStandings();
  }
}

function showAdminError(msg) {
  let el = document.getElementById('admin-err-banner');
  if (!el) {
    el = document.createElement('div');
    el.id = 'admin-err-banner';
    el.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9999;' +
      'background:#1a0000;border:1px solid var(--red);color:#e88a80;padding:10px 18px;' +
      'font-size:12px;font-family:var(--mono);max-width:90vw;cursor:pointer;';
    el.onclick = () => el.remove();
    document.body.appendChild(el);
  }
  el.textContent = msg + '  (click to dismiss)';
  setTimeout(() => el?.remove(), 8000);
}

async function upsertBonusResult(rid, qid, answer) {
  // Snapshot leaderboard totals as they were just before this bonus question's edits began,
  // so the dashboard's +/- movement badge reflects this bonus question as a whole
  maybeSnapshotBeforeEdit(`${rid}:${qid}`);

  await sb.from('bonus_results').upsert(
    { round_id: rid, question_id: qid, tournament_id: S.tournamentId, answer },
    { onConflict: 'round_id,question_id,tournament_id' }
  );
  if (!S.bonusResults[rid]) S.bonusResults[rid] = {};
  S.bonusResults[rid][qid] = { answer };
  autoCheckAchievements();
  saveFinalStandings();
}

async function toggleLock(rid) {
  const current = S.roundSettings[rid]?.locked || false;
  if (!S.roundSettings[rid]) S.roundSettings[rid] = {};
  S.roundSettings[rid].locked = !current;
  render(); // optimistic UI update
  try {
    const { error } = await sb.from('round_settings').upsert(
      { round_id: rid, tournament_id: S.tournamentId, locked: !current },
      { onConflict: 'round_id,tournament_id' }
    );
    if (error) throw error;
  } catch (e) {
    // Revert and show error
    S.roundSettings[rid].locked = current;
    render();
    alert(`Lock failed: ${e.message || e}\n\nMake sure the round_settings table exists in Supabase and allows writes.`);
  }
}

// 7. THEME
// ════════════════════════════════════════════════════════════════
function initTheme() {
  const saved = localStorage.getItem('wc26:theme');
  S.darkMode = saved !== 'light';
  applyTheme();
  applyColorScheme(S.colorScheme);
}

function applyTheme() {
  document.body.classList.toggle('light-mode', !S.darkMode);
}

function applyColorScheme(id) {
  const scheme = COLOR_SCHEMES[id] || COLOR_SCHEMES.gold;
  S.colorScheme = id;
  // Set on document.body — inline styles on body beat body.light-mode CSS class variables
  const vars = S.darkMode ? scheme.dark : scheme.light;
  document.body.style.setProperty('--gold',   vars.accent);
  document.body.style.setProperty('--gold2',  vars.accent2);
  document.body.style.setProperty('--border', vars.border);
}

function toggleTheme() {
  S.darkMode = !S.darkMode;
  localStorage.setItem('wc26:theme', S.darkMode ? 'dark' : 'light');
  applyTheme();
  applyColorScheme(S.colorScheme || 'gold'); // re-apply with correct dark/light variant
  // Re-render sidebar in place without full page render
  const trackEl = document.getElementById('toggle-track');
  const thumbEl = document.getElementById('toggle-thumb');
  const labelEl = document.getElementById('theme-label');
  const iconEl  = document.getElementById('theme-icon');
  if (trackEl) {
    trackEl.style.background = S.darkMode ? '#333' : 'var(--gold)';
    thumbEl.className = 'toggle-thumb ' + (S.darkMode ? 'on' : 'off');
    labelEl.textContent = S.darkMode ? 'Dark Mode' : 'Light Mode';
    iconEl.textContent  = S.darkMode ? '🌙' : '☀️';
  }
}

// 8. ACHIEVEMENT HELPERS
// ════════════════════════════════════════════════════════════════
async function awardAchievement(profileId, type) {
  const prof = S.profiles.find(p => p.id === profileId);
  if (!prof) return;
  const existing = prof.achievements || [];
  const updated  = [...existing, { type, awardedAt: new Date().toISOString() }];
  const { error } = await sb.from('profiles').update({ achievements: updated }).eq('id', profileId);
  if (error) { console.error('awardAchievement failed:', error.message); return; }
  prof.achievements = updated;
}

async function removeAchievement(profileId, index) {
  const prof = S.profiles.find(p => p.id === profileId);
  if (!prof) return;
  const updated = (prof.achievements || []).filter((_, i) => i !== index);
  const { error } = await sb.from('profiles').update({ achievements: updated }).eq('id', profileId);
  if (error) { console.error('removeAchievement failed:', error.message); return; }
  prof.achievements = updated;
}

// Auto-award achievements based on current data. Safe to run multiple times —
// only awards what a player doesn't already have. Admin-only (writes profiles).
async function autoCheckAchievements() {
  if (!S.profile?.is_admin) return;
  const players = S.profiles.filter(p => !p.is_admin);

  for (const player of players) {
    const uid = player.id;
    const has = type => (player.achievements || []).some(a => a.type === type);
    const award = async type => { if (!has(type)) await awardAchievement(uid, type); };

    const { total, exactScores } = calcScore(uid);

    // ── centuryClub: 100+ total points ────────────────────────────
    if (total >= 100) await award('centuryClub');

    // ── scoreMaster: 20+ exact scores across the whole tournament ──
    if (exactScores >= 20) await award('scoreMaster');

    // ── oracle: correctly predicted the tournament winner ──────────
    const ptWinnerPick = S.bonusAnswers[uid]?.['pt']?.['pt_winner']?.answer;
    const ptWinnerRes  = S.bonusResults['pt']?.['pt_winner']?.answer;
    if (ptWinnerPick && ptWinnerRes && ptWinnerPick === ptWinnerRes) await award('oracle');

    // ── Per-round checks ───────────────────────────────────────────
    for (const round of Object.values(ROUNDS)) {
      if (round.special === 'pretournament') continue;
      const rid = round.id;
      const matchesWithResults = round.matches.filter(m => S.results[rid]?.[m.id]?.winner);
      if (!matchesWithResults.length) continue;
      const allResultsIn = matchesWithResults.length === round.matches.length;
      const picks = S.picks[uid]?.[rid] || {};

      // perfectRound: every match pick correct (all results must be in)
      if (!has('perfectRound') && allResultsIn && round.matches.length > 0) {
        const allCorrect = round.matches.every(m => {
          const pick = picks[m.id];
          const res  = S.results[rid]?.[m.id];
          return pick?.winner && res?.winner && pick.winner === res.winner;
        });
        if (allCorrect) await award('perfectRound');
      }

      // sharpshooter: 5+ exact scores in a single round
      if (!has('sharpshooter')) {
        let exactInRound = 0;
        for (const m of round.matches) {
          const pick = picks[m.id];
          const res  = S.results[rid]?.[m.id];
          if (pick && res?.winner && scoreLinePoints(pick, res).exact) exactInRound++;
        }
        if (exactInRound >= 5) await award('sharpshooter');
      }

      // bonusHunter: every bonus question answered correctly in a round (min 3 Qs)
      if (!has('bonusHunter')) {
        const bqs = getActiveQuestions(rid);
        const answeredQs = bqs.filter(bq => S.bonusResults[rid]?.[bq.id]?.answer);
        if (answeredQs.length >= 3) {
          const allRight = answeredQs.every(bq =>
            S.bonusAnswers[uid]?.[rid]?.[bq.id]?.answer === S.bonusResults[rid][bq.id].answer
          );
          if (allRight) await award('bonusHunter');
        }
      }

      // wagerKing: 15+ pts from wagers in a single round
      if (!has('wagerKing')) {
        let wagerPts = 0;
        for (const bq of getActiveQuestions(rid)) {
          const isWagerable = bq.type === 'overunder' || bq.wager;
          if (!isWagerable) continue;
          const ans     = S.bonusAnswers[uid]?.[rid]?.[bq.id];
          const correct = S.bonusResults[rid]?.[bq.id];
          if (!ans?.answer || !correct?.answer || ans.answer === 'Abstain') continue;
          if (ans.answer === correct.answer) {
            wagerPts += bq.wager ? (Number(ans.wager) || 0) : bq.pts;
          }
        }
        if (wagerPts >= 15) await award('wagerKing');
      }

      // highRoller: won a knockout O/U wager at max stake
      if (!has('highRoller') && round.knockout) {
        for (const bq of getActiveQuestions(rid)) {
          if (bq.type !== 'overunder') continue;
          const ans     = S.bonusAnswers[uid]?.[rid]?.[bq.id];
          const correct = S.bonusResults[rid]?.[bq.id];
          if (!ans?.answer || !correct?.answer || ans.answer === 'Abstain') continue;
          const maxStake = bq.pts * 2;
          if (Number(ans.wager) >= maxStake && ans.answer === correct.answer) {
            await award('highRoller'); break;
          }
        }
      }

      // contrarian: picked the minority winner (<35% of players) and they were right
      if (!has('contrarian') && allResultsIn) {
        for (const m of matchesWithResults) {
          const res    = S.results[rid]?.[m.id];
          const myPick = picks[m.id]?.winner;
          if (!myPick || myPick !== res?.winner) continue;
          const counts = {};
          players.forEach(p => {
            const w = S.picks[p.id]?.[rid]?.[m.id]?.winner;
            if (w) counts[w] = (counts[w] || 0) + 1;
          });
          const total = Object.values(counts).reduce((a, b) => a + b, 0);
          if (total >= 3 && (counts[myPick] || 0) / total < 0.35) {
            await award('contrarian'); break;
          }
        }
      }
    }

    // ── comebackKid: gained the most positions of any player in any single round ──
    if (!has('comebackKid')) {
      const lb = getLeaderboard();
      const curRank = lb.find(p => p.id === uid)?.rank;
      if (curRank != null) {
        for (const round of Object.values(ROUNDS)) {
          if (round.special === 'pretournament') continue;
          const rid = round.id;
          if (!round.matches.every(m => S.results[rid]?.[m.id]?.winner)) continue;

          // Rank everyone as if this round didn't happen
          const prevSorted = players
            .map(p => ({ id: p.id, prevTotal: (lb.find(x => x.id === p.id)?.total ?? 0) - calcRoundScore(p.id, rid) }))
            .sort((a, b) => b.prevTotal - a.prevTotal);
          const prevRankMap = {};
          for (let i = 0; i < prevSorted.length; i++) {
            prevRankMap[prevSorted[i].id] = i === 0 || prevSorted[i].prevTotal !== prevSorted[i-1].prevTotal
              ? i + 1 : prevRankMap[prevSorted[i-1].id];
          }

          // Gain for each player in this round
          const gains = players.map(p => {
            const cur  = lb.find(x => x.id === p.id)?.rank ?? 999;
            const prev = prevRankMap[p.id] ?? 999;
            return { id: p.id, gain: prev - cur };
          });
          const maxGain = Math.max(...gains.map(g => g.gain));
          const myGain  = gains.find(g => g.id === uid)?.gain ?? 0;
          if (maxGain >= 10 && myGain === maxGain) {
            await award('comebackKid'); break;
          }
        }
      }
    }
  }
  render();
}

      email: 'admin@vermanipool.internal',
      password: 'dw8SxQCWcZLbEER'
    });

      showMsg(msgEl, 'Admin sign-in failed — contact support.', 'err');

async function doAuth() {
  const email = document.getElementById('a-email').value.trim();
  const pw    = document.getElementById('a-pw').value;
  const msgEl = document.getElementById('auth-msg');
  const btn   = document.getElementById('a-submit');

  if (!email || !pw) { showMsg(msgEl, 'Please fill in all fields.', 'err'); return; }
  btn.disabled = true; btn.textContent = 'Please wait…';
  const authTimeout = setTimeout(() => {
    if (btn.disabled) { btn.disabled = false; btn.textContent = 'Sign In →'; showMsg(msgEl, 'Took too long — please try again.', 'err'); }
  }, 15000);

  if (S.authMode === 'login') {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    clearTimeout(authTimeout);
    if (error) { showMsg(msgEl, error.message, 'err'); btn.disabled = false; btn.textContent = 'Sign In →'; return; }
    // Drive the login flow directly — don't rely solely on onAuthStateChange which can hang
    S.user = data.user;
    const { data: profile } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
    S.profile = profile;
    await loadAllData();
    S.page = 'dashboard';
    render();
  } else {
    const name = document.getElementById('a-name').value.trim();
    if (!name) { clearTimeout(authTimeout); showMsg(msgEl, 'Please enter a display name.', 'err'); btn.disabled = false; btn.textContent = 'Create Account →'; return; }
    // Check registration cutoff
    if (S.registrationCutoff && Date.now() > new Date(S.registrationCutoff).getTime()) {
      clearTimeout(authTimeout);
      showMsg(msgEl, 'Registration is now closed.', 'err');
      btn.disabled = false; btn.textContent = 'Create Account →'; return;
    }
    const { data, error } = await sb.auth.signUp({ email, password: pw });
    clearTimeout(authTimeout);
    if (error) { showMsg(msgEl, error.message, 'err'); btn.disabled = false; btn.textContent = 'Create Account →'; return; }
    await sb.from('profiles').insert({ id: data.user.id, name });
    // Add profile to local state immediately so leaderboard shows the name right away
    if (!S.profiles) S.profiles = [];
    S.profiles.push({ id: data.user.id, name, is_admin: false });
    showMsg(msgEl, 'Account created! Signing you in…', 'ok');
  }
}

async function doForgotPassword() {
  const email = document.getElementById('a-email').value.trim();
  const msgEl = document.getElementById('auth-msg');
  const btn   = document.getElementById('a-submit');
  if (!email) { showMsg(msgEl, 'Please enter your email address.', 'err'); return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.href.split('#')[0],
  });
  if (error) {
    showMsg(msgEl, error.message, 'err');
    btn.disabled = false; btn.textContent = 'Send Reset Link →';
  } else {
    showMsg(msgEl, '✅ Reset link sent! Check your inbox (and spam folder).', 'ok');
    btn.disabled = true;
  }
}

async function doResetPassword() {
  const pw    = document.getElementById('a-pw').value;
  const msgEl = document.getElementById('auth-msg');
  const btn   = document.getElementById('a-submit');
  if (!pw || pw.length < 6) { showMsg(msgEl, 'Password must be at least 6 characters.', 'err'); return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) {
    showMsg(msgEl, error.message, 'err');
    btn.disabled = false; btn.textContent = 'Set New Password →';
  } else {
    showMsg(msgEl, '✅ Password updated! You are now signed in.', 'ok');
    setTimeout(() => { S.authMode = 'login'; }, 1500);
  }
}

// ── Pick reminder banner ──────────────────────────────────────────
function pickReminderBanner() {
  if (S.profile?.is_admin) return '';
  const uid  = S.user?.id;
  if (!uid) return '';
  const now  = Date.now();
  const WINDOW_START = 24 * 3600000; // show banner from 24h before kickoff
  const WINDOW_END   = 3600000;      // hide once locked (1h before)

  const unpickedMatches = [];
  for (const round of Object.values(ROUNDS)) {
    if (round.special === 'pretournament') continue;
    if (S.roundSettings[round.id]?.locked) continue;
    for (const m of round.matches) {
      const kickoff = getKickoff(m.id, m.kickoff);
      if (!kickoff) continue;
      if (S.manualMatchLocks[m.id]) continue;
      const koTime = new Date(kickoff).getTime();
      const diff   = koTime - now;
      if (diff < WINDOW_END || diff > WINDOW_START) continue; // outside 1-24h window
      const pick = S.picks[uid]?.[round.id]?.[m.id];
      if (!pick?.winner) {
        const homeTeam = getBracketTeam(m.id,'home',m.home);
        const awayTeam = getBracketTeam(m.id,'away',m.away);
        const hrs  = Math.floor(diff / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        unpickedMatches.push({ homeTeam, awayTeam, hrs, mins });
      }
    }
  }
  if (!unpickedMatches.length) return '';

  const matchList = unpickedMatches.map(m =>
    `<strong>${F(m.homeTeam)} ${m.homeTeam} vs ${F(m.awayTeam)} ${m.awayTeam}</strong> — locks in ${m.hrs}h ${m.mins}m`
  ).join(' &nbsp;·&nbsp; ');

  return `<div id="pick-reminder-banner" style="background:rgba(255,183,77,0.12);border-bottom:1px solid rgba(255,183,77,0.3);
    padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div style="font-size:12px;color:#ffb74d;font-family:var(--mono)">
      ⏰ <strong>Don't forget to pick!</strong> &nbsp; ${matchList}
    </div>
    <button onclick="document.getElementById('pick-reminder-banner').remove()"
      style="background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:16px;flex-shrink:0;padding:0 4px">✕</button>
  </div>`;
}

// ── Picks page ───────────────────────────────────────────────────
function renderPicks() {
  const round    = ROUNDS[S.activeRound];
  if (!round) return `<div class="page-title">My Picks</div>
    <div class="card"><p style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0">
      No rounds are configured for this tournament yet. An admin can add rounds in the ⚙️ Settings tab.</p></div>`;
  const rid      = round.id;
  const uid      = S.user.id;
  const locked   = S.roundSettings[rid]?.locked || false;
  const isAdmin  = S.profile?.is_admin;
  const isPinAdmin = isAdmin; // isPinAdmin unified — both cases now use S.profile.is_admin
  const readOnly = (locked && !isAdmin) || isAdmin;

  const pillsHtml = Object.values(ROUNDS).map(r => {
    const lk = S.roundSettings[r.id]?.locked;
    const shortLabel = r.id === 'pt' ? 'Pre-Tournament' : r.label.replace('Match Day ','MD');
    return `<button class="pill ${lk?'locked':''} ${S.activeRound===r.id?'active':''}" data-r="${r.id}">
      ${shortLabel} ${lk?'🔒':''}
    </button>`;
  }).join('');

  // Admin-locked round: hide everything from regular users
  // Exception: pre-tournament round shows picks read-only instead of a lock wall
  if (locked && !isAdmin && !isPinAdmin && round.special !== 'pretournament') {
    const unlockAt = S.lockSchedules[rid]?.unlockAt;
    let unlockLine = '';
    if (unlockAt) {
      const diff = new Date(unlockAt).getTime() - Date.now();
      if (diff > 0) {
        const totalMins = Math.floor(diff / 60000);
        const hrs = Math.floor(totalMins / 60);
        const mins = totalMins % 60;
        let countdownStr;
        if (hrs >= 48) countdownStr = `${Math.floor(hrs/24)}d ${hrs%24}h`;
        else if (hrs >= 1) countdownStr = `${hrs}h ${mins}m`;
        else countdownStr = `${mins}m`;
        const localUnlock = new Date(unlockAt).toLocaleString(undefined, {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
        unlockLine = `<p style="color:#66bb6a;font-family:var(--mono);font-size:12px;margin-top:16px;letter-spacing:0.05em">
          🟢 Unlocks in ${countdownStr} · ${localUnlock}
        </p>`;
      }
    }
    return `
      <div class="page-title">My Picks</div>
      <div class="pill-row">${pillsHtml}</div>
      ${round.dateRange ? `<div class="round-dates">📅 ${round.dateRange}</div>` : ''}

          This round is currently locked. Picks are hidden until the admin opens it.
        </p>
        ${unlockLine}
      </div>`;
  }

  // ── Pre-Tournament special render ──────────────────────────────
  if (round.special === 'pretournament') {
    const winPts = S.ptSettings?.winnerPts ?? 10;
    const allTeams = Object.values(GROUPS).flat().sort();
    const maxGroupPts = (S.tournamentConfig?.numGroups ?? Object.keys(GROUPS).length) * (S.tournamentConfig?.advancersPerGroup ?? 2) * 2;
    const ptBonusQsForMax = getActiveQuestions('pt');
    const { bonus: ptBMult } = getMultipliers('pt');
    const ptBonusMaxPts = ptBonusQsForMax.reduce((sum, q) => sum + q.pts * ptBMult, 0);
    const ptBonusNote = ptBonusQsForMax.length
      ? ` + ${ptBonusMaxPts} pts (${ptBonusQsForMax.length} bonus Q${ptBonusQsForMax.length>1?'s':''})` : '';
    const totalMax = maxGroupPts + winPts + ptBonusMaxPts;

    const groupHtml = Object.entries(GROUPS).map(([g, teams]) => {
      const p1 = S.bonusAnswers[uid]?.['pt']?.[`pt_${g}_1`]?.answer || '';
      const p2 = S.bonusAnswers[uid]?.['pt']?.[`pt_${g}_2`]?.answer || '';
      const r1 = S.bonusResults['pt']?.[`pt_${g}_1`]?.answer || '';

              <option value="">— Select team —</option>${opts2}

          ${badge(p1, r1, hasResults)}
          ${badge(p2, r2, hasResults)}
        </div>

    if (winnerRes) {
      wBadge = winnerPick === winnerRes
        ? `<span class="pts-badge pts-ok">+${winPts} pts ✅</span>`
        : winnerPick ? `<span class="pts-badge pts-bad">0 pts ❌</span>` : '';
    }
    const allTeamOpts = allTeams.map(t => `<option value="${t}" ${winnerPick===t?'selected':''}>${F(t)} ${t}</option>`).join('');

    return `
      <div class="page-title">My Picks</div>
      ${isAdmin || isPinAdmin ? `<div class="notice">👁 Admin view — picks are read-only.</div>` : ''}
      <div class="pill-row">${pillsHtml}</div>
      <div class="round-dates">📅 Before Jun 11 · Lock in your pre-tournament predictions</div>
      <div class="notice" style="margin-bottom:16px">
        🏆 Up for grabs: <strong>${totalMax} pts</strong> — ${maxGroupPts} from group picks (${S.tournamentConfig?.numGroups ?? Object.keys(GROUPS).length} groups × max ${(S.tournamentConfig?.advancersPerGroup ?? 2) * 2} pts) + ${winPts} from tournament winner${ptBonusNote}
      </div>
      <div class="card">
        <div class="card-title">🏆 Group Stage Predictions</div>
        <p style="color:var(--muted);font-size:12px;margin-bottom:16px;line-height:1.7">

      </div>
      <div class="card" style="border-color:rgba(232,213,163,0.2)">

        <p style="color:var(--muted);font-size:12px;margin-bottom:12px">
