<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ WC 2026 Fantasy Pool</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── Reset & variables ───────────────────────────────────────── */
:root{
  --bg:#0a1628;--card:#0d1f3c;--card2:#0f2448;
  --gold:#FFD700;--gold2:#b8940a;
  --text:#ffffff;--muted:#8a9bb0;--faint:#3a4a60;
  --border:rgba(255,215,0,0.14);--border2:rgba(255,255,255,0.09);
  --green:#4CAF50;--red:#ef5350;--blue:#1565c0;--purple:#7b2fff;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;}
a{color:var(--gold);text-decoration:none;}

/* ── Nav ─────────────────────────────────────────────────────── */
.nav{background:#060e1d;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:4px;padding:0 16px;
  position:sticky;top:0;z-index:100;height:50px;overflow-x:auto;}
.nav-brand{color:var(--gold);font-weight:900;font-size:15px;margin-right:10px;white-space:nowrap;}
.nav-tab{background:transparent;border:none;color:var(--muted);cursor:pointer;
  padding:8px 14px;border-radius:8px;font-size:13px;white-space:nowrap;transition:all .2s;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{background:var(--gold);color:#060e1d;font-weight:700;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.nav-user{font-size:12px;color:var(--muted);}
.nav-signout{background:transparent;border:1px solid var(--faint);color:var(--muted);
  cursor:pointer;padding:5px 10px;border-radius:8px;font-size:12px;}
.nav-signout:hover{border-color:var(--red);color:var(--red);}

/* ── Layout ──────────────────────────────────────────────────── */
.page{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
.page-title{color:var(--gold);font-size:20px;font-weight:900;margin-bottom:20px;}

/* ── Cards ───────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:14px;}

/* ── Buttons ─────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;
  padding:10px 20px;border-radius:10px;border:none;cursor:pointer;
  font-size:14px;font-weight:700;transition:all .15s;font-family:Arial,sans-serif;}
.btn-gold{background:var(--gold);color:#060e1d;}
.btn-gold:hover{background:#e6c200;}
.btn-outline{background:transparent;color:var(--muted);border:1px solid var(--faint);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px;}
.btn-danger{background:rgba(239,83,80,.15);color:var(--red);border:1px solid var(--red);}
.btn-danger:hover{background:rgba(239,83,80,.3);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ── Inputs ──────────────────────────────────────────────────── */
.input{width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);
  border-radius:10px;color:var(--text);padding:11px 14px;font-size:14px;
  outline:none;transition:border-color .2s;font-family:Arial,sans-serif;}
.input:focus{border-color:var(--gold);}
.input::placeholder{color:var(--faint);}
.label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.field{margin-bottom:14px;}
.err-box{background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.3);
  color:#ef9a9a;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px;}
.ok-box{background:rgba(76,175,80,.12);border:1px solid rgba(76,175,80,.3);
  color:#a5d6a7;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px;}

/* ── Pill selector (round tabs) ───────────────────────────────── */
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.pill{background:transparent;border:1px solid var(--faint);color:var(--muted);
  cursor:pointer;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;
  transition:all .2s;font-family:Arial,sans-serif;}
.pill:hover{border-color:var(--gold);color:var(--gold);}
.pill.active{background:var(--gold);border-color:var(--gold);color:#060e1d;}
.pill.locked{border-color:#ff7043;color:#ff7043;}
.pill.locked.active{background:#ff7043;color:#fff;}

/* ── Match rows ───────────────────────────────────────────────── */
.match-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px 0;border-bottom:1px solid var(--border2);}
.match-row:last-child{border-bottom:none;}
.team-btn{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);
  color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer;
  font-size:12px;font-weight:700;font-family:Arial,sans-serif;
  transition:all .15s;white-space:nowrap;}
.team-btn:hover:not(:disabled){background:rgba(255,255,255,.12);}
.team-btn.sel{background:var(--blue);border-color:#42a5f5;color:#fff;}
.team-btn.correct{background:#2e7d32;border-color:#66bb6a;color:#fff;}
.team-btn.wrong{background:#4a0000;border-color:var(--red);color:#ef9a9a;}
.team-btn.draw{border-color:rgba(255,215,0,.3);color:var(--muted);}
.team-btn.draw.sel{background:#5d4037;border-color:var(--gold);color:var(--gold);}
.team-btn.draw.correct{background:#2e7d32;border-color:#66bb6a;color:#fff;}
.team-btn.draw.wrong{background:#4a0000;border-color:var(--red);color:#ef9a9a;}
.team-btn:disabled{cursor:default;opacity:.8;}
.vs{color:var(--faint);font-size:11px;flex-shrink:0;}
.score-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.score-in{width:34px;height:28px;background:rgba(255,255,255,.06);
  border:1px solid var(--border2);border-radius:6px;color:var(--text);
  text-align:center;font-size:13px;font-weight:700;outline:none;
  font-family:Arial,sans-serif;}
.score-in:disabled{opacity:.6;cursor:default;}
.pts-badge{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:700;
  white-space:nowrap;margin-left:auto;}
.pts-ok{background:#1b5e20;color:#a5d6a7;}
.pts-part{background:#0d47a1;color:#90caf9;}
.pts-bad{background:#4a0000;color:#ef9a9a;}

/* ── Bonus questions ──────────────────────────────────────────── */
.bonus-section{margin-top:18px;padding:16px;background:rgba(255,215,0,.04);
  border:1px solid rgba(255,215,0,.15);border-radius:10px;}
.bonus-title{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:12px;}
.bonus-q{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border2);}
.bonus-q:last-child{border-bottom:none;margin-bottom:0;}
.bonus-q-text{font-size:12px;color:var(--text);margin-bottom:7px;}
.bonus-opts{display:flex;flex-wrap:wrap;gap:5px;}
.bopt{background:transparent;border:2px solid var(--faint);color:var(--muted);
  border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;
  cursor:pointer;font-family:Arial,sans-serif;transition:all .15s;}
.bopt:hover:not(:disabled){border-color:var(--gold);}
.bopt.sel{background:var(--blue);border-color:#42a5f5;color:#fff;}
.bopt.correct{background:#2e7d32;border-color:#66bb6a;color:#fff;}
.bopt.wrong{background:#4a0000;border-color:var(--red);color:#ef9a9a;}
.bopt:disabled{cursor:default;opacity:.8;}
.wager-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.wager-in{width:60px;height:26px;background:rgba(255,215,0,.08);
  border:1px solid rgba(255,215,0,.35);border-radius:6px;color:var(--gold);
  text-align:center;font-size:13px;font-weight:700;outline:none;font-family:Arial,sans-serif;}
.wager-in:disabled{opacity:.6;cursor:default;}
.wager-hint{font-size:10px;color:var(--muted);}

/* ── Leaderboard ─────────────────────────────────────────────── */
.lb-table{width:100%;border-collapse:collapse;}
.lb-table th{color:var(--gold);font-size:11px;padding:7px 10px;
  border-bottom:2px solid var(--gold);text-align:left;}
.lb-table th:last-child,.lb-table td:last-child{text-align:right;}
.lb-table td{padding:9px 10px;border-bottom:1px solid var(--border2);font-size:13px;}
.lb-table tr:hover td{background:rgba(255,255,255,.03);cursor:pointer;}
.lb-table tr.gold-row td{background:rgba(255,215,0,.07);}
.rank-icon{font-size:18px;}
.lb-pts{color:var(--green);font-weight:900;font-size:16px;}
.lb-bar-wrap{height:5px;background:rgba(255,255,255,.07);border-radius:3px;width:80px;display:inline-block;}
.lb-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),#ffa500);}

/* ── Admin ───────────────────────────────────────────────────── */
.admin-match-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 0;border-bottom:1px solid var(--border2);}
.admin-match-row:last-child{border-bottom:none;}
.admin-match-label{font-size:12px;color:var(--muted);min-width:180px;flex-shrink:0;}
.admin-select{background:#1a2e50;border:1px solid rgba(255,112,67,.4);color:#fff;
  border-radius:6px;padding:4px 8px;font-size:12px;font-family:Arial,sans-serif;}
.admin-score{width:38px;height:26px;background:#1a2e50;border:1px solid rgba(255,112,67,.4);
  border-radius:6px;color:#fff;text-align:center;font-size:12px;font-family:Arial,sans-serif;}
.lock-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;}
.lock-badge.locked{background:rgba(255,112,67,.2);color:#ff7043;border:1px solid #ff7043;}
.lock-badge.open{background:rgba(255,255,255,.07);color:var(--muted);border:1px solid var(--faint);}

/* ── Auth page ───────────────────────────────────────────────── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:32px;width:100%;max-width:400px;}
.auth-logo{text-align:center;font-size:48px;margin-bottom:12px;}
.auth-title{text-align:center;color:var(--gold);font-size:22px;font-weight:900;margin-bottom:4px;}
.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;}
.auth-switch{text-align:center;font-size:12px;color:var(--muted);margin-top:16px;}
.auth-switch span{color:var(--gold);cursor:pointer;font-weight:700;}
.auth-switch span:hover{text-decoration:underline;}

/* ── Notice banner ───────────────────────────────────────────── */
.notice{background:rgba(255,215,0,.07);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px;font-size:12px;color:var(--gold);margin-bottom:12px;}
.locked-notice{background:rgba(255,112,67,.08);border:1px solid rgba(255,112,67,.25);
  border-radius:8px;padding:10px 14px;font-size:13px;color:#ff7043;margin-bottom:14px;}

/* ── Spinner ─────────────────────────────────────────────────── */
.spin{display:flex;align-items:center;justify-content:center;padding:60px;
  font-size:40px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Hamburger & Sidebar ──────────────────────────────────────── */
.hamburger{background:transparent;border:none;cursor:pointer;
  padding:6px 8px;border-radius:8px;display:flex;flex-direction:column;
  gap:4px;flex-shrink:0;margin-right:4px;}
.hamburger span{display:block;width:20px;height:2px;background:#aaa;border-radius:1px;}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:200;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.sidebar-overlay.open{opacity:1;pointer-events:auto;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;
  background:#0a1628;border-right:1px solid rgba(255,255,255,0.1);
  z-index:201;transform:translateX(-100%);transition:transform 0.3s ease;
  display:flex;flex-direction:column;overflow-y:auto;}
.sidebar.open{transform:translateX(0);}
.sidebar-header{padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,0.07);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.sidebar-close{background:transparent;border:none;color:#555;cursor:pointer;font-size:22px;line-height:1;}
.sidebar-section{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.07);}
.sidebar-section-label{color:#555;font-size:10px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;margin:0 0 10px;}
.sidebar-nav-btn{width:100%;display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:10px;background:transparent;
  border:1px solid rgba(255,255,255,0.08);color:var(--text);
  cursor:pointer;font-size:14px;margin-bottom:6px;font-family:Arial,sans-serif;
  transition:all .15s;text-align:left;}
.sidebar-nav-btn:hover{background:rgba(255,255,255,0.06);border-color:var(--gold);}
.sidebar-nav-btn.active{background:rgba(255,215,0,0.1);border-color:rgba(255,215,0,0.3);color:var(--gold);}

/* ── Dashboard ───────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:14px 16px;}
.stat-icon{font-size:22px;margin-bottom:6px;}
.stat-value{font-size:20px;font-weight:700;margin-bottom:2px;}
.stat-label{font-size:12px;color:var(--muted);}
.mini-bar-wrap{height:6px;background:rgba(255,255,255,0.07);border-radius:3px;flex:1;overflow:hidden;}
.mini-bar{height:100%;border-radius:3px;background:var(--gold);}
.player-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;
  padding:4px 6px;border-radius:8px;transition:background .15s;}
.highlight-card{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:14px 16px;}
.highlight-label{color:var(--muted);font-size:12px;margin-bottom:8px;}
.highlight-name{color:var(--text);font-weight:700;font-size:14px;margin-bottom:2px;}
.highlight-stat{color:var(--gold);font-size:12px;}
.rounds-table{width:100%;border-collapse:collapse;font-size:12px;}
.rounds-table th{color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border2);
  text-align:center;white-space:nowrap;}
.rounds-table th:first-child{text-align:left;}
.rounds-table td{padding:7px 8px;border-bottom:1px solid var(--border2);text-align:center;}
.rounds-table td:first-child{text-align:left;color:var(--text);}
.rounds-table tr:hover td{background:rgba(255,255,255,0.04);}

/* ── Bracket ─────────────────────────────────────────────────── */
.bracket-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:8px;margin-bottom:4px;}
.bracket-match{background:rgba(255,255,255,0.04);border:1px solid var(--border2);
  border-radius:10px;padding:8px 12px;font-size:12px;}
.bracket-match.has-result{border-color:rgba(102,187,106,0.35);}
.bracket-team{display:flex;justify-content:space-between;align-items:center;padding:3px 0;}
.bracket-team.winner{color:#66bb6a;font-weight:700;}
.bracket-team.loser{color:var(--muted);}
.bracket-vs{color:var(--faint);font-size:10px;text-align:center;padding:1px 0;}
.bracket-section{margin-bottom:16px;}
.bracket-section-title{color:#ff7043;font-size:13px;font-weight:700;margin-bottom:10px;}

/* ── Light mode overrides ─────────────────────────────────────── */
body.light-mode{
  --bg:#eef1f5;--card:#ffffff;--card2:#f5f7fa;
  --gold:#b8940a;--gold2:#8a6d00;
  --text:#1a2a40;--muted:#4a5568;--faint:#9aa5b1;
  --border:rgba(184,148,10,0.2);--border2:rgba(0,0,0,0.1);
  --green:#2e7d32;--red:#c62828;--blue:#1565c0;--purple:#6a1b9a;
}
body.light-mode .nav{background:#fff;border-color:rgba(184,148,10,0.18);}
body.light-mode .nav-signout{border-color:rgba(0,0,0,0.15);color:var(--muted);}
body.light-mode .sidebar{background:#fff;border-color:rgba(0,0,0,0.1);}
body.light-mode .sidebar-overlay{background:rgba(0,0,0,0.4);}
body.light-mode .auth-card{background:#fff;border-color:rgba(184,148,10,0.2);}
body.light-mode .score-in,
body.light-mode .input{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.15);color:var(--text);}
body.light-mode .team-btn{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.12);color:var(--muted);}
body.light-mode .admin-select,
body.light-mode .admin-score{background:#f0f2f5;border-color:rgba(255,112,67,.35);color:var(--text);}
body.light-mode .spin{color:#b8940a;}

/* ── Dark mode toggle button ──────────────────────────────────── */
.theme-toggle-btn{width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-radius:10px;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);color:var(--muted);cursor:pointer;
  font-size:13px;font-family:Arial,sans-serif;transition:all .15s;}
body.light-mode .theme-toggle-btn{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.12);}
.theme-toggle-btn:hover{border-color:var(--gold);}
.toggle-track{width:44px;height:24px;border-radius:12px;position:relative;
  flex-shrink:0;transition:background 0.3s;background:#333;}
body.light-mode .toggle-track{background:var(--gold);}
.toggle-thumb{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:left 0.25s;box-shadow:0 1px 4px rgba(0,0,0,0.4);}
.toggle-thumb.on{left:22px;}
.toggle-thumb.off{left:2px;}

/* ── Achievement badges ───────────────────────────────────────── */
.ach-icons{display:flex;gap:2px;flex-wrap:wrap;}
.ach-icon{font-size:14px;cursor:default;}
.ach-badge{display:inline-flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 12px;border-radius:12px;cursor:default;}
.ach-badge-label{font-size:11px;font-weight:700;}

/* ── Player profile modal ─────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);
  display:flex;align-items:center;justify-content:center;z-index:400;padding:20px;}
.modal-box{background:#0a1628;border-radius:20px;border:1px solid rgba(255,255,255,0.12);
  width:100%;max-width:440px;max-height:85vh;overflow-y:auto;}
body.light-mode .modal-box{background:#fff;border-color:rgba(0,0,0,0.1);}
.modal-header{background:linear-gradient(160deg,#0d1f3c,#1a2e50);
  padding:28px 24px 20px;border-radius:20px 20px 0 0;text-align:center;position:relative;}
body.light-mode .modal-header{background:linear-gradient(160deg,#dde4f0,#c8d3e8);}
.modal-close{position:absolute;top:14px;right:16px;background:transparent;border:none;
  color:#555;cursor:pointer;font-size:22px;line-height:1;}
.modal-avatar{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:36px;font-weight:700;margin:0 auto 12px;
  background:linear-gradient(135deg,var(--blue),var(--purple));}
.modal-stat-row{display:flex;gap:10px;margin-bottom:16px;}
.modal-stat{text-align:center;flex:1;padding:12px 8px;
  background:rgba(255,255,255,0.04);border-radius:10px;}
body.light-mode .modal-stat{background:rgba(0,0,0,0.04);}
.modal-stat-val{font-size:22px;font-weight:700;}
.modal-stat-lbl{font-size:11px;color:var(--muted);margin-top:2px;}

/* ── Responsive ──────────────────────────────────────────────── */
@media(max-width:600px){
  .page{padding:16px 12px 60px;}
  .lb-bar-wrap{display:none;}
  .match-row{gap:5px;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .highlights-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>

function getActiveQuestions(rid) {

}

function getMultipliers(rid) {
  return { match: S.multipliers[rid]?.match ?? 1, bonus: S.multipliers[rid]?.bonus ?? 1 };
}

function saveCustomQuestions() {
  localStorage.setItem('wc26:customBonusQs', JSON.stringify(S.customBonusQs));
}

function saveMultipliers() {
  localStorage.setItem('wc26:multipliers', JSON.stringify(S.multipliers));
}

function loadLocalSettings() {
  try {
    const cq = localStorage.getItem('wc26:customBonusQs');
    if (cq) S.customBonusQs = JSON.parse(cq);
  } catch {}
  try {
    const ml = localStorage.getItem('wc26:multipliers');
    if (ml) S.multipliers = JSON.parse(ml);
  } catch {}
}

// 6. SCORING
// ════════════════════════════════════════════════════════════════
function calcScore(uid) {
  let total = 0, correctPicks = 0, exactScores = 0;
  for (const round of Object.values(ROUNDS)) {
    const rid = round.id;
    const { match: mMult, bonus: bMult } = getMultipliers(rid);
    for (const m of round.matches) {
      const pick   = S.picks[uid]?.[rid]?.[m.id];
      const result = S.results[rid]?.[m.id];
      if (!pick || !result || !result.winner || !pick.winner) continue;
      if (pick.winner === result.winner) {
        total += 2 * mMult; correctPicks++;
        const sh = String(pick.score_home), sa = String(pick.score_away);
        const rh = String(result.score_home), ra = String(result.score_away);
        if (sh !== '' && sh === rh && sa === ra) { total += 1 * mMult; exactScores++; }
      }
    }
    for (const bq of getActiveQuestions(rid)) {
      const ans     = S.bonusAnswers[uid]?.[rid]?.[bq.id];
      const correct = S.bonusResults[rid]?.[bq.id];
      if (!ans || !correct || !correct.answer || !ans.answer) continue;
      if (ans.answer === correct.answer) {
        const wager = round.knockout ? (Number(ans.wager) || 0) : 0;
        total += (bq.pts * bMult) + wager;
      } else if (round.knockout && Number(ans.wager) > 0) {
        total -= Number(ans.wager);
      }
    }
  }
  return { total, correctPicks, exactScores };
}

function getLeaderboard() {
  return S.profiles
    .map(p => ({ ...p, ...calcScore(p.id) }))
    .sort((a,b) => b.total - a.total || b.correctPicks - a.correctPicks || b.exactScores - a.exactScores)
    .map((p, i, arr) => {
      const tied = i > 0 && p.total === arr[i-1].total && p.correctPicks === arr[i-1].correctPicks && p.exactScores === arr[i-1].exactScores;
      return { ...p, rank: tied ? arr[i-1].rank : i + 1 };
    });
}

async function loadAllData() {
  // profiles
  const { data: profiles } = await sb.from('profiles').select('*');
  S.profiles = profiles || [];

  // picks (admin sees all, others see own + locked rounds via RLS)
  const { data: picks } = await sb.from('picks').select('*');
  S.picks = {};
  for (const p of (picks || [])) {
    if (!S.picks[p.user_id]) S.picks[p.user_id] = {};
    if (!S.picks[p.user_id][p.round_id]) S.picks[p.user_id][p.round_id] = {};
    S.picks[p.user_id][p.round_id][p.match_id] = { winner: p.winner, score_home: p.score_home, score_away: p.score_away };
  }

  // bonus answers
  const { data: bans } = await sb.from('bonus_answers').select('*');
  S.bonusAnswers = {};
  for (const b of (bans || [])) {
    if (!S.bonusAnswers[b.user_id]) S.bonusAnswers[b.user_id] = {};
    if (!S.bonusAnswers[b.user_id][b.round_id]) S.bonusAnswers[b.user_id][b.round_id] = {};
    S.bonusAnswers[b.user_id][b.round_id][b.question_id] = { answer: b.answer, wager: b.wager };
  }

  // results
  const { data: results } = await sb.from('results').select('*');
  S.results = {};
  for (const r of (results || [])) {
    if (!S.results[r.round_id]) S.results[r.round_id] = {};
    S.results[r.round_id][r.match_id] = { winner: r.winner, score_home: r.score_home, score_away: r.score_away };
  }

  // bonus results
  const { data: bres } = await sb.from('bonus_results').select('*');
  S.bonusResults = {};
  for (const b of (bres || [])) {
    if (!S.bonusResults[b.round_id]) S.bonusResults[b.round_id] = {};
    S.bonusResults[b.round_id][b.question_id] = { answer: b.answer };
  }

  // round settings
  const { data: rs } = await sb.from('round_settings').select('*');
  S.roundSettings = {};
  for (const r of (rs || [])) S.roundSettings[r.round_id] = { locked: r.locked, deadline: r.deadline };
}

async function upsertPick(rid, mid, winner, sh, sa) {
  await sb.from('picks').upsert({
    user_id: S.user.id, round_id: rid, match_id: mid,
    winner, score_home: String(sh), score_away: String(sa),
  }, { onConflict: 'user_id,round_id,match_id' });
  if (!S.picks[S.user.id]) S.picks[S.user.id] = {};
  if (!S.picks[S.user.id][rid]) S.picks[S.user.id][rid] = {};
  S.picks[S.user.id][rid][mid] = { winner, score_home: String(sh), score_away: String(sa) };
}

async function upsertBonusAnswer(rid, qid, answer, wager) {
  await sb.from('bonus_answers').upsert({
    user_id: S.user.id, round_id: rid, question_id: qid, answer, wager: Number(wager) || 0,
  }, { onConflict: 'user_id,round_id,question_id' });
  if (!S.bonusAnswers[S.user.id]) S.bonusAnswers[S.user.id] = {};
  if (!S.bonusAnswers[S.user.id][rid]) S.bonusAnswers[S.user.id][rid] = {};
  S.bonusAnswers[S.user.id][rid][qid] = { answer, wager: Number(wager) || 0 };
}

async function upsertResult(rid, mid, winner, sh, sa) {
  await sb.from('results').upsert(
    { round_id: rid, match_id: mid, winner, score_home: String(sh), score_away: String(sa) },
    { onConflict: 'round_id,match_id' }
  );
  if (!S.results[rid]) S.results[rid] = {};
  S.results[rid][mid] = { winner, score_home: String(sh), score_away: String(sa) };
}

async function upsertBonusResult(rid, qid, answer) {
  await sb.from('bonus_results').upsert(
    { round_id: rid, question_id: qid, answer },
    { onConflict: 'round_id,question_id' }
  );
  if (!S.bonusResults[rid]) S.bonusResults[rid] = {};
  S.bonusResults[rid][qid] = { answer };
}

async function toggleLock(rid) {
  const current = S.roundSettings[rid]?.locked || false;
  await sb.from('round_settings').upsert(
    { round_id: rid, locked: !current },
    { onConflict: 'round_id' }
  );
  if (!S.roundSettings[rid]) S.roundSettings[rid] = {};
  S.roundSettings[rid].locked = !current;
}

function initTheme() {
  const saved = localStorage.getItem('wc26:theme');
  S.darkMode = saved !== 'light';
  applyTheme();
}

function applyTheme() {
  document.body.classList.toggle('light-mode', !S.darkMode);
}

function toggleTheme() {
  S.darkMode = !S.darkMode;
  localStorage.setItem('wc26:theme', S.darkMode ? 'dark' : 'light');
  applyTheme();
  // Re-render sidebar in place without full page render
  const trackEl = document.getElementById('toggle-track');
  const thumbEl = document.getElementById('toggle-thumb');
  const labelEl = document.getElementById('theme-label');
  const iconEl  = document.getElementById('theme-icon');
  if (trackEl) {
    trackEl.style.background = S.darkMode ? '#333' : 'var(--gold)';
    thumbEl.className = 'toggle-thumb ' + (S.darkMode ? 'on' : 'off');
    labelEl.textContent = S.darkMode ? 'Dark Mode' : 'Light Mode';
    iconEl.textContent  = S.darkMode ? '🌙' : '☀️';
  }
}

// ════════════════════════════════════════════════════════════════
async function awardAchievement(profileId, type) {
  const prof = S.profiles.find(p => p.id === profileId);
  if (!prof) return;
  const existing = prof.achievements || [];
  const updated  = [...existing, { type, awardedAt: new Date().toISOString() }];
  await sb.from('profiles').update({ achievements: updated }).eq('id', profileId);
  prof.achievements = updated;
}

async function removeAchievement(profileId, index) {
  const prof = S.profiles.find(p => p.id === profileId);
  if (!prof) return;
  const updated = (prof.achievements || []).filter((_, i) => i !== index);
  await sb.from('profiles').update({ achievements: updated }).eq('id', profileId);
  prof.achievements = updated;
}

  S.selectedPlayer = profile;
  const existing = document.getElementById('player-modal');
  if (existing) existing.remove();

  const isAdmin  = S.profile?.is_admin;
  const getName  = p => p?.nickname || p?.name || '—';
  const initials = n => (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const { total, correctPicks, exactScores } = calcScore(profile.id);
  const lb   = getLeaderboard();
  const rank = (lb.find(p => p.id === profile.id)?.rank) ?? '—';
  const medal = r => r===1?'🥇':r===2?'🥈':r===3?'🥉':`#${r}`;
  const rankColor = rank===1?'#FFD700':rank===2?'#C0C0C0':rank===3?'#CD7F32':'#aaa';
  const achs = profile.achievements || [];

  const achBadges = achs.length
    ? achs.map((a, i) => {
        const def = ACHIEVEMENTS[a.type];
        if (!def) return '';
        return `<div class="ach-badge" style="background:${def.color}22;border:1px solid ${def.color}55" title="${def.desc}">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:18px">${def.icon}</span>
            <span class="ach-badge-label" style="color:${def.color}">${def.label}</span>
            ${isAdmin ? `<button data-remove-ach="${i}" style="background:transparent;border:none;color:rgba(255,80,80,0.7);cursor:pointer;font-size:14px;font-weight:bold;line-height:1;padding:0 2px">×</button>` : ''}
          </div>
        </div>`;
      }).join('')
    : '<p style="color:var(--muted);font-size:13px;font-style:italic">No achievements yet — keep playing!</p>';

  const awardSelect = isAdmin ? `
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border2)">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">⚙️ Award Achievement</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="ach-select" class="input" style="flex:1;padding:8px 10px;font-size:13px">
          <option value="">— Select achievement —</option>
          ${Object.entries(ACHIEVEMENTS).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('')}
        </select>
        <button id="ach-award-btn" class="btn btn-gold btn-sm">Award</button>
      </div>
    </div>` : '';

  const el = document.createElement('div');
  el.id = 'player-modal';
  el.className = 'modal-overlay';
  el.innerHTML = `
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <button class="modal-close" id="modal-close-btn">✕</button>
        <div class="modal-avatar">${initials(getName(profile))}</div>
        <h2 style="color:#fff;margin:0 0 2px;font-size:20px">${getName(profile)}</h2>
        ${profile.nickname ? `<p style="color:#666;font-size:12px;margin:0 0 8px">${profile.name}</p>` : ''}
        <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.07);padding:5px 14px;border-radius:20px">
          <span style="font-size:${rank<=3?20:14}px;color:${rankColor}">${typeof rank==='number'&&rank<=3?['🥇','🥈','🥉'][rank-1]:'#'+rank}</span>
          <span style="color:${rankColor};font-size:13px;font-weight:bold">${typeof rank==='number'&&rank<=3?['Champion','Runner-up','3rd Place'][rank-1]:'Rank '+rank}</span>
        </div>
      </div>
      <div style="padding:16px 20px 20px">
        <div class="modal-stat-row">
          <div class="modal-stat"><div class="modal-stat-val" style="color:#4CAF50">${total}</div><div class="modal-stat-lbl">Points</div></div>
          <div class="modal-stat"><div class="modal-stat-val" style="color:#90caf9">${correctPicks}</div><div class="modal-stat-lbl">Correct Picks</div></div>
          <div class="modal-stat"><div class="modal-stat-val" style="color:#ce93d8">${exactScores}</div><div class="modal-stat-lbl">Exact Scores</div></div>
        </div>
        <h4 style="color:var(--gold);margin:0 0 10px;font-size:13px">🏅 Achievements</h4>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">${achBadges}</div>
        ${awardSelect}
      </div>
    </div>`;

  el.onclick = () => { el.remove(); S.selectedPlayer = null; };
  document.body.appendChild(el);

  document.getElementById('modal-close-btn').onclick = () => { el.remove(); S.selectedPlayer = null; };

  el.querySelectorAll('[data-remove-ach]').forEach(btn => {
    btn.onclick = async e => {
      e.stopPropagation();
      await removeAchievement(profile.id, Number(btn.dataset.removeAch));
      el.remove();
      showPlayerModal(S.profiles.find(p => p.id === profile.id) || profile);
    };
  });

  if (isAdmin) {
    document.getElementById('ach-award-btn').onclick = async () => {
      const type = document.getElementById('ach-select').value;
      if (!type) return;
      await awardAchievement(profile.id, type);
      el.remove();
      showPlayerModal(S.profiles.find(p => p.id === profile.id) || profile);
    };
  }
}

  document.getElementById('tab-admin').onclick = () => { S.authMode = 'admin'; renderAuth(); };

  if (isAdmin) {
    document.getElementById('a-pin').onkeydown = e => { if (e.key === 'Enter') doAdminPin(); };

    document.getElementById('a-toggle').onclick = () => { S.authMode = isLogin ? 'register' : 'login'; renderAuth(); };

async function doAdminPin() {
  const pin   = document.getElementById('a-pin').value;
  const msgEl = document.getElementById('auth-msg');
  const btn   = document.getElementById('a-submit');
  if (pin !== 'admin2026') { showMsg(msgEl, 'Wrong PIN.', 'err'); btn.style.background = '#c0392b'; setTimeout(() => btn.style.background = '#ff7043', 500); return; }
  btn.disabled = true; btn.textContent = 'Loading…';
  S.user    = { id: 'admin_pin' };
  S.profile = { is_admin: true, name: 'Admin', nickname: 'Admin' };
  await loadAllData();
  S.page = 'admin';
  render();
}

async function doAuth() {
  const email = document.getElementById('a-email').value.trim();
  const pw    = document.getElementById('a-pw').value;
  const msgEl = document.getElementById('auth-msg');
  const btn   = document.getElementById('a-submit');

  if (!email || !pw) { showMsg(msgEl, 'Please fill in all fields.', 'err'); return; }
  btn.disabled = true; btn.textContent = 'Please wait…';

  if (S.authMode === 'login') {
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) { showMsg(msgEl, error.message, 'err'); btn.disabled = false; btn.textContent = 'Sign In →'; }
  } else {
    const name = document.getElementById('a-name').value.trim();
    if (!name) { showMsg(msgEl, 'Please enter a display name.', 'err'); btn.disabled = false; btn.textContent = 'Create Account →'; return; }
    const { data, error } = await sb.auth.signUp({ email, password: pw });
    if (error) { showMsg(msgEl, error.message, 'err'); btn.disabled = false; btn.textContent = 'Create Account →'; return; }
    await sb.from('profiles').insert({ id: data.user.id, name });
    showMsg(msgEl, 'Account created! Signing you in…', 'ok');
  }
}

// ── Picks page ───────────────────────────────────────────────────
function renderPicks() {
  const round    = ROUNDS[S.activeRound];
  const rid      = round.id;
  const uid      = S.user.id;
  const locked   = S.roundSettings[rid]?.locked || false;
  const isAdmin  = S.profile?.is_admin;
  const isPinAdmin = S.user?.id === 'admin_pin';
  const readOnly = (locked && !isAdmin) || isAdmin || isPinAdmin;

  const pillsHtml = Object.values(ROUNDS).map(r => {
    const lk = S.roundSettings[r.id]?.locked;
    return `<button class="pill ${lk?'locked':''} ${S.activeRound===r.id?'active':''}" data-r="${r.id}">
      ${r.label.replace('Group Stage – Round ','Group Stage ')} ${lk?'🔒':''}
    </button>`;
  }).join('');

  const matchesHtml = round.matches.map(m => {
    const pick   = S.picks[uid]?.[rid]?.[m.id] || {};
    const result = S.results[rid]?.[m.id] || {};
    const winner = pick.winner || '';
    const sh     = pick.score_home ?? '';
    const sa     = pick.score_away ?? '';
    const rw     = result.winner || '';
    const rsh    = result.score_home ?? '';
    const rsa    = result.score_away ?? '';
    const hasResult = !!rw;

    const teamBtn = (team, isDraw) => {
      const isSel = winner === team;
      let cls = isDraw ? 'draw' : '';
      if (isSel && hasResult) cls += rw === team ? ' correct' : ' wrong';
      else if (isSel) cls += ' sel';
      const label = isDraw ? '🤝 Draw' : `${F(team)} ${team}`;
      return `<button class="team-btn ${cls}" data-action="pick" data-rid="${rid}" data-mid="${m.id}" data-team="${team}" ${readOnly?'disabled':''}>${label}</button>`;
    };

    let pts = '';
    if (hasResult && winner) {
      const exact = winner===rw && String(sh)===String(rsh) && String(sa)===String(rsa) && rsh!=='';
      if (exact) pts = '<span class="pts-badge pts-ok">+3 pts</span>';
      else if (winner===rw) pts = '<span class="pts-badge pts-part">+2 pts</span>';
      else pts = '<span class="pts-badge pts-bad">0 pts</span>';
    }

    return `<div class="match-row">
      ${teamBtn(m.home,false)}
      <span class="vs">vs</span>
      ${teamBtn(m.away,false)}
      ${!round.knockout ? teamBtn('Draw',true) : ''}
      <div class="score-wrap">
        <input class="score-in" type="number" min="0" max="20" value="${sh}" data-action="score" data-rid="${rid}" data-mid="${m.id}" data-side="h" ${readOnly?'disabled':''}>
        <span class="vs">–</span>
        <input class="score-in" type="number" min="0" max="20" value="${sa}" data-action="score" data-rid="${rid}" data-mid="${m.id}" data-side="a" ${readOnly?'disabled':''}>
      </div>
      ${pts}
    </div>`;
  }).join('');

  const bonusHtml = getActiveQuestions(rid).map(bq => {
    const ans   = S.bonusAnswers[uid]?.[rid]?.[bq.id] || {};
    const bres  = S.bonusResults[rid]?.[bq.id]?.answer || '';
    const wager = ans.wager || 0;
    const maxW  = bq.pts * 2;

    const optsHtml = bq.opts.map(opt => {
      const isSel = ans.answer === opt;
      let cls = '';
      if (isSel && bres) cls = bres===opt ? 'correct' : 'wrong';
      else if (isSel) cls = 'sel';
      return `<button class="bopt ${cls}" data-action="bonus" data-rid="${rid}" data-qid="${bq.id}" data-opt="${opt}" ${readOnly?'disabled':''}>${opt}</button>`;
    }).join('');

    const wagerHtml = round.knockout ? `
      <div class="wager-row">
        <span class="wager-hint">💰 Wager:</span>
        <input class="wager-in" type="number" min="0" max="${maxW}" value="${wager||''}" placeholder="0"
          data-action="wager" data-rid="${rid}" data-qid="${bq.id}" ${readOnly?'disabled':''}>
        <span class="wager-hint">max ${maxW} · correct +${bq.pts+(wager||0)} · wrong −${wager||0}</span>
      </div>` : '';

    return `<div class="bonus-q">
      <div class="bonus-q-text">${bq.text} <span style="color:var(--gold);font-size:10px">[${bq.pts} pts]</span></div>
      <div class="bonus-opts">${optsHtml}</div>
      ${wagerHtml}
    </div>`;
  }).join('');

  return `
    <div class="page-title">My Picks</div>
    ${isAdmin || isPinAdmin ? `<div class="notice">👁 Admin view — picks are read-only. Admins cannot submit picks.</div>` : readOnly ? `<div class="locked-notice">🔒 This round is locked — picks are read-only.</div>` : ''}
    <div class="pill-row">${pillsHtml}</div>
    <div class="card">
      <div class="card-title">${round.label}</div>
      <p style="color:var(--muted);font-size:11px;margin-bottom:12px">Pick winner (2 pts) + exact score (+1 pt)</p>
      ${matchesHtml}
    </div>
    <div class="bonus-section">
      <div class="bonus-title">⭐ Bonus Questions</div>
      ${bonusHtml}
    </div>`;
}

// ── Leaderboard ───────────────────────────────────────────────────
function renderLeaderboard() {
  const lb = getLeaderboard();
  const maxPts = lb[0]?.total || 1;
  const medal = r => ['🥇','🥈','🥉'][r-1] || `#${r}`;
  const achIcons = p => (p.achievements || []).slice(0,4)
    .map(a => ACHIEVEMENTS[a.type] ? `<span class="ach-icon" title="${ACHIEVEMENTS[a.type].label}">${ACHIEVEMENTS[a.type].icon}</span>` : '')
    .join('');
  const rows = lb.map((p,i) => {
    const barW = Math.round((p.total/maxPts)*100);
    return `<tr class="${i===0?'gold-row':''}" data-uid="${p.id}" style="cursor:pointer">
      <td><span class="rank-icon">${medal(p.rank)}</span></td>
      <td>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span>${p.nickname||p.name}</span>
          <span class="ach-icons">${achIcons(p)}</span>
        </div>
      </td>
      <td style="color:#90caf9">${p.correctPicks}</td>
      <td style="color:#ce93d8">${p.exactScores}</td>
      <td><span class="lb-bar-wrap"><span class="lb-bar" style="width:${barW}%"></span></span></td>
      <td><span class="lb-pts">${p.total}</span></td>
    </tr>`;
  }).join('');

  const html = `
    <div class="page-title">🏆 Leaderboard</div>
    <div class="card">
      <table class="lb-table">
        <thead><tr>
          <th>Rank</th><th>Player</th><th>Correct</th><th>Exact</th><th></th><th>Pts</th>
        </tr></thead>
        <tbody>${rows||'<tr><td colspan="6" style="color:var(--muted);padding:20px;text-align:center">No players yet.</td></tr>'}</tbody>
      </table>
      <p style="font-size:10px;color:var(--faint);margin-top:12px">Tiebreaker: most correct picks → most exact scores · Click a player to view profile</p>
    </div>`;

  // Attach row click handlers after render via requestAnimationFrame
  requestAnimationFrame(() => {
    document.querySelectorAll('.lb-table tbody tr[data-uid]').forEach(row => {
      row.onclick = () => {
        const prof = S.profiles.find(p => p.id === row.dataset.uid);
        if (prof) showPlayerModal(prof);
      };
    });
  });

  return html;
}

function calcRoundScore(uid, rid) {
  const round = ROUNDS[rid];
  if (!round) return 0;
  let pts = 0;
  const { match: mMult, bonus: bMult } = getMultipliers(rid);
  for (const m of round.matches) {
    const pick   = S.picks[uid]?.[rid]?.[m.id];
    const result = S.results[rid]?.[m.id];
    if (!pick || !result || !result.winner || !pick.winner) continue;
    if (pick.winner === result.winner) {
      pts += 2 * mMult;
      if (String(pick.score_home) === String(result.score_home) &&
          String(pick.score_away) === String(result.score_away) &&
          result.score_home !== '') pts += 1 * mMult;
    }
  }
  for (const bq of getActiveQuestions(rid)) {
    const ans     = S.bonusAnswers[uid]?.[rid]?.[bq.id];
    const correct = S.bonusResults[rid]?.[bq.id];
    if (!ans || !correct || !correct.answer || !ans.answer) continue;
    if (ans.answer === correct.answer) {
      const wager = round.knockout ? (Number(ans.wager) || 0) : 0;
      pts += (bq.pts * bMult) + wager;
    } else if (round.knockout && Number(ans.wager) > 0) {
      pts -= Number(ans.wager);
    }
  }
  return pts;
}

function renderDashboard() {
  const lb      = getLeaderboard();
  const maxPts  = lb[0]?.total || 1;
  const medal   = r => ['🥇','🥈','🥉'][r-1] || `#${r}`;
  const getName = p => p?.nickname || p?.name || '—';

  const playedRounds = Object.values(ROUNDS).filter(round =>
    round.matches.some(m => S.results[round.id]?.[m.id]?.winner)
  );
  const lastRound = playedRounds[playedRounds.length - 1];

  let roundLeader = null, roundLeaderPts = 0;
  if (lastRound) {
    S.profiles.forEach(p => {
      const pts = calcRoundScore(p.id, lastRound.id);
      if (pts > roundLeaderPts) { roundLeaderPts = pts; roundLeader = p; }
    });
  }

  let mostCorrect = null, mostCorrectN = -1;
  let exactKing   = null, exactKingN   = -1;
  S.profiles.forEach(p => {
    const { correctPicks, exactScores } = calcScore(p.id);
    if (correctPicks > mostCorrectN) { mostCorrectN = correctPicks; mostCorrect = p; }
    if (exactScores  > exactKingN)   { exactKingN   = exactScores;  exactKing   = p; }
  });

  const statsCards = [
    { icon:'👥', value: S.profiles.length,  label:'Total Players', color:'#1565c0' },
    { icon:'🥇', value: getName(lb[0]),      label:'Leader',        color:'#b8860b' },
    { icon:'⚡', value: lb[0]?.total ?? 0,   label:'Top Score',     color:'#2e7d32' },
    { icon:'📅', value: playedRounds.length, label:'Rounds Played', color:'#6a1b9a' },
  ].map(s => `<div class="stat-card">
    <div class="stat-icon">${s.icon}</div>
    <div class="stat-value" style="color:${s.color}">${s.value}</div>
    <div class="stat-label">${s.label}</div>
  </div>`).join('');

  const standingsRows = lb.length
    ? lb.map((p, i) => {
        const barW = Math.round((p.total / maxPts) * 100);
        return `<div class="player-row">
          <span style="width:28px;font-size:${i<3?18:13}px;text-align:center;flex-shrink:0">${medal(p.rank)}</span>
          <span style="color:var(--text);font-size:13px;min-width:80px;flex-shrink:0">${getName(p)}</span>
          <div class="mini-bar-wrap"><div class="mini-bar" style="width:${barW}%"></div></div>
          <span style="color:var(--green);font-weight:700;font-size:15px;min-width:32px;text-align:right">${p.total}</span>
        </div>`;
      }).join('')
    : '<p style="color:var(--muted);text-align:center;font-size:13px">No data yet.</p>';

  const hlCard = (icon, title, player, stat) => `<div class="highlight-card">
    <div class="highlight-label">${icon} ${title}</div>
    ${player
      ? `<div class="highlight-name">${getName(player)}</div><div class="highlight-stat">${stat}</div>`
      : `<div style="color:var(--muted);font-size:12px">No data yet</div>`}
  </div>`;

  let roundsTableHtml = '';
  if (playedRounds.length > 0) {
    const headerCells = playedRounds.map(r => `<th>${r.id.toUpperCase()}</th>`).join('');
    const rows = lb.map(p => {
      const cells = playedRounds.map(r =>
        `<td style="color:#90caf9">${calcRoundScore(p.id, r.id)}</td>`
      ).join('');
      return `<tr>
        <td>${getName(p)}</td>${cells}
        <td style="color:var(--green);font-weight:700">${p.total}</td>
      </tr>`;
    }).join('');
    roundsTableHtml = `<div class="card" style="margin-top:4px">
      <div class="card-title">📊 Points by Round</div>
      <div style="overflow-x:auto">
        <table class="rounds-table">
          <thead><tr>
            <th>Player</th>${headerCells}<th style="color:var(--gold)">Total</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }

  return `
    <div class="page-title">Dashboard</div>
    <div class="stat-grid">${statsCards}</div>
    <div class="card">
      <div class="card-title">🏆 Overall Standings</div>
      ${standingsRows}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      ${hlCard('⚡', 'Round Leader', roundLeader,
          lastRound ? `${roundLeaderPts} pts in ${lastRound.label.replace('Group Stage – ','')}` : '')}
      ${hlCard('🎯', 'Most Correct Picks', mostCorrect,
          mostCorrect ? `${mostCorrectN} correct picks` : '')}
      ${hlCard('🔮', 'Exact Score King', exactKing,
          exactKing ? `${exactKingN} exact scores` : '')}
      <div class="highlight-card">
        <div class="highlight-label">💰 Pool</div>
        <div style="text-align:center;padding:8px 0">
          <div style="color:var(--gold);font-size:28px;font-weight:700">${S.profiles.length}</div>
          <div style="color:var(--muted);font-size:12px">players registered</div>
        </div>
      </div>
    </div>
    ${roundsTableHtml}`;
}

// ── Bracket ───────────────────────────────────────────────────────
function renderBracket() {
  const knockoutRounds = ['r32','r16','qf','sf','final'];
  const icons = { r32:'⚡', r16:'⚔️', qf:'🏅', sf:'🌟', final:'🏆' };

  const matchCard = (m, rid) => {
    const result  = S.results[rid]?.[m.id] || {};
    const hasRes  = !!result.winner;
    const homeWon = hasRes && result.winner === m.home;
    const awayWon = hasRes && result.winner === m.away;
    return `<div class="bracket-match ${hasRes?'has-result':''}">
      <div class="bracket-team ${homeWon?'winner':hasRes?'loser':''}">
        <span>${F(m.home)} ${m.home}</span>
        ${hasRes ? `<span class="bracket-score">${result.score_home??''}</span>` : ''}
      </div>
      <div class="bracket-vs">vs</div>
      <div class="bracket-team ${awayWon?'winner':hasRes?'loser':''}">
        <span>${F(m.away)} ${m.away}</span>
        ${hasRes ? `<span class="bracket-score">${result.score_away??''}</span>` : ''}
      </div>
    </div>`;
  };

  const roundsHtml = knockoutRounds.map(rid => {
    const round = ROUNDS[rid];
    return `<div class="bracket-section">
      <div class="bracket-section-title">${icons[rid]} ${round.label}</div>
      <div class="bracket-grid">
        ${round.matches.map(m => matchCard(m, rid)).join('')}
      </div>
    </div>`;
  }).join('');

  return `
    <div class="page-title">🏆 Tournament Bracket</div>
    <div class="notice" style="margin-bottom:16px">Knockout stage results will populate the bracket as the tournament progresses.</div>
    ${roundsHtml}`;
}

// ── Rules ─────────────────────────────────────────────────────────
function renderRules() {
  const rows = [
    ['⚽ Correct winner','2 pts'],['🎯 Exact score (needs correct winner)','+1 pt'],
    ['⭐ Group Stage bonus Q','2 pts'],['⭐ R32 / R16 bonus Q','3 pts'],
    ['⭐ QF bonus Q','3 pts'],['⭐ SF bonus Q','4 pts'],['⭐ Final bonus Q','5 pts'],
    ['💰 Knockout wager — correct','base pts + wager'],['💀 Knockout wager — wrong','−wager only'],
  ];
  return `
    <div class="page-title">📋 Pool Rules</div>
    <div class="card">
      <h3 style="color:var(--text);margin-bottom:12px;font-size:15px">⚽ Match Picks</h3>
      <p style="color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:16px">
        Pick the winner of every match. Group stage matches can end in a <strong>Draw</strong>.
        Correct winner = <strong style="color:var(--gold)">2 pts</strong>.
        Add the exact final score for a <strong style="color:#90caf9">+1 bonus pt</strong>.
      </p>
      <h3 style="color:var(--text);margin-bottom:12px;font-size:15px">💰 Knockout Wagers</h3>
      <p style="color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:16px">
        From Round of 32 onwards, wager up to 2× the base points on each bonus question.
        Right = base + wager. Wrong = −wager only (you keep your match pick points).
      </p>
      <h3 style="color:var(--text);margin-bottom:12px;font-size:15px">🏆 Tiebreakers</h3>
      <ol style="color:var(--muted);font-size:14px;padding-left:20px;line-height:2">
        <li>Most correct match picks</li><li>Most exact scores</li><li>Earliest registration</li>
      </ol>
      <table style="width:100%;border-collapse:collapse;margin-top:20px;font-size:13px">
        <tbody>${rows.map(([l,p])=>`<tr style="border-bottom:1px solid var(--border2)">
          <td style="padding:8px 0;color:var(--muted)">${l}</td>
          <td style="padding:8px 0;text-align:right;color:var(--gold);font-weight:700">${p}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
}

// ════════════════════════════════════════════════════════════════
// 8. MAIN RENDER + EVENT DELEGATION
// ════════════════════════════════════════════════════════════════
function render() {
  if (!S.user) { renderAuth(); return; }
  let content = '';
  switch(S.page) {
    case 'dashboard':   content = renderDashboard(); break;
    case 'picks':       content = renderPicks(); break;
    case 'bracket':     content = renderBracket(); break;
    case 'leaderboard': content = renderLeaderboard(); break;
    case 'admin':       content = renderAdmin(); break;
    case 'rules':       content = renderRules(); break;
  }
  renderShell(content);
  attachEvents();
}

function attachEvents() {
  // Round pill selectors
  document.querySelectorAll('[data-r]').forEach(btn => {
    btn.onclick = () => { S.activeRound = btn.dataset.r; render(); };
  });

  // Team pick buttons
  document.querySelectorAll('[data-action="pick"]').forEach(btn => {
    btn.onclick = async () => {
      const { rid, mid, team } = btn.dataset;
      const pick = S.picks[S.user.id]?.[rid]?.[mid] || {};
      await upsertPick(rid, mid, team, pick.score_home||'', pick.score_away||'');
      render();
    };
  });

  // Score inputs (save on blur)
  document.querySelectorAll('[data-action="score"]').forEach(inp => {
    inp.onblur = async () => {
      const { rid, mid, side } = inp.dataset;
      const pick = S.picks[S.user.id]?.[rid]?.[mid] || {};
      const sh = side==='h' ? inp.value : pick.score_home || '';
      const sa = side==='a' ? inp.value : pick.score_away || '';
      await upsertPick(rid, mid, pick.winner||'', sh, sa);
      render();
    };
  });

  // Bonus option buttons
  document.querySelectorAll('[data-action="bonus"]').forEach(btn => {
    btn.onclick = async () => {
      const { rid, qid, opt } = btn.dataset;
      const cur = S.bonusAnswers[S.user.id]?.[rid]?.[qid] || {};
      await upsertBonusAnswer(rid, qid, opt, cur.wager||0);
      render();
    };
  });

  // Wager inputs (save on blur)
  document.querySelectorAll('[data-action="wager"]').forEach(inp => {
    inp.onblur = async () => {
      const { rid, qid } = inp.dataset;
      const bq   = Object.values(ROUNDS).find(r=>r.id===rid)?.bonusQuestions.find(q=>q.id===qid);
      const maxW = (bq?.pts||0)*2;
      const val  = Math.min(maxW, Math.max(0, parseInt(inp.value)||0));
      const cur  = S.bonusAnswers[S.user.id]?.[rid]?.[qid] || {};
      await upsertBonusAnswer(rid, qid, cur.answer||'', val);
      render();
    };
  });

  // Admin: result winner dropdown
  document.querySelectorAll('[data-action="result-winner"]').forEach(sel => {
    sel.onchange = async () => {
      const { rid, mid } = sel.dataset;
      const cur = S.results[rid]?.[mid] || {};
      await upsertResult(rid, mid, sel.value, cur.score_home||'', cur.score_away||'');
      render();
    };
  });

  // Admin: result score inputs
  ['result-sh','result-sa'].forEach(action => {
    document.querySelectorAll(`[data-action="${action}"]`).forEach(inp => {
      inp.onblur = async () => {
        const { rid, mid } = inp.dataset;
        const cur = S.results[rid]?.[mid] || {};
        const sh = action==='result-sh' ? inp.value : cur.score_home||'';
        const sa = action==='result-sa' ? inp.value : cur.score_away||'';
        await upsertResult(rid, mid, cur.winner||'', sh, sa);
        render();
      };
    });
  });

  // Admin: bonus result dropdown
  document.querySelectorAll('[data-action="bonus-result"]').forEach(sel => {
    sel.onchange = async () => {
      const { rid, qid } = sel.dataset;
      await upsertBonusResult(rid, qid, sel.value);
      render();
    };
  });

  // Admin: lock toggle
  document.querySelectorAll('[data-action="toggle-lock"]').forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      await toggleLock(btn.dataset.rid);
      await loadAllData();
      render();
    };
  });

  // Admin: tab switcher
  document.querySelectorAll('[data-admin-tab]').forEach(btn => {
    btn.onclick = () => { S.adminTab = btn.dataset.adminTab; render(); };
  });

  // Admin: question bank category filter
  document.querySelectorAll('[data-qcat]').forEach(btn => {
    btn.onclick = () => { S.adminQFilter = btn.dataset.qcat; render(); };
  });

  // Admin: view player profile
  document.querySelectorAll('[data-view-profile]').forEach(btn => {
    btn.onclick = () => {
      const prof = S.profiles.find(p => p.id === btn.dataset.viewProfile);
      if (prof) showPlayerModal(prof);
    };
  });

  // Admin: save multipliers
  const saveMultBtn = document.getElementById('save-mult-btn');
  if (saveMultBtn) {
    saveMultBtn.onclick = () => {
      const rid = saveMultBtn.dataset.rid;
      if (!S.multipliers[rid]) S.multipliers[rid] = {};
      S.multipliers[rid].match = parseFloat(document.getElementById('mult-match').value) || 1;
      S.multipliers[rid].bonus = parseFloat(document.getElementById('mult-bonus').value) || 1;
      saveMultipliers();
      render();
    };
  }

  // Admin: save edited question
  document.querySelectorAll('[data-save-q]').forEach(btn => {
    btn.onclick = () => {
      const i   = Number(btn.dataset.saveQ);
      const rid = btn.dataset.rid;
      const qs  = JSON.parse(JSON.stringify(getActiveQuestions(rid)));
      const textEl = document.querySelector(`[data-eq-text="${i}"]`);
      const ptsEl  = document.querySelector(`[data-eq-pts="${i}"]`);
      const optsEl = document.querySelector(`[data-eq-opts="${i}"]`);
      qs[i] = {
        ...qs[i],
        text: textEl?.value || qs[i].text,
        pts:  Number(ptsEl?.value)  || qs[i].pts,
        opts: optsEl?.value.split(',').map(o => o.trim()).filter(Boolean) || qs[i].opts,
      };
      S.customBonusQs[rid] = qs;
      saveCustomQuestions();
      render();
    };
  });

  // Admin: delete question
  document.querySelectorAll('[data-del-q]').forEach(btn => {
    btn.onclick = () => {
      const i   = Number(btn.dataset.delQ);
      const rid = btn.dataset.rid;
      const qs  = JSON.parse(JSON.stringify(getActiveQuestions(rid)));
      qs.splice(i, 1);
      S.customBonusQs[rid] = qs;
      saveCustomQuestions();
      render();
    };
  });

  // Admin: add blank question
  const addBlankBtn = document.getElementById('add-blank-q-btn');
  if (addBlankBtn) {
    addBlankBtn.onclick = () => {
      const rid = addBlankBtn.dataset.rid;
      const qs  = JSON.parse(JSON.stringify(getActiveQuestions(rid)));
      qs.push({ id: `custom_${rid}_${Date.now()}`, text: 'New question', pts: 2, opts: ['Yes', 'No'] });
      S.customBonusQs[rid] = qs;
      saveCustomQuestions();
      render();
    };
  }

  // Admin: reset questions to defaults
  const resetQsBtn = document.getElementById('reset-qs-btn');
  if (resetQsBtn) {
    resetQsBtn.onclick = () => {
      const rid = resetQsBtn.dataset.rid;
      delete S.customBonusQs[rid];
      saveCustomQuestions();
      render();
    };
  }

  // Admin: use bank question (add to active list for this round)
  document.querySelectorAll('[data-use-bank-q]').forEach(btn => {
    btn.onclick = () => {
      const bi  = Number(btn.dataset.useBankQ);
      const rid = btn.dataset.rid;
      const bank = window._adminQuestionBank || [];
      const bq   = bank[bi];
      if (!bq) return;
      const qs = JSON.parse(JSON.stringify(getActiveQuestions(rid)));
      qs.push({ id: `bk_${rid}_${Date.now()}`, text: bq.text, pts: bq.pts, opts: [...bq.opts] });
      S.customBonusQs[rid] = qs;
      saveCustomQuestions();
      S.adminTab = 'questions'; // stay on questions tab
      render();
    };
  });
}

// ════════════════════════════════════════════════════════════════
// 9. UTILITIES
// ════════════════════════════════════════════════════════════════
function showMsg(el, text, type) {
  if (!el) return;
  el.className = type==='err' ? 'err-box' : 'ok-box';
  el.textContent = text;
}

// ════════════════════════════════════════════════════════════════
// 10. INIT
// ════════════════════════════════════════════════════════════════
async function init() {
  initTheme();
  loadLocalSettings();
  const { data: { session } } = await sb.auth.getSession();

  if (session?.user) {
    S.user = session.user;
    const { data: profile } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
    S.profile = profile;
    await loadAllData();
  }
  render();

  // React to login/logout events
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session?.user) {
      S.user = session.user;
      const { data: profile } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
      S.profile = profile;
      await loadAllData();
      S.page = 'dashboard';
      render();
    } else if (event === 'SIGNED_OUT') {
      S.user = null; S.profile = null;
      S.picks = {}; S.bonusAnswers = {}; S.results = {}; S.bonusResults = {}; S.roundSettings = {};
      renderAuth();
    }
  });
}

init();
</script>
