  return `
    <div class="page-title">Dashboard</div>
    <div class="stat-grid">${statsCards}</div>
    <div class="card">
      <div class="card-title">🏆 Overall Standings</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">

// ── Bracket ───────────────────────────────────────────────────────
function renderBracket() {
  const dark = S.darkMode;
  const clr = {
    bg:      dark ? '#0d1f3c' : '#ffffff',
    bgPage:  dark ? '#0a1628' : '#eef1f5',
    border:  dark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.12)',
    winFill: dark ? 'rgba(46,125,50,0.55)'  : 'rgba(76,175,80,0.25)',
    line:    dark ? '#1e3a5f' : '#c0cfe0',
    text:    dark ? '#ffffff' : '#1a2a40',
    text2:   dark ? '#888888' : '#666666',
    text3:   dark ? '#555555' : '#999999',
    win:     '#66bb6a',
    res:     dark ? 'rgba(102,187,106,0.35)' : 'rgba(76,175,80,0.35)',
  };

  const trunc = t => {
    const s = t || 'TBD';
    return s.length > 13 ? s.slice(0, 12) + '…' : s;
  };

  const res = (rid, mid) => S.results[rid]?.[mid] || {};

  // ── Box renderer ─────────────────────────────────────────────
  const BW = 132, BH = 44, HALF = BH / 2;
  const box = (x, cy, home, away, rid, mid, label) => {
    const r = res(rid, mid);
    const hw = r.winner === home;
    const aw = r.winner === away;
    const top = cy - HALF;
    const hasScore = r.score_home !== undefined && r.score_home !== '';
    return `
      ${label ? `<text x="${x + BW/2}" y="${top - 5}" text-anchor="middle" font-size="8"
        fill="${clr.text3}" font-family="Arial" letter-spacing="0.8" font-weight="bold">${label}</text>` : ''}
      <rect x="${x}" y="${top}" width="${BW}" height="${BH}" rx="6"
        fill="${clr.bg}" stroke="${r.winner ? clr.res : clr.border}" stroke-width="1"/>
      ${hw ? `<rect x="${x+1}" y="${top+1}" width="${BW-2}" height="${HALF-1}" rx="5" fill="${clr.winFill}"/>` : ''}
      ${aw ? `<rect x="${x+1}" y="${top+HALF}" width="${BW-2}" height="${HALF-1}" rx="5" fill="${clr.winFill}"/>` : ''}
      <line x1="${x}" y1="${top+HALF}" x2="${x+BW}" y2="${top+HALF}"
        stroke="${clr.border}" stroke-width="0.5"/>
      <text x="${x+7}" y="${top + HALF*0.72}" font-size="11"
        fill="${hw ? clr.win : clr.text}" font-weight="${hw ? 'bold' : 'normal'}"
        font-family="Arial">${trunc(home)}</text>
      ${hasScore ? `<text x="${x+BW-6}" y="${top + HALF*0.72}" font-size="11"
        fill="${hw ? clr.win : clr.text2}" text-anchor="end" font-family="Arial">${r.score_home}</text>` : ''}
      <text x="${x+7}" y="${top + HALF + HALF*0.72}" font-size="11"
        fill="${aw ? clr.win : clr.text}" font-weight="${aw ? 'bold' : 'normal'}"
        font-family="Arial">${trunc(away)}</text>
      ${hasScore ? `<text x="${x+BW-6}" y="${top + HALF + HALF*0.72}" font-size="11"
        fill="${aw ? clr.win : clr.text2}" text-anchor="end" font-family="Arial">${r.score_away}</text>` : ''}`;
  };

  // ── Connector renderer ───────────────────────────────────────
  const conn = (fx, y1, y2, tx, ty) => {
    const mx = fx + Math.round((tx - fx) * 0.45);
    return `
      <polyline points="${fx},${y1} ${mx},${y1} ${mx},${y2} ${mx},${ty} ${tx},${ty}"
        fill="none" stroke="${clr.line}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  };

  // ── Layout constants ─────────────────────────────────────────
  // R16 y-centres (8 matches, 70px apart starting at 35)
  const r16Y = [35,105,175,245,315,385,455,525];
  const qfY  = r16Y.reduce((acc, _, i, a) => i%2===0 ? [...acc, (a[i]+a[i+1])/2] : acc, []);
  const sfY  = qfY.reduce( (acc, _, i, a) => i%2===0 ? [...acc, (a[i]+a[i+1])/2] : acc, []);
  const finY = (sfY[0] + sfY[1]) / 2;
  const SVG_H = 570, SVG_W = 800;
  const r16X = 4, qfX = 196, sfX = 388, finX = 580;

  const r16 = ROUNDS['r16'];
  const qf  = ROUNDS['qf'];
  const sf  = ROUNDS['sf'];
  const fin = ROUNDS['final'];

  // ── Round column labels ──────────────────────────────────────
  const colLabel = (x, label) =>
    `<text x="${x + BW/2}" y="14" text-anchor="middle" font-size="10"
      fill="${clr.text3}" font-family="Arial" font-weight="bold" letter-spacing="0.5">${label}</text>`;

  let svgBody = '';
  svgBody += colLabel(r16X,  'ROUND OF 16');
  svgBody += colLabel(qfX,   'QUARTER-FINALS');
  svgBody += colLabel(sfX,   'SEMI-FINALS');
  svgBody += colLabel(finX,  'FINAL');

  // R16 matches
  r16.matches.forEach((m, i) => {
    svgBody += box(r16X, r16Y[i], getBracketTeam(m.id,'home',m.home), getBracketTeam(m.id,'away',m.away), 'r16', m.id, '');
  });

  // R16 → QF connectors + QF boxes
  qf.matches.forEach((m, i) => {
    svgBody += conn(r16X + BW, r16Y[i*2], r16Y[i*2+1], qfX, qfY[i]);
    svgBody += box(qfX, qfY[i], getBracketTeam(m.id,'home',m.home), getBracketTeam(m.id,'away',m.away), 'qf', m.id, '');
  });

  // QF → SF connectors + SF boxes
  sf.matches.forEach((m, i) => {
    svgBody += conn(qfX + BW, qfY[i*2], qfY[i*2+1], sfX, sfY[i]);
    svgBody += box(sfX, sfY[i], getBracketTeam(m.id,'home',m.home), getBracketTeam(m.id,'away',m.away), 'sf', m.id, '');
  });

  // SF → Final connector + Final box
  const finalM = fin.matches.find(m => m.id === 'finalm1') || fin.matches[0];
  svgBody += conn(sfX + BW, sfY[0], sfY[1], finX, finY);
  svgBody += box(finX, finY, getBracketTeam(finalM.id,'home',finalM.home), getBracketTeam(finalM.id,'away',finalM.away), 'final', finalM.id, '🏆 FINAL');

  const bracketSvg = `
    <div style="overflow-x:auto;background:${clr.bgPage};border-radius:12px;border:1px solid ${clr.border};padding:16px">
      <svg viewBox="0 0 ${SVG_W} ${SVG_H}" width="100%" style="min-width:560px;max-width:${SVG_W}px;display:block">
        ${svgBody}
      </svg>
    </div>`;

  // ── 3rd place match card ─────────────────────────────────────
  const thirdM = fin.matches.find(m => m.id === 'finalm2');
  let thirdHtml = '';
  if (thirdM) {
    const r = res('final', thirdM.id);
    const ht = getBracketTeam(thirdM.id,'home',thirdM.home), at = getBracketTeam(thirdM.id,'away',thirdM.away);
    const hw = r.winner === ht, aw = r.winner === at;
    thirdHtml = `
      <div class="card" style="margin-top:16px;border-color:rgba(205,127,50,0.4)">
        <div class="card-title" style="color:#CD7F32">🥉 3rd Place Match</div>
        <div class="bracket-match ${r.winner?'has-result':''}">
          <div class="bracket-team ${hw?'winner':r.winner?'loser':''}">
            <span>${F(ht)} ${ht}</span>
            ${r.winner ? `<span class="bracket-score">${r.score_home??''}</span>` : ''}
          </div>
          <div class="bracket-vs">vs</div>
          <div class="bracket-team ${aw?'winner':r.winner?'loser':''}">
            <span>${F(at)} ${at}</span>
            ${r.winner ? `<span class="bracket-score">${r.score_away??''}</span>` : ''}
          </div>
        </div>
      </div>`;
  }

  // ── R32 compact grid ─────────────────────────────────────────
  const r32 = ROUNDS['r32'];
  const r32Html = `
    <div class="bracket-section" style="margin-bottom:20px">
      <div class="bracket-section-title">⚡ Round of 32</div>
      <div class="bracket-grid">
        ${r32.matches.map(m => {
          const r = res('r32', m.id);
          const ht = getBracketTeam(m.id,'home',m.home), at = getBracketTeam(m.id,'away',m.away);
          const hw = r.winner === ht, aw = r.winner === at;
          return `<div class="bracket-match ${r.winner?'has-result':''}">
            <div class="bracket-team ${hw?'winner':r.winner?'loser':''}">${F(ht)} ${ht}${r.winner?` <span class="bracket-score">${r.score_home??''}</span>`:''}</div>
            <div class="bracket-vs">vs</div>
            <div class="bracket-team ${aw?'winner':r.winner?'loser':''}">${F(at)} ${at}${r.winner?` <span class="bracket-score">${r.score_away??''}</span>`:''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;

  return `
    <div class="page-title">🏆 Tournament Bracket</div>
    ${r32Html}
    <div class="bracket-section">
      <div class="bracket-section-title">🏆 Knockout Bracket — R16 to Final</div>
      ${bracketSvg}
    </div>
    ${thirdHtml}`;
}

// 8. MAIN RENDER + EVENT DELEGATION
// ════════════════════════════════════════════════════════════════
function render() {
  if (!S.user) { renderAuth(); return; }
  let content = '';
  switch(S.page) {
    case 'dashboard':   content = renderDashboard(); break;
    case 'picks':       content = renderPicks(); break;
    case 'groups':      content = renderGroups(); break;
    case 'bracket':     content = renderBracket(); break;
    case 'leaderboard': content = renderLeaderboard(); break;
    case 'admin':       content = renderAdmin(); break;
    case 'rules':       content = renderRules(); break;
  }
  renderShell(content);
  attachEvents();
}

function attachEvents() {
  // Round pill selectors
  document.querySelectorAll('[data-r]').forEach(btn => {
    btn.onclick = () => { S.activeRound = btn.dataset.r; render(); };
  });

  // Team pick buttons
  document.querySelectorAll('[data-action="pick"]').forEach(btn => {
    btn.onclick = async () => {
      const { rid, mid, team } = btn.dataset;
      const pick = S.picks[S.user.id]?.[rid]?.[mid] || {};
      await upsertPick(rid, mid, team, pick.score_home||'', pick.score_away||'');
      render();
    };
  });

  // Score inputs (save on blur)
  document.querySelectorAll('[data-action="score"]').forEach(inp => {
    inp.onblur = async () => {
      const { rid, mid, side } = inp.dataset;
      const pick = S.picks[S.user.id]?.[rid]?.[mid] || {};
      const sh = side==='h' ? inp.value : pick.score_home || '';
      const sa = side==='a' ? inp.value : pick.score_away || '';
      await upsertPick(rid, mid, pick.winner||'', sh, sa);
      render();
    };
  });

  // Bonus option buttons
  document.querySelectorAll('[data-action="bonus"]').forEach(btn => {
    btn.onclick = async () => {
      const { rid, qid, opt } = btn.dataset;
      const cur = S.bonusAnswers[S.user.id]?.[rid]?.[qid] || {};
      await upsertBonusAnswer(rid, qid, opt, cur.wager||0);
      render();
    };
  });

  // Wager inputs (save on blur)
  document.querySelectorAll('[data-action="wager"]').forEach(inp => {
    inp.onblur = async () => {
      const { rid, qid } = inp.dataset;
      const bq   = Object.values(ROUNDS).find(r=>r.id===rid)?.bonusQuestions.find(q=>q.id===qid);
      const maxW = (bq?.pts||0)*2;
      const val  = Math.min(maxW, Math.max(0, parseInt(inp.value)||0));
      const cur  = S.bonusAnswers[S.user.id]?.[rid]?.[qid] || {};
      await upsertBonusAnswer(rid, qid, cur.answer||'', val);
      render();
    };
  });

  // Admin: result winner dropdown
  document.querySelectorAll('[data-action="result-winner"]').forEach(sel => {
    sel.onchange = async () => {
      const { rid, mid } = sel.dataset;
      const cur = S.results[rid]?.[mid] || {};
      await upsertResult(rid, mid, sel.value, cur.score_home||'', cur.score_away||'');
      render();
    };
  });

  // Admin: result score inputs — auto-infer winner from scores when possible
  ['result-sh','result-sa'].forEach(action => {
    document.querySelectorAll(`[data-action="${action}"]`).forEach(inp => {
      inp.onblur = async () => {
        const { rid, mid } = inp.dataset;
        const cur = S.results[rid]?.[mid] || {};
        const sh = action==='result-sh' ? inp.value : cur.score_home||'';
        const sa = action==='result-sa' ? inp.value : cur.score_away||'';
        const round = ROUNDS[rid];
        const m = round?.matches.find(x => x.id === mid);
        // Auto-determine winner from scores so admin doesn't have to use the dropdown
        let winner = cur.winner || '';
        const shN = parseInt(sh), saN = parseInt(sa);
        if (!isNaN(shN) && !isNaN(saN) && sh !== '' && sa !== '') {
          if (shN > saN) winner = m?.home || winner;
          else if (saN > shN) winner = m?.away || winner;
          else if (!round?.knockout) winner = 'Draw';
          // tied knockout: keep existing winner (ET/pens must be set manually)
        }
        await upsertResult(rid, mid, winner, sh, sa);
        // Sync the winner dropdown UI if winner was auto-set
        const sel = document.querySelector(`[data-action="result-winner"][data-rid="${rid}"][data-mid="${mid}"]`);
        if (sel && winner) sel.value = winner;
        render();
      };
    });
  });

  // Admin: bonus result dropdown
  document.querySelectorAll('[data-action="bonus-result"]').forEach(sel => {
    sel.onchange = async () => {
      const { rid, qid } = sel.dataset;
      await upsertBonusResult(rid, qid, sel.value);
      render();
    };
  });

  // Admin: lock toggle
  document.querySelectorAll('[data-action="toggle-lock"]').forEach(btn => {
    btn.onclick = async () => {

      await toggleLock(btn.dataset.rid);
      render();
    };
  });

  document.querySelectorAll('[data-action="set-lock-schedule"]').forEach(inp => {
    inp.onchange = () => {
      const { rid, type } = inp.dataset;
      if (!S.lockSchedules[rid]) S.lockSchedules[rid] = {};
      S.lockSchedules[rid][type] = inp.value ? new Date(inp.value).toISOString() : '';
      if (!S.lockSchedules[rid][type]) delete S.lockSchedules[rid][type];
      saveLockSchedules();
      render();
    };
  });

  // Admin: clear lock/unlock schedule

    btn.onclick = () => {

      if (S.lockSchedules[rid]) delete S.lockSchedules[rid][type];

  // Admin: adjust kickoff time for delayed matches
  document.querySelectorAll('[data-action="set-kickoff"]').forEach(inp => {
    inp.onchange = () => {

  document.querySelectorAll('[data-action="reset-kickoff"]').forEach(btn => {
    btn.onclick = () => {
      delete S.kickoffOverrides[btn.dataset.mid];
      saveKickoffOverrides();
      render();

  // Admin: tab switcher
  document.querySelectorAll('[data-admin-tab]').forEach(btn => {

  // Admin: question bank category filter

    reloadDataBtn.onclick = async () => {

      await loadAllData();

  // Admin: save pre-tournament winner pts
  const savePtWinnerPtsBtn = document.getElementById('save-pt-winner-pts-btn');
  if (savePtWinnerPtsBtn) {
    savePtWinnerPtsBtn.onclick = () => {

      S.ptSettings.winnerPts = val;
      savePtSettings();
      render();

  }

  // Admin: save multipliers
  const saveMultBtn = document.getElementById('save-mult-btn');
  if (saveMultBtn) {
    saveMultBtn.onclick = () => {
      const rid = saveMultBtn.dataset.rid;
      if (!S.multipliers[rid]) S.multipliers[rid] = {};
      S.multipliers[rid].match = parseFloat(document.getElementById('mult-match').value) || 1;
      S.multipliers[rid].bonus = parseFloat(document.getElementById('mult-bonus').value) || 1;
      saveMultipliers();

  // Admin: save edited question
  document.querySelectorAll('[data-save-q]').forEach(btn => {

    resetQsBtn.onclick = () => {

  document.querySelectorAll('[data-use-bank-q]').forEach(btn => {
    btn.onclick = () => {

      qs.push({ id: `bk_${rid}_${Date.now()}`, text: bq.text, pts: bq.pts, opts: [...bq.opts] });

  const syncSaveKeyBtn = document.getElementById('sync-save-key-btn');

// ════════════════════════════════════════════════════════════════
// 9. LIVE SYNC
// ════════════════════════════════════════════════════════════════
async function syncFromAPI(apiKey) {
  const st = document.getElementById('sync-status');
  const btn = document.getElementById('sync-btn');
  const setStatus = (msg, type) => {
    if (!st) return;
    st.className = type === 'ok' ? 'ok-box' : type === 'err' ? 'err-box' : 'notice';
    st.textContent = msg;
  };

  if (!apiKey) { setStatus('Please enter an API key first.', 'err'); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Syncing…'; }
  setStatus('⏳ Fetching match data from football-data.org…', 'info');

  try {
    const resp = await fetch('https://api.football-data.org/v4/competitions/WC/matches?status=FINISHED', {
      headers: { 'X-Auth-Token': apiKey }
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const matches = data.matches || [];
    if (!matches.length) { setStatus('✅ No finished matches found yet — check back once WC 2026 begins.', 'ok'); return; }

    let updated = 0;

    // Build a flat list of all our match definitions for lookup
    const allMatches = [];
    for (const round of Object.values(ROUNDS)) {
      for (const m of round.matches) {
        allMatches.push({ rid: round.id, m, knockout: round.knockout });
      }
    }

    for (const apiM of matches) {
      const apiHome = apiM.homeTeam?.shortName || apiM.homeTeam?.name || '';
      const apiAway = apiM.awayTeam?.shortName || apiM.awayTeam?.name || '';
      const scoreHome = apiM.score?.fullTime?.home ?? '';
      const scoreAway = apiM.score?.fullTime?.away ?? '';
      if (scoreHome === '' || scoreAway === '') continue;

      // Find matching round/match by team name (fuzzy)
      const found = allMatches.find(({ m }) => {
        const hMatch = m.home.toLowerCase().includes(apiHome.toLowerCase()) ||
                       apiHome.toLowerCase().includes(m.home.toLowerCase());
        const aMatch = m.away.toLowerCase().includes(apiAway.toLowerCase()) ||
                       apiAway.toLowerCase().includes(m.away.toLowerCase());
        return hMatch && aMatch;
      });

      if (!found) continue;

      const { rid, m, knockout } = found;
      const sh = String(scoreHome), sa = String(scoreAway);
      const winner = parseInt(sh) > parseInt(sa) ? m.home
                   : parseInt(sa) > parseInt(sh) ? m.away
                   : knockout ? '' : 'Draw';

      if (!winner && !knockout) continue; // skip draws in knockout (goes to ET/pens, handle manually)

      await upsertResult(rid, m.id, winner, sh, sa);
      updated++;
    }

    setStatus(`✅ Sync complete — ${updated} match${updated !== 1 ? 'es' : ''} updated.`, 'ok');
    await loadAllData();
    render();
  } catch (e) {
    setStatus(`❌ Sync failed: ${e.message}`, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync Now'; }
  }
}

  if (session?.user) {
    S.user = session.user;
    const { data: profile } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
    S.profile = profile;
    await loadAllData();
  }
  render();

  // Check lock schedules every 30 seconds
  setInterval(checkLockSchedules, 30000);

  // React to login/logout events
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session?.user) {
      S.user = session.user;
      const { data: profile } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
      S.profile = profile;
      await loadAllData();
      S.page = 'dashboard';
      render();
    } else if (event === 'SIGNED_OUT') {
      S.user = null; S.profile = null;
      S.picks = {}; S.bonusAnswers = {}; S.results = {}; S.bonusResults = {}; S.roundSettings = {};
      renderAuth();
    }
  });
}

init();
</script>
</body>
</html>
