            </div>

            <div style="flex:1;min-width:200px">
              <div style="font-size:9px;color:#66bb6a;font-family:var(--mono);letter-spacing:0.15em;margin-bottom:5px">
                🔓 AUTO-UNLOCK AT${unlockBadge}
              </div>
              <div style="display:flex;gap:6px;align-items:center">
                <input type="datetime-local" class="admin-score"
                  style="width:190px;font-family:var(--mono);font-size:11px;border-color:rgba(102,187,106,0.35)"
                  value="${toDatetimeLocal(unlockAt)}"
                  data-action="set-lock-schedule" data-rid="${rid}" data-type="unlockAt">
                ${unlockAt ? `<button class="btn btn-sm btn-outline" style="font-size:9px;padding:3px 8px;border-color:rgba(102,187,106,0.4);color:#66bb6a"
                  data-action="clear-lock-schedule" data-rid="${rid}" data-type="unlockAt">✕</button>` : ''}
              </div>
            </div>
          </div>
        </div>`;
    }).join('');

    tabContent = `
      <div class="card" style="border-color:rgba(255,112,67,0.3)">
        <div class="card-title" style="color:#ff7043">🔒 Lock / Unlock Rounds</div>
        <p style="color:var(--muted);font-size:11px;margin-bottom:16px">
          Toggle rounds manually, or set a scheduled time to auto-lock and auto-unlock.
          Schedules are stored on this device and checked every 30 seconds.
        </p>
        ${lockRows}
      </div>`;
  }

  // ── Picks viewer tab ─────────────────────────────────────────
  if (adminTab === 'picks') {
    const rid    = S.adminTabRounds['picks'] || S.activeRound;
    const round  = ROUNDS[rid] || ROUNDS[S.activeRound];
    if (!round) { tabContent = `<div class="card"><p style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0">
        No rounds configured yet. Set up rounds in the ⚙️ <b>Settings</b> tab first.</p></div>`; } else {
    const nowPicks = Date.now();
    // Returns true if a missing pick for this match should be flagged red (within 2hrs of lock = 3hrs before kickoff)
    const matchWarnMissing = m => {
      const ko = getKickoff(m.id, m.kickoff);
      if (!ko) return false;
      const lockTime = new Date(ko).getTime() - 3600000; // 1hr before kickoff
      return nowPicks >= lockTime - 7200000; // warn 2hrs before lock
    };
    // Returns true if missing bonus answer should be flagged (within 2hrs of bonus lock)
    const bonusWarnMissing = () => {
      const roundKickoffs = round.matches
        .map(m => getKickoff(m.id, m.kickoff)).filter(Boolean)
        .map(k => new Date(k).getTime()).sort((a,b) => a-b);
      const firstKickoff = roundKickoffs[0] || null;
      const override = S.bonusLockOverrides[rid];
      const lockAt = override ? new Date(override).getTime() : (firstKickoff ? firstKickoff - 3600000 : null);
      if (!lockAt) return false;
      return nowPicks >= lockAt - 7200000;
    };

    const pillsHtml = Object.values(ROUNDS).map(r =>
      `<button class="pill ${S.activeRound===r.id?'active':''}" data-r="${r.id}">${roundLabel(r)}</button>`
    ).join('');

    const otherPlayers = S.profiles.filter(p => !p.is_admin);

    const playersHtml = otherPlayers.length === 0
      ? '<p style="color:var(--muted);font-size:13px">No players yet.</p>'
      : otherPlayers.map(player => {
          let picksContent = '';

          if (round.special === 'pretournament') {
            // Pre-tournament: show group picks + winner pick
            const ba = S.bonusAnswers[player.id]?.['pt'] || {};
            const br = S.bonusResults['pt'] || {};
            const groupRows = Object.entries(GROUPS).map(([g, teams]) => {
              const p1 = ba[`pt_${g}_1`]?.answer || '';
              const p2 = ba[`pt_${g}_2`]?.answer || '';
              const r1 = br[`pt_${g}_1`]?.answer || '';
              const r2 = br[`pt_${g}_2`]?.answer || '';
              const qualified = new Set([r1, r2].filter(Boolean));
              const badge = (pick, res) => {
                if (!pick) return '<span style="color:var(--faint)">—</span>';
                if (!res) return `<span style="color:var(--text)">${F(pick)} ${pick}</span>`;
                if (pick === res) return `<span style="color:#a5d6a7">${F(pick)} ${pick} ✅</span>`;
                if (qualified.has(pick)) return `<span style="color:#90caf9">${F(pick)} ${pick} 🎯</span>`;
                return `<span style="color:var(--muted)">${F(pick)} ${pick} ❌</span>`;
              };
              return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;
                border-bottom:1px solid var(--border2);font-size:12px;flex-wrap:wrap">
                <span style="color:var(--muted);min-width:80px;flex-shrink:0;font-family:var(--mono);font-size:11px">GROUP ${g}</span>
                <span>1st: ${badge(p1, r1)}</span>
                <span style="color:var(--border2)">·</span>
                <span>2nd: ${badge(p2, r2)}</span>
              </div>`;
            }).join('');
            const winPick = ba['pt_winner']?.answer || '';
            const winRes  = br['pt_winner']?.answer  || '';
            const winBadge = !winPick ? '<span style="color:var(--faint)">— no pick —</span>'
              : !winRes ? `<span style="color:var(--text)">${F(winPick)} ${winPick}</span>`
              : winPick === winRes ? `<span style="color:#a5d6a7">${F(winPick)} ${winPick} ✅</span>`
              : `<span style="color:var(--muted)">${F(winPick)} ${winPick} ❌</span>`;
            const ptExtraBonusRows = getActiveQuestions('pt').map(bq => {
              const ans     = S.bonusAnswers[player.id]?.['pt']?.[bq.id] || {};
              const correct = S.bonusResults['pt']?.[bq.id]?.answer || '';
              const icon = !ans.answer ? '' : !correct ? '⏳' : ans.answer === correct ? '✅' : '❌';
              return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;
                border-bottom:1px solid var(--border2);font-size:11px;flex-wrap:wrap">
                <span style="color:var(--muted);flex:1;min-width:140px;word-break:break-word">${bq.text}</span>
                <span style="color:${ans.answer?'var(--gold)':'var(--faint)'};flex-shrink:0">${ans.answer||'—'} ${icon}</span>
              </div>`;
            }).join('');
            picksContent = `
              ${groupRows}
              <div style="display:flex;align-items:center;gap:8px;padding:8px 0;font-size:12px;margin-top:4px">
                <span style="color:var(--gold);min-width:80px;flex-shrink:0;font-family:var(--mono);font-size:11px">🏆 WINNER</span>
                ${winBadge}
              </div>
              ${ptExtraBonusRows ? `<div style="margin-top:8px"><div style="font-size:11px;color:var(--gold);margin-bottom:6px">⭐ Bonus</div>${ptExtraBonusRows}</div>` : ''}`;
          } else {
            // Regular round: match picks + bonus questions
            const matchRows = round.matches.map(m => {
              const pick   = S.picks[player.id]?.[rid]?.[m.id] || {};
              const result = S.results[rid]?.[m.id] || {};
              const hasRes = !!result.winner;
              const correct = hasRes && pick.winner && pick.winner === result.winner;
              const icon   = !pick.winner ? '' : !hasRes ? '⏳' : correct ? '✅' : '❌';
              const hasSc  = pick.score_home !== '' && pick.score_home !== undefined && pick.score_away !== '' && pick.score_away !== undefined;
              const slp    = hasRes && hasSc ? scoreLinePoints({ score_home: pick.score_home, score_away: pick.score_away }, result) : { pts: 0, exact: false };
              const scoreEmoji = slp.exact ? ' 🎯' : '';
              const score  = hasSc ? ` (${pick.score_home}–${pick.score_away}${scoreEmoji})` : '';
              const matchLabel = m.label ? ` <span style="font-size:10px;color:#ff7043">[${m.label}]</span>` : '';
              const ko = getKickoff(m.id, m.kickoff);
              const koTime = ko ? new Date(ko).getTime() : null;
              const matchLocked = hasRes || !!(koTime && nowPicks >= koTime - 3600000);
              const missingPick = !pick.winner;
              const missingWarn = missingPick && !matchLocked && !!(koTime && nowPicks >= koTime - 3 * 3600000);
              const missingLate = missingPick && matchLocked;
              const rowBg = missingLate ? 'background:rgba(239,83,80,0.08);' : missingWarn ? 'background:rgba(255,183,77,0.08);' : '';
              const missingColor = missingLate ? '#ef5350' : missingWarn ? '#ffb74d' : 'var(--faint)';
              const missingLabel = missingLate ? '✗ no pick' : missingWarn ? '⚠ no pick — closing soon' : '— no pick —';
              const homeTeamLabel = getBracketTeam(m.id, 'home', m.home);
              const awayTeamLabel = getBracketTeam(m.id, 'away', m.away);
              return `<div style="display:flex;align-items:flex-start;gap:8px;padding:5px 0;${rowBg}
                border-bottom:1px solid var(--border2);font-size:12px;flex-wrap:wrap">
                <span style="color:var(--muted);min-width:120px;flex:1;word-break:break-word">${F(homeTeamLabel)} ${homeTeamLabel} vs ${F(awayTeamLabel)} ${awayTeamLabel}${matchLabel}</span>
                <span style="color:${pick.winner ? 'var(--text)' : missingColor};word-break:break-word;text-align:right">
                  ${pick.winner ? `${pick.winner}${score} ${icon}` : missingLabel}
                </span>
              </div>`;
            }).join('');
            const bonusAlreadyLocked = isBonusLocked(rid);
            const bonusWarn = bonusWarnMissing();
            const bonusRows = getActiveQuestions(rid).map(bq => {
              const ans     = S.bonusAnswers[player.id]?.[rid]?.[bq.id] || {};
              const correct = S.bonusResults[rid]?.[bq.id]?.answer || '';
              const icon = !ans.answer ? '' : !correct ? '⏳' : ans.answer === correct ? '✅' : '❌';
              const missingBonus = !ans.answer;
              const bonusRowBg = missingBonus && bonusWarn && !bonusAlreadyLocked ? 'background:rgba(255,183,77,0.08);'
                               : missingBonus && bonusAlreadyLocked ? 'background:rgba(239,83,80,0.08);' : '';
              const ansColor = ans.answer ? 'var(--gold)'
                             : (missingBonus && bonusAlreadyLocked) ? '#ef5350'
                             : (missingBonus && bonusWarn) ? '#ffb74d'
                             : 'var(--faint)';
              const wagerTag = (bq.wager && ans.answer && ans.answer !== 'Abstain')
                ? ` <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">[💰 ${Number(ans.wager)||0} pts wagered]</span>`
                : '';
              let ansLabel;
              if (bq.type === 'multicheck') {
                const picked     = (ans.answer||'').split(',').map(s=>s.trim()).filter(Boolean);
                const rawRes = S.bonusResults[rid]?.[bq.id]?.answer || '';
                const { correctSet, wrongSet: mcWrongSet } = rawRes ? parseMcResult(rawRes) : { correctSet: null, wrongSet: null };
                if (!picked.length) {
                  ansLabel = (missingBonus && bonusAlreadyLocked) ? '✗ no answer — locked'
                           : (missingBonus && bonusWarn) ? '⚠ no answer — closing soon' : '—';
                } else {
                  ansLabel = picked.map(p => {
                    if (!correctSet) return p;
                    if (correctSet.has(p)) return `<span style="color:#a5d6a7">${p} ✅</span>`;
                    if (mcWrongSet && mcWrongSet.has(p)) return `<span style="color:#ef9a9a">${p} ❌</span>`;
                    return `<span style="color:var(--muted)">${p} ⏳</span>`;
                  }).join(', ');
                }
              } else {
                ansLabel = ans.answer ? `${ans.answer} ${icon}`
                         : (missingBonus && bonusAlreadyLocked) ? '✗ no answer — locked'
                         : (missingBonus && bonusWarn) ? '⚠ no answer — closing soon'
                         : '—';
              }
              return `<div style="display:flex;align-items:flex-start;gap:8px;padding:5px 0;${bonusRowBg}
                border-bottom:1px solid var(--border2);font-size:11px;flex-wrap:wrap">
                <span style="color:var(--muted);flex:1;min-width:120px;word-break:break-word">${bq.text}</span>
                <span style="color:${ansColor};word-break:break-word;overflow-wrap:anywhere;max-width:100%">${ansLabel}${wagerTag}</span>
              </div>`;
            }).join('');
            picksContent = matchRows +
              (round.bonusQuestions.length ? `<div style="margin-top:10px"><div style="font-size:11px;color:var(--gold);margin-bottom:6px">⭐ Bonus</div>${bonusRows}</div>` : '');
          }

          return `<div class="card" style="margin-bottom:10px">
            <div class="card-title" style="margin-bottom:10px">${player.nickname||player.name}</div>
            ${picksContent}
          </div>`;
        }).join('');

    tabContent = `
      <div class="pill-row">${pillsHtml}</div>
      <p style="color:var(--muted);font-size:12px;margin-bottom:16px">
        Viewing picks for: <strong style="color:var(--gold)">${roundLabel(round)}</strong>
      </p>
      ${playersHtml}`;
  } // end else (round exists)
  }

  // ── Question bank tab ─────────────────────────────────────────
  if (adminTab === 'questions') {
    const QUESTION_BANK = [
      {id:'qb1', cat:'⚽ Goals',       text:'Will any team score 4+ goals in a single match?',            pts:2, opts:['Yes','No']},
      {id:'qb2', cat:'⚽ Goals',       text:'Total goals across all matches in this round?',               pts:3, opts:['0–5','6–10','11–15','16+']},
      {id:'qb3', cat:'⚽ Goals',       text:'Will any match end 0-0?',                                     pts:2, opts:['Yes','No']},
      {id:'qb4', cat:'⚽ Goals',       text:'Will any player score a hat-trick?',                          pts:3, opts:['Yes','No']},
      {id:'qb5', cat:'⚽ Goals',       text:'Will a goal be scored from outside the box?',                 pts:3, opts:['Yes','No']},
      {id:'qb6', cat:'⚽ Goals',       text:'Will there be an own goal?',                                  pts:2, opts:['Yes','No']},
      {id:'qb7', cat:'⚽ Goals',       text:'How many matches decided by exactly one goal?',               pts:3, opts:['0–1','2–3','4–5','All']},
      {id:'qb8', cat:'⚽ Goals',       text:'Will a direct free kick goal be scored?',                     pts:3, opts:['Yes','No']},
      {id:'qb9', cat:'⚽ Goals',       text:'How many penalties will be scored?',                          pts:2, opts:['0','1','2','3+']},
      {id:'qb10',cat:'⚽ Goals',       text:'Will a winning goal be scored in added time?',                pts:3, opts:['Yes','No']},
      {id:'qb11',cat:'🟨 Discipline',  text:'Will any player receive a red card?',                        pts:2, opts:['Yes','No']},
      {id:'qb12',cat:'🟨 Discipline',  text:'Total yellow cards across all matches?',                      pts:3, opts:['0–5','6–10','11–15','16+']},
      {id:'qb13',cat:'🟨 Discipline',  text:'Will there be a VAR red card review?',                       pts:2, opts:['Yes','No']},
      {id:'qb14',cat:'🟨 Discipline',  text:'Total red cards in this round?',                              pts:2, opts:['0','1','2','3+']},
      {id:'qb15',cat:'🟨 Discipline',  text:'Will a player receive two yellows in any match?',             pts:2, opts:['Yes','No']},
      {id:'qb16',cat:'🟨 Discipline',  text:'Will a manager be sent to the stands?',                      pts:3, opts:['Yes','No']},
      {id:'qb17',cat:'🧤 Goalkeeping', text:'How many clean sheets in this round?',                       pts:2, opts:['0','1','2','3+']},
      {id:'qb18',cat:'🧤 Goalkeeping', text:'Will any goalkeeper save a penalty?',                        pts:3, opts:['Yes','No']},
      {id:'qb19',cat:'🧤 Goalkeeping', text:'Will a goalkeeper error lead to a goal?',                    pts:3, opts:['Yes','No']},
      {id:'qb20',cat:'🧤 Goalkeeping', text:'Will a goalkeeper be subbed off injured?',                   pts:4, opts:['Yes','No']},
      {id:'qb21',cat:'📊 Stats',       text:'Which team has the highest average possession?',             pts:2, opts:['Team A','Team B','Team C','Team D']},
      {id:'qb22',cat:'📊 Stats',       text:'Which team earns the most corner kicks?',                    pts:2, opts:['Team A','Team B','Team C','Team D']},
      {id:'qb23',cat:'📊 Stats',       text:'Total corners across all matches?',                           pts:3, opts:['0–15','16–25','26–35','36+']},
      {id:'qb24',cat:'🏆 Tournament',  text:'Will any host nation be eliminated?',                        pts:3, opts:['Yes – USA','Yes – Canada','Yes – Mexico','No']},
      {id:'qb25',cat:'🏆 Tournament',  text:'Will the defending champion win?',                            pts:3, opts:['Yes','No']},
      {id:'qb26',cat:'🏆 Tournament',  text:'Will an African team reach the semi-finals?',                pts:4, opts:['Yes','No']},
      {id:'qb27',cat:'🏆 Tournament',  text:'How many matches go to extra time in this round?',           pts:3, opts:['0','1–2','3–4','5+']},
      {id:'qb28',cat:'🏆 Tournament',  text:'Will any match be decided by penalties?',                    pts:3, opts:['Yes – 1','Yes – 2+','No']},
      {id:'qb29',cat:'🏆 Tournament',  text:'Will an upset (lower-ranked team wins) occur?',              pts:2, opts:['Yes','No']},
      {id:'qb30',cat:'🏆 Tournament',  text:'Which host nation finishes highest in their group?',         pts:3, opts:['USA','Canada','Mexico','Equal']},
    ];

    // ── Round selector ───────────────────────────────────────────
    const qRid = S.adminTabRounds['questions'] || S.activeRound;
    const qRound = ROUNDS[qRid] || ROUNDS[S.activeRound];
    const qPillsHtml = Object.values(ROUNDS).map(r =>
      `<button class="pill ${qRid===r.id?'active':''}" data-r="${r.id}">${roundLabel(r)}</button>`
    ).join('');

    const activeQs = getActiveQuestions(qRid);
    const isCustom = !!S.customBonusQs[qRid];

    // ── Active questions editor ──────────────────────────────────
    const activeEditorRows = activeQs.map((q, i) => {
      const isOU = q.type === 'overunder';
      const inputStyle = 'background:#1e2230;border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:5px 8px;font-size:11px;font-family:var(--mono)';
      return `
      <div style="padding:12px 0;border-bottom:1px solid var(--border2)">
        <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px">
          <span style="font-size:11px;color:var(--muted);width:20px;padding-top:10px;flex-shrink:0">${i+1}.</span>
          <textarea rows="2" data-eq-text="${i}" style="flex:1;min-width:180px;background:rgba(255,255,255,0.06);
            border:1.5px solid rgba(255,255,255,0.12);color:var(--text);
            padding:8px 10px;font-size:12px;font-family:Arial,sans-serif;resize:vertical">${q.text.replace(/</g,'&lt;')}</textarea>
          <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
            <label style="font-size:10px;color:var(--muted)">Pts</label>
            <input type="number" min="1" max="20" data-eq-pts="${i}" value="${q.pts}"
              style="width:52px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.12);
              color:var(--gold);text-align:center;font-size:14px;font-weight:700;
              padding:6px 4px;font-family:var(--mono)">
          </div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-left:28px;margin-bottom:6px">
          <span style="font-size:10px;color:var(--muted);flex-shrink:0">Type:</span>
          <select data-eq-type="${i}" style="${inputStyle}">
            <option value="normal" ${q.type==='normal'||!q.type?'selected':''}>Multiple Choice</option>
            <option value="overunder" ${q.type==='overunder'?'selected':''}>Over / Under</option>
            <option value="multicheck" ${q.type==='multicheck'?'selected':''}>Multi-Select</option>
          </select>
          <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none">
            <input type="checkbox" data-eq-wager="${i}" ${q.wager?'checked':''}>
            Wager (slider 0–10)
          </label>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-left:28px">
          ${isOU
            ? `<span style="font-size:10px;color:var(--muted);font-style:italic">Options auto-set: Over / Under / Abstain</span>`
            : `<span style="font-size:10px;color:var(--muted);flex-shrink:0">Options (comma-separated):</span>
               <input data-eq-opts="${i}" value="${q.opts.join(', ').replace(/"/g,'&quot;')}"
                 style="flex:1;min-width:140px;${inputStyle}">`
          }
          <button class="btn btn-gold btn-sm" data-save-q="${i}" data-rid="${qRid}">Save</button>
          <button class="btn btn-danger btn-sm" data-del-q="${i}" data-rid="${qRid}">Delete</button>
        </div>
        <div style="padding-left:28px;margin-top:10px">
          <div style="font-size:10px;color:var(--muted);letter-spacing:0.08em;margin-bottom:6px">TIEBREAKER CRITERIA <span style="font-weight:400;opacity:0.6">(optional — shown to players under the question)</span></div>
          ${(q.tiebreakers||[]).map((tb, j) => `
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:5px">
              <span style="font-size:10px;color:var(--muted);min-width:18px;text-align:right;flex-shrink:0">${j+1}.</span>
              <input data-eq-tb="${i}-${j}" value="${tb.replace(/</g,'&lt;').replace(/"/g,'&quot;')}"
                placeholder="e.g. Most goals scored"
                style="flex:1;min-width:160px;${inputStyle}">
              <button class="btn btn-danger btn-sm" data-del-tb="${i}-${j}" data-rid="${qRid}" style="padding:2px 7px;font-size:11px">✕</button>
            </div>`).join('')}
          <button class="btn btn-sm btn-outline" data-add-tb="${i}" data-rid="${qRid}"
            style="font-size:11px;margin-top:4px;border-color:rgba(255,255,255,0.2);color:var(--muted)">＋ Add tiebreaker</button>
        </div>
        <div style="padding-left:28px;margin-top:10px">
          <div style="font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;margin-bottom:5px">NOTE &amp; TAGS</div>
          <div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:7px">
            ${BONUS_TAGS.map(t => `<button class="bonus-tag-btn${(q.tags||[]).includes(t.id)?' tag-active':''}" style="--tc:${t.color}" data-eq-tagbtn="${i}" data-tag-id="${t.id}" title="${t.text}">${t.label}</button>`).join('')}
          </div>
          <textarea rows="2" data-eq-note="${i}" placeholder="Add a note visible to players (or click a tag above to auto-fill)…"
            style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
            color:var(--muted);padding:6px 9px;font-size:11px;font-family:Arial,sans-serif;resize:vertical">${(q.note||'').replace(/</g,'&lt;')}</textarea>
        </div>
      </div>`;
    }).join('');

    // ── Question bank ────────────────────────────────────────────
    const catFilter  = S.adminQFilter || 'All';
    const categories = ['All', ...new Set(QUESTION_BANK.map(q => q.cat))];
    const filtered   = QUESTION_BANK.filter(q => catFilter === 'All' || q.cat === catFilter);

    const catPills = categories.map(c =>
      `<button class="pill ${catFilter===c?'active':''}" data-qcat="${c}" style="font-size:11px">${c}</button>`
    ).join('');

    const bankRows = filtered.map((q, bi) => `
      <div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border2)">
        <div style="flex:1">
          <div style="font-size:12px;color:var(--text);margin-bottom:4px">${q.text}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <span style="font-size:10px;background:rgba(255,255,255,0.06);color:var(--muted);padding:2px 8px;border-radius:10px">${q.cat}</span>
            <span style="font-size:11px;color:var(--gold);font-weight:700">${q.pts} pts</span>
            <span style="font-size:10px;color:var(--muted)">${q.opts.join(' / ')}</span>
          </div>
        </div>
        <button class="btn btn-outline btn-sm" data-use-bank-q="${bi}" data-rid="${qRid}"
          style="flex-shrink:0;border-color:var(--gold);color:var(--gold)">Use →</button>
      </div>`).join('');

    tabContent = `
      <div class="pill-row">${qPillsHtml}</div>

      <div class="card" style="border-color:rgba(255,215,0,0.2);margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">
          <div class="card-title" style="margin:0">✏️ Active Questions — ${roundLabel(qRound)}</div>
          <div style="display:flex;gap:8px">
            ${isCustom ? `<button class="btn btn-sm btn-outline" id="reset-qs-btn" data-rid="${qRid}" style="font-size:11px;color:#ff7043;border-color:#ff7043">↩ Reset to defaults</button>` : ''}
            <button class="btn btn-sm btn-outline" id="add-blank-q-btn" data-rid="${qRid}">＋ Add blank</button>
          </div>
        </div>
        <p style="color:var(--muted);font-size:11px;margin-bottom:12px">
          Edit text, points, and options inline then hit Save. Use the bank below to insert pre-written questions.
        </p>
        ${activeEditorRows || '<p style="color:var(--muted);font-size:13px">No questions for this round yet. Add one below.</p>'}
      </div>

      <div class="card" style="border-color:rgba(255,255,255,0.08)">
        <div class="card-title">📚 Question Bank <span style="font-size:11px;color:var(--muted);font-weight:400">(click "Use →" to add to active questions)</span></div>
        <div class="pill-row" style="margin-bottom:12px">${catPills}</div>
        ${bankRows}
      </div>`;

    // Store bank ref for event handlers
    window._adminQuestionBank = QUESTION_BANK;
  }

  // ── Players tab ──────────────────────────────────────────────
  if (adminTab === 'players') {
    const players = S.profiles.filter(p => !p.is_admin);
    const playerRows = players.map(p => {
      const { total, correctPicks, exactScores } = calcScore(p.id);
      const achs = (p.achievements || []).slice(0, 5)
        .map(a => { const d = ACHIEVEMENTS[a.type]; return d ? `<span title="${d.label}">${d.icon}</span>` : ''; })
        .join('');
      const override = parseInt(p.points_override ?? 0, 10) || 0;
      return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;
        border-bottom:1px solid var(--border2);flex-wrap:wrap">
        <div style="flex:1;min-width:120px">
          <div style="color:var(--text);font-weight:700;font-size:13px">${p.nickname||p.name}</div>
          ${p.nickname ? `<div style="color:var(--muted);font-size:11px">${p.name}</div>` : ''}
        </div>
        <div style="display:flex;gap:12px;font-size:12px">
          <span style="color:var(--green);font-weight:700">${total} pts</span>
          <span style="color:#90caf9">${correctPicks} ✓</span>
          <span style="color:#ce93d8">${exactScores} 🎯</span>
        </div>
        <div style="font-size:14px;display:flex;gap:2px">${achs}</div>
        <div style="display:flex;align-items:center;gap:4px" title="Manual points adjustment (positive or negative)">
          <span style="font-size:10px;color:var(--muted);font-family:var(--mono);white-space:nowrap">±pts</span>
          <input class="input admin-pts-override" type="number" value="${override}"
            data-uid="${p.id}" placeholder="0"
            style="width:60px;padding:5px 8px;font-size:12px;text-align:center">
          <button class="btn btn-sm btn-gold admin-pts-save" data-uid="${p.id}" style="padding:5px 9px;font-size:11px">✓</button>
        </div>
        <button class="btn btn-sm ${p.paid ? 'btn-gold' : 'btn-outline'} admin-paid-toggle" data-uid="${p.id}" data-paid="${p.paid ? '1' : '0'}"
          style="font-size:11px;${p.paid ? '' : 'opacity:0.5'}" title="${p.paid ? 'Mark as unpaid' : 'Mark as paid'}">
          ${p.paid ? '✅ Paid' : '⬜ Unpaid'}
        </button>
        <button class="btn btn-sm btn-outline" data-view-profile="${p.id}">Profile</button>
      </div>`;
    }).join('');

    const pz = S.prizes;
    const prizeRows = pz.entries.map((e, i) => `
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <span style="font-size:11px;color:var(--muted);font-family:var(--mono);width:28px;flex-shrink:0">#</span>
        <input class="input" type="number" min="1" max="999" value="${e.rank}"
          data-prize-field="rank" data-prize-i="${i}"
          style="width:70px;padding:7px 10px;font-size:13px" placeholder="Place">
        <input class="input" type="text" value="${e.amount}"
          data-prize-field="amount" data-prize-i="${i}"
          style="flex:1;padding:7px 10px;font-size:13px" placeholder="e.g. 500">
        <button class="btn btn-sm btn-danger" data-prize-delete="${i}" style="padding:6px 10px;flex-shrink:0">✕</button>
      </div>`).join('');

    const cutoffVal = S.registrationCutoff ? S.registrationCutoff.slice(0,16) : '';
    tabContent = `
      <div class="card" style="margin-bottom:16px;border-color:rgba(255,183,77,0.25)">
        <div class="card-title">🔒 Registration Cutoff</div>
        <p style="font-size:12px;color:var(--muted);margin-bottom:12px">
          After this date &amp; time, new accounts cannot be created. Leave blank to allow registration at any time.
        </p>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input class="input" id="reg-cutoff-input" type="datetime-local" value="${cutoffVal}"
            style="padding:7px 10px;font-size:13px;font-family:var(--mono)">
          <button class="btn btn-gold btn-sm" id="reg-cutoff-save">Save</button>
          <button class="btn btn-outline btn-sm" id="reg-cutoff-clear">Clear</button>
          <span id="reg-cutoff-status" style="font-size:11px;color:var(--muted);font-family:var(--mono)"></span>
        </div>
        ${S.registrationCutoff ? `<p style="font-size:11px;color:${Date.now()>new Date(S.registrationCutoff).getTime()?'#ef9a9a':'#66bb6a'};font-family:var(--mono);margin-top:8px">
          ${Date.now()>new Date(S.registrationCutoff).getTime()?'🔴 Registration is currently CLOSED':'🟢 Registration is currently OPEN'} — cutoff: ${new Date(S.registrationCutoff).toLocaleString()}</p>` : '<p style="font-size:11px;color:#66bb6a;font-family:var(--mono);margin-top:8px">🟢 Registration is currently OPEN (no cutoff set)</p>'}
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">🏆 Prize Configuration</div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
          <label style="font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap">Currency Symbol / Label</label>
          <input class="input" id="prize-currency" type="text" value="${pz.currency}"
            style="width:100px;padding:7px 10px;font-size:13px" placeholder="CAD">
          <span style="font-size:11px;color:var(--muted)">shown before every prize amount</span>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <span style="font-size:11px;color:var(--muted);font-family:var(--mono);width:28px;flex-shrink:0"></span>
          <span style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;width:70px">PLACE</span>
          <span style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em">AMOUNT</span>
        </div>
        ${prizeRows || '<p style="color:var(--muted);font-size:13px;margin-bottom:12px">No prizes set yet.</p>'}
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-outline btn-sm" id="prize-add-btn">+ Add Place</button>
          <button class="btn btn-gold btn-sm" id="prize-save-btn">Save Prizes</button>
          <span id="prize-status" style="font-size:11px;color:var(--muted);font-family:var(--mono);align-self:center"></span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">👥 Players (${players.length})</div>
        ${playerRows || '<p style="color:var(--muted);font-size:13px">No players yet.</p>'}
      </div>`;
  }

  // ── Sync tab ─────────────────────────────────────────────────
  if (adminTab === 'sync') {
    const savedKey = localStorage.getItem('wc26:apiKey') || '';
    tabContent = `
      <div class="card" style="border-color:rgba(100,200,100,0.3)">
        <div class="card-title" style="color:#66bb6a">🔄 Live Score Sync</div>
        <p style="color:var(--muted);font-size:12px;margin-bottom:16px">
          Fetches completed match results from
          <strong style="color:var(--text)">football-data.org</strong> and auto-fills the Results panel.
          Free API keys available at <span style="color:var(--gold)">football-data.org</span>.
          WC 2026 kicks off <strong style="color:var(--text)">June 11, 2026</strong> — set your key up now.
        </p>

        <div class="field">
          <label class="label">API Key (X-Auth-Token)</label>
          <input class="input" id="sync-api-key" type="password"
            value="${savedKey}" placeholder="Paste your football-data.org API key"
            style="font-family:monospace;font-size:13px">
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">
          <button class="btn btn-gold" id="sync-btn" style="min-width:120px">🔄 Sync Now</button>
          <button class="btn btn-outline btn-sm" id="sync-save-key-btn">Save Key</button>
        </div>

        <div id="sync-status" style="margin-top:14px"></div>

        <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border2)">
          <div style="font-size:11px;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:0.5px">HOW IT WORKS</div>
          <div style="font-size:12px;color:var(--muted);line-height:1.8">
            1. Register at <span style="color:var(--gold)">football-data.org</span> → free tier supports WC data<br>
            2. Paste your API key above and click <strong style="color:var(--text)">Save Key</strong><br>
            3. Once WC 2026 is underway, click <strong style="color:var(--text)">Sync Now</strong> after each match<br>
            4. Results are matched by team name and written directly to Supabase<br>
            5. Scores auto-populate the Results tab and all player picks are re-scored
          </div>
        </div>
      </div>`;
  }

  // ── Logs tab ─────────────────────────────────────────────────
  if (adminTab === 'logs') {
    const getName = p => p?.nickname || p?.name || '—';

    const describeItem = (log) => {
      const round = ROUNDS[log.round_id];
      if (log.item_type === 'pick') {
        const m = round?.matches?.find(x => x.id === log.item_id);
        if (!m) return log.item_id;
        const home = getBracketTeam(m.id, 'home', m.home);
        const away = getBracketTeam(m.id, 'away', m.away);
        return `${home || 'TBD'} vs ${away || 'TBD'}`;
      }
      if (log.item_type === 'bonus') {
        const bq = getActiveQuestions(log.round_id).find(q => q.id === log.item_id);
        return bq ? bq.text : log.item_id;
      }
      return log.item_id;
    };

    const fieldLabel = { winner: 'Pick', score_home: 'Home Score', score_away: 'Away Score', answer: 'Answer', wager: 'Wager' };

    const fmtVal = (log, val) => {
      if (val === '' || val == null) return '<span style="color:var(--muted);font-style:italic">empty</span>';
      return val;
    };

    const rows = (S.activityLogs || []).map(log => {
      const player = S.profiles.find(p => p.id === log.user_id);
      const round = ROUNDS[log.round_id];
      const ts = new Date(log.created_at).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit', second:'2-digit' });
      return `<tr>
        <td style="font-family:var(--mono);font-size:11px;white-space:nowrap;color:var(--muted)">${ts}</td>
        <td style="font-weight:600">${getName(player)}</td>
        <td style="font-size:11px;color:var(--muted)">${round?.id === 'pt' ? 'Pre-Tournament' : (round?.label || log.round_id)}</td>
        <td style="font-size:12px">${describeItem(log)}</td>
        <td style="font-size:11px;color:var(--muted)">${fieldLabel[log.field] || log.field}</td>
        <td style="font-size:12px;color:#ef9a9a">${fmtVal(log, log.old_value)}</td>
        <td style="font-size:12px;color:#a5d6a7">${fmtVal(log, log.new_value)}</td>
      </tr>`;
    }).join('');

    tabContent = `
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px">
          <div class="card-title" style="margin:0">📜 Activity Log</div>
          <button class="btn btn-sm btn-outline" id="refresh-logs-btn">🔄 Refresh</button>
        </div>
        <p style="color:var(--muted);font-size:11px;margin-bottom:14px;line-height:1.6">
          Every time a player sets or changes a pick or bonus answer, it's recorded here with a timestamp —
          including changes made after a match should have locked. Showing the most recent ${(S.activityLogs||[]).length} change(s).
        </p>
        ${rows ? `<div style="overflow-x:auto">
          <table class="rounds-table">
            <thead><tr>
              <th>Time</th><th>Player</th><th>Round</th><th>Match / Question</th><th>Field</th><th>From</th><th>To</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>` : `<p style="color:var(--muted);font-size:13px">No activity logged yet.</p>`}
      </div>`;
  }

  // ── Feedback tab ─────────────────────────────────────────────
  if (adminTab === 'feedback') {
    const entries = S.feedbackEntries;
    if (entries === null) {
      tabContent = `<div class="card"><p style="color:var(--muted);font-size:13px">Loading feedback…</p></div>`;
    } else if (entries.length === 0) {
      tabContent = `<div class="card"><p style="color:var(--muted);font-size:13px">No feedback submitted yet.</p></div>`;
    } else {
      const rows = entries.map(e => {
        const name = e.user_name || '—';
        const date = new Date(e.created_at).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
        return `<tr>
          <td style="white-space:nowrap">${date}</td>
          <td><strong>${name}</strong></td>
          <td style="color:var(--muted);font-size:12px;max-width:400px;white-space:pre-wrap">${e.message || '—'}</td>
        </tr>`;
      }).join('');
      tabContent = `
        <div class="card" style="margin-bottom:12px">
          <div class="card-title">💬 Player Feedback — ${entries.length} response${entries.length !== 1 ? 's' : ''}</div>
          <div style="overflow-x:auto">
            <table class="rounds-table">
              <thead><tr><th>Date</th><th>Player</th><th>Comments</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
    }
  }

  if (adminTab === 'settings') {
    const sc = S.scoring;
    const ht = S.hiddenTabs || [];
    const TOGGLEABLE_TABS = [
      { id:'dashboard',  label:'Dashboard' },
      { id:'picks',      label:'My Picks' },
      { id:'leaderboard',label:'Leaderboard' },
      { id:'results',    label:'Results' },
      { id:'history',    label:'Match History' },
      { id:'ptpicks',    label:'Pre-Tournament Picks' },
      { id:'groups',     label:'Groups' },
      { id:'bracket',    label:'Bracket' },
      { id:'rules',      label:'Rules' },
      { id:'feedback',   label:'Feedback' },
    ];
    const field = (id, label, val, desc='') => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--faint)">
        <div>
          <div style="font-size:13px;color:var(--text)">${label}</div>
          ${desc ? `<div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px">${desc}</div>` : ''}
        </div>
        <input type="number" min="0" max="99" step="1" class="admin-score" style="width:54px;text-align:center;font-size:14px"
          data-scoring="${id}" value="${val}">
      </div>`;
    const tabToggle = t => {
      const hidden = ht.includes(t.id);
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--faint)">
        <span style="font-size:13px;color:var(--text)">${t.label}</span>
        <div class="settings-toggle-track${hidden ? '' : ' on'}" data-tab-toggle="${t.id}" style="cursor:pointer;width:36px;height:20px;background:${hidden?'var(--faint)':'var(--gold)'};border-radius:10px;position:relative;transition:background .2s;flex-shrink:0">
          <div style="position:absolute;top:2px;left:${hidden?'2px':'18px'};width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s"></div>
        </div>
      </div>`;
    };
    tabContent = `
      <div class="card" style="margin-bottom:12px">
        <div class="card-title">Match Scoring</div>
        <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Points awarded per match before round multiplier is applied.</p>
        ${field('winnerPts',         'Correct winner',                   sc.winnerPts,         'Team/outcome correct')}
        ${field('exactScorePts',     'Exact score (correct team)',        sc.exactScorePts,     'Right scoreline + right winner')}
        ${field('scoreWrongTeamPts', 'Exact score (wrong team)',          sc.scoreWrongTeamPts, 'Right goals but picked wrong side')}
      </div>
      <div class="card" style="margin-bottom:12px">
        <div class="card-title">Tab Visibility</div>
        <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Toggle which tabs are visible to players. Admin always sees all tabs.</p>
        ${TOGGLEABLE_TABS.map(tabToggle).join('')}
      </div>
      <div class="card" style="margin-bottom:12px">
        <div class="card-title">Bonus Question Tag Descriptions</div>
        <p style="font-size:12px;color:var(--muted);margin-bottom:14px">Customize the description shown to players when a tag is applied to a question.</p>
        ${BONUS_TAGS.map(t => `
          <div style="padding:10px 0;border-bottom:1px solid var(--faint)">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span class="bonus-tag-pip" style="--tc:${t.color}">${t.label}</span>
            </div>
            <textarea rows="2" data-tag-desc="${t.id}"
              style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
              color:var(--muted);padding:6px 9px;font-size:11px;font-family:Arial,sans-serif;resize:vertical"
              placeholder="${t.text}">${(S.tagDescs[t.id] || '').replace(/</g,'&lt;')}</textarea>
          </div>`).join('')}
      </div>
      <div class="card" style="margin-bottom:12px">
        <div class="card-title">Round Structure</div>
        <p style="font-size:12px;color:var(--muted);margin-bottom:16px">Enable or disable rounds and set custom display labels. Disabled rounds are hidden from all views and excluded from scoring.</p>
        ${(() => {
          const base = ROUNDS_MAP[S.tournamentId] || ROUNDS_WC2026;
          const cfg = S.tournamentConfig;
          return Object.values(base).map(r => {
            const disabled = (cfg.disabledRounds || []).includes(r.id);
            const labelOverride = cfg.roundLabels?.[r.id] || '';
            return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--faint)">
              <div class="settings-toggle-track${disabled ? '' : ' on'}" data-round-toggle="${r.id}"
                style="cursor:pointer;width:36px;height:20px;flex-shrink:0;background:${disabled?'var(--faint)':'var(--gold)'};border-radius:10px;position:relative;transition:background .2s">
                <div style="position:absolute;top:2px;left:${disabled?'2px':'18px'};width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s"></div>
              </div>
              <div style="flex:1;min-width:0">
                <div style="font-size:12px;color:var(--text);font-family:var(--mono)">${r.label}</div>
                <div style="font-size:10px;color:var(--muted);margin-top:1px">${r.id}${r.knockout?' · Knockout':''}${r.special?' · '+r.special:''}</div>
              </div>
              <input type="text" data-round-label="${r.id}" value="${labelOverride.replace(/"/g,'&quot;')}"
                placeholder="${r.label}" maxlength="40"
                style="width:130px;background:var(--bg2);border:1px solid var(--border2);color:var(--text);
                       font-size:12px;padding:5px 8px;font-family:inherit;outline:none;box-sizing:border-box"
                title="Custom label (leave blank to use default)">
            </div>`;
          }).join('');
        })()}
      </div>
      <div class="card" style="margin-bottom:12px">
        <div class="card-title">Group Stage Settings</div>
        <p style="font-size:12px;color:var(--muted);margin-bottom:16px">Controls how groups are displayed and how pre-tournament picks are scored. Actual group compositions are set in code.</p>
        ${(() => {
          const cfg = S.tournamentConfig;
          const numField = (id, label, val, desc) => `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--faint)">
              <div>
                <div style="font-size:13px;color:var(--text)">${label}</div>
                ${desc ? `<div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px">${desc}</div>` : ''}
              </div>
              <input type="number" min="1" max="32" step="1" id="${id}" value="${val}"
                class="admin-score" style="width:54px;text-align:center;font-size:14px">
            </div>`;
          return numField('cfg-num-groups',        'Number of groups',         cfg.numGroups,         'e.g. 12 for WC, 6 for EUROs, 0 for no groups')
               + numField('cfg-group-size',        'Teams per group',          cfg.groupSize,         'e.g. 4 for most tournaments')

// ── Match History page ────────────────────────────────────────────
function renderHistory() {
  const players = S.profiles.filter(p => !p.is_admin);
  const now = Date.now();
  const LOCK_BEFORE = 3600000;

  // History only shows matches that have actually kicked off (or manually locked per-match).
  // Round-level lock is intentionally excluded — admins lock rounds early to manage
  // bonus questions, but that shouldn't surface unplayed matches in history.
  const hasMatchStarted = (match) => {
    const ko = getKickoff(match.id, match.kickoff);
    if (!ko) return false;
    return !!(S.manualMatchLocks[match.id] || now >= new Date(ko).getTime() - LOCK_BEFORE);
  };

  // Build list of rounds that have at least one match that has actually kicked off
  const roundsWithMatches = Object.values(ROUNDS).filter(r =>
    r.special !== 'pretournament' &&
    r.matches.some(m => hasMatchStarted(m))
  );

  if (!roundsWithMatches.length) {
    return `<div class="page-title">Match History</div>
      <div class="card"><p style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0">
        No matches have locked yet — check back once the tournament starts.</p></div>`;
  }

  const buildPicksTable = (round, match) => {
    const result  = S.results[round.id]?.[match.id] || {};
    const hasResult = !!result.winner;
    const { match: mMult } = getMultipliers(round.id);
    const rows = players.map(p => {
      const pick  = S.picks[p.id]?.[round.id]?.[match.id] || {};
      const name  = p.nickname || p.name || '—';
      const wp    = pick.winner || '';
      const sh    = pick.score_home ?? '';
      const sa    = pick.score_away ?? '';
      const hasSc = sh !== '' && sa !== '';
      const correct    = hasResult && wp && wp === result.winner;
      // Score-line points are independent of the winner pick
      const slp = hasResult ? scoreLinePoints({ score_home: sh, score_away: sa }, { score_home: result.score_home, score_away: result.score_away }) : { pts: 0, exact: false };
      const exactScore = slp.exact;
      const earnedPts = (correct ? 2 : 0) + slp.pts;
      const pts = !hasResult ? '' : earnedPts
        ? `<span style="color:#66bb6a">+${earnedPts*mMult}</span>`
        : `<span style="color:var(--faint)">0</span>`;
      const pickCol  = !wp ? 'var(--faint)' : !hasResult ? 'var(--text)' : correct ? '#66bb6a' : '#ef5350';
      const scoreCol = !hasSc ? 'var(--faint)' : !hasResult ? 'var(--muted)' : slp.pts ? '#66bb6a' : 'var(--muted)';
      return `<tr style="border-bottom:1px solid var(--border2)">
        <td style="padding:6px 8px;color:var(--text);font-size:12px">${name}</td>
        <td style="padding:6px 8px;color:${pickCol};font-size:12px;font-weight:${correct?'700':'400'}">${wp?`${F(wp)} ${wp}`:'<span style="color:var(--faint)">—</span>'}</td>
        <td style="padding:6px 8px;text-align:center;color:${scoreCol};font-family:var(--mono);font-size:12px">${hasSc?`${sh} – ${sa}${exactScore?(correct?' ✓ 🎯':' 🎯'):''}`:'<span style="color:var(--faint)">—</span>'}</td>
        <td style="padding:6px 8px;text-align:right;font-size:11px;font-family:var(--mono)">${pts}</td>
      </tr>`;
    }).join('');
    const resultBar = hasResult ? `
      <div style="margin-top:8px;padding:6px 10px;background:rgba(102,187,106,0.07);
        border:1px solid rgba(102,187,106,0.2);font-size:12px;font-family:var(--mono);
        display:flex;align-items:center;gap:8px">
        <span style="color:var(--muted)">RESULT</span>
        <span>${F(result.winner)} <strong style="color:#66bb6a">${result.winner}</strong></span>
        ${result.score_home!=null&&result.score_home!==''?`<span style="color:var(--muted)">${result.score_home} – ${result.score_away}</span>`:''}
      </div>` : '';
    return `<div class="admin-table-wrap"><table style="width:100%;border-collapse:collapse">
      <thead><tr style="border-bottom:1px solid rgba(255,255,255,0.1)">
        <th style="padding:4px 8px;text-align:left;font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400">PLAYER</th>
        <th style="padding:4px 8px;text-align:left;font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400">PICK</th>
        <th style="padding:4px 8px;text-align:center;font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400">SCORE</th>
        <th style="padding:4px 8px;text-align:right;font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400">PTS</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>${resultBar}`;
  };

  const roundsHtml = roundsWithMatches.map(round => {
    const lockedMatches = round.matches.filter(m => hasMatchStarted(m));
    const matchRows = lockedMatches.map(match => {
      const ko = getKickoff(match.id, match.kickoff);
      const koStr = ko ? new Date(ko).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
      const result = S.results[round.id]?.[match.id] || {};
      const hasResult = !!result.winner;
      const homeTeam = getBracketTeam(match.id,'home',match.home);
      const awayTeam = getBracketTeam(match.id,'away',match.away);
      const scoreStr = hasResult
        ? `<span style="font-family:var(--mono);font-weight:700;color:#66bb6a">${result.score_home} – ${result.score_away}</span>`
        : '';
      const badge = hasResult
        ? `<span style="font-size:10px;font-family:var(--mono);color:#66bb6a">✅ FINAL</span>`
        : `<span style="font-size:10px;font-family:var(--mono);color:#ffb74d">🔒 LOCKED</span>`;
      const uid = `hist-${match.id}`;
      return `<div style="border-bottom:1px solid var(--border2)">
        <div onclick="var d=document.getElementById('${uid}');var a=document.getElementById('${uid}-arr');if(d.style.display==='none'){d.style.display='block';a.textContent='▲';}else{d.style.display='none';a.textContent='▼';}"
          style="display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;flex-wrap:wrap">
          <span style="font-size:10px;color:var(--muted);font-family:var(--mono);min-width:90px;flex-shrink:0">${koStr}</span>
          <span style="font-size:15px;font-family:var(--display);letter-spacing:0.04em;flex:1">${F(homeTeam)} ${homeTeam} <span style="color:var(--muted);font-size:11px">vs</span> ${F(awayTeam)} ${awayTeam}</span>
          ${scoreStr}
          ${badge}
          <span id="${uid}-arr" style="color:var(--muted);font-size:11px;flex-shrink:0">▼</span>
        </div>
        <div id="${uid}" style="display:none;padding:0 16px 14px">${buildPicksTable(round, match)}</div>
      </div>`;
    }).join('');

    const bonusRecapHtml = renderBonusRecap(round.id, { compact: true });
    const bonusSection = bonusRecapHtml ? (() => {
      const uid = `bonus-recap-hist-${round.id}`;
      return `<div style="border-top:1px solid var(--border2)">
        <div onclick="var d=document.getElementById('${uid}');var a=document.getElementById('${uid}-arr');if(d.style.display==='none'){d.style.display='block';a.textContent='▲';}else{d.style.display='none';a.textContent='▼';}"
          style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;user-select:none">
          <span style="font-size:11px;font-family:var(--mono);letter-spacing:0.08em;color:var(--gold)">🎯 BONUS RESULTS</span>
          <span id="${uid}-arr" style="color:var(--muted);font-size:11px">▼</span>
        </div>
        <div id="${uid}" style="display:none;padding:0 16px 14px">${bonusRecapHtml}</div>
      </div>`;
    })() : '';

    return `<div class="card" style="padding:0;margin-bottom:12px">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border2)">
        <div class="card-title" style="margin:0">${round.label}</div>
      </div>
      ${matchRows}
      ${bonusSection}
    </div>`;
  }).join('');

  return `<div class="page-title">Match History</div>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Click any match to see everyone's picks and scores.</p>
    ${roundsHtml}`;
}

function renderPtPicks() {

  const allTeams = Object.values(GROUPS).flat().sort();
  const br = S.bonusResults['pt'] || {};
  const winRes = br['pt_winner']?.answer || '';
  const ptQs = getActiveQuestions('pt');

  const badge = (pick, res, qualified) => {
    if (!pick) return '<span style="color:var(--faint)">— no pick —</span>';

      const p1 = ba[`pt_${g}_1`]?.answer || '';
      const p2 = ba[`pt_${g}_2`]?.answer || '';

      const r2 = br[`pt_${g}_2`]?.answer || '';

      return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;

        <span>2nd: ${badge(p2, r2, qualified)}</span>
      </div>`;

    const winPick = ba['pt_winner']?.answer || '';
    const winBadge = badge(winPick, winRes, null);

      </div>`;

    const uid = `ptpick-${player.id}`;
    return `<div class="card" style="padding:0;margin-bottom:12px">
      <div onclick="var d=document.getElementById('${uid}');var a=document.getElementById('${uid}-arr');if(d.style.display==='none'){d.style.display='block';a.textContent='▲';}else{d.style.display='none';a.textContent='▼';}"
        style="display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none">

  return `<div class="page-title">Pre-Tournament Picks</div>

// ── Dashboard ─────────────────────────────────────────────────────
function calcRoundScore(uid, rid) {
  if (rid === 'pt') {
    let pts = 0;
    const ptBa = S.bonusAnswers[uid]?.['pt'] || {};
    const ptBr = S.bonusResults['pt'] || {};
    for (const g of Object.keys(GROUPS)) {
      const p1 = ptBa[`pt_${g}_1`]?.answer, p2 = ptBa[`pt_${g}_2`]?.answer;
      const r1 = ptBr[`pt_${g}_1`]?.answer,  r2 = ptBr[`pt_${g}_2`]?.answer;
      if (!r1 && !r2) continue;
      const qualified = new Set([r1, r2].filter(Boolean));
      if (p1) { if (p1 === r1) pts += 2; else if (qualified.has(p1)) pts += 1; }
      if (p2) { if (p2 === r2) pts += 2; else if (qualified.has(p2)) pts += 1; }
    }
    const winPts = S.ptSettings?.winnerPts ?? 10;
    const winPick = ptBa['pt_winner']?.answer, winRes = ptBr['pt_winner']?.answer;
    if (winPick && winRes && winPick === winRes) pts += winPts;
    return pts;
  }
  const round = ROUNDS[rid];
  if (!round) return 0;
  let pts = 0;
  const { match: mMult, bonus: bMult } = getMultipliers(rid);
  for (const m of round.matches) {
    const pick   = S.picks[uid]?.[rid]?.[m.id];
    const result = S.results[rid]?.[m.id];
    if (!pick || !result || !result.winner) continue;
    if (pick.winner && pick.winner === result.winner) pts += 2 * mMult;
    const slp = scoreLinePoints(pick, result);
    pts += slp.pts * mMult;
  }
  for (const bq of getActiveQuestions(rid)) {
    const ans     = S.bonusAnswers[uid]?.[rid]?.[bq.id];
    const correct = S.bonusResults[rid]?.[bq.id];
    if (!ans || !correct || !correct.answer || !ans.answer) continue;
    const isOU     = bq.type === 'overunder';
    const isMCQ    = bq.type === 'multicheck';
    const hasWager = bq.wager === true;
    const stake    = hasWager ? (Number(ans.wager) || 0) : (bq.pts * bMult);
    if (isMCQ) {
      const { correctSet, wrongSet } = parseMcResult(correct.answer);
      const picked = new Set((ans.answer || '').split(',').map(s => s.trim()).filter(Boolean));
      let mcPts = 0;
      for (const p of picked) {
        if (correctSet.has(p)) mcPts += 2;
        else if (wrongSet.has(p)) mcPts -= 1;
      }
      pts += mcPts * bMult;
    } else if (isOU) {
      if (ans.answer === 'Abstain') { /* 0 pts */ }
      else if (ans.answer === correct.answer) pts += stake;
      else pts -= stake;
    } else {
      if (ans.answer === correct.answer) pts += stake;
    }
  }
  return pts;
}

// ── Group Standings ───────────────────────────────────────────────
function computeGroupStandings() {
  const standings = {};
  for (const [g, teams] of Object.entries(GROUPS)) {
    standings[g] = teams.map(t => ({ team: t, played:0, won:0, drawn:0, lost:0, gf:0, ga:0, gd:0, pts:0 }));
  }
  // Use all non-knockout, non-pretournament rounds as group-stage rounds
  const groupRoundIds = Object.values(ROUNDS)
    .filter(r => !r.knockout && r.special !== 'pretournament')
    .map(r => r.id);
  for (const rid of groupRoundIds) {
    const round = ROUNDS[rid];
    if (!round) continue;
    for (const m of round.matches) {
      const result = S.results[rid]?.[m.id];
      if (!result?.winner || result.score_home === '' || result.score_home == null) continue;
      const sh = parseInt(result.score_home), sa = parseInt(result.score_away);
      if (isNaN(sh) || isNaN(sa)) continue;
      let grp = null;
      for (const [g, teams] of Object.entries(GROUPS)) {
        if (teams.includes(m.home) && teams.includes(m.away)) { grp = g; break; }
      }
      if (!grp) continue;
      const home = standings[grp].find(t => t.team === m.home);
      const away = standings[grp].find(t => t.team === m.away);
      if (!home || !away) continue;
      home.played++; away.played++;
      home.gf += sh; home.ga += sa;
      away.gf += sa; away.ga += sh;
      if (sh > sa)      { home.won++; home.pts += 3; away.lost++; }
      else if (sa > sh) { away.won++; away.pts += 3; home.lost++; }
      else              { home.drawn++; home.pts++; away.drawn++; away.pts++; }
    }
  }
  for (const g of Object.keys(standings)) {
    for (const t of standings[g]) t.gd = t.gf - t.ga;
    standings[g].sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.team.localeCompare(b.team));
  }
  return standings;
}

function renderGroups() {
  const standings = computeGroupStandings();
  const anyResults = Object.values(standings).some(g => g.some(t => t.played > 0));

  // Identify the best N third-place teams — they also advance (count from config)
  const best3rdCount = S.tournamentConfig?.best3rdAdvancers ?? 8;
  const thirdPlaceTeams = Object.values(standings)
    .map(teams => teams[2])
    .filter(t => t && t.played > 0)
    .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
  const best8Third = new Set(thirdPlaceTeams.slice(0, best3rdCount).map(t => t.team));

  const groupCards = Object.entries(standings).map(([g, teams]) => {
    const hasData = teams.some(t => t.played > 0);
    const rows = teams.map((t, i) => {
      const isQualified3rd = i === 2 && best8Third.has(t.team);
      const qualColor = i === 0 ? '#66bb6a' : i === 1 ? '#90caf9' : isQualified3rd ? '#ffb74d' : 'var(--muted)';
      const bar = hasData && teams[0].pts > 0
        ? Math.round((t.pts / (teams[0].pts || 1)) * 100) : 0;
      return `<tr style="border-bottom:1px solid var(--border2)">
        <td style="padding:7px 8px;width:20px">
          <span style="display:inline-block;width:6px;height:6px;border-radius:50%;
            background:${i<2?qualColor:isQualified3rd?qualColor:'var(--faint)'};flex-shrink:0"></span>
        </td>
        <td style="padding:7px 8px;color:${i<2||isQualified3rd?'var(--text)':'var(--muted)'};white-space:nowrap">
          ${F(t.team)} ${t.team}
        </td>
        <td style="padding:7px 6px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px">${t.played}</td>
        <td style="padding:7px 6px;text-align:center;color:#66bb6a;font-family:var(--mono);font-size:11px">${t.won}</td>
        <td style="padding:7px 6px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px">${t.drawn}</td>
        <td style="padding:7px 6px;text-align:center;color:#e88a80;font-family:var(--mono);font-size:11px">${t.lost}</td>
        <td style="padding:7px 6px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px">${t.gd > 0 ? '+' : ''}${t.gd}</td>
        <td style="padding:7px 8px;text-align:right;font-weight:700;color:var(--gold);font-family:var(--mono)">${t.pts}</td>
      </tr>`;
    }).join('');

    return `<div class="card" style="padding:0;overflow:hidden">
      <div style="padding:10px 14px 8px;display:flex;justify-content:space-between;align-items:center;
        border-bottom:1px solid var(--border2);background:rgba(255,255,255,0.02)">
        <span style="font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:0.2em">GROUP ${g}</span>
        ${!hasData ? `<span style="font-size:10px;color:var(--faint);font-family:var(--mono)">No results yet</span>` : ''}
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="border-bottom:1px solid var(--border2)">
          <th style="padding:5px 8px;width:20px"></th>
          <th style="padding:5px 8px;text-align:left;color:var(--muted);font-size:10px;font-family:var(--mono)">TEAM</th>
          <th style="padding:5px 6px;text-align:center;color:var(--muted);font-size:10px;font-family:var(--mono)" title="Played">P</th>
          <th style="padding:5px 6px;text-align:center;color:var(--muted);font-size:10px;font-family:var(--mono)" title="Won">W</th>
          <th style="padding:5px 6px;text-align:center;color:var(--muted);font-size:10px;font-family:var(--mono)" title="Drawn">D</th>
          <th style="padding:5px 6px;text-align:center;color:var(--muted);font-size:10px;font-family:var(--mono)" title="Lost">L</th>

          <th style="padding:5px 8px;text-align:right;color:var(--muted);font-size:10px;font-family:var(--mono)" title="Points">PTS</th>
        </tr></thead>

  }).join('');

  return `
    <div class="page-title">🌍 Group Standings</div>
