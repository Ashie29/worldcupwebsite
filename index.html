      ${groupCards}
    </div>`;
}

function renderLiveMatches() {
  const now = Date.now();
  const LOCK_BEFORE = 3600000;   // 1 hr before kickoff — match locks
  const LIVE_WINDOW = 10800000;  // 3 hrs after kickoff — treated as in-play

  // Flatten all non-PT matches
  const allMatches = [];
  for (const round of Object.values(ROUNDS)) {
    if (round.special === 'pretournament') continue;
    for (const m of round.matches) {
      const kickoff = getKickoff(m.id, m.kickoff);
      if (!kickoff) continue;
      allMatches.push({ round, match: m, kickoff, koTime: new Date(kickoff).getTime() });
    }
  }

  const players = S.profiles.filter(p => !p.is_admin);
  if (!players.length) return '';

  const isMatchLocked = (round, match, koTime) =>
    !!(S.roundSettings[round.id]?.locked || S.manualMatchLocks[match.id] || now >= koTime - LOCK_BEFORE);

  // Live / locked window matches (up to 2)
  const windowMatches = allMatches
    .filter(({ koTime }) => now >= koTime - LOCK_BEFORE && now <= koTime + LIVE_WINDOW)
    .sort((a, b) => a.koTime - b.koTime)
    .slice(0, 2);

  // Last 3 completed matches outside the live window, newest first
  const windowIds = new Set(windowMatches.map(w => w.match.id));
  const previousMatches = allMatches
    .filter(({ round, match }) =>
      !windowIds.has(match.id) && S.results[round.id]?.[match.id]?.winner)
    .sort((a, b) => b.koTime - a.koTime)
    .slice(0, 3);

  if (!windowMatches.length && !previousMatches.length) return '';

  // ── shared match card builder ─────────────────────────────────
  const buildCard = ({ round, match, kickoff, koTime }, compact = false) => {
    const locked    = isMatchLocked(round, match, koTime);
    const result    = S.results[round.id]?.[match.id] || {};
    const hasResult = !!result.winner;
    const isLive    = !hasResult && now >= koTime && now <= koTime + LIVE_WINDOW;
    const homeTeam  = getBracketTeam(match.id, 'home', match.home);
    const awayTeam  = getBracketTeam(match.id, 'away', match.away);
    const koStr     = new Date(kickoff).toLocaleString(undefined,
      { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });

    let statusBadge, cardBorder;
    if (hasResult) {
      statusBadge = `<span style="font-size:10px;font-family:var(--mono);color:#66bb6a;letter-spacing:0.1em">✅ FINAL</span>`;
      cardBorder  = compact ? 'var(--border)' : 'rgba(102,187,106,0.2)';
    } else if (isLive) {
      statusBadge = `<span style="font-size:10px;font-family:var(--mono);color:#ff5252;letter-spacing:0.1em"><span class="live-dot">●</span> LIVE</span>`;
      cardBorder  = 'rgba(255,82,82,0.25)';
    } else {
      statusBadge = `<span style="font-size:10px;font-family:var(--mono);color:#ffb74d;letter-spacing:0.1em">🔒 LOCKED</span>`;
      cardBorder  = 'rgba(255,183,77,0.2)';
    }

    const { match: mMult } = getMultipliers(round.id);
    const picksTableHtml = !locked
      ? `<p style="color:var(--muted);font-size:12px;margin-top:10px;font-family:var(--mono)">Picks revealed 1 hour before kickoff</p>`
      : (() => {
          const rows = players.map(p => {
            const pick  = S.picks[p.id]?.[round.id]?.[match.id] || {};
            const name  = p.nickname || p.name || '—';
            const wp    = pick.winner || '';
            const sh    = pick.score_home ?? '';
            const sa    = pick.score_away ?? '';
            const hasSc = sh !== '' && sa !== '';
            const correct    = hasResult && wp && wp === result.winner;
            // Score-line points are independent of the winner pick
            const slp = hasResult ? scoreLinePoints({ score_home: sh, score_away: sa }, { score_home: result.score_home, score_away: result.score_away }) : { pts: 0, exact: false };
            const exactScore = slp.exact;
            const earnedPts = (correct ? 2 : 0) + slp.pts;
            const pts = !hasResult ? '' : earnedPts
              ? `<span style="color:#66bb6a">+${earnedPts * mMult}</span>`
              : `<span style="color:var(--faint)">0</span>`;
            const pickCol  = !wp ? 'var(--faint)' : !hasResult ? 'var(--text)' : correct ? '#66bb6a' : '#ef5350';
            const scoreCol = !hasSc ? 'var(--faint)' : !hasResult ? 'var(--muted)' : slp.pts ? '#66bb6a' : 'var(--muted)';
            return `<tr style="border-bottom:1px solid var(--border2)">
              <td style="padding:5px 8px;color:var(--text);font-size:12px">${name}</td>
              <td style="padding:5px 8px;color:${pickCol};font-size:12px;font-weight:${correct?'700':'400'}">${wp ? `${F(wp)} ${wp}` : '<span style="color:var(--faint)">—</span>'}</td>
              <td style="padding:5px 8px;text-align:center;color:${scoreCol};font-family:var(--mono);font-size:12px">${hasSc ? `${sh} – ${sa}${exactScore?' 🎯':''}` : '<span style="color:var(--faint)">—</span>'}</td>
              <td style="padding:5px 8px;text-align:right;font-size:11px;font-family:var(--mono)">${pts}</td>
            </tr>`;
          }).join('');
          const resultBar = hasResult ? `
            <div style="margin-top:8px;padding:6px 10px;background:rgba(102,187,106,0.07);
              border:1px solid rgba(102,187,106,0.2);font-size:12px;font-family:var(--mono);
              display:flex;align-items:center;gap:8px">
              <span style="color:var(--muted)">RESULT</span>
              <span>${F(result.winner)} <strong style="color:#66bb6a">${result.winner}</strong></span>
              ${result.score_home !== '' && result.score_home != null
                ? `<span style="color:var(--muted)">${result.score_home} – ${result.score_away}</span>` : ''}
            </div>` : '';
          // Pick confidence %
          const pickCounts = {};
          let totalPickers = 0;
          players.forEach(p => {
            const wp = S.picks[p.id]?.[round.id]?.[match.id]?.winner;
            if (wp) { pickCounts[wp] = (pickCounts[wp] || 0) + 1; totalPickers++; }
          });
          const homeTeam2 = getBracketTeam(match.id,'home',match.home);
          const awayTeam2 = getBracketTeam(match.id,'away',match.away);
          const confidenceBar = totalPickers > 0 ? (() => {
            const teams = [homeTeam2, ...(!round.knockout?['Draw']:[]), awayTeam2];
            const cols  = { [homeTeam2]:'#90caf9', Draw:'#eeeeee', [awayTeam2]:'#ef9a9a' };
            const segs  = teams.map(t => {
              const pct = Math.round((pickCounts[t] || 0) / totalPickers * 100);
              return { t, pct, col: cols[t] };
            }).filter(s => s.pct > 0);
            const segBar = segs.map(s =>
              `<div style="flex:${s.pct};background:${s.col};height:100%;opacity:0.8"></div>`
            ).join('');
            const labels = `
              <span style="font-size:10px;font-family:var(--mono);color:#90caf9">${F(homeTeam2)} ${homeTeam2} <strong>${Math.round((pickCounts[homeTeam2]||0)/totalPickers*100)}%</strong></span>
              ${!round.knockout ? `<span style="font-size:10px;font-family:var(--mono);color:var(--muted);margin:0 auto">Draw <strong>${Math.round((pickCounts['Draw']||0)/totalPickers*100)}%</strong></span>` : ''}
              <span style="font-size:10px;font-family:var(--mono);color:#ef9a9a;margin-left:auto">${F(awayTeam2)} ${awayTeam2} <strong>${Math.round((pickCounts[awayTeam2]||0)/totalPickers*100)}%</strong></span>`;
            return `<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border2)">
              <div style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.08em;margin-bottom:6px">PICK SPLIT (${totalPickers} picks)</div>
              <div style="display:flex;width:100%;height:10px;border-radius:0;overflow:hidden;gap:2px;background:rgba(255,255,255,0.06)">${segBar}</div>
              <div style="display:flex;align-items:center;margin-top:5px">${labels}</div>
            </div>`;
          })() : '';

          return `<div style="overflow-x:auto;margin-top:10px"><table style="width:100%;border-collapse:collapse;min-width:280px">
            <thead><tr style="border-bottom:1px solid rgba(255,255,255,0.1)">
              <th style="padding:4px 8px;text-align:left;font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400;white-space:nowrap">PLAYER</th>
              <th style="padding:4px 8px;text-align:left;font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400;white-space:nowrap">PICK</th>
              <th style="padding:4px 8px;text-align:center;font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400;white-space:nowrap">SCORE</th>
              <th style="padding:4px 8px;text-align:right;font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400;white-space:nowrap">PTS</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table></div>${resultBar}${confidenceBar}`;
        })();

    const roundShort = round.label.replace('Match Day ','MD').toUpperCase();
    const nameSize   = compact ? '16px' : '20px';
    const uid = `picks-${match.id}`;

    // Compact (previous): collapsed by default, click header to expand
    if (compact) {
      const scoreStr = hasResult
        ? `<span style="font-family:var(--mono);font-size:13px;color:#66bb6a;font-weight:700">${result.score_home} – ${result.score_away}</span>`
        : '';
      return `<div class="card" style="border-color:${cardBorder};margin-bottom:8px;padding:0">
        <div onclick="var d=document.getElementById('${uid}');var a=document.getElementById('${uid}-arrow');if(d.style.display==='none'){d.style.display='block';a.textContent='▲';}else{d.style.display='none';a.textContent='▼';}"
          style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;user-select:none">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1">
            <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">${roundShort} · ${koStr}</span>
            <span style="font-size:15px;font-family:var(--display);letter-spacing:0.04em">${F(homeTeam)} ${homeTeam} <span style="color:var(--muted);font-size:11px">vs</span> ${F(awayTeam)} ${awayTeam}</span>
            ${scoreStr}
            ${statusBadge}
          </div>
          <span id="${uid}-arrow" style="color:var(--muted);font-size:11px;margin-left:12px;flex-shrink:0">▼</span>
        </div>
        <div id="${uid}" style="display:none;padding:0 16px 14px">
          ${picksTableHtml}
        </div>
      </div>`;
    }

    // Live / full: always expanded
    return `<div class="card" style="border-color:${cardBorder};margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:4px">
        <span style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.07em">${roundShort} · ${koStr}</span>
        ${statusBadge}
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px">
        <span style="font-size:${nameSize};font-family:var(--display);letter-spacing:0.05em">${F(homeTeam)} ${homeTeam}</span>
        <span style="color:var(--muted);font-size:11px;font-family:var(--mono)">VS</span>
        <span style="font-size:${nameSize};font-family:var(--display);letter-spacing:0.05em">${F(awayTeam)} ${awayTeam}</span>
      </div>
      ${picksTableHtml}
    </div>`;
  };

  // ── Live Now section ──────────────────────────────────────────
  const liveSection = windowMatches.length ? `
    <div style="margin-bottom:16px">
      <div style="font-family:var(--display);font-size:22px;letter-spacing:0.08em;color:var(--text);margin-bottom:10px">🔴 LIVE NOW</div>
      ${windowMatches.map(m => buildCard(m, false)).join('')}
    </div>` : '';

  // ── Recent Matches section (last 3, dashboard only) ──────────
  let prevSection = '';
  if (previousMatches.length) {
    prevSection = `
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-family:var(--display);font-size:22px;letter-spacing:0.08em;color:var(--text)">📋 RECENT MATCHES</div>
          <button class="btn btn-sm btn-outline" onclick="S.page='history';render()">View All →</button>
        </div>
        ${previousMatches.map(m => buildCard(m, true)).join('')}
      </div>`;
  }

  return liveSection + prevSection;
}

// ── Bonus Question Recap ────────────────────────────────────────────
// Returns HTML for a single round's bonus results recap (all questions + everyone's answers).
// Used both in the dashboard inter-round card and in Match History.
function renderBonusRecap(rid, opts = {}) {
  const { compact = false } = opts;
  const round = ROUNDS[rid];
  if (!round) return '';
  const questions = getActiveQuestions(rid);
  const answeredQs = questions.filter(bq => S.bonusResults[rid]?.[bq.id]?.answer);
  if (!answeredQs.length) return '';

  const players = S.profiles.filter(p => !p.is_admin);
  const { bonus: bMult } = getMultipliers(rid);

  const qBlocks = answeredQs.map(bq => {
    const correctAnswer = S.bonusResults[rid][bq.id].answer;
    const isOU  = bq.type === 'overunder';
    const isMCQ = bq.type === 'multicheck';
    const hasWager = bq.wager === true;
    const { correctSet: recapCS, wrongSet: recapWS } = isMCQ ? parseMcResult(correctAnswer) : { correctSet: new Set(), wrongSet: new Set() };

    const rows = players.map(p => {
      const ua   = S.bonusAnswers[p.id]?.[rid]?.[bq.id];
      const name = p.nickname || p.name || '—';
      if (!ua?.answer) {
        return `<tr>
          <td style="padding:5px 8px;font-size:12px;color:var(--text)">${name}</td>
          <td style="padding:5px 8px;font-size:12px;color:var(--faint);font-style:italic" colspan="2">No answer</td>
        </tr>`;
      }
      const ans = ua.answer;
      const stake = hasWager ? (Number(ua.wager) || 0) : (bq.pts * bMult);
      let pts = 0, correct = false;
      if (isMCQ) {
        const picked = new Set(ans.split(',').map(s=>s.trim()).filter(Boolean));
        let mcPts = 0;
        for (const p of picked) {
          if (recapCS.has(p)) mcPts += 2;
          else if (recapWS.has(p)) mcPts -= 1;
        }
        pts = mcPts * bMult;
        correct = pts > 0;
      } else if (isOU) {
        if (ans === 'Abstain') { pts = 0; correct = false; }
        else if (ans === correctAnswer) { pts = stake; correct = true; }
        else { pts = -stake; correct = false; }
      } else {
        correct = ans === correctAnswer;
        pts = correct ? stake : 0;
      }
      const ptsStr = pts > 0
        ? `<span style="color:#66bb6a;font-family:var(--mono);font-weight:700">+${pts}</span>`
        : pts < 0
          ? `<span style="color:#ef5350;font-family:var(--mono);font-weight:700">${pts}</span>`
          : `<span style="color:var(--faint);font-family:var(--mono)">0</span>`;
      let ansDisplay = ans;
      if (isMCQ) {
        ansDisplay = ans.split(',').map(s => s.trim()).filter(Boolean).map(p =>
          recapCS.has(p) ? `<span style="color:#66bb6a">${p} ✓</span>`
          : recapWS.has(p) ? `<span style="color:#ef5350">${p} ✗</span>`
          : `<span style="color:var(--muted)">${p} ⏳</span>`
        ).join(', ');
      }
      const ansColor = isMCQ ? 'var(--text)' : correct ? '#66bb6a' : isOU && ans === 'Abstain' ? 'var(--muted)' : '#ef5350';
      const wagerNote = hasWager && ua.wager ? `<span style="font-size:9px;color:var(--muted);font-family:var(--mono)"> (w:${ua.wager})</span>` : '';
      return `<tr style="border-top:1px solid var(--border2)">
        <td style="padding:5px 8px;font-size:12px;color:var(--text)">${name}</td>
        <td style="padding:5px 8px;font-size:12px;color:${ansColor};font-weight:${correct?'700':'400'}">${ansDisplay}${wagerNote}</td>
        <td style="padding:5px 8px;text-align:right">${ptsStr}</td>
      </tr>`;
    }).join('');

    const answerLabel = isMCQ
      ? [...recapCS].map(o=>`<span style="color:#66bb6a">${o} ✓</span>`).join(' ') + (recapWS.size ? ' ' + [...recapWS].map(o=>`<span style="color:#ef5350">${o} ✗</span>`).join(' ') : '') + ((!recapCS.size && !recapWS.size) ? '<span style="color:var(--muted)">pending</span>' : '')
      : `<span style="font-size:13px;font-weight:700;color:var(--gold);font-family:var(--display)">${correctAnswer}</span>`;

    return `<div style="margin-bottom:${compact?'10':'14'}px">
      <div style="font-size:12px;color:var(--text);line-height:1.4;margin-bottom:5px">${bq.text}</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">
        <span style="font-size:9px;letter-spacing:0.08em;color:var(--muted);font-family:var(--mono)">ANSWER</span>
        ${answerLabel}
        <span style="font-size:9px;color:var(--muted);font-family:var(--mono)">${bq.pts} pts${hasWager?' (wager)':''}</span>
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="border-bottom:1px solid var(--border)">
            <th style="padding:4px 8px;text-align:left;font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400">PLAYER</th>
            <th style="padding:4px 8px;text-align:left;font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400">ANSWER</th>
            <th style="padding:4px 8px;text-align:right;font-size:10px;color:var(--muted);font-family:var(--mono);font-weight:400">PTS</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  });

  return qBlocks.join(`<div style="border-top:1px solid var(--border2);margin:${compact?'10':'14'}px 0"></div>`);
}

// ── Bonus Guess Distribution (visible after lock, current round only) ──
function renderGuessDistribution() {
  const players = S.profiles.filter(p => !p.is_admin);
  const total = players.length || 1;

  // Find the most recent round that is bonus-locked and has at least one answer
  const lockedRounds = Object.values(ROUNDS).filter(round => {
    if (!isBonusLocked(round.id)) return false;
    const qs = getActiveQuestions(round.id);
    return qs.some(bq => players.some(p => S.bonusAnswers[p.id]?.[round.id]?.[bq.id]?.answer));
  });
  if (!lockedRounds.length) return '';
  // Use the most recent locked round (last by first-match kickoff)
  const round = lockedRounds.sort((a, b) => {
    const ka = new Date(getKickoff(a.matches[0]?.id, a.matches[0]?.kickoff) || 0).getTime();
    const kb = new Date(getKickoff(b.matches[0]?.id, b.matches[0]?.kickoff) || 0).getTime();
    return ka - kb;
  })[lockedRounds.length - 1];

  const blocks = [round].map(round => {
    const qs = getActiveQuestions(round.id);
    if (!qs.length) return null;

    const qBlocks = qs.map(bq => {
      const isMCQ = bq.type === 'multicheck';
      const isOU  = bq.type === 'overunder';
      const opts  = isOU ? ['Over','Under','Abstain'] : bq.opts;
      const ouColors = { Over:'#90caf9', Under:'#ef9a9a', Abstain:'rgba(255,255,255,0.2)' };
      const barColor = isMCQ ? '#ce93d8' : isOU ? null : 'var(--gold)';

      let bars;
      if (isMCQ) {
        const counts = {};
        opts.forEach(o => counts[o] = 0);
        players.forEach(p => {
          (S.bonusAnswers[p.id]?.[round.id]?.[bq.id]?.answer || '')
            .split(',').map(s => s.trim()).filter(Boolean)
            .forEach(o => { if (o in counts) counts[o]++; });
        });
        bars = opts.map(o => {
          const n = counts[o]; const pct = Math.round((n / total) * 100);
          return `<div style="margin-bottom:5px">
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px">
              <span style="color:var(--text)">${o}</span>
              <span style="color:var(--muted);font-family:var(--mono)">${n}/${total}</span>
            </div>
            <div style="height:5px;background:var(--bg2);border:1px solid var(--border2);position:relative">
              <div style="position:absolute;left:0;top:0;bottom:0;background:#ce93d8;width:${pct}%"></div>
            </div>
          </div>`;
        }).join('');
      } else {
        const counts = {};
        opts.forEach(o => counts[o] = 0);
        players.forEach(p => {
          const a = S.bonusAnswers[p.id]?.[round.id]?.[bq.id]?.answer;
          if (a && a in counts) counts[a]++;
        });
        bars = opts.map(o => {
          const n = counts[o]; const pct = Math.round((n / total) * 100);
          const c = barColor || ouColors[o];
          return `<div style="margin-bottom:5px">
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px">
              <span style="color:${isOU ? (ouColors[o]||'var(--text)') : 'var(--text)'}">${o}</span>
              <span style="color:var(--muted);font-family:var(--mono)">${n}/${total}</span>
            </div>
            <div style="height:5px;background:var(--bg2);border:1px solid var(--border2);position:relative">
              <div style="position:absolute;left:0;top:0;bottom:0;background:${c};width:${pct}%"></div>
            </div>
          </div>`;
        }).join('');
      }

      const typeTag = isMCQ ? ` <span style="font-size:9px;color:#ce93d8;font-family:var(--mono)">[MULTI]</span>`
        : isOU ? ` <span style="font-size:9px;color:#90caf9;font-family:var(--mono)">[O/U]</span>` : '';
      return `<div style="margin-bottom:10px">
        <div style="font-size:11px;color:var(--text);margin-bottom:5px;line-height:1.3">${bq.text}${typeTag}</div>
        ${bars}
      </div>`;
    }).join('');

    return qBlocks || null;
  })[0];

  if (!blocks) return '';

  return `<div class="card" style="margin-bottom:16px">
    <details>
      <summary style="cursor:pointer;font-size:11px;color:var(--muted);letter-spacing:0.05em;user-select:none">
        📊 GUESS DISTRIBUTION — ${round.label.toUpperCase()}
      </summary>
      <div style="margin-top:12px">${blocks}</div>
    </details>
  </div>`;
}

// ── Live Bonus Trackers (admin-configurable progress for any bonus question) ──
function renderBonusTrackers() {
  const isAdminUser = !!S.profile?.is_admin;
  const rounds = Object.values(ROUNDS);

  const items = [];
  rounds.forEach(round => {
    const locked = isBonusLocked(round.id);
    // Non-admins only see locked rounds; admins can configure any round with questions
    if (!locked && !isAdminUser) return;
    getActiveQuestions(round.id).forEach(bq => {
      const resolved = !!S.bonusResults[round.id]?.[bq.id]?.answer;
      if (resolved) return;
      const prog = S.bonusProgress[round.id]?.[bq.id] || {};
      const enabled = !!prog.enabled;
      // Non-admins only see enabled trackers for locked rounds
      if (!isAdminUser && (!locked || !enabled)) return;
      items.push({ round, bq, prog, enabled, isOU: bq.type === 'overunder', isMCQ: bq.type === 'multicheck', locked });
    });
  });

  if (!items.length) return '';

  // ── Visible trackers (shown to everyone) — one card each ───────
  const visible = items.filter(it => it.enabled);
  const visibleCards = visible.map(({ round, bq, prog, isOU, isMCQ }) => {
    const isCounter = isOU || prog.mode === 'counter';
    let body;
    if (isMCQ) {
      // Checklist mode: show question's own options with ✓/✗
      const cl = prog.checklist || {};
      const opts = bq.opts || [];
      body = opts.length ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-top:8px">
        ${opts.map(o => {
          const ticked = !!cl[o];
          return `<div style="display:flex;align-items:center;gap:5px;font-size:12px;padding:2px 0">
            <span style="color:${ticked?'#66bb6a':'var(--muted)'};font-family:var(--mono);font-size:11px">${ticked?'✓':'✗'}</span>
            <span style="color:${ticked?'var(--text)':'var(--muted)'}">${o}</span>
          </div>`;
        }).join('')}
      </div>` : `<div style="font-size:10px;color:var(--muted);margin-top:8px">No options defined</div>`;
    } else if (isCounter) {
      const target  = Number(prog.target)  || 0;
      const current = Number(prog.current) || 0;
      if (target > 0) {
        const pct = Math.min(100, Math.max(0, (current / target) * 100));
        body = `
          <div class="tracker-big" style="font-size:36px;font-weight:700;color:var(--gold);font-family:var(--mono);line-height:1;margin:10px 0 8px">${current}<span style="font-size:16px;color:var(--muted)"> / ${target}</span></div>
          <div style="height:8px;background:var(--bg2);border:1px solid var(--border2);position:relative">
            <div style="position:absolute;left:0;top:0;bottom:0;background:var(--gold);width:${pct}%"></div>
          </div>`;
      } else if (prog.current !== '' && prog.current != null) {
        body = `<div class="tracker-big" style="font-size:40px;font-weight:700;color:var(--gold);font-family:var(--mono);line-height:1;margin:10px 0 4px">${current}</div>`;
      } else {
        body = `<div style="font-size:10px;color:var(--muted);margin-top:8px">Not yet tracked</div>`;
      }
    } else {
      if (prog.leader) {
        body = `<div style="font-size:22px;font-weight:700;color:var(--gold);font-family:var(--display);letter-spacing:0.03em;margin:10px 0 4px;word-break:break-word">${prog.leader}</div>${prog.note ? `<div style="font-size:11px;color:var(--muted);word-break:break-word">${prog.note.replace(/</g,'&lt;')}</div>` : ''}`;
      } else {
        body = `<div style="font-size:10px;color:var(--muted);margin-top:8px">Not yet tracked</div>`;
      }
    }
    return `<div class="card bonus-tracker-card" style="margin-bottom:16px">
      <div style="font-size:9px;letter-spacing:0.1em;color:var(--gold);font-family:var(--mono)">📊 ${round.label.toUpperCase()}</div>
      <div style="font-size:13px;color:var(--text);margin-top:4px;word-break:break-word">${bq.text}</div>
      ${body}
    </div>`;
  }).join('');

  // ── Admin management (collapsed by default) ───────────────────
  const manageHtml = isAdminUser ? (() => {
    const rows = items.map(({ round, bq, prog, enabled, isOU, isMCQ }) => {
      const optsList = isOU ? ['Over','Under'] : (bq.opts || []);
      const clData = prog.checklist || {};
      const checklistHtml = isMCQ ? (() => {
        const opts = bq.opts || [];
        const btns = opts.map(o => {
          const ticked = !!clData[o];
          return `<button data-action="mc-checklist-toggle" data-rid="${round.id}" data-qid="${bq.id}" data-opt="${o}"
            style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid;border-radius:2px;cursor:pointer;font-size:12px;font-family:inherit;
            ${ticked ? 'background:rgba(102,187,106,0.2);border-color:#66bb6a;color:#66bb6a' : 'background:transparent;border-color:rgba(255,255,255,0.2);color:var(--muted)'}">
            <span style="font-family:var(--mono);font-size:11px">${ticked ? '✓' : '✗'}</span>${o}
          </button>`;
        }).join('');
        return `<div style="margin-top:8px">
          <div style="font-size:10px;color:var(--muted);margin-bottom:5px;font-family:var(--mono)">CLICK OPTION TO TOGGLE HIT / NOT YET (saves instantly)</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${btns}</div>
        </div>`;
      })() : '';
      return `<div style="margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border2)">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
          <span style="font-size:12px;color:var(--text)">${bq.text}</span>
          <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">${round.label}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)">
            <input type="checkbox" data-action="bonus-progress-enabled" data-rid="${round.id}" data-qid="${bq.id}" ${enabled?'checked':''}> Show on dashboard
          </label>
          ${isOU || isMCQ ? '' : `
          <span class="wager-hint">Display:</span>
          <select data-action="bonus-progress-mode" data-rid="${round.id}" data-qid="${bq.id}"
            style="height:26px;background:rgba(232,213,163,.05);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;padding:0 6px;border-radius:0">
            <option value="leader" style="color:#000;background:#fff" ${prog.mode!=='counter'?'selected':''}>Leader</option>
            <option value="counter" style="color:#000;background:#fff" ${prog.mode==='counter'?'selected':''}>Counter</option>
          </select>
          `}
        </div>
        ${isMCQ ? checklistHtml : isOU || prog.mode === 'counter' ? `
        <div style="display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap">
          <span class="wager-hint">Current:</span>
          <input type="number" step="0.5" value="${prog.current ?? ''}" data-action="bonus-progress-current" data-rid="${round.id}" data-qid="${bq.id}"
            style="width:70px;max-width:100%;height:26px;background:rgba(232,213,163,.05);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;padding:0 6px;border-radius:0;box-sizing:border-box">
          <span class="wager-hint">Target:</span>
          <input type="number" step="0.5" value="${prog.target ?? ''}" data-action="bonus-progress-target" data-rid="${round.id}" data-qid="${bq.id}"
            style="width:70px;max-width:100%;height:26px;background:rgba(232,213,163,.05);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;padding:0 6px;border-radius:0;box-sizing:border-box">
        </div>` : `
        <div style="display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap">
          <span class="wager-hint">Leader:</span>
          <select data-action="bonus-progress-leader" data-rid="${round.id}" data-qid="${bq.id}"
            style="height:26px;max-width:100%;background:rgba(232,213,163,.05);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;padding:0 6px;border-radius:0;box-sizing:border-box">
            <option value="" style="color:#000;background:#fff">—</option>
            ${optsList.map(o => `<option value="${o.replace(/"/g,'&quot;')}" style="color:#000;background:#fff" ${prog.leader===o?'selected':''}>${o}</option>`).join('')}
          </select>
          <span class="wager-hint">Note:</span>
          <input type="text" value="${(prog.note ?? '').replace(/"/g,'&quot;')}" placeholder="optional detail" data-action="bonus-progress-note" data-rid="${round.id}" data-qid="${bq.id}"
            style="width:120px;max-width:100%;height:26px;background:rgba(232,213,163,.05);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;padding:0 6px;border-radius:0;box-sizing:border-box">
        </div>`}
        <div style="margin-top:6px">
          <button class="btn btn-sm btn-outline" data-action="save-bonus-progress" data-rid="${round.id}" data-qid="${bq.id}">Save</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="card" style="margin-bottom:16px">
      <details>
        <summary style="cursor:pointer;font-size:11px;color:var(--muted);letter-spacing:0.05em;user-select:none">⚙️ MANAGE TRACKERS (${items.length})</summary>
        <div style="margin-top:12px">${rows}</div>
      </details>
    </div>`;
  })() : '';

  if (!visible.length && !manageHtml) return '';

  return visibleCards + manageHtml;
}

function renderDashboard() {
  const lb      = getLeaderboard();
  const maxPts  = lb[0]?.total || 1;
  const medal   = r => ['🥇','🥈','🥉'][r-1] || `#${r}`;
  const getName = p => p?.nickname || p?.name || '—';

  const playedRounds = Object.values(ROUNDS).filter(round =>
    round.matches.some(m => S.results[round.id]?.[m.id]?.winner)
  );
  const lastRound = playedRounds[playedRounds.length - 1];

  let roundLeader = null, roundLeaderPts = 0;
  if (lastRound) {
    S.profiles.forEach(p => {
      const pts = calcRoundScore(p.id, lastRound.id);
      if (pts > roundLeaderPts) { roundLeaderPts = pts; roundLeader = p; }
    });
  }

  let mostCorrect = null, mostCorrectN = -1;
  let exactKing   = null, exactKingN   = -1;
  S.profiles.forEach(p => {
    const { correctPicks, exactScores } = calcScore(p.id);
    if (correctPicks > mostCorrectN) { mostCorrectN = correctPicks; mostCorrect = p; }
    if (exactScores  > exactKingN)   { exactKingN   = exactScores;  exactKing   = p; }
  });

  const statsCards = [
    { icon:'👥', value: S.profiles.length,  label:'Total Players', color:'#1565c0' },
    { icon:'🥇', value: getName(lb[0]),      label:'Leader',        color:'#b8860b' },
    { icon:'⚡', value: lb[0]?.total ?? 0,   label:'Top Score',     color:'#2e7d32' },
    { icon:'📅', value: playedRounds.length, label:'Rounds Played', color:'#6a1b9a' },
  ].map(s => `<div class="stat-card">
    <div class="stat-icon">${s.icon}</div>
    <div class="stat-value" style="color:${s.color}">${s.value}</div>
    <div class="stat-label">${s.label}</div>
  </div>`).join('');

  // ── Top 3 Podium (tie-aware) ──────────────────────────────────
  const podiumHtml = lb.length ? (() => {
    const rankStyle = {
      1: { icon:'🥇', size:'26px', color:'#FFD700', bg:'rgba(255,215,0,0.08)'   },
      2: { icon:'🥈', size:'22px', color:'#C0C0C0', bg:'rgba(192,192,192,0.06)' },
      3: { icon:'🥉', size:'20px', color:'#CD7F32', bg:'rgba(205,127,50,0.06)'  },
    };
    // Collect players at rank 1, 2, 3 — max 3 shown even with ties
    const slots = lb.filter(p => p.rank <= 3).slice(0, 3);
    const cards = slots.map(p => {
      const { icon, size, color, bg } = rankStyle[p.rank] || rankStyle[3];
      return `<div style="flex:1;min-width:90px;background:${bg};border:1px solid ${color}22;padding:14px 10px;text-align:center">
        <div style="font-size:${size};margin-bottom:4px">${icon}</div>
        <div style="font-family:var(--display);font-size:16px;letter-spacing:0.05em;color:var(--text);margin-bottom:2px;word-break:break-word">${getName(p)}</div>
        <div style="font-size:20px;font-weight:700;color:${color};font-family:var(--mono)">${p.total}</div>
        <div style="font-size:10px;color:var(--muted);font-family:var(--mono)">PTS</div>
      </div>`;
    }).join('');
    return `<div class="card" style="margin-bottom:16px">
      <div class="card-title">🏆 Standings</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${cards}</div>
    </div>`;
  })() : '';

  // ── Next Match card ───────────────────────────────────────────
  const nextMatchCard = (() => {
    const now2 = Date.now();
    const upcoming = Object.values(ROUNDS)
      .filter(r => r.special !== 'pretournament')
      .flatMap(r => r.matches.map(m => ({ round: r, match: m, kickoff: getKickoff(m.id, m.kickoff) })))
      .filter(({ kickoff }) => kickoff && new Date(kickoff).getTime() > now2)
      .sort((a, b) => new Date(a.kickoff).getTime() - new Date(b.kickoff).getTime())[0];

    if (!upcoming) return `<div class="highlight-card"><div class="highlight-label">⏱️ Next Match</div><div style="color:var(--muted);font-size:12px">No upcoming matches</div></div>`;
    const ko = new Date(upcoming.kickoff);
    const diff = ko.getTime() - now2;
    const totalMins = Math.floor(diff / 60000);
    const hrs = Math.floor(totalMins / 60), mins = totalMins % 60;
    const days = Math.floor(hrs / 24);
    const countdown = days >= 1 ? `in ${days}d ${hrs%24}h` : hrs >= 1 ? `in ${hrs}h ${mins}m` : `in ${mins}m`;
    const koStr = ko.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    const home = getBracketTeam(upcoming.match.id,'home',upcoming.match.home);
    const away = getBracketTeam(upcoming.match.id,'away',upcoming.match.away);
    return `<div class="highlight-card">
      <div class="highlight-label">⏱️ Next Match</div>
      <div style="text-align:center;padding:4px 0">
        <div style="font-size:13px;color:var(--text);margin-bottom:6px;font-family:var(--display);letter-spacing:0.04em">${F(home)} ${home} vs ${F(away)} ${away}</div>
        <div style="font-size:18px;font-weight:700;color:var(--gold);font-family:var(--mono);margin-bottom:2px">${countdown}</div>
        <div style="font-size:10px;color:var(--muted);font-family:var(--mono)">${koStr}</div>
      </div>
    </div>`;
  })();

  const hlCard = (icon, title, player, stat) => `<div class="highlight-card">
    <div class="highlight-label">${icon} ${title}</div>
    ${player
      ? `<div class="highlight-name">${getName(player)}</div><div class="highlight-stat">${stat}</div>`
      : `<div style="color:var(--muted);font-size:12px">No data yet</div>`}
  </div>`;

  // ── Points by Round (includes PT if any PT results exist) ─────
  const ptHasResults = Object.keys(S.bonusResults['pt'] || {}).length > 0;
  const roundsForTable = [
    ...(ptHasResults ? [ROUNDS.pt] : []),
    ...playedRounds,
  ];
  let roundsTableHtml = '';
  if (roundsForTable.length > 0) {
    const headerCells = roundsForTable.map(r =>
      `<th title="${r.label}">${r.id === 'pt' ? 'PRE' : r.id.toUpperCase()}</th>`
    ).join('');
    const rows = lb.map(p => {
      const cells = roundsForTable.map(r =>
        `<td style="color:#90caf9">${calcRoundScore(p.id, r.id)}</td>`
      ).join('');
      return `<tr>
        <td>${getName(p)}</td>${cells}
        <td style="color:var(--green);font-weight:700">${p.total}</td>
      </tr>`;
    }).join('');
    roundsTableHtml = `<div class="card" style="margin-top:4px">
      <div class="card-title">📊 Points by Round</div>
      <div style="overflow-x:auto">
        <table class="rounds-table">
          <thead><tr>
            <th>Player</th>${headerCells}<th style="color:var(--gold)">Total</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }

  const liveSection = renderLiveMatches();

  const isAdminUser = !!S.profile?.is_admin;
  const noticeBoardHtml = (() => {
    const txt = S.noticeBoard || '';
    if (!txt && !isAdminUser) return '';
    if (isAdminUser) {
      // Admin sees editable card
      return `<div class="card" style="border-color:rgba(232,213,163,0.35);margin-bottom:16px" id="notice-board-card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span class="card-title" style="margin:0">📋 Notice Board</span>
          <span style="font-family:var(--mono);font-size:9px;letter-spacing:0.1em;color:var(--gold);border:1px solid rgba(232,213,163,0.35);padding:2px 7px">ADMIN</span>
        </div>
        <textarea id="notice-board-input" rows="3" placeholder="Write a notice for all players… (leave empty to hide)"
          style="width:100%;box-sizing:border-box;background:var(--bg2);border:1px solid var(--border2);color:var(--text);
                 font-size:13px;padding:10px 12px;resize:vertical;font-family:inherit;border-radius:0;outline:none"
        >${txt.replace(/</g,'&lt;')}</textarea>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
          <button class="btn btn-sm btn-gold" data-action="save-notice">Save Notice</button>
          <button class="btn btn-sm btn-outline" data-action="clear-notice" style="opacity:0.7">Clear</button>
          <span id="notice-save-status" style="font-size:11px;color:var(--muted)"></span>
        </div>
      </div>`;
    }
    // Regular players see a read-only notice
    return `<div class="card" style="border-color:rgba(232,213,163,0.35);margin-bottom:16px">
      <div class="card-title">📋 Notice Board</div>
      <div style="font-size:13px;line-height:1.6;white-space:pre-wrap;color:var(--text)">${txt.replace(/</g,'&lt;')}</div>
    </div>`;
  })();

  const bonusTrackersHtml  = renderBonusTrackers();
  const guessDistHtml      = renderGuessDistribution();

  // ── Most Positions Gained card ────────────────────────────────────
  const moveCardHtml = (() => {
    // Skip round 1 — everyone starts tied at rank 1, so position gains are meaningless
    const moveRounds = playedRounds.slice(1);
    if (!moveRounds.length) return '';
    if (!S.activeMoveRound || !ROUNDS[S.activeMoveRound] || !moveRounds.find(r => r.id === S.activeMoveRound)) {
      S.activeMoveRound = moveRounds[moveRounds.length - 1].id;
    }
    const players = S.profiles.filter(p => !p.is_admin);

    // Build per-round position gains for each player
    const roundGains = (rid) => {
      // Points before this round = total - this round's pts
      const prevTotals = players.map(p => ({ p, prev: calcScore(p.id).total - calcRoundScore(p.id, rid) }));
      const currTotals = players.map(p => ({ p, curr: calcScore(p.id).total }));
      prevTotals.sort((a, b) => b.prev - a.prev);
      currTotals.sort((a, b) => b.curr - a.curr);
      const prevRank = {}, currRank = {};
      prevTotals.forEach((x, i) => { prevRank[x.p.id] = i + 1; });
      currTotals.forEach((x, i) => { currRank[x.p.id] = i + 1; });
      return players.map(p => ({
        p,
        gain: prevRank[p.id] - currRank[p.id], // positive = moved up
        prev: prevRank[p.id],
        curr: currRank[p.id],
        roundPts: calcRoundScore(p.id, rid),
      })).sort((a, b) => b.gain - a.gain || b.roundPts - a.roundPts);
    };

    const pills = moveRounds.map(r => {
      const active = r.id === S.activeMoveRound;
      const short = r.label.replace('Group Stage – ', '').replace('Matchday ', 'MD');
      return `<button class="pill${active ? ' active' : ''}" data-action="move-round-pill" data-rid="${r.id}" style="font-size:11px;padding:4px 10px">${short}</button>`;
    }).join('');

    const gains = roundGains(S.activeMoveRound);
    const getName = p => p?.nickname || p?.name || '—';
    const rows = gains.map((g, i) => {
      const gainStr = g.gain > 0 ? `<span style="color:#66bb6a;font-weight:700">▲${g.gain}</span>`
                    : g.gain < 0 ? `<span style="color:#ef5350;font-weight:700">▼${Math.abs(g.gain)}</span>`
                    : `<span style="color:var(--muted)">—</span>`;
      const bg = i === 0 && g.gain > 0 ? 'background:rgba(102,187,106,0.08);' : '';
      const crown = i === 0 && g.gain > 0 ? ' 🚀' : '';
      return `<tr style="${bg}">
        <td style="padding:6px 8px;color:var(--muted);font-family:var(--mono);font-size:12px">#${g.curr}</td>
        <td style="padding:6px 8px;font-size:13px">${getName(g.p)}${crown}</td>
        <td style="padding:6px 8px;text-align:center;font-family:var(--mono)">${gainStr}</td>
        <td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)">${g.prev}→${g.curr}</td>
        <td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-size:12px;color:#66bb6a">+${g.roundPts}</td>
      </tr>`;
    }).join('');

    const open = S.moveCardOpen;
    return `<div class="card" style="margin-bottom:16px">
      <div data-action="toggle-move-card" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none">
        <div class="card-title" style="margin-bottom:0">🚀 Most Positions Gained</div>
        <span style="font-size:12px;color:var(--muted);font-family:var(--mono)">${open ? '▲' : '▼'}</span>
      </div>
      ${open ? `
      <div style="margin-top:12px">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${pills}</div>
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse">
            <thead><tr style="border-bottom:1px solid var(--border)">
              <th style="padding:4px 8px;text-align:left;font-size:11px;color:var(--muted);font-weight:600">Rank</th>
              <th style="padding:4px 8px;text-align:left;font-size:11px;color:var(--muted);font-weight:600">Player</th>
              <th style="padding:4px 8px;text-align:center;font-size:11px;color:var(--muted);font-weight:600">Move</th>
              <th style="padding:4px 8px;text-align:right;font-size:11px;color:var(--muted);font-weight:600">Pos</th>
              <th style="padding:4px 8px;text-align:right;font-size:11px;color:var(--muted);font-weight:600">Pts</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>` : ''}
    </div>`;
  })();

  // ── Bonus Recap cards (shown during inter-round gap) ─────────────
  const bonusRecapCardsHtml = (() => {
    const now = Date.now();
    const roundIds = Object.keys(ROUNDS).filter(r => ROUNDS[r].special !== 'pretournament');
    const cards = [];
    for (let i = 0; i < roundIds.length; i++) {
      const rid = roundIds[i];
      const round = ROUNDS[rid];
      // Must have bonus results to show recap
      if (!Object.keys(S.bonusResults[rid] || {}).length) continue;
      // All matches in this round must have kicked off (round is fully done)
      const allDone = round.matches.every(m => {
        const ko = getKickoff(m.id, m.kickoff);
        return ko && now >= new Date(ko).getTime() - 3600000;
      });
      if (!allDone) continue;
      // Next round's first match must NOT have kicked off yet (we're in the gap)
      const nextRid = roundIds[i + 1];
      if (nextRid) {
        const nextRound = ROUNDS[nextRid];
        const firstM = nextRound?.matches[0];
        const nextKo = firstM ? getKickoff(firstM.id, firstM.kickoff) : null;
        if (nextKo && now >= new Date(nextKo).getTime() - 3600000) continue; // next round started
      }
      const recapBody = renderBonusRecap(rid);
      if (!recapBody) continue;
      const open = S.bonusRecapOpen[rid] !== false; // default open
      cards.push(`<div class="card" style="margin-bottom:16px;border-color:rgba(232,213,163,0.3)">
        <div data-action="toggle-bonus-recap" data-rid="${rid}"
          style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none">
          <div>
            <div class="card-title" style="margin-bottom:2px">🎯 Bonus Recap</div>
            <div style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.06em">${round.label.toUpperCase()}</div>
          </div>
          <span style="font-size:12px;color:var(--muted);font-family:var(--mono)">${open ? '▲' : '▼'}</span>
        </div>
        ${open ? `<div style="margin-top:14px">${recapBody}</div>` : ''}
      </div>`);
    }
    return cards.join('');
  })();

  return `
    <div class="page-title">Dashboard</div>
    ${noticeBoardHtml}
    <div class="dashboard-grid">
      <div class="dashboard-main">
        <div class="stat-grid">${statsCards}</div>
        ${liveSection}
        ${podiumHtml}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
          ${hlCard('⚡', 'Round Leader', roundLeader,
              lastRound ? `${roundLeaderPts} pts in ${lastRound.label.replace('Group Stage – ','')}` : '')}
          ${hlCard('🎯', 'Most Correct Picks', mostCorrect,
              mostCorrect ? `${mostCorrectN} correct picks` : '')}
          ${hlCard('🔮', 'Exact Score King', exactKing,
              exactKing ? `${exactKingN} exact scores` : '')}
          ${nextMatchCard}
        </div>
        ${moveCardHtml}
        ${bonusRecapCardsHtml}
        ${roundsTableHtml}
      </div>
      ${(bonusTrackersHtml || guessDistHtml) ? `<div class="dashboard-side">${guessDistHtml}${bonusTrackersHtml}</div>` : ''}
    </div>`;
}

// ── Bracket ───────────────────────────────────────────────────────
function renderBracket() {
  const dark = S.darkMode;
  const clr = {
    bg:      dark ? '#0d1f3c' : '#ffffff',
    bgPage:  dark ? '#0a1628' : '#eef1f5',
    border:  dark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.12)',
    winFill: dark ? 'rgba(46,125,50,0.55)'  : 'rgba(76,175,80,0.25)',
    line:    dark ? '#1e3a5f' : '#c0cfe0',
    text:    dark ? '#ffffff' : '#1a2a40',
    text2:   dark ? '#888888' : '#666666',
    text3:   dark ? '#555555' : '#999999',
    win:     '#66bb6a',
    res:     dark ? 'rgba(102,187,106,0.35)' : 'rgba(76,175,80,0.35)',
  };

  const trunc = t => {
    const s = t || 'TBD';
    return s.length > 13 ? s.slice(0, 12) + '…' : s;
  };

  const res = (rid, mid) => S.results[rid]?.[mid] || {};

  // ── Box renderer ─────────────────────────────────────────────
  const BW = 132, BH = 44, HALF = BH / 2;
  const box = (x, cy, home, away, rid, mid, label) => {
    const r = res(rid, mid);
    const hw = r.winner === home;
    const aw = r.winner === away;
    const top = cy - HALF;
    const hasScore = r.score_home !== undefined && r.score_home !== '';
    return `
      ${label ? `<text x="${x + BW/2}" y="${top - 5}" text-anchor="middle" font-size="8"
        fill="${clr.text3}" font-family="Arial" letter-spacing="0.8" font-weight="bold">${label}</text>` : ''}
      <rect x="${x}" y="${top}" width="${BW}" height="${BH}" rx="6"
        fill="${clr.bg}" stroke="${r.winner ? clr.res : clr.border}" stroke-width="1"/>
      ${hw ? `<rect x="${x+1}" y="${top+1}" width="${BW-2}" height="${HALF-1}" rx="5" fill="${clr.winFill}"/>` : ''}
      ${aw ? `<rect x="${x+1}" y="${top+HALF}" width="${BW-2}" height="${HALF-1}" rx="5" fill="${clr.winFill}"/>` : ''}
      <line x1="${x}" y1="${top+HALF}" x2="${x+BW}" y2="${top+HALF}"
        stroke="${clr.border}" stroke-width="0.5"/>
      <text x="${x+7}" y="${top + HALF*0.72}" font-size="11"
        fill="${hw ? clr.win : clr.text}" font-weight="${hw ? 'bold' : 'normal'}"
        font-family="Arial">${trunc(home)}</text>
      ${hasScore ? `<text x="${x+BW-6}" y="${top + HALF*0.72}" font-size="11"
        fill="${hw ? clr.win : clr.text2}" text-anchor="end" font-family="Arial">${r.score_home}</text>` : ''}
      <text x="${x+7}" y="${top + HALF + HALF*0.72}" font-size="11"
        fill="${aw ? clr.win : clr.text}" font-weight="${aw ? 'bold' : 'normal'}"
        font-family="Arial">${trunc(away)}</text>
      ${hasScore ? `<text x="${x+BW-6}" y="${top + HALF + HALF*0.72}" font-size="11"
        fill="${aw ? clr.win : clr.text2}" text-anchor="end" font-family="Arial">${r.score_away}</text>` : ''}`;
  };

  // ── Connector renderer ───────────────────────────────────────
  const conn = (fx, y1, y2, tx, ty) => {
    const mx = fx + Math.round((tx - fx) * 0.45);
    return `
      <polyline points="${fx},${y1} ${mx},${y1} ${mx},${y2} ${mx},${ty} ${tx},${ty}"
        fill="none" stroke="${clr.line}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  };

  // ── Layout constants ─────────────────────────────────────────
  // R16 y-centres (8 matches, 70px apart starting at 35)
  const r16Y = [35,105,175,245,315,385,455,525];
  const qfY  = r16Y.reduce((acc, _, i, a) => i%2===0 ? [...acc, (a[i]+a[i+1])/2] : acc, []);
  const sfY  = qfY.reduce( (acc, _, i, a) => i%2===0 ? [...acc, (a[i]+a[i+1])/2] : acc, []);
  const finY = (sfY[0] + sfY[1]) / 2;
  const SVG_H = 570, SVG_W = 800;
  const r16X = 4, qfX = 196, sfX = 388, finX = 580;

  const r16 = ROUNDS['r16'];
  const qf  = ROUNDS['qf'];
  const sf  = ROUNDS['sf'];
  const fin = ROUNDS['final'];

  // ── Round column labels ──────────────────────────────────────
  const colLabel = (x, label) =>
    `<text x="${x + BW/2}" y="14" text-anchor="middle" font-size="10"
      fill="${clr.text3}" font-family="Arial" font-weight="bold" letter-spacing="0.5">${label}</text>`;

  let svgBody = '';
  svgBody += colLabel(r16X,  'ROUND OF 16');
  svgBody += colLabel(qfX,   'QUARTER-FINALS');
  svgBody += colLabel(sfX,   'SEMI-FINALS');
  svgBody += colLabel(finX,  'FINAL');

  // R16 matches
  r16.matches.forEach((m, i) => {
    svgBody += box(r16X, r16Y[i], getBracketTeam(m.id,'home',m.home), getBracketTeam(m.id,'away',m.away), 'r16', m.id, '');
  });

  // R16 → QF connectors + QF boxes
  qf.matches.forEach((m, i) => {
    svgBody += conn(r16X + BW, r16Y[i*2], r16Y[i*2+1], qfX, qfY[i]);
    svgBody += box(qfX, qfY[i], getBracketTeam(m.id,'home',m.home), getBracketTeam(m.id,'away',m.away), 'qf', m.id, '');
  });

  // QF → SF connectors + SF boxes
  sf.matches.forEach((m, i) => {
    svgBody += conn(qfX + BW, qfY[i*2], qfY[i*2+1], sfX, sfY[i]);
    svgBody += box(sfX, sfY[i], getBracketTeam(m.id,'home',m.home), getBracketTeam(m.id,'away',m.away), 'sf', m.id, '');
  });

  // SF → Final connector + Final box
  const finalM = fin.matches.find(m => m.id === 'finalm1') || fin.matches[0];
  svgBody += conn(sfX + BW, sfY[0], sfY[1], finX, finY);
  svgBody += box(finX, finY, getBracketTeam(finalM.id,'home',finalM.home), getBracketTeam(finalM.id,'away',finalM.away), 'final', finalM.id, '🏆 FINAL');

  const bracketSvg = `
    <div style="overflow-x:auto;background:${clr.bgPage};border-radius:12px;border:1px solid ${clr.border};padding:16px">
      <svg viewBox="0 0 ${SVG_W} ${SVG_H}" width="100%" style="min-width:560px;max-width:${SVG_W}px;display:block">
        ${svgBody}
      </svg>
    </div>`;

  // ── 3rd place match card ─────────────────────────────────────
  const thirdM = fin.matches.find(m => m.id === 'finalm2');
  let thirdHtml = '';
  if (thirdM) {
    const r = res('final', thirdM.id);
    const ht = getBracketTeam(thirdM.id,'home',thirdM.home), at = getBracketTeam(thirdM.id,'away',thirdM.away);
    const hw = r.winner === ht, aw = r.winner === at;
    thirdHtml = `
      <div class="card" style="margin-top:16px;border-color:rgba(205,127,50,0.4)">
        <div class="card-title" style="color:#CD7F32">🥉 3rd Place Match</div>
        <div class="bracket-match ${r.winner?'has-result':''}">
          <div class="bracket-team ${hw?'winner':r.winner?'loser':''}">
            <span>${F(ht)} ${ht}</span>
            ${r.winner ? `<span class="bracket-score">${r.score_home??''}</span>` : ''}
          </div>
          <div class="bracket-vs">vs</div>
          <div class="bracket-team ${aw?'winner':r.winner?'loser':''}">
            <span>${F(at)} ${at}</span>
            ${r.winner ? `<span class="bracket-score">${r.score_away??''}</span>` : ''}
          </div>
        </div>
      </div>`;
  }

  // ── R32 compact grid ─────────────────────────────────────────
  const r32 = ROUNDS['r32'];
  const r32Html = `
    <div class="bracket-section" style="margin-bottom:20px">
      <div class="bracket-section-title">⚡ Round of 32</div>
      <div class="bracket-grid">
        ${r32.matches.map(m => {
          const r = res('r32', m.id);
          const ht = getBracketTeam(m.id,'home',m.home), at = getBracketTeam(m.id,'away',m.away);
          const hw = r.winner === ht, aw = r.winner === at;
          return `<div class="bracket-match ${r.winner?'has-result':''}">
            <div class="bracket-team ${hw?'winner':r.winner?'loser':''}">${F(ht)} ${ht}${r.winner?` <span class="bracket-score">${r.score_home??''}</span>`:''}</div>
            <div class="bracket-vs">vs</div>
            <div class="bracket-team ${aw?'winner':r.winner?'loser':''}">${F(at)} ${at}${r.winner?` <span class="bracket-score">${r.score_away??''}</span>`:''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;

  return `
    <div class="page-title">🏆 Tournament Bracket</div>
    ${r32Html}
    <div class="bracket-section">
      <div class="bracket-section-title">🏆 Knockout Bracket — R16 to Final</div>
      ${bracketSvg}
    </div>
    ${thirdHtml}`;
}

// ── Rules ─────────────────────────────────────────────────────────
function renderResults() {
  const isAdmin    = S.profile?.is_admin;
  const allRoundIds = Object.keys(ROUNDS).filter(rid => rid !== 'pt');

  // For regular users, only show rounds that have results entered.
  // Lock state is irrelevant here — a round appears once the admin has entered at least one result.
  const roundIds = isAdmin
    ? allRoundIds
    : allRoundIds.filter(r =>
        Object.values(S.results[r] || {}).some(res => res.winner) ||
        Object.values(S.bonusResults[r] || {}).some(res => res.answer)
      );

  // If the active round is now hidden, fall back to the first visible one
  if (!roundIds.includes(S.activeRound)) S.activeRound = roundIds[0] || null;
  const rid   = S.activeRound;
  const round = ROUNDS[rid];

  // Nothing visible yet for regular users
  if (!isAdmin && roundIds.length === 0) {
    return `
      <div class="page-title">📊 Results</div>
      <div class="card" style="text-align:center;padding:40px 20px">
        <div style="font-size:32px;margin-bottom:12px">⏳</div>
        <div style="color:var(--muted);font-size:14px">Results will appear here once the tournament begins.</div>
      </div>`;
  }

  const pills = roundIds.map(r => {
    const hasAny = Object.keys(S.results[r] || {}).length > 0;
    return `<button class="pill ${r===rid?'active':''}" data-r="${r}">${ROUNDS[r].label}${hasAny?' ✓':''}</button>`;
  }).join('');

  // Match results
  const matchRows = round.matches.map(m => {
    const r = S.results[rid]?.[m.id] || {};
    const homeTeam = getBracketTeam(m.id, 'home', m.home);
    const awayTeam = getBracketTeam(m.id, 'away', m.away);
    const hasResult = r.winner !== undefined && r.winner !== '';
    const hasScore  = r.score_home !== '' && r.score_home !== undefined && r.score_away !== '' && r.score_away !== undefined;

    const scoreStr = hasScore ? `${r.score_home} – ${r.score_away}` : '— : —';
    const winnerHighlight = (team) => {
      if (!hasResult) return `color:var(--text)`;
      return r.winner === team ? `color:var(--gold);font-weight:500` :
             r.winner === 'Draw' ? `color:#90caf9` : `color:var(--muted)`;
    };
    const drawBadge = hasResult && r.winner === 'Draw'
      ? `<span style="font-size:10px;font-family:var(--mono);color:#90caf9;border:1px solid #90caf9;padding:1px 6px;margin:0 6px">DRAW</span>` : '';

    const kickoffDate = (() => {
      const d = new Date(getKickoff(m.id, m.kickoff));
      return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
    })();

    return `<tr style="border-bottom:1px solid var(--border2)">
      <td style="padding:10px 8px;font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap">${kickoffDate}</td>
      <td style="padding:10px 8px;text-align:right;${winnerHighlight(homeTeam)}">${homeTeam}</td>
      <td style="padding:10px 12px;text-align:center;font-family:var(--mono);font-size:13px;white-space:nowrap">
        ${hasResult ? `<span style="color:var(--gold);font-weight:600">${scoreStr}</span>${drawBadge}` : `<span style="color:var(--muted)">${scoreStr}</span>`}
      </td>
      <td style="padding:10px 8px;${winnerHighlight(awayTeam)}">${awayTeam}</td>
    </tr>`;
  }).join('');

  // Bonus results
  const bonusQs = getActiveQuestions(rid);
  const bonusRows = bonusQs.map(bq => {
    const ans = S.bonusResults[rid]?.[bq.id]?.answer || '';
    return `<tr style="border-bottom:1px solid var(--border2)">
      <td style="padding:10px 8px;color:var(--muted);font-size:13px;line-height:1.5">${bq.text}</td>
      <td style="padding:10px 8px;text-align:right;white-space:nowrap">
        <span style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-right:8px">${bq.pts} pts</span>
        ${ans
          ? `<span style="color:var(--gold);font-family:var(--mono);font-size:12px;font-weight:600">${ans}</span>`
          : `<span style="color:var(--muted);font-size:12px;font-family:var(--mono)">—</span>`}
      </td>
    </tr>`;
  }).join('');

  const noMatches = round.matches.length === 0;

  return `
    <div class="page-title">📊 Results</div>
    <div class="pill-row">${pills}</div>

    <div class="card">
      <div class="card-title">${round.label} — Match Results</div>
      ${noMatches ? `<p style="color:var(--muted);font-size:13px">No matches in this round.</p>` : `
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:14px">
        <thead>
          <tr style="border-bottom:1px solid var(--border2)">
            <th style="padding:6px 8px;text-align:left;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:400">KICKOFF</th>
            <th style="padding:6px 8px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:400">HOME</th>
            <th style="padding:6px 8px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:400">SCORE</th>
            <th style="padding:6px 8px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:400">AWAY</th>
          </tr>
        </thead>
        <tbody>${matchRows}</tbody>
      </table>
      </div>`}
    </div>

    ${bonusQs.length > 0 ? `
    <div class="card">
      <div class="card-title">${round.label} — Bonus Questions</div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <tbody>${bonusRows}</tbody>
      </table>
      </div>
    </div>` : ''}`;
}

function getDefaultRulesText() {
  const winPts = S.ptSettings?.winnerPts ?? 10;
  return `⚽ Match Picks
Pick the winner of every match (Group Stage matches can also end in a Draw).

• Correct winner = 2 pts
• Exact final score = +1 pt — awarded independently of your winner pick
• Hedge bonus: if your predicted scoreline is correct but for the opposite team (e.g. you picked 3–1 and the result was 1–3), you still earn +1 pt — even if your winner pick was wrong. This does not count as an "exact score" for tiebreakers.

Maximum per match = 3 pts (2 for the winner + 1 for the scoreline).

⭐ Bonus Questions
Each round includes bonus questions worth a base number of points — ranging from 2 pts in early rounds up to 5 pts in the Final. Admins may also apply a bonus-points multiplier to a round, which scales all bonus question values for that round. Bonus questions for a round automatically lock 1 hour before that round's first match kicks off (admins can override this timing per round if needed).

There are two question styles, and an optional wager:

1. Normal — answer correctly to earn the question's points. Answering incorrectly earns 0 pts. No risk.
2. Over/Under — choose "Over", "Under", or "Abstain". Correct = +points. Incorrect = −points (you can lose points on these!). Abstain = 0 pts (always safe).

💰 Wagers
Some bonus questions allow you to wager your own point value (0–10) instead of the fixed amount:

• Normal + Wager — correct = +your wager, incorrect = 0 pts
• Over/Under + Wager — correct = +your wager, incorrect = −your wager, abstain = 0 pts

🏆 Pre-Tournament Picks
Before the tournament starts, predict the top 2 finishers (in order) for all 12 groups, plus the overall tournament winner.

• Correct team in the correct spot = 2 pts each
• Correct team but wrong spot (still in top 2) = 1 pt each
• Correct tournament winner = ${winPts} pts

Pre-tournament rounds may also include their own bonus questions, scored the same way as above.

🔒 Locks & Deadlines
• Each match locks for picks 1 hour before its scheduled kickoff (or earlier if manually locked by an admin).
• Bonus questions for a round lock 1 hour before that round's first match kicks off, unless an admin has set a custom override time.
• Registration may be closed by the admin after a set cutoff date — no new sign-ups are accepted after that point.

✅ Verified Badge
Players who have paid their entry fee are marked with a blue checkmark badge on the Leaderboard and their profile.

⚡ Multipliers
For certain rounds (typically later knockout stages), admins may apply a match-points and/or bonus-points multiplier to raise the stakes. When active, all match pick points and/or bonus question points earned in that round are multiplied accordingly.

🏆 Tiebreakers & Prizes
Final standings are ranked by:
1. Total points
2. Most correct match-winner picks
3. Most exact scores

If players remain tied after all tiebreakers, the prize for their combined positions is split evenly between them — e.g. a two-way tie for 1st splits the 1st + 2nd place prizes 50/50, a three-way tie for 1st splits 1st + 2nd + 3rd 33/33/33, and so on.

📊 Points Summary
⚽ Correct winner pick — 2 pts
🎯 Exact score (independent of winner) — +1 pt
🔄 Hedge (correct scoreline, swapped teams) — +1 pt
⭐ Bonus question (Normal), correct — base pts (or your wager)
⭐ Bonus question (Normal), incorrect — 0 pts
⭐ Bonus question (Over/Under), correct — +base pts (or +your wager)
⭐ Bonus question (Over/Under), incorrect — −base pts (or −your wager)
⭐ Bonus question (Over/Under), abstain — 0 pts
🏆 Pre-tournament group top-2, correct spot — 2 pts each
🏆 Pre-tournament group top-2, right team wrong spot — 1 pt each
🏆 Pre-tournament tournament winner — ${winPts} pts`;
}

function renderRules() {
  const isAdmin = S.profile?.is_admin;
  const editing = S.rulesEditing;
  const text = S.customRules ?? getDefaultRulesText();
  const hasCustom = S.customRules !== null;

  if (editing && isAdmin) {
    return `
      <div class="page-title">📋 Pool Rules</div>
      <div class="card">
        <div class="card-title" style="margin-bottom:10px">Edit Rules</div>
        <p style="color:var(--muted);font-size:12px;margin-bottom:14px;font-family:var(--mono);letter-spacing:.05em">
          Plain text only. Use blank lines to separate sections. All players see this.
        </p>
        <textarea id="rules-editor" class="input" style="min-height:420px;resize:vertical;font-size:13px;line-height:1.7;font-family:var(--sans)">${text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
        <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
          <button class="btn btn-gold" id="rules-save-btn">Save Rules</button>
          <button class="btn btn-outline" id="rules-cancel-btn">Cancel</button>
          ${hasCustom ? `<button class="btn btn-danger" id="rules-reset-btn" style="margin-left:auto">Reset to Default</button>` : ''}
        </div>
      </div>`;
  }

  // Render saved/default text — split on blank lines into paragraphs
  const sections = text.split(/\n{2,}/).map(block => {
    const lines = block.trim().split('\n');
    const heading = lines[0];
    const body = lines.slice(1).join('\n').trim();
    const isHeading = /^[⚽⭐💰🏆📊💀🎯]/.test(heading);
    if (isHeading) {
      return `
        <div style="margin-bottom:20px">
          <h3 style="color:var(--text);font-size:15px;margin-bottom:8px">${heading}</h3>
          ${body ? `<p style="color:var(--muted);font-size:14px;line-height:1.7;white-space:pre-line">${body}</p>` : ''}
        </div>`;
    }
    return `<p style="color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:16px;white-space:pre-line">${block.trim()}</p>`;
  }).join('');

  return `
    <div style="display:flex;align-items:baseline;gap:16px;margin-bottom:24px;flex-wrap:wrap">
      <div class="page-title" style="margin-bottom:0">📋 Pool Rules</div>
      ${isAdmin ? `
        <div style="display:flex;gap:8px;margin-left:auto">
          ${hasCustom ? `<span style="font-size:10px;font-family:var(--mono);color:var(--muted);align-self:center">custom</span>` : ''}
          <button class="btn btn-outline btn-sm" id="rules-edit-btn">✏️ Edit Rules</button>
        </div>` : ''}
    </div>
    <div class="card">${sections}</div>`;
}
