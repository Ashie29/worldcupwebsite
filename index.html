// 8. MAIN RENDER + EVENT DELEGATION
// ════════════════════════════════════════════════════════════════
let _rendering = false;
let _adminLoginInProgress = false;
function render() {
  if (_rendering) return; // prevent re-entrant renders
  _rendering = true;
  try {
    if (!S.user) { renderAuth(); return; }
    if (!S.profile?.is_admin && !S.isRegistered) { renderRegisterGate(); return; }
    let content = '';
    switch(S.page) {
      case 'dashboard':   content = renderDashboard(); break;
      case 'picks':       content = renderPicks(); break;
      case 'groups':      content = renderGroups(); break;
      case 'bracket':     content = renderBracket(); break;
      case 'leaderboard': content = renderLeaderboard(); break;
      case 'results':     content = renderResults(); break;
      case 'history':     content = renderHistory(); break;
      case 'ptpicks':     content = renderPtPicks(); break;
      case 'admin':       content = renderAdmin(); break;
      case 'rules':       content = renderRules(); break;
      case 'feedback':    content = renderFeedback(); break;
    }
    renderShell(content);
    attachEvents();
  } finally {
    _rendering = false;
  }
}

function attachEvents() {
  // Most Positions Gained toggle + round pill
  const moveCardEl = document.querySelector('[data-action="toggle-move-card"]');
  if (moveCardEl) moveCardEl.onclick = () => { S.moveCardOpen = !S.moveCardOpen; render(); };

  document.querySelectorAll('[data-action="toggle-bonus-recap"]').forEach(el => {
    el.onclick = () => {
      const rid = el.dataset.rid;
      S.bonusRecapOpen[rid] = S.bonusRecapOpen[rid] === false ? true : false;
      render();
    };
  });

  document.querySelectorAll('[data-action="move-round-pill"]').forEach(btn => {
    btn.onclick = () => { S.activeMoveRound = btn.dataset.rid; render(); };
  });

  // Round pill selectors
  document.querySelectorAll('[data-r]').forEach(btn => {
    btn.onclick = () => {
      S.activeRound = btn.dataset.r;
      // Remember per-admin-tab round selection so switching tabs doesn't lose your place
      if (S.page === 'admin' && S.adminTab) {
        S.adminTabRounds[S.adminTab] = btn.dataset.r;
      }
      render();
    };
  });

  // Avatar upload
  const avatarInput  = document.getElementById('avatar-file-input');
  const avatarStatus = document.getElementById('avatar-status');
  const avatarRemove = document.getElementById('avatar-remove-btn');

  if (avatarInput) {
    avatarInput.onchange = async () => {
      const file = avatarInput.files[0];
      if (!file) return;
      // 15 MB guard
      if (file.size > 15 * 1024 * 1024) {
        avatarStatus.style.color = 'var(--red)';
        avatarStatus.textContent = '✗ File too large (max 15 MB)';
        return;
      }
      avatarStatus.style.color = 'var(--muted)';
      avatarStatus.textContent = 'Processing…';
      try {
        // Use createObjectURL — no base64 intermediate, handles large originals fine
        const base64 = await new Promise((resolve, reject) => {
          const objectUrl = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(objectUrl);
            const SIZE = 256;
            const canvas = document.createElement('canvas');
            canvas.width = SIZE; canvas.height = SIZE;
            const ctx = canvas.getContext('2d');
            // Centre-crop to square
            const minDim = Math.min(img.width, img.height);
            const sx = (img.width  - minDim) / 2;
            const sy = (img.height - minDim) / 2;
            ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, SIZE, SIZE);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('Image load failed')); };
          img.src = objectUrl;
        });
        avatarStatus.textContent = 'Saving…';
        const { error } = await sb.from('profiles').update({ avatar_url: base64 }).eq('id', S.user.id);
        if (error) throw error;
        S.profile.avatar_url = base64;
        S.profiles = S.profiles.map(p => p.id === S.user.id ? { ...p, avatar_url: base64 } : p);
        avatarStatus.style.color = '#4CAF50';
        avatarStatus.textContent = '✓ Photo saved';
        render();
      } catch (err) {
        avatarStatus.style.color = 'var(--red)';
        avatarStatus.textContent = '✗ Upload failed — try again';
        console.error(err);
      }
    };
  }

  if (avatarRemove) {
    avatarRemove.onclick = async () => {
      if (!confirm('Remove your profile photo?')) return;
      avatarStatus.style.color = 'var(--muted)';
      avatarStatus.textContent = 'Removing…';
      try {
        const { error } = await sb.from('profiles').update({ avatar_url: null }).eq('id', S.user.id);
        if (error) throw error;
        S.profile.avatar_url = null;
        S.profiles = S.profiles.map(p => p.id === S.user.id ? { ...p, avatar_url: null } : p);
        render();
      } catch (err) {
        avatarStatus.style.color = 'var(--red)';
        avatarStatus.textContent = '✗ Failed — try again';
        console.error(err);
      }
    };
  }

  // Manual per-match lock toggles (admin only)
  document.querySelectorAll('[data-action="toggle-match-lock"]').forEach(btn => {
    btn.onclick = () => {
      const mid = btn.dataset.mid;
      if (S.manualMatchLocks[mid]) {
        delete S.manualMatchLocks[mid];
      } else {
        S.manualMatchLocks[mid] = true;
      }
      localStorage.setItem('wc26:manualMatchLocks', JSON.stringify(S.manualMatchLocks));
      render();
    };
  });

  document.querySelectorAll('[data-action="force-unlock-match"]').forEach(btn => {
    btn.onclick = () => {
      const mid = btn.dataset.mid;
      S.manualMatchUnlocks[mid] = true;
      delete S.manualMatchLocks[mid];
      localStorage.setItem('wc26:manualMatchUnlocks', JSON.stringify(S.manualMatchUnlocks));
      localStorage.setItem('wc26:manualMatchLocks', JSON.stringify(S.manualMatchLocks));
      render();
    };
  });

  document.querySelectorAll('[data-action="relock-match"]').forEach(btn => {
    btn.onclick = () => {
      const mid = btn.dataset.mid;
      delete S.manualMatchUnlocks[mid];
      localStorage.setItem('wc26:manualMatchUnlocks', JSON.stringify(S.manualMatchUnlocks));
      render();
    };
  });

  // Pre-tournament bonus question editor (inline in Admin Results tab)
  const ptAddBlankBtn = document.getElementById('pt-add-blank-q-btn');
  if (ptAddBlankBtn) {
    ptAddBlankBtn.onclick = () => {
      const qs = JSON.parse(JSON.stringify(getActiveQuestions('pt')));
      qs.push({ id: `ptq_${Date.now()}`, text: 'New question', pts: 2, opts: ['Yes', 'No'] });
      S.customBonusQs['pt'] = qs;
      saveCustomQuestions();
      render();
    };
  }

  document.querySelectorAll('[data-ptq-save]').forEach(btn => {
    btn.onclick = () => {
      const i  = Number(btn.dataset.ptqSave);
      const qs = JSON.parse(JSON.stringify(getActiveQuestions('pt')));
      const activeTags = [...document.querySelectorAll(`[data-ptq-tagbtn="${i}"].tag-active`)].map(b => b.dataset.tagId);
      qs[i] = {
        ...qs[i],
        text: document.querySelector(`[data-ptq-text="${i}"]`)?.value || qs[i].text,
        pts:  Number(document.querySelector(`[data-ptq-pts="${i}"]`)?.value) || qs[i].pts,
        opts: document.querySelector(`[data-ptq-opts="${i}"]`)?.value.split(',').map(o => o.trim()).filter(Boolean) || qs[i].opts,
        note: document.querySelector(`[data-ptq-note="${i}"]`)?.value.trim() || '',
        tags: activeTags,
      };
      S.customBonusQs['pt'] = qs;
      saveCustomQuestions();
      render();
    };
  });

  document.querySelectorAll('[data-ptq-tagbtn]').forEach(btn => {
    btn.onclick = () => btn.classList.toggle('tag-active');
  });

  document.querySelectorAll('[data-eq-tagbtn]').forEach(btn => {
    btn.onclick = () => btn.classList.toggle('tag-active');
  });

  document.querySelectorAll('[data-ptq-del]').forEach(btn => {
    btn.onclick = () => {
      const i  = Number(btn.dataset.ptqDel);
      const qs = JSON.parse(JSON.stringify(getActiveQuestions('pt')));
      qs.splice(i, 1);
      S.customBonusQs['pt'] = qs;
      saveCustomQuestions();
      render();
    };
  });

  document.querySelectorAll('[data-ptq-result]').forEach(sel => {
    sel.onchange = async () => {
      const qid = sel.dataset.qid;
      await upsertBonusResult('pt', qid, sel.value);
      render();
    };
  });

  // Admin: toggle paid status
  document.querySelectorAll('.admin-paid-toggle').forEach(btn => {
    btn.onclick = async () => {
      const uid     = btn.dataset.uid;
      const newPaid = btn.dataset.paid !== '1';
      btn.disabled  = true; btn.textContent = '…';
      const { error } = await sb.from('profiles').update({ paid: newPaid }).eq('id', uid);
      if (!error) {
        const p = S.profiles.find(p => p.id === uid);
        if (p) p.paid = newPaid;
        render();
      } else {
        btn.disabled = false; btn.textContent = '✗ Error';
      }
    };
  });

  // Admin: save points override per player
  document.querySelectorAll('.admin-pts-save').forEach(btn => {
    btn.onclick = async () => {
      const uid = btn.dataset.uid;
      const inp = document.querySelector(`.admin-pts-override[data-uid="${uid}"]`);
      const val = parseInt(inp?.value ?? 0, 10) || 0;
      btn.textContent = '…'; btn.disabled = true;
      const { error } = await sb.from('profiles').update({ points_override: val }).eq('id', uid);
      const profile = S.profiles.find(p => p.id === uid);
      if (profile) profile.points_override = val;
      btn.textContent = error ? '✗' : '✓'; btn.disabled = false;
      setTimeout(() => render(), 500);
    };
  });

  // Clear individual match pick
  document.querySelectorAll('[data-action="clear-pick"]').forEach(btn => {
    btn.onclick = async () => {
      const { rid, mid } = btn.dataset;
      await upsertPick(rid, mid, '', '', '');
      render();
    };
  });

  // Submit / confirm picks button
  const submitBtn = document.getElementById('submit-picks-btn');
  if (submitBtn) {
    submitBtn.onclick = async () => {
      const rid = submitBtn.dataset.rid;
      const round = ROUNDS[rid];
      const uid = S.user.id;
      const warnings = [];
      for (const m of round.matches) {
        const pick = S.picks[uid]?.[rid]?.[m.id] || {};
        const hasWinner = !!pick.winner;
        const hasHome   = pick.score_home !== '' && pick.score_home != null;
        const hasAway   = pick.score_away !== '' && pick.score_away != null;
        const started   = hasWinner || hasHome || hasAway;
        if (!started) continue;
        const homeTeam = getBracketTeam(m.id, 'home', m.home);
        const awayTeam = getBracketTeam(m.id, 'away', m.away);
        const label = `${homeTeam} vs ${awayTeam}`;
        if (!hasWinner)         warnings.push(`${label}: no result selected`);
        else if (!hasHome || !hasAway) warnings.push(`${label}: score is incomplete`);
      }
      const msgEl = document.getElementById('submit-picks-msg');
      if (warnings.length) {
        msgEl.style.color = '#ff7043';
        msgEl.innerHTML = '⚠️ ' + warnings.join('<br>⚠️ ');
      } else {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving…';
        // Re-upsert all current picks for this round as a confirmation
        const roundPicks = S.picks[uid]?.[rid] || {};
        for (const [mid, pick] of Object.entries(roundPicks)) {
          await upsertPick(rid, mid, pick.winner||'', pick.score_home??'', pick.score_away??'');
        }
        msgEl.style.color = '#66bb6a';
        msgEl.textContent = '✅ Picks saved!';
        submitBtn.disabled = false;
        submitBtn.textContent = '✅ Save & Confirm Picks';
        setTimeout(() => { if (msgEl) msgEl.textContent = ''; }, 3000);
      }
    };
  }

  // Registration cutoff (admin Players tab)
  const regCutoffSave  = document.getElementById('reg-cutoff-save');
  const regCutoffClear = document.getElementById('reg-cutoff-clear');
  if (regCutoffSave) {
    regCutoffSave.onclick = async () => {
      const val = document.getElementById('reg-cutoff-input').value;
      const status = document.getElementById('reg-cutoff-status');
      if (!val) { status.textContent = 'Enter a date first.'; status.style.color = '#ef9a9a'; return; }
      const iso = new Date(val).toISOString();
      const { error } = await sb.from('round_settings').upsert({ round_id:'__config__', tournament_id: S.tournamentId, deadline: iso, locked: false }, { onConflict: 'round_id,tournament_id' });
      if (error) { status.textContent = 'Save failed: ' + error.message; status.style.color = '#ef9a9a'; }
      else { S.registrationCutoff = iso; status.textContent = '✓ Saved'; status.style.color = '#66bb6a'; render(); }
    };
  }
  if (regCutoffClear) {
    regCutoffClear.onclick = async () => {
      const status = document.getElementById('reg-cutoff-status');
      const { error } = await sb.from('round_settings').delete().eq('round_id','__config__').eq('tournament_id', S.tournamentId);

      const enabledInp = field('bonus-progress-enabled');
      const modeInp    = field('bonus-progress-mode');

      const tgtInp     = field('bonus-progress-target');

      if (!S.bonusProgress[rid]) S.bonusProgress[rid] = {};
      const existing = S.bonusProgress[rid][qid] || {};
      const entry = { enabled: !!enabledInp?.checked, checklist: existing.checklist || {} };
      if (modeInp)   entry.mode    = modeInp.value;
      if (curInp)    entry.current = curInp.value;
      if (tgtInp)    entry.target  = tgtInp.value;
      if (leaderInp) entry.leader  = leaderInp.value;

      prog.checklist[opt] = ticked;

      upsertBonusAnswer(rid, qid, opt, cur.wager||0);
      render();
    };
  });

      const cur = S.bonusAnswers[S.user.id]?.[rid]?.[qid] || {};

      const maxW = (bq?.pts||0)*2;
      const val  = Math.min(maxW, Math.max(0, parseInt(inp.value)||0));

      if (display) display.textContent = val + ' pts';

      await upsertResult(rid, mid, sel.value, cur.score_home||'', cur.score_away||'');

    };
  });

        const { rid, mid } = inp.dataset;
        const cur = S.results[rid]?.[mid] || {};
        const sh = action==='result-sh' ? inp.value : cur.score_home||'';
        const sa = action==='result-sa' ? inp.value : cur.score_away||'';
        const round = ROUNDS[rid];
        const m = round?.matches.find(x => x.id === mid);
        // Auto-determine winner from scores so admin doesn't have to use the dropdown
        let winner = cur.winner || '';
        const shN = parseInt(sh), saN = parseInt(sa);
        if (!isNaN(shN) && !isNaN(saN) && sh !== '' && sa !== '') {
          if (shN > saN) winner = (m ? getBracketTeam(m.id, 'home', m.home) : '') || winner;
          else if (saN > shN) winner = (m ? getBracketTeam(m.id, 'away', m.away) : '') || winner;
          else if (!round?.knockout) winner = 'Draw';
          // tied knockout: keep existing winner (ET/pens must be set manually)
        }
        await upsertResult(rid, mid, winner, sh, sa);
        // Sync the winner dropdown UI if winner was auto-set
        const sel = document.querySelector(`[data-action="result-winner"][data-rid="${rid}"][data-mid="${mid}"]`);

        render();

      correctSet.delete(opt); wrongSet.delete(opt);

      if (prof) showPlayerModal(prof);
    };
  });

  // Pre-tournament: group picks (user)
  document.querySelectorAll('[data-action="pt-group"]').forEach(sel => {
    sel.onchange = async () => {
      const { g, pos } = sel.dataset;
      await upsertBonusAnswer('pt', `pt_${g}_${pos}`, sel.value, 0);
      render();
    };
  });

  // Pre-tournament: tournament winner pick (user)
  document.querySelectorAll('[data-action="pt-winner"]').forEach(sel => {
    sel.onchange = async () => {
      await upsertBonusAnswer('pt', 'pt_winner', sel.value, 0);
      render();
    };
  });

  // Admin: pre-tournament group result
  document.querySelectorAll('[data-action="pt-result-group"]').forEach(sel => {
    sel.onchange = async () => {
      const { g, pos } = sel.dataset;
      await upsertBonusResult('pt', `pt_${g}_${pos}`, sel.value);
      render();
    };
  });

  // Admin: pre-tournament winner result
  document.querySelectorAll('[data-action="pt-result-winner"]').forEach(sel => {
    sel.onchange = async () => {
      await upsertBonusResult('pt', 'pt_winner', sel.value);
      render();
    };
  });

  // Admin: bracket team name inputs
  document.querySelectorAll('[data-action="bracket-team"]').forEach(inp => {
    inp.onblur = () => {
      const { mid, side } = inp.dataset;
      if (!S.bracketTeams[mid]) S.bracketTeams[mid] = {};
      const val = inp.value.trim();
      if (val) S.bracketTeams[mid][side] = val;
      else delete S.bracketTeams[mid][side];
      if (!S.bracketTeams[mid].home && !S.bracketTeams[mid].away) delete S.bracketTeams[mid];
      saveBracketTeams();
      render();
    };
  });

  // Admin: bracket team dropdown (used for "Best 3rd" slot assignment)
  document.querySelectorAll('[data-action="bracket-team-select"]').forEach(sel => {
    sel.onchange = () => {
      const { mid, side } = sel.dataset;
      if (!S.bracketTeams[mid]) S.bracketTeams[mid] = {};
      const val = sel.value;
      if (val) S.bracketTeams[mid][side] = val;
      else delete S.bracketTeams[mid][side];
      if (!S.bracketTeams[mid].home && !S.bracketTeams[mid].away) delete S.bracketTeams[mid];
      saveBracketTeams();
      render();
    };
  });

  // Admin: auto-fill bracket slots from group results (r32) or previous round results (r16/qf/sf/final)
  const autofillBracketBtn = document.getElementById('autofill-bracket-btn');
  if (autofillBracketBtn) {
    autofillBracketBtn.onclick = () => {
      const rid = autofillBracketBtn.dataset.rid;
      const fills = computeBracketAutoFill(rid);
      fills.forEach(({ mid, side, team }) => {
        if (!S.bracketTeams[mid]) S.bracketTeams[mid] = {};
        S.bracketTeams[mid][side] = team;
      });
      saveBracketTeams();
      render();
      setTimeout(() => {
        const btn = document.getElementById('autofill-bracket-btn');
        if (btn) btn.textContent = fills.length ? `✅ Filled ${fills.length} slot${fills.length>1?'s':''}` : 'Nothing to fill — enter previous round results first';
      }, 0);
    };
  }

  document.querySelectorAll('[data-action="clear-bracket-team"]').forEach(btn => {
    btn.onclick = () => {
      delete S.bracketTeams[btn.dataset.mid];
      saveBracketTeams();
      render();
    };
  });

  // Admin: clear stale bracket overrides left over from before a schedule update
  const clearStaleBtn = document.getElementById('clear-stale-overrides-btn');
  if (clearStaleBtn) {
    clearStaleBtn.onclick = () => {
      const rid = clearStaleBtn.dataset.rid;
      const cleared = clearStaleBracketOverrides(rid);
      saveBracketTeams();
      render();
      setTimeout(() => {
        const btn = document.getElementById('clear-stale-overrides-btn');
        if (btn) btn.textContent = cleared ? `✅ Cleared ${cleared} stale override${cleared>1?'s':''}` : 'Nothing stale to clear';
      }, 0);
    };
  }

  // Admin: reload all data from Supabase
  const reloadDataBtn = document.getElementById('reload-data-btn');
  if (reloadDataBtn) {
    reloadDataBtn.onclick = async () => {
      reloadDataBtn.disabled = true;
      reloadDataBtn.textContent = '⏳ Loading…';
      await loadAllData();
      render();
    };
  }

  const checkAchBtn = document.getElementById('check-achievements-btn');
  if (checkAchBtn) {
    checkAchBtn.onclick = async () => {
      checkAchBtn.disabled = true;
      checkAchBtn.textContent = '⏳ Checking…';
      await autoCheckAchievements();
      checkAchBtn.disabled = false;
      checkAchBtn.textContent = '✅ Done';
      setTimeout(() => { if (checkAchBtn) checkAchBtn.textContent = '🏅 Check Achievements'; }, 2000);
    };
  }

  // Admin: save pre-tournament winner pts
  const savePtWinnerPtsBtn = document.getElementById('save-pt-winner-pts-btn');
  if (savePtWinnerPtsBtn) {
    savePtWinnerPtsBtn.onclick = () => {
      const val = parseInt(document.getElementById('pt-winner-pts-input').value) || 10;
      S.ptSettings.winnerPts = val;
      savePtSettings();
      render();
    };
  }

  // Admin: save multipliers
  const saveMultBtn = document.getElementById('save-mult-btn');
  if (saveMultBtn) {
    saveMultBtn.onclick = () => {
      const rid = saveMultBtn.dataset.rid;
      if (!S.multipliers[rid]) S.multipliers[rid] = {};
      S.multipliers[rid].match = parseFloat(document.getElementById('mult-match').value) || 1;
      S.multipliers[rid].bonus = parseFloat(document.getElementById('mult-bonus').value) || 1;
      saveMultipliers(rid);
      render();
    };
  }

  // Admin: save edited question
  document.querySelectorAll('[data-save-q]').forEach(btn => {
    btn.onclick = () => {
      const i   = Number(btn.dataset.saveQ);
      const rid = btn.dataset.rid;
      const qs  = JSON.parse(JSON.stringify(getActiveQuestions(rid)));
      const textEl  = document.querySelector(`[data-eq-text="${i}"]`);
      const ptsEl   = document.querySelector(`[data-eq-pts="${i}"]`);
      const optsEl  = document.querySelector(`[data-eq-opts="${i}"]`);
      const typeEl  = document.querySelector(`[data-eq-type="${i}"]`);
      const wagerEl = document.querySelector(`[data-eq-wager="${i}"]`);
      const qType   = typeEl?.value || qs[i].type || 'normal';
      const qWager  = wagerEl?.checked || false;
      const qOpts   = qType === 'overunder'
        ? ['Over','Under','Abstain']
        : (optsEl?.value.split(',').map(o => o.trim()).filter(Boolean) || qs[i].opts);
      const tiebreakers = Array.from(document.querySelectorAll(`[data-eq-tb^="${i}-"]`))
        .map(el => el.value.trim()).filter(Boolean);
      const activeTags = [...document.querySelectorAll(`[data-eq-tagbtn="${i}"].tag-active`)].map(b => b.dataset.tagId);
      qs[i] = {
        ...qs[i],
        text:  textEl?.value || qs[i].text,
        pts:   Number(ptsEl?.value)  || qs[i].pts,
        opts:  qOpts,
        type:  qType,
        wager: qWager,
        tiebreakers: tiebreakers.length ? tiebreakers : undefined,
        note: document.querySelector(`[data-eq-note="${i}"]`)?.value.trim() || '',
        tags: activeTags,
      };
      S.customBonusQs[rid] = qs;
      saveCustomQuestions();
      render();
    };
  });

  // Admin: add tiebreaker row
  document.querySelectorAll('[data-add-tb]').forEach(btn => {
    btn.onclick = () => {
      const i = Number(btn.dataset.addTb);
      const rid = btn.dataset.rid;
      const qs = JSON.parse(JSON.stringify(getActiveQuestions(rid)));
      const existing = Array.from(document.querySelectorAll(`[data-eq-tb^="${i}-"]`)).map(el => el.value.trim());
      qs[i].tiebreakers = [...existing, ''];
      S.customBonusQs[rid] = qs;
      saveCustomQuestions();
      render();
    };
  });

  // Admin: remove tiebreaker row
  document.querySelectorAll('[data-del-tb]').forEach(btn => {
    btn.onclick = () => {
      const [qi, j] = btn.dataset.delTb.split('-').map(Number);
      const rid = btn.dataset.rid;
      const qs = JSON.parse(JSON.stringify(getActiveQuestions(rid)));
      const existing = Array.from(document.querySelectorAll(`[data-eq-tb^="${qi}-"]`)).map(el => el.value.trim());
      existing.splice(j, 1);
      qs[qi].tiebreakers = existing.length ? existing : undefined;
      S.customBonusQs[rid] = qs;
      saveCustomQuestions();
      render();
    };
  });

  // Admin: delete question
  document.querySelectorAll('[data-del-q]').forEach(btn => {
    btn.onclick = () => {
      const i   = Number(btn.dataset.delQ);
      const rid = btn.dataset.rid;
      const qs  = JSON.parse(JSON.stringify(getActiveQuestions(rid)));
      qs.splice(i, 1);
      S.customBonusQs[rid] = qs;
      saveCustomQuestions();
      render();
    };
  });

  // Admin: add blank question
  const addBlankBtn = document.getElementById('add-blank-q-btn');
  if (addBlankBtn) {
    addBlankBtn.onclick = () => {
      const rid = addBlankBtn.dataset.rid;
      const qs  = JSON.parse(JSON.stringify(getActiveQuestions(rid)));
      qs.push({ id: `custom_${rid}_${Date.now()}`, text: 'New question', pts: 2, opts: ['Yes', 'No'], type: 'normal', wager: false });
      S.customBonusQs[rid] = qs;
      saveCustomQuestions();
      render();
    };
  }

  // Admin: reset questions to defaults
  const resetQsBtn = document.getElementById('reset-qs-btn');
  if (resetQsBtn) {
    resetQsBtn.onclick = () => {
      const rid = resetQsBtn.dataset.rid;
      delete S.customBonusQs[rid];
      saveCustomQuestions();
      render();
    };
  }

  // Admin: use bank question (add to active list for this round)
  document.querySelectorAll('[data-use-bank-q]').forEach(btn => {
    btn.onclick = () => {
      const bi  = Number(btn.dataset.useBankQ);
      const rid = btn.dataset.rid;
      const bank = window._adminQuestionBank || [];
      const bq   = bank[bi];
      if (!bq) return;
      const qs = JSON.parse(JSON.stringify(getActiveQuestions(rid)));
      // Use a stable ID based on text hash so re-adding the same question preserves bonusProgress
      const textHash = bq.text.split('').reduce((h, c) => (Math.imul(31, h) + c.charCodeAt(0)) | 0, 0);
      const stableId = `bk_${rid}_${Math.abs(textHash).toString(36)}`;
      qs.push({ id: stableId, text: bq.text, pts: bq.pts, opts: [...bq.opts], type: bq.type || 'normal', wager: bq.wager || false });
      S.customBonusQs[rid] = qs;
      saveCustomQuestions();
      S.adminTab = 'questions';
      render();
    };
  });

  // Sync tab: save key
  const syncSaveKeyBtn = document.getElementById('sync-save-key-btn');
  if (syncSaveKeyBtn) {
    syncSaveKeyBtn.onclick = () => {
      const key = document.getElementById('sync-api-key').value.trim();
      localStorage.setItem('wc26:apiKey', key);
      const st = document.getElementById('sync-status');
      if (st) { st.className = 'ok-box'; st.textContent = '✅ API key saved.'; }
    };
  }

  // Sync tab: sync now
  const syncBtn = document.getElementById('sync-btn');
  if (syncBtn) {
    syncBtn.onclick = async () => {
      const key = document.getElementById('sync-api-key').value.trim();
      if (key) localStorage.setItem('wc26:apiKey', key);
      await syncFromAPI(key);
    };
  }
}

// ════════════════════════════════════════════════════════════════
// 9. LIVE SYNC
// ════════════════════════════════════════════════════════════════
async function syncFromAPI(apiKey) {
  const st = document.getElementById('sync-status');
  const btn = document.getElementById('sync-btn');
  const setStatus = (msg, type) => {
    if (!st) return;
    st.className = type === 'ok' ? 'ok-box' : type === 'err' ? 'err-box' : 'notice';
    st.textContent = msg;
  };

  if (!apiKey) { setStatus('Please enter an API key first.', 'err'); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Syncing…'; }
  setStatus('⏳ Fetching match data from football-data.org…', 'info');

  try {
    const resp = await fetch('https://api.football-data.org/v4/competitions/WC/matches?status=FINISHED', {
      headers: { 'X-Auth-Token': apiKey }
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const matches = data.matches || [];
    if (!matches.length) { setStatus('✅ No finished matches found yet — check back once WC 2026 begins.', 'ok'); return; }

    let updated = 0;

    // Build a flat list of all our match definitions for lookup
    const allMatches = [];
    for (const round of Object.values(ROUNDS)) {
      for (const m of round.matches) {
        allMatches.push({ rid: round.id, m, knockout: round.knockout });
      }
    }

    for (const apiM of matches) {
      const apiHome = apiM.homeTeam?.shortName || apiM.homeTeam?.name || '';
      const apiAway = apiM.awayTeam?.shortName || apiM.awayTeam?.name || '';
      const scoreHome = apiM.score?.fullTime?.home ?? '';
      const scoreAway = apiM.score?.fullTime?.away ?? '';
      if (scoreHome === '' || scoreAway === '') continue;

      // Find matching round/match by team name (fuzzy)
      const found = allMatches.find(({ m }) => {
        const hMatch = m.home.toLowerCase().includes(apiHome.toLowerCase()) ||
                       apiHome.toLowerCase().includes(m.home.toLowerCase());
        const aMatch = m.away.toLowerCase().includes(apiAway.toLowerCase()) ||
                       apiAway.toLowerCase().includes(m.away.toLowerCase());
        return hMatch && aMatch;
      });

      if (!found) continue;

      const { rid, m, knockout } = found;
      const sh = String(scoreHome), sa = String(scoreAway);
      const winner = parseInt(sh) > parseInt(sa) ? m.home
                   : parseInt(sa) > parseInt(sh) ? m.away
                   : knockout ? '' : 'Draw';

      if (!winner && !knockout) continue; // skip draws in knockout (goes to ET/pens, handle manually)

      await upsertResult(rid, m.id, winner, sh, sa);
      updated++;
    }

    setStatus(`✅ Sync complete — ${updated} match${updated !== 1 ? 'es' : ''} updated.`, 'ok');
    await loadAllData();
    render();
  } catch (e) {
    setStatus(`❌ Sync failed: ${e.message}`, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync Now'; }
  }
}

// ════════════════════════════════════════════════════════════════
// 10. UTILITIES
// ════════════════════════════════════════════════════════════════
function getCurrentRound() {
  const now = Date.now();
  const playableRounds = Object.values(ROUNDS).filter(r => r.matches?.length > 0);
  if (!playableRounds.length) return null;
  let current = playableRounds[0];
  for (const round of playableRounds) {
    const firstKo = round.matches
      .map(m => getKickoff(m.id, m.kickoff)).filter(Boolean)
      .map(k => new Date(k).getTime()).sort((a, b) => a - b)[0];
    if (firstKo && now >= firstKo) current = round;
  }
  return current?.id || null;
}

function showMsg(el, text, type) {
  if (!el) return;
  el.className = type==='err' ? 'err-box' : 'ok-box';
  el.textContent = text;
}

// ════════════════════════════════════════════════════════════════
// 10. INIT
// ════════════════════════════════════════════════════════════════
async function init() {
  // If no tournament param, send user to the hub page
  const tid = new URLSearchParams(location.search).get('t');
  if (!tid) { location.replace('tournaments.html'); return; }
  S.tournamentId = tid;
  ROUNDS = ROUNDS_MAP[tid] || ROUNDS_WC2026;

  loadLocalSettings();
  initTheme();

  // Detect Supabase password-reset redirect (hash contains type=recovery)
  const hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
  if (hashParams.get('type') === 'recovery') {
    // Supabase will auto-sign in from the token; show the reset form
    S.authMode = 'reset';
    renderAuth();
    // Clean up the hash from the URL without reloading
    history.replaceState(null, '', window.location.pathname + window.location.search);
    return;
  }

  const { data: { session } } = await sb.auth.getSession();

  if (session?.user) {
    S.user = session.user;
    const { data: profile } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
    // If this is the admin account, always restore admin status regardless of DB profile
    if (session.user.email === 'admin@vermanipool.internal') {
      S.profile = { ...(profile || {}), is_admin: true, name: 'Admin', nickname: 'Admin' };
    } else {
      S.profile = profile;
    }
    await loadAllData();
    S.activeRound = getCurrentRound();
    if (session.user.email !== 'admin@vermanipool.internal') {
      const savedTab = localStorage.getItem('wc26:lastTab');
      const validTabs = ['dashboard','leaderboard','picks','bonus','rules'];
      if (savedTab && validTabs.includes(savedTab)) S.page = savedTab;
    }
  } else {
    // Still fetch registration cutoff so the signup form can enforce it
    const { data: regCfg } = await sb.from('round_settings').select('deadline').eq('round_id','__config__').eq('tournament_id', S.tournamentId).single();
    S.registrationCutoff = regCfg?.deadline || null;
  }
  render();

  // Check lock schedules every 30 seconds
  setInterval(checkLockSchedules, 30000);

  // React to login/logout events
  sb.auth.onAuthStateChange(async (event, session) => {
    if (_adminLoginInProgress) return;
    if (event === 'SIGNED_IN' && session?.user) {
      const isNewLogin = !S.user; // only navigate on a genuine new login, not token refresh
      S.user = session.user;
      // Token refreshes also fire SIGNED_IN — skip reload/render to avoid wiping typed text
      if (!isNewLogin) return;
      const { data: profile } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
      if (session.user.email === 'admin@vermanipool.internal') {
        S.profile = { ...(profile || {}), is_admin: true, name: 'Admin', nickname: 'Admin' };
        S.page = 'admin';
      } else {
        S.profile = profile;
        const savedTab = localStorage.getItem('wc26:lastTab');
        const validTabs = ['dashboard','leaderboard','picks','bonus','rules'];
        S.page = (savedTab && validTabs.includes(savedTab)) ? savedTab : 'dashboard';
      }
      await loadAllData();
      S.activeRound = getCurrentRound();
      render();
    } else if (event === 'SIGNED_OUT') {
      S.user = null; S.profile = null;
      S.picks = {}; S.bonusAnswers = {}; S.results = {}; S.bonusResults = {}; S.roundSettings = {};
      renderAuth();
    }
  });
}

init();
</script>
