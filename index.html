          <strong style="color:var(--gold)">${winPts} pts</strong> for the correct pick.
        </p>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <select class="input" data-action="pt-winner" style="max-width:300px;font-size:13px;padding:10px 12px;cursor:pointer" ${readOnly?'disabled':''}>
            <option value="">— Select champion —</option>${allTeamOpts}
          </select>
          ${wBadge}
        </div>
      </div>
      ${(() => {
        const ptBonusQs = getActiveQuestions('pt');
        if (!ptBonusQs.length) return '';
        const ptBonusHtml = ptBonusQs.map(bq => {
          const ans  = S.bonusAnswers[uid]?.['pt']?.[bq.id] || {};
          const bres = S.bonusResults['pt']?.[bq.id]?.answer || '';
          const optsHtml = bq.opts.map(opt => {
            const isSel = ans.answer === opt;
            let cls = '';
            if (isSel && bres) cls = bres === opt ? 'correct' : 'wrong';
            else if (isSel) cls = 'sel';
            return `<button class="bopt ${cls}" data-action="bonus" data-rid="pt" data-qid="${bq.id}" data-opt="${opt}" ${readOnly?'disabled':''}>${opt}</button>`;
          }).join('');
          const icon = !ans.answer ? '' : !bres ? '' : ans.answer === bres
            ? `<span class="pts-badge pts-ok">+${bq.pts} pts ✅</span>`
            : `<span class="pts-badge pts-bad">0 pts ❌</span>`;
          const noteHtml = renderBonusNote(bq);
          return `<div class="bonus-q">
            <div class="bonus-q-text">${bq.text} <span style="color:var(--gold);font-size:10px">[${bq.pts} pts]</span></div>
            <div class="bonus-opts">${optsHtml}</div>
            ${icon}
            ${noteHtml}
          </div>`;
        }).join('');
        return `<div class="bonus-section"><div class="bonus-title">⭐ Bonus Questions</div>${ptBonusHtml}</div>`;
      })()}`;
  }

  // ── Regular round render ───────────────────────────────────────
  const isMatchLocked = m => {
    if (S.manualMatchUnlocks[m.id]) return false; // force-unlocked by admin
    if (locked) return true;
    if (S.manualMatchLocks[m.id]) return true;
    const ko = getKickoff(m.id, m.kickoff);
    if (!ko) return false;
    return Date.now() >= new Date(ko).getTime() - 3600000;
  };
  const matchRO = m => isAdmin || isPinAdmin || isMatchLocked(m);

  const { match: mMult, bonus: bMult } = getMultipliers(rid);
  const bonusQs = getActiveQuestions(rid);

  // Bonus questions auto-lock 1 hour before the round's first match kickoff
  const roundKickoffs = round.matches
    .map(m => getKickoff(m.id, m.kickoff))
    .filter(Boolean)
    .map(k => new Date(k).getTime())
    .sort((a,b) => a - b);
  const firstKickoff   = roundKickoffs[0] || null;
  const bonusLockOverride = S.bonusLockOverrides[rid];
  const bonusLockAt    = bonusLockOverride ? new Date(bonusLockOverride).getTime() : (firstKickoff ? firstKickoff - 3600000 : null);
  const bonusAutoLocked = !!(bonusLockAt && Date.now() >= bonusLockAt);
  const bonusLocked    = locked || bonusAutoLocked;
  const bonusRO        = isAdmin || isPinAdmin || bonusLocked;
  const bonusLockBadge = (() => {
    if (isAdmin || isPinAdmin) return '';
    if (bonusLocked) return `<span style="font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--red);border:1px solid rgba(217,79,61,0.4);padding:3px 10px;margin-left:10px">⛔ Bonus Closed</span>`;
    if (bonusLockAt) {
      const diff = bonusLockAt - Date.now();
      const days = Math.floor(diff / 86400000);
      const hrs  = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const str  = days >= 1 ? `${days}d ${hrs}h ${mins}m` : (hrs >= 1 ? `${hrs}h ${mins}m` : `${mins}m`);
      return `<span style="font-family:var(--mono);font-size:10px;letter-spacing:0.08em;color:#ffb74d;border:1px solid rgba(255,183,77,0.35);padding:3px 10px;margin-left:10px">⏰ Bonus closes in ${str}</span>`;
    }
    return '';
  })();
  const matchMaxPts = round.matches.length * 3 * mMult;
  const regularBonusQs = bonusQs.filter(q => !q.wager);
  const wagerBonusQs   = bonusQs.filter(q => q.wager);
  const regularBonusMax = regularBonusQs.reduce((sum, q) => sum + q.pts * bMult, 0);
  const wagerMax = 10; // slider max
  const wagerBonusMax   = wagerBonusQs.length * wagerMax;
  const totalMax = matchMaxPts + regularBonusMax + wagerBonusMax;

  const multNote = (mMult !== 1 || bMult !== 1)
    ? ` <span style="color:#ff7043;font-size:9px">(×${mMult} match · ×${bMult} bonus multipliers active)</span>` : '';

  const bonusParts = [];
  if (regularBonusQs.length) {
    const label = bMult !== 1
      ? `${regularBonusQs.length} bonus Q${regularBonusQs.length>1?'s':''} × pts × ×${bMult} = ${regularBonusMax} pts`
      : `${regularBonusQs.length} bonus Q${regularBonusQs.length>1?'s':''} = ${regularBonusMax} pts`;
    bonusParts.push(label);
  }
  if (wagerBonusQs.length) {
    bonusParts.push(`${wagerBonusQs.length} wager Q${wagerBonusQs.length>1?'s':''} (up to ${wagerMax} pts each)`);
  }
  const bonusNote = bonusParts.length ? ` + ${bonusParts.join(' + ')}` : '';

  const knockoutNote = round.knockout ? `<div style="background:rgba(255,112,67,0.07);border:1px solid rgba(255,112,67,0.25);
    padding:10px 14px;margin-bottom:12px;font-size:11px;color:var(--muted);line-height:1.6">
    ⚠ <strong style="color:#ff7043">No draws in knockout rounds</strong> — every match has a winner, so pick a side, not a tie.
    If a match is level after extra time and decided on penalties, the official result will show the shootout winner's score
    bumped up by 1 (e.g. a match tied 1–1 after extra time, won on penalties, will be entered as 2–1).
  </div>` : '';
  const ptsHtml = `${knockoutNote}<div style="background:rgba(232,213,163,0.04);border:1px solid rgba(232,213,163,0.1);
    padding:8px 14px;margin-bottom:12px;font-size:11px;font-family:var(--mono);color:var(--muted)">
    🏆 Up for grabs: <strong style="color:var(--gold)">${totalMax} pts</strong> —
    ${round.matches.length} matches × max 3 pts${mMult !== 1 ? ` × ×${mMult}` : ''} = ${matchMaxPts}${bonusNote}${multNote}
  </div>`;

  const matchesHtml = round.matches.map(m => {
    const homeTeam = getBracketTeam(m.id, 'home', m.home);
    const awayTeam = getBracketTeam(m.id, 'away', m.away);
    const pick   = S.picks[uid]?.[rid]?.[m.id] || {};
    const result = S.results[rid]?.[m.id] || {};
    const winner = pick.winner || '';
    const sh     = pick.score_home ?? '';
    const sa     = pick.score_away ?? '';
    const rw     = result.winner || '';
    const rsh    = result.score_home ?? '';
    const rsa    = result.score_away ?? '';
    const hasResult = !!rw;
    const ro = matchRO(m);

    const teamBtn = (team, isDraw) => {
      const isSel = winner === team;
      let cls = isDraw ? 'draw' : '';
      if (isSel && hasResult) cls += rw === team ? ' correct' : ' wrong';
      else if (isSel) cls += ' sel';
      const label = isDraw ? '🤝 Draw' : `${F(team)} ${team}`;
      return `<button class="team-btn ${cls}" data-action="pick" data-rid="${rid}" data-mid="${m.id}" data-team="${team}" ${ro?'disabled':''}>${label}</button>`;
    };

    // Score-line points are independent of the winner pick
    const correctWinner = hasResult && winner === rw;
    const slp = hasResult ? scoreLinePoints({ score_home: sh, score_away: sa }, { score_home: rsh, score_away: rsa }) : { pts: 0, exact: false };
    let pts = '';
    if (hasResult && (winner || slp.pts)) {
      const earned = ((correctWinner ? 2 : 0) + slp.pts) * mMult;
      if (earned > 0)  pts = `<span class="pts-badge pts-ok">+${earned} pts</span>`;
      else if (earned === 0) pts = `<span class="pts-badge pts-bad">0 pts</span>`;
    }

    const guessClosed = `<span style="font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--red);border:1px solid rgba(217,79,61,0.4);padding:3px 10px;white-space:nowrap">⛔ Guess Closed</span>`;
    const cdBadge = (isAdmin || isPinAdmin) ? '' : (isMatchLocked(m) ? guessClosed : matchCountdown(getKickoff(m.id, m.kickoff)));
    const manualLocked   = !!S.manualMatchLocks[m.id];
    const forceUnlocked  = !!S.manualMatchUnlocks[m.id];
    const wouldAutoLock  = !manualLocked && !forceUnlocked && (() => {
      if (locked) return true;
      const ko = getKickoff(m.id, m.kickoff);
      if (!ko) return false;
      return Date.now() >= new Date(ko).getTime() - 3600000;
    })();
    const autoLocked = wouldAutoLock;
    const adminLockBtn = (isAdmin || isPinAdmin) ? (() => {
      const btnStyle = `cursor:pointer;border:1px solid;background:transparent;font-size:10px;font-family:var(--mono);letter-spacing:0.05em;padding:3px 9px;border-radius:0;white-space:nowrap;transition:opacity .15s`;
      if (forceUnlocked) {
        // Admin force-unlocked — show status + re-lock option
        return `<span class="lock-badge open" style="font-size:10px;font-family:var(--mono);letter-spacing:0.05em;padding:3px 9px;white-space:nowrap;border:1px solid">🔓 Force-open</span>` +
          `<button class="lock-badge locked" data-action="relock-match" data-mid="${m.id}" title="Remove force-unlock (reverts to auto-lock)"
            style="${btnStyle};margin-left:4px" onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'">🔒 Re-lock</button>`;
      } else if (autoLocked) {
        // Auto-locked by time — show label + separate unlock button
        return `<span class="lock-badge locked" style="font-size:10px;font-family:var(--mono);letter-spacing:0.05em;padding:3px 9px;white-space:nowrap;border:1px solid">⏱ Auto-locked</span>` +
          `<button class="lock-badge open" data-action="force-unlock-match" data-mid="${m.id}" title="Force-unlock this match (overrides auto-lock)"
            style="${btnStyle};margin-left:4px" onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'">🔓 Unlock</button>`;
      } else if (manualLocked) {
        return `<button class="lock-badge locked" data-action="toggle-match-lock" data-mid="${m.id}" title="Manually locked — click to unlock"
          style="${btnStyle}" onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'">🔒 Locked</button>`;
      } else {
        return `<button class="lock-badge open" data-action="toggle-match-lock" data-mid="${m.id}" title="Click to manually lock this match"
          style="${btnStyle}" onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'">🔓 Open</button>`;
      }
    })() : '';

    const hasPick = !!(winner || sh !== '' || sa !== '');
    const clearBtn = (!ro && hasPick) ? `<button class="btn btn-sm" data-action="clear-pick" data-rid="${rid}" data-mid="${m.id}"
      title="Clear this match" style="font-size:10px;padding:3px 8px;opacity:0.55;border-color:var(--border2);color:var(--muted);flex-shrink:0">✕</button>` : '';

    return `<div class="match-row">
      ${teamBtn(homeTeam,false)}
      <span class="vs">vs</span>
      ${teamBtn(awayTeam,false)}
      ${!round.knockout ? teamBtn('Draw',true) : ''}
      <div class="score-wrap" style="display:flex;gap:4px;align-items:center">
        <span style="font-size:9px;color:var(--muted);font-family:var(--mono)">H</span>
        <input class="score-in" type="number" min="0" max="20" value="${sh}" placeholder="–"
          data-action="score" data-rid="${rid}" data-mid="${m.id}" data-side="h" ${ro?'disabled':''}>
        <span class="vs" style="font-size:11px">–</span>
        <input class="score-in" type="number" min="0" max="20" value="${sa}" placeholder="–"
          data-action="score" data-rid="${rid}" data-mid="${m.id}" data-side="a" ${ro?'disabled':''}>
        <span style="font-size:9px;color:var(--muted);font-family:var(--mono)">A</span>
      </div>
      ${pts}
      ${cdBadge}
      ${adminLockBtn}
      ${clearBtn}
    </div>`;
  }).join('');

  const bonusHtml = bonusQs.map(bq => {
    const ans    = S.bonusAnswers[uid]?.[rid]?.[bq.id] || {};
    const bres   = S.bonusResults[rid]?.[bq.id]?.answer || '';
    const wager  = Number(ans.wager) || 0;
    const isOU   = bq.type === 'overunder';
    const isMC   = bq.type === 'multicheck';
    const hasWager = bq.wager === true;
    const displayOpts = isOU ? ['Over','Under','Abstain'] : bq.opts;

    const ouColors = { Over:'#90caf9', Under:'#ef9a9a', Abstain:'var(--muted)' };

    let optsHtml = '';
    if (isMC) {
      const picked = new Set((ans.answer||'').split(',').map(s=>s.trim()).filter(Boolean));
      const { correctSet: mcCorrect, wrongSet: mcWrong } = bres ? parseMcResult(bres) : { correctSet: new Set(), wrongSet: new Set() };
      const hasAnyResult = bres && (mcCorrect.size || mcWrong.size);
      const checkboxBtns = displayOpts.map(opt => {
        const isSel = picked.has(opt);
        let cls = '';
        if (isSel && hasAnyResult) {
          cls = mcCorrect.has(opt) ? 'correct' : mcWrong.has(opt) ? 'wrong' : 'sel'; // sel = pending
        } else if (isSel) cls = 'sel';
        const icon = isSel ? '☑' : '☐';
        return `<button class="bopt ${cls}" data-action="bonus-mc" data-rid="${rid}" data-qid="${bq.id}" data-opt="${opt}" ${bonusRO?'disabled':''}
          style="border-radius:3px;display:inline-flex;align-items:center;gap:6px;font-family:inherit">
          <span style="font-size:14px;line-height:1">${icon}</span>${opt}</button>`;
      }).join('');
      optsHtml = `<div style="font-size:10px;color:var(--muted);letter-spacing:0.08em;margin-bottom:6px">SELECT ALL THAT APPLY</div>${checkboxBtns}`;
    } else {
      optsHtml = displayOpts.map(opt => {
        const isSel = ans.answer === opt;
        let cls = '';
        if (isSel && bres) {
          if (opt === 'Abstain') cls = 'sel';
          else cls = bres === opt ? 'correct' : 'wrong';
        } else if (isSel) cls = 'sel';
        const ouStyle = isOU ? `style="border-color:${ouColors[opt]};color:${cls?'':''+ouColors[opt]}"` : '';
        return `<button class="bopt ${cls}" data-action="bonus" data-rid="${rid}" data-qid="${bq.id}" data-opt="${opt}" ${bonusRO?'disabled':''} ${ouStyle}>${opt}</button>`;
      }).join('');
    }

    // Scoring hint
    let hint = '';
    if (bres) {
      if (isMC) {
        const { correctSet: hcSet, wrongSet: hwSet } = parseMcResult(bres);
        const picked = new Set((ans.answer||'').split(',').map(s=>s.trim()).filter(Boolean));
        let mcPts = 0;
        for (const p of picked) {
          if (hcSet.has(p)) mcPts += 2;
          else if (hwSet.has(p)) mcPts -= 1;
        }
        const scaled = mcPts * bMult;
        const hasResolved = picked.size && [...picked].some(p => hcSet.has(p) || hwSet.has(p));
        if (hasResolved) hint = `<span class="pts-badge ${scaled>=0?'pts-ok':'pts-bad'}">${scaled>=0?'+':''}${scaled} pts (partial)</span>`;
        else if (picked.size) hint = `<span class="pts-badge" style="background:rgba(255,255,255,0.06);color:var(--muted);border:1px solid var(--border2)">results pending</span>`;
      } else {
        const correct = ans.answer && ans.answer !== 'Abstain' && ans.answer === bres;
        const wrong   = ans.answer && ans.answer !== 'Abstain' && ans.answer !== bres;
        const stake   = hasWager ? wager : bq.pts;
        if (correct) hint = `<span class="pts-badge pts-ok">+${stake} pts ✅</span>`;
        else if (wrong && isOU) hint = `<span class="pts-badge pts-bad">−${stake} pts ❌</span>`;
        else if (wrong) hint = `<span class="pts-badge pts-bad">0 pts ❌</span>`;
        else if (ans.answer === 'Abstain') hint = `<span class="pts-badge" style="background:rgba(255,255,255,0.06);color:var(--muted);border:1px solid var(--border2)">0 pts (Abstain)</span>`;
      }
    }

    // Wager slider — hidden when Abstain is selected
    const wagerHtml = (hasWager && ans.answer !== 'Abstain') ? `
      <div class="wager-row" style="margin-top:10px;gap:10px">
        <span class="wager-hint">💰 Stake:</span>
        <input type="range" min="0" max="10" value="${wager}"
          data-action="wager-slider" data-rid="${rid}" data-qid="${bq.id}"
          style="flex:1;accent-color:var(--gold)" ${bonusRO?'disabled':''}>
        <span data-wager-display="${bq.id}" style="font-size:13px;font-weight:700;color:var(--gold);font-family:var(--mono);min-width:30px">${wager} pts</span>
        ${isOU ? `<span class="wager-hint" style="font-size:10px">correct +${wager} · wrong −${wager}</span>` : `<span class="wager-hint" style="font-size:10px">correct +${wager} · wrong 0</span>`}
      </div>` : '';

    const ptsLabel = hasWager
      ? `<span style="color:var(--muted);font-size:10px">[wager 0–10]</span>`
      : isMC
      ? `<span style="color:var(--gold);font-size:10px">[+2 correct · −1 wrong · ×${bMult} mult]</span>`
      : `<span style="color:var(--gold);font-size:10px">[${bq.pts} pts${isOU ? ' · wrong −'+bq.pts : ''}]</span>`;

    const tbHtml = (bq.tiebreakers?.length) ? `
      <div style="margin-top:6px;padding:6px 10px;background:rgba(255,255,255,0.03);border-left:2px solid rgba(232,213,163,0.3);border-radius:2px">
        <div style="font-size:9px;color:var(--muted);letter-spacing:0.1em;margin-bottom:4px">TIEBREAKER CRITERIA</div>
        ${bq.tiebreakers.map((tb, j) => `<div style="font-size:11px;color:var(--muted);line-height:1.6"><span style="color:rgba(232,213,163,0.5);font-family:var(--mono)">${j+1}.</span> ${tb}</div>`).join('')}
      </div>` : '';
    const noteHtml = renderBonusNote(bq);
    return `<div class="bonus-q">
      <div class="bonus-q-text">${bq.text} ${ptsLabel}${isOU ? ` <span style="font-size:10px;color:#90caf9;font-family:var(--mono)">[OVER/UNDER]</span>` : ''}</div>
      ${tbHtml}
      <div class="bonus-opts">${optsHtml}</div>
      ${wagerHtml}
      ${hint}
      ${noteHtml}
    </div>`;
  }).join('');

  return `
    <div class="page-title">My Picks</div>
    ${isAdmin || isPinAdmin ? `<div class="notice">👁 Admin view — picks are read-only. Admins cannot submit picks.</div>` : ''}
    <div class="pill-row">${pillsHtml}</div>
    ${round.dateRange ? `<div class="round-dates">📅 ${round.dateRange}</div>` : ''}
    ${ptsHtml}
    <div class="card">
      <div class="card-title">${round.label}</div>
      <p style="color:var(--muted);font-size:11px;margin-bottom:12px">
        Pick the winner <span style="color:var(--gold)">(2 pts)</span> — then enter the exact score for a bonus
        <span style="color:#ce93d8">(+1 pt, even if your winner pick is wrong)</span>
      </p>
      ${matchesHtml}
    </div>
    ${bonusQs.length ? `<div class="bonus-section">
      <div class="bonus-title" style="display:flex;align-items:center;flex-wrap:wrap">⭐ Bonus Questions ${bonusLockBadge}</div>
      ${bonusHtml}
    </div>` : ''}
    ${!isAdmin && !isPinAdmin ? `
    <div id="submit-picks-wrap" style="margin-top:8px">
      <button class="btn btn-gold" id="submit-picks-btn" data-rid="${rid}" style="width:100%;font-size:13px;padding:12px">
        ✅ Save &amp; Confirm Picks
      </button>
      <div id="submit-picks-msg" style="margin-top:8px;font-size:12px;font-family:var(--mono)"></div>
    </div>` : ''}`;
}

// ── Leaderboard ───────────────────────────────────────────────────
function renderLeaderboard() {
  const lb = getLeaderboard();
  const maxPts = lb[0]?.total || 1;
  const medal = r => ['🥇','🥈','🥉'][r-1] || `#${r}`;
  const isAdmin  = S.profile?.is_admin;
  const isPinAdmin = isAdmin;
  const meId = !isAdmin ? S.user?.id : null;
  const me = meId ? lb.find(p => p.id === meId) : null;

  const LB_TOURNAMENT_COLORS = {
    wc2026:'#e8d5a3',wc2022:'#ef5350',euro2024:'#42a5f5',
    ipl2024:'#ab47bc',ipl2025:'#ff8f00',euro2028:'#26c6da',wc2030:'#66bb6a',
  };
  const lbTournamentColor = tid => {
    if (tid && LB_TOURNAMENT_COLORS[tid]) return LB_TOURNAMENT_COLORS[tid];
    let h = 0; for (let i=0;i<(tid||'').length;i++) h=(h*31+tid.charCodeAt(i))&0xffff;
    return `hsl(${h%360},65%,62%)`;
  };

  const achIcons = p => (p.achievements || [])
    .filter(a => a.type !== 'tournament_winner' && (!a.tid || a.tid === S.tournamentId))
    .slice(0, 5)
    .map(a => ACHIEVEMENTS[a.type] ? `<span class="ach-icon" title="${ACHIEVEMENTS[a.type].label}">${ACHIEVEMENTS[a.type].icon}</span>` : '')
    .join('');

  const winnerDots = p => {
    const wins = (p.achievements || []).filter(a => a.type === 'tournament_winner');
    if (!wins.length) return '';
    return `<span class="lb-dots">${wins.map(a => {
      const color = lbTournamentColor(a.tid);
      return `<span class="lb-badge-dot-wrap winner" style="--dot-color:${color}" title="🏆 ${a.label} Winner"><span class="lb-badge-dot" style="background:${color}"></span></span>`;
    }).join('')}</span>`;
  };

  // ── Movement: compare current rank to rank as of the last saved snapshot ─
  // (snapshot is taken just before each admin result/bonus edit — see saveRankSnapshot)
  const movementMap = {};
  if (S.rankSnapshot && Object.keys(S.rankSnapshot).length > 0) {
    const prevSorted = S.profiles
      .filter(p => !p.is_admin)
      .map(p => ({ id: p.id, prevTotal: S.rankSnapshot[p.id] ?? lb.find(x => x.id === p.id)?.total ?? 0 }))
      .sort((a, b) => b.prevTotal - a.prevTotal);
    const prevRankMap = {};
    for (let i = 0; i < prevSorted.length; i++) {
      if (i === 0 || prevSorted[i].prevTotal !== prevSorted[i-1].prevTotal) {
        prevRankMap[prevSorted[i].id] = i + 1;
      } else {
        prevRankMap[prevSorted[i].id] = prevRankMap[prevSorted[i-1].id];
      }
    }
    lb.forEach(p => {
      const prev = prevRankMap[p.id];
      if (prev == null) return;
      const diff = prev - p.rank; // positive = moved up
      movementMap[p.id] = diff;
    });
  }

  const movBadge = uid => {
    const diff = movementMap[uid];
    if (diff == null || diff === 0) return `<span style="font-size:10px;color:var(--faint);font-family:var(--mono);width:28px;text-align:center">—</span>`;
    if (diff > 0) return `<span style="font-size:10px;color:#66bb6a;font-family:var(--mono);font-weight:700;width:28px;text-align:center">▲${diff}</span>`;
    return `<span style="font-size:10px;color:#ef5350;font-family:var(--mono);font-weight:700;width:28px;text-align:center">▼${Math.abs(diff)}</span>`;
  };

  // Build prize lookup: rank → amount, with tie-splitting
  const prizeMap = {};
  const pzCurrency = S.prizes?.currency || 'CAD';
  (S.prizes?.entries || []).forEach(e => { if (e.rank) prizeMap[Number(e.rank)] = Number(e.amount); });

  // For each leaderboard player, compute their split prize
  // Tied players share the sum of all prize positions they span
  const splitPrize = (rank) => {
    // Find how many players share this rank
    const tied = lb.filter(p => p.rank === rank);
    if (!tied.length) return null;
    if (tied.length === 1) return prizeMap[rank] ?? null;
    // Sum prizes for positions rank through rank+tied.length-1
    let total = 0, hasPrize = false;
    for (let r = rank; r < rank + tied.length; r++) {
      if (prizeMap[r] != null) { total += prizeMap[r]; hasPrize = true; }
    }
    return hasPrize ? total / tied.length : null;
  };

  const rows = lb.map((p,i) => {
    const barW = Math.round((p.total/maxPts)*100);
    const isMe = p.id === meId;
    const prize = splitPrize(p.rank);
    const tied = lb.filter(x => x.rank === p.rank).length > 1;
    const prizeMeta = p.rank === 1
      ? { bg:'var(--gold)',        color:'#1a1a1a', shadow:'rgba(232,213,163,0.4)' }
      : p.rank === 2
      ? { bg:'#b0b8c1',           color:'#1a1a1a', shadow:'rgba(176,184,193,0.4)' }
      : p.rank === 3
      ? { bg:'#a0714f',           color:'#fff',    shadow:'rgba(160,113,79,0.4)'  }
      :   { bg:'rgba(255,255,255,0.1)', color:'var(--muted)', shadow:'none' };
    // Format prize: trim unnecessary decimals (show .5 but not .0)
    const fmtPrize = prize == null ? null
      : Number.isInteger(prize) ? prize.toString()
      : prize % 1 === 0.5 ? prize.toFixed(1)
      : prize.toFixed(2).replace(/\.?0+$/, '');
    const prizeBadge = prize != null
      ? `<span style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;
          color:${prizeMeta.color};background:${prizeMeta.bg};padding:3px 9px;white-space:nowrap;
          font-weight:700;box-shadow:0 0 10px ${prizeMeta.shadow}"
          title="${tied ? 'Split prize (tie)' : ''}">
          ${pzCurrency} ${fmtPrize}${tied ? ` <span style="font-size:9px;opacity:.7">÷${lb.filter(x=>x.rank===p.rank).length}</span>` : ''}
         </span>` : '';
    return `<tr class="${i===0?'gold-row':''} ${isMe?'me-row':''}" data-uid="${p.id}" style="cursor:pointer${isMe?';outline:1px solid rgba(232,213,163,0.35)':''}">
      <td><span class="rank-icon">${medal(p.rank)}</span></td>
      <td>${movBadge(p.id)}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap">
          ${p.avatar_url
            ? `<img src="${p.avatar_url}" class="lb-avatar" alt="">`
            : `<span class="lb-avatar-initials">${(p.nickname||p.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</span>`}
          <span style="white-space:nowrap${isMe?';color:var(--gold);font-weight:500':''}">${p.nickname||p.name}${isMe?' <span style="font-size:9px;font-family:var(--mono);color:var(--muted)">(you)</span>':''}</span>
          ${p.nickname && p.name && p.nickname !== p.name ? `<span style="color:var(--muted);font-size:11px;white-space:nowrap">(${p.name})</span>` : ''}
          ${p.paid ? `<span title="Entry fee paid" style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#1da1f2;color:#fff;font-size:9px;font-weight:700;flex-shrink:0;line-height:1">✓</span>` : ''}
          ${winnerDots(p)}
        </div>
      </td>
      <td><span class="lb-ach-col">${achIcons(p)}</span></td>
      <td style="color:#90caf9">${p.correctPicks}</td>
      <td style="color:#ce93d8">${p.exactScores}</td>
      <td><span class="lb-bar-wrap"><span class="lb-bar" style="width:${barW}%"></span></span></td>
      <td><span class="lb-pts">${p.total}</span></td>
      <td style="padding-left:10px">${prizeBadge}</td>
    </tr>`;
  }).join('');

  // Your standing card — shown to regular players only
  const myCard = me ? (() => {
    const rankColor = me.rank===1?'#FFD700':me.rank===2?'#C0C0C0':me.rank===3?'#CD7F32':'var(--gold)';
    const rankLabel = me.rank===1?'🥇 1st':me.rank===2?'🥈 2nd':me.rank===3?'🥉 3rd':`#${me.rank}`;
    const nextUp = lb[lb.findIndex(p=>p.id===meId)-1];
    const gap = nextUp ? nextUp.total - me.total : 0;
    return `<div class="card" style="border-color:rgba(232,213,163,0.35);margin-bottom:16px">
      <div class="card-title" style="color:var(--gold)">Your Standing</div>
      <div style="display:flex;align-items:center;gap:0;flex-wrap:wrap">
        <div style="flex:0 0 auto;padding:0 24px 0 0;border-right:1px solid var(--border2);margin-right:24px">
          <div style="font-family:var(--display);font-size:52px;line-height:1;color:${rankColor}">${rankLabel}</div>
          <div style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.15em;margin-top:4px">POSITION</div>
        </div>
        <div style="display:flex;gap:24px;flex-wrap:wrap">
          <div>
            <div style="font-family:var(--display);font-size:40px;line-height:1;color:#4CAF50">${me.total}</div>
            <div style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.15em;margin-top:4px">POINTS</div>
          </div>
          <div>
            <div style="font-family:var(--display);font-size:40px;line-height:1;color:#90caf9">${me.correctPicks}</div>
            <div style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.15em;margin-top:4px">CORRECT</div>
          </div>
          <div>
            <div style="font-family:var(--display);font-size:40px;line-height:1;color:#ce93d8">${me.exactScores}</div>
            <div style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.15em;margin-top:4px">EXACT</div>
          </div>
          ${nextUp ? `<div style="align-self:flex-end;padding-bottom:4px">
            <div style="font-size:11px;color:var(--muted);font-family:var(--mono)">
              ${gap > 0 ? `<span style="color:#e88a80">−${gap} pts</span> behind ${nextUp.nickname||nextUp.name}` : `<span style="color:#4CAF50">You're leading! 🎉</span>`}
            </div>
          </div>` : `<div style="align-self:flex-end;padding-bottom:4px;font-size:11px;color:#4CAF50;font-family:var(--mono)">You're leading! 🎉</div>`}
        </div>
      </div>
    </div>`;
  })() : '';

  return `
    <div class="page-title">🏆 Leaderboard</div>
    ${myCard}
    <div class="card">
      <div style="overflow-x:auto">
        <table class="lb-table">
          <thead><tr>
            <th>Rank</th><th title="Movement since last round">+/−</th><th>Player</th><th title="In-tournament achievements">Badges</th><th>Correct</th><th>Exact</th><th></th><th>Pts</th><th></th>
          </tr></thead>
          <tbody>${rows||'<tr><td colspan="7" style="color:var(--muted);padding:20px;text-align:center">No players yet.</td></tr>'}</tbody>
        </table>
      </div>
      <p style="font-size:10px;color:var(--faint);margin-top:12px">Tiebreaker: most correct picks → most exact scores · Click a player to view profile</p>
    </div>`;
}

        const opts1 = teams.map(t => `<option value="${t}" ${r1===t?'selected':''}>${F(t)} ${t}</option>`).join('');
        const opts2 = teams.map(t => `<option value="${t}" ${r2===t?'selected':''}>${F(t)} ${t}</option>`).join('');
        const opts3 = teams.map(t => `<option value="${t}" ${r3===t?'selected':''}>${F(t)} ${t}</option>`).join('');

              <option value="">— Team —</option>${opts1}
            </select>
            <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">2ND</span>
            <select class="admin-select" data-action="pt-result-group" data-g="${g}" data-pos="2" style="min-width:140px">
              <option value="">— Team —</option>${opts2}
            </select>
            <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">3RD</span>

      tabContent = `
        <div class="pill-row">${pillsHtml}</div>

          <div class="card-title" style="color:var(--gold)">⚙️ Pre-Tournament Settings</div>
          <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
            <div>
              <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px">Tournament winner points</label>
              <input id="pt-winner-pts-input" class="admin-score" type="number" min="1" max="100"
                value="${winPts}" style="width:64px;font-size:14px;font-weight:700;text-align:center">
            </div>
            <button class="btn btn-gold btn-sm" id="save-pt-winner-pts-btn">Save</button>
          </div>
        </div>
        <div class="card">
          <div class="card-title">🏆 Group Standings Results</div>
          <p style="color:var(--muted);font-size:11px;margin-bottom:12px">Set the actual 1st and 2nd place finisher for each group to auto-score all player predictions.</p>
          ${groupResultsHtml}
        </div>
        <div class="card" style="border-color:rgba(232,213,163,0.2)">
          <div class="card-title">🏆 Tournament Winner Result</div>
          <div class="admin-match-row">
            <span class="admin-match-label">Who will win the 2026 World Cup?</span>
            <select class="admin-select" data-action="pt-result-winner" style="min-width:180px">
              <option value="">— Winner —</option>${allTeamOpts}
            </select>
          </div>

        ${(() => {
          const ptQs = getActiveQuestions('pt');
          const qRows = ptQs.map((q, i) => `
            <div style="padding:12px 0;border-bottom:1px solid var(--border2)">
              <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px">
                <span style="font-size:11px;color:var(--muted);width:20px;padding-top:10px;flex-shrink:0">${i+1}.</span>
                <textarea rows="2" data-ptq-text="${i}" style="flex:1;min-width:180px;background:rgba(255,255,255,0.06);
                  border:1.5px solid rgba(255,255,255,0.12);color:var(--text);

                  <label style="font-size:10px;color:var(--muted)">Pts</label>
                  <input type="number" min="1" max="20" data-ptq-pts="${i}" value="${q.pts}"
                    style="width:52px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.12);
                    color:var(--gold);text-align:center;font-size:14px;font-weight:700;padding:6px 4px;font-family:Arial,sans-serif">
                </div>
              </div>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-left:28px">

                  style="flex:1;min-width:140px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);

              </div>
              <div style="padding-left:28px;margin-top:8px">
                <div style="font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;margin-bottom:5px">TAGS</div>
                <div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:7px">
                  ${BONUS_TAGS.map(t => `<button class="bonus-tag-btn${(q.tags||[]).includes(t.id)?' tag-active':''}" style="--tc:${t.color}" data-ptq-tagbtn="${i}" data-tag-id="${t.id}" title="${t.text}">${t.label}</button>`).join('')}
                </div>
                <textarea rows="2" data-ptq-note="${i}" placeholder="Add a note visible to players (or click a tag above to auto-fill)…"
                  style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);

                <select class="admin-select" data-ptq-result="${i}" data-qid="${q.id}" style="min-width:160px">
                  <option value="">— Not set —</option>

          return `<div class="card" style="margin-top:12px;border-color:rgba(255,215,0,0.15)">

            <p style="color:var(--muted);font-size:11px;margin-bottom:12px">
              These appear to participants in the Pre-Tournament picks tab. Set the correct answer here to auto-score them.
            </p>
            ${qRows || '<p style="color:var(--faint);font-size:13px;margin-bottom:4px">No bonus questions yet. Click "+ Add question" to add one.</p>'}

        })()}
        ${(() => {

          const winnerSet = !!ptBr['pt_winner']?.answer;
          const bonusQsWithAnswer = ptQs.filter(q => ptBr[q.id]?.answer).length;

          const previewRows = players.map(p => {
            const ptBa = S.bonusAnswers[p.id]?.['pt'] || {};
            let groupPts = 0, winnerPtsEarned = 0, bonusPts = 0;
            const groupDetails = Object.entries(GROUPS).map(([g]) => {
              const p1 = ptBa[`pt_${g}_1`]?.answer, p2 = ptBa[`pt_${g}_2`]?.answer;
              const r1 = ptBr[`pt_${g}_1`]?.answer,  r2 = ptBr[`pt_${g}_2`]?.answer;
              if (!r1 && !r2) return null;
              const qualified = new Set([r1, r2].filter(Boolean));
              let gPts = 0;
              if (p1) { if (p1 === r1) gPts += 2; else if (qualified.has(p1)) gPts += 1; }
              if (p2) { if (p2 === r2) gPts += 2; else if (qualified.has(p2)) gPts += 1; }

            for (const bq of ptQs) {

              <td style="padding:8px;text-align:center;color:${winnerPtsEarned>0?'#66bb6a':'var(--muted)'};font-family:var(--mono)">

              </td>
              <td style="padding:8px;text-align:center;color:${bonusPts>0?'#ffb74d':'var(--muted)'};font-family:var(--mono)">${ptQs.length?bonusPts:'—'}</td>

          return `<div class="card" style="border-color:rgba(76,175,80,0.2);margin-top:12px">

              · Winner: <strong style="color:${winnerSet?'#66bb6a':'var(--faint)'}">${winnerSet?ptBr['pt_winner'].answer:'not set'}</strong>
              · Bonus answers set: <strong style="color:var(--text)">${bonusQsWithAnswer}/${ptQs.length}</strong>
            </p>
            ${players.length === 0
              ? '<p style="color:var(--muted);font-size:13px">No players registered yet.</p>'
              : `<div class="admin-table-wrap"><table style="width:100%;border-collapse:collapse;font-size:12px">
                <thead><tr style="border-bottom:1px solid var(--gold)">
                  <th style="padding:5px 8px;text-align:left;color:var(--muted);font-family:var(--mono);font-size:10px">PLAYER</th>
                  <th style="padding:5px 8px;color:var(--muted);font-family:var(--mono);font-size:10px">GROUPS</th>

    } else {

        <div class="card" style="border-color:rgba(100,150,255,0.2);margin-bottom:12px">

        </div>
        <div class="card">
          <div class="card-title">${roundLabel(round)} — Match Results</div>
          <p style="color:var(--muted);font-size:11px;margin-bottom:12px">Set actual match outcomes to score all players automatically.</p>

        ${(() => {

              <span style="color:#90caf9">CREATE POLICY "bonus_results_write" ON bonus_results FOR ALL USING (true) WITH CHECK (true);</span>
            </div>` : ''}

        })()}`;

  // ── Lock tab ─────────────────────────────────────────────────
  if (adminTab === 'lock') {
    const lockRows = Object.values(ROUNDS).map(r => {
      const rid     = r.id;
      const locked  = S.roundSettings[rid]?.locked || false;

      const lockAt  = sched.lockAt   || '';
      const unlockAt= sched.unlockAt || '';

      return `
        <div style="padding:14px 16px;margin-bottom:10px;
