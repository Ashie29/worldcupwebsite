<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ WC 2026 Fantasy Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── Reset & variables ───────────────────────────────────────── */
:root{
  --bg:#0a0a0a;--card:#111111;--card2:#181818;
  --gold:#e8d5a3;--gold2:#c4a96a;
  --text:#f0ede8;--muted:#6b6660;--faint:#2a2a2a;
  --border:rgba(232,213,163,0.14);--border2:rgba(255,255,255,0.07);
  --green:#4CAF50;--red:#d94f3d;--blue:#1a4a7a;--purple:#5b21b6;
  --radius:0px;
  --mono:'DM Mono',monospace;
  --sans:'DM Sans',sans-serif;
  --display:'Bebas Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);
  font-weight:300;min-height:100vh;overflow-x:hidden;}
/* noise overlay */
body::before{content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity:0.025;pointer-events:none;z-index:9000;}
a{color:var(--gold);text-decoration:none;}

/* ── Nav ─────────────────────────────────────────────────────── */
.nav{background:rgba(10,10,10,0.95);border-bottom:1px solid var(--border2);
  display:flex;align-items:center;gap:2px;padding:0 20px;
  position:sticky;top:0;z-index:100;height:52px;overflow-x:auto;
  backdrop-filter:blur(12px);}
.nav-brand{font-family:var(--display);letter-spacing:0.1em;color:var(--gold);
  font-size:22px;margin-right:16px;white-space:nowrap;flex-shrink:0;}
.nav-tab{background:transparent;border:none;color:var(--muted);cursor:pointer;
  padding:6px 14px;font-size:11px;white-space:nowrap;transition:color .2s;
  font-family:var(--mono);letter-spacing:0.12em;text-transform:uppercase;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{color:var(--gold);border-bottom:1px solid var(--gold);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-user{font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:0.08em;}
.nav-signout{background:transparent;border:1px solid var(--faint);color:var(--muted);
  cursor:pointer;padding:5px 12px;font-size:10px;font-family:var(--mono);
  letter-spacing:0.1em;text-transform:uppercase;transition:all .2s;}
.nav-signout:hover{border-color:var(--red);color:var(--red);}

/* ── Layout ──────────────────────────────────────────────────── */
.page{max-width:900px;margin:0 auto;padding:32px 20px 80px;}
.page-title{font-family:var(--display);color:var(--gold);font-size:42px;
  letter-spacing:0.06em;margin-bottom:24px;line-height:1;}

/* ── Cards ───────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border2);padding:20px;margin-bottom:16px;}
.card-title{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--gold);
  margin-bottom:16px;letter-spacing:0.2em;text-transform:uppercase;
  display:flex;align-items:center;gap:12px;}
.card-title::before{content:'';width:24px;height:1px;background:var(--gold);}

/* ── Buttons ─────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;
  padding:10px 22px;border:none;cursor:pointer;
  font-size:10px;font-weight:500;transition:all .15s;
  font-family:var(--mono);letter-spacing:0.15em;text-transform:uppercase;}
.btn-gold{background:var(--gold);color:var(--bg);}
.btn-gold:hover{background:var(--gold2);}
.btn-outline{background:transparent;color:var(--muted);border:1px solid var(--faint);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}
.btn-sm{padding:5px 14px;font-size:10px;}
.btn-danger{background:rgba(217,79,61,.12);color:var(--red);border:1px solid var(--red);}
.btn-danger:hover{background:rgba(217,79,61,.25);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ── Inputs ──────────────────────────────────────────────────── */
.input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border2);
  color:var(--text);padding:12px 14px;font-size:14px;font-family:var(--sans);font-weight:300;
  outline:none;transition:border-color .2s;}
.input:focus{border-color:var(--gold);}
.input::placeholder{color:var(--faint);}
.label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;
  font-family:var(--mono);letter-spacing:0.15em;text-transform:uppercase;}
.field{margin-bottom:14px;}
.err-box{background:rgba(217,79,61,.08);border:1px solid rgba(217,79,61,.3);
  color:#e88a80;padding:10px 14px;font-size:12px;margin-bottom:12px;}
.ok-box{background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.3);
  color:#a5d6a7;padding:10px 14px;font-size:12px;margin-bottom:12px;}

/* ── Pill selector (round tabs) ───────────────────────────────── */
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.pill{background:transparent;border:1px solid var(--faint);color:var(--muted);
  cursor:pointer;padding:5px 14px;font-size:10px;font-weight:500;
  transition:all .2s;font-family:var(--mono);letter-spacing:0.12em;text-transform:uppercase;}
.pill:hover{border-color:var(--gold);color:var(--gold);}
.pill.active{background:var(--gold);border-color:var(--gold);color:var(--bg);}
.pill.locked{border-color:#ff7043;color:#ff7043;}
.pill.locked.active{background:#ff7043;border-color:#ff7043;color:#fff;}

/* ── Match rows ───────────────────────────────────────────────── */
.match-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px 0;border-bottom:1px solid var(--border2);}
.match-row:last-child{border-bottom:none;}
.team-btn{background:rgba(255,255,255,.03);border:1px solid var(--border2);
  color:var(--muted);padding:6px 12px;cursor:pointer;
  font-size:11px;font-weight:500;font-family:var(--mono);
  transition:all .15s;white-space:nowrap;letter-spacing:0.06em;}
.team-btn:hover:not(:disabled){background:rgba(255,255,255,.07);color:var(--text);}
.team-btn.sel{background:rgba(26,74,122,0.5);border-color:rgba(100,160,220,0.5);color:#90caf9;}
.team-btn.correct{background:rgba(46,125,50,0.4);border-color:#66bb6a;color:#a5d6a7;}
.team-btn.wrong{background:rgba(74,0,0,0.4);border-color:var(--red);color:#e88a80;}
.team-btn.draw{border-color:rgba(232,213,163,.2);color:var(--muted);}
.team-btn.draw.sel{background:rgba(93,64,55,0.4);border-color:var(--gold);color:var(--gold);}
.team-btn.draw.correct{background:rgba(46,125,50,0.4);border-color:#66bb6a;color:#a5d6a7;}
.team-btn.draw.wrong{background:rgba(74,0,0,0.4);border-color:var(--red);color:#e88a80;}
.team-btn:disabled{cursor:default;opacity:.75;}
.vs{color:var(--faint);font-size:10px;flex-shrink:0;font-family:var(--mono);}
.score-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.score-in{width:34px;height:28px;background:rgba(255,255,255,.04);
  border:1px solid var(--border2);color:var(--text);
  text-align:center;font-size:13px;font-weight:400;outline:none;
  font-family:var(--mono);}
.score-in:disabled{opacity:.5;cursor:default;}
.pts-badge{font-size:10px;padding:3px 8px;font-weight:500;font-family:var(--mono);
  white-space:nowrap;margin-left:auto;letter-spacing:0.08em;}
.pts-ok{background:rgba(46,125,50,0.25);color:#a5d6a7;border:1px solid rgba(102,187,106,0.3);}
.pts-part{background:rgba(26,74,122,0.3);color:#90caf9;border:1px solid rgba(100,160,220,0.3);}
.pts-bad{background:rgba(74,0,0,0.25);color:#e88a80;border:1px solid rgba(217,79,61,0.3);}

/* ── Bonus questions ──────────────────────────────────────────── */
.bonus-section{margin-top:18px;padding:16px;background:rgba(232,213,163,.03);
  border:1px solid rgba(232,213,163,.1);}
.bonus-title{font-size:10px;color:var(--gold);font-weight:500;margin-bottom:12px;
  font-family:var(--mono);letter-spacing:0.2em;text-transform:uppercase;}
.bonus-q{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border2);}
.bonus-q:last-child{border-bottom:none;margin-bottom:0;}
.bonus-q-text{font-size:13px;color:var(--text);margin-bottom:7px;font-weight:300;}
.bonus-opts{display:flex;flex-wrap:wrap;gap:5px;}
.bopt{background:transparent;border:1px solid var(--faint);color:var(--muted);
  padding:4px 12px;font-size:10px;font-weight:500;
  cursor:pointer;font-family:var(--mono);transition:all .15s;letter-spacing:0.08em;}
.bopt:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
.bopt.sel{background:rgba(26,74,122,0.4);border-color:rgba(100,160,220,0.5);color:#90caf9;}
.bopt.correct{background:rgba(46,125,50,0.4);border-color:#66bb6a;color:#a5d6a7;}
.bopt.wrong{background:rgba(74,0,0,0.3);border-color:var(--red);color:#e88a80;}
.bopt:disabled{cursor:default;opacity:.75;}
.wager-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.wager-in{width:60px;height:26px;background:rgba(232,213,163,.05);
  border:1px solid rgba(232,213,163,.25);color:var(--gold);
  text-align:center;font-size:13px;font-weight:400;outline:none;font-family:var(--mono);}
.wager-in:disabled{opacity:.5;cursor:default;}
.wager-hint{font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.06em;}

/* ── Leaderboard ─────────────────────────────────────────────── */
.lb-table{width:100%;border-collapse:collapse;}
.lb-table th{color:var(--muted);font-size:10px;padding:7px 10px;font-family:var(--mono);
  border-bottom:1px solid var(--gold);text-align:left;letter-spacing:0.15em;text-transform:uppercase;}
.lb-table th:last-child,.lb-table td:last-child{text-align:right;}
.lb-table td{padding:10px 10px;border-bottom:1px solid var(--border2);font-size:13px;}
.lb-table tr:hover td{background:rgba(255,255,255,.02);cursor:pointer;}
.lb-table tr.gold-row td{background:rgba(232,213,163,.05);}
.rank-icon{font-size:16px;}
.lb-pts{color:var(--green);font-weight:500;font-size:15px;font-family:var(--mono);}
.lb-bar-wrap{height:2px;background:rgba(255,255,255,.06);width:80px;display:inline-block;}
.lb-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));}

/* ── Admin ───────────────────────────────────────────────────── */
.admin-match-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 0;border-bottom:1px solid var(--border2);}
.admin-match-row:last-child{border-bottom:none;}
.admin-match-label{font-size:11px;color:var(--muted);min-width:180px;flex-shrink:0;
  font-family:var(--mono);letter-spacing:0.05em;}
.admin-select{background:var(--card2);border:1px solid rgba(255,112,67,.35);color:var(--text);
  padding:4px 8px;font-size:11px;font-family:var(--mono);}
.admin-score{width:38px;height:26px;background:var(--card2);border:1px solid rgba(255,112,67,.35);
  color:var(--text);text-align:center;font-size:12px;font-family:var(--mono);}
.lock-badge{font-size:10px;padding:3px 10px;font-weight:500;white-space:nowrap;
  flex-shrink:0;font-family:var(--mono);letter-spacing:0.08em;}
.lock-badge.locked{background:rgba(255,112,67,.12);color:#ff7043;border:1px solid rgba(255,112,67,.3);}
.lock-badge.countdown{background:rgba(232,213,163,.08);color:var(--gold);border:1px solid rgba(232,213,163,.25);}
.lock-badge.urgent{background:rgba(217,79,61,.1);color:#e88a80;border:1px solid rgba(217,79,61,.3);}
.round-dates{font-size:10px;color:var(--muted);margin:-8px 0 14px;padding-left:2px;
  font-family:var(--mono);letter-spacing:0.12em;}
.lock-badge.open{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--faint);}

/* ── Auth page ───────────────────────────────────────────────── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:var(--bg);}
.auth-card{background:var(--card);border:1px solid var(--border);
  padding:40px 36px;width:100%;max-width:400px;}
.auth-logo{text-align:center;font-size:44px;margin-bottom:12px;}
.auth-title{text-align:center;color:var(--gold);font-size:28px;font-weight:400;margin-bottom:4px;
  font-family:var(--display);letter-spacing:0.1em;}
.auth-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:28px;
  font-family:var(--mono);letter-spacing:0.08em;}
.auth-switch{text-align:center;font-size:11px;color:var(--muted);margin-top:16px;
  font-family:var(--mono);}
.auth-switch span{color:var(--gold);cursor:pointer;}
.auth-switch span:hover{text-decoration:underline;}

/* ── Notice banner ───────────────────────────────────────────── */
.notice{background:rgba(232,213,163,.05);border:1px solid var(--border);
  padding:8px 14px;font-size:11px;color:var(--gold);margin-bottom:12px;
  font-family:var(--mono);letter-spacing:0.06em;}
.locked-notice{background:rgba(255,112,67,.06);border:1px solid rgba(255,112,67,.2);
  padding:10px 14px;font-size:12px;color:#ff7043;margin-bottom:14px;
  font-family:var(--mono);}

/* ── Spinner ─────────────────────────────────────────────────── */
.spin{display:flex;align-items:center;justify-content:center;padding:80px;
  font-size:40px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Hamburger & Sidebar ──────────────────────────────────────── */
.hamburger{background:transparent;border:none;cursor:pointer;
  padding:6px 8px;display:flex;flex-direction:column;
  gap:5px;flex-shrink:0;margin-right:4px;}
.hamburger span{display:block;width:18px;height:1px;background:var(--muted);}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:200;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.sidebar-overlay.open{opacity:1;pointer-events:auto;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;
  background:var(--card);border-right:1px solid var(--border2);
  z-index:201;transform:translateX(-100%);transition:transform 0.3s ease;
  display:flex;flex-direction:column;overflow-y:auto;}
.sidebar.open{transform:translateX(0);}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border2);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.sidebar-close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;}
.sidebar-section{padding:16px 20px;border-bottom:1px solid var(--border2);}
.sidebar-section-label{color:var(--muted);font-size:9px;font-weight:500;letter-spacing:0.2em;
  text-transform:uppercase;margin:0 0 10px;font-family:var(--mono);}
.sidebar-nav-btn{width:100%;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:transparent;
  border:1px solid var(--border2);color:var(--text);
  cursor:pointer;font-size:11px;margin-bottom:6px;
  font-family:var(--mono);letter-spacing:0.08em;
  transition:all .15s;text-align:left;}
.sidebar-nav-btn:hover{background:rgba(255,255,255,.04);border-color:var(--gold);color:var(--gold);}
.sidebar-nav-btn.active{background:rgba(232,213,163,.07);border-color:rgba(232,213,163,.25);color:var(--gold);}

/* ── Dashboard ───────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:2px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border2);padding:16px;}
.stat-icon{font-size:20px;margin-bottom:8px;}
.stat-value{font-size:22px;font-weight:400;margin-bottom:2px;font-family:var(--display);
  letter-spacing:0.05em;color:var(--text);}
.stat-label{font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.12em;text-transform:uppercase;}
.mini-bar-wrap{height:2px;background:rgba(255,255,255,0.06);flex:1;overflow:hidden;}
.mini-bar{height:100%;background:var(--gold);}
.player-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;
  padding:4px 6px;transition:background .15s;}
.highlight-card{background:var(--card);border:1px solid var(--border2);padding:16px;}
.highlight-label{color:var(--muted);font-size:10px;margin-bottom:8px;
  font-family:var(--mono);letter-spacing:0.15em;text-transform:uppercase;}
.highlight-name{color:var(--text);font-weight:400;font-size:14px;margin-bottom:2px;}
.highlight-stat{color:var(--gold);font-size:11px;font-family:var(--mono);}
.rounds-table{width:100%;border-collapse:collapse;font-size:12px;}
.rounds-table th{color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border2);
  text-align:center;white-space:nowrap;font-family:var(--mono);
  font-size:10px;letter-spacing:0.12em;text-transform:uppercase;}
.rounds-table th:first-child{text-align:left;}
.rounds-table td{padding:8px 8px;border-bottom:1px solid var(--border2);text-align:center;}
.rounds-table td:first-child{text-align:left;color:var(--text);}
.rounds-table tr:hover td{background:rgba(255,255,255,0.02);}

/* ── Bracket ─────────────────────────────────────────────────── */
.bracket-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:2px;margin-bottom:4px;}
.bracket-match{background:rgba(255,255,255,0.03);border:1px solid var(--border2);
  padding:8px 12px;font-size:12px;}
.bracket-match.has-result{border-color:rgba(102,187,106,0.25);}
.bracket-team{display:flex;justify-content:space-between;align-items:center;padding:3px 0;}
.bracket-team.winner{color:#a5d6a7;font-weight:500;}
.bracket-team.loser{color:var(--muted);}
.bracket-vs{color:var(--faint);font-size:10px;text-align:center;padding:1px 0;font-family:var(--mono);}
.bracket-section{margin-bottom:16px;}
.bracket-section-title{color:#ff7043;font-size:11px;font-weight:500;margin-bottom:10px;
  font-family:var(--mono);letter-spacing:0.15em;text-transform:uppercase;}

/* ── Light mode overrides ─────────────────────────────────────── */
body.light-mode{
  --bg:#f4f1ec;--card:#ffffff;--card2:#f0ece4;
  --gold:#9a7a35;--gold2:#7a5f25;
  --text:#1a1714;--muted:#7a7268;--faint:#d0c8bc;
  --border:rgba(154,122,53,0.2);--border2:rgba(0,0,0,0.08);
  --green:#2e7d32;--red:#b83228;--blue:#1565c0;--purple:#6a1b9a;
}
body.light-mode .nav{background:rgba(244,241,236,0.95);border-color:rgba(0,0,0,0.08);}
body.light-mode .nav-signout{border-color:rgba(0,0,0,0.15);color:var(--muted);}
body.light-mode .sidebar{background:#fff;border-color:rgba(0,0,0,0.08);}
body.light-mode .sidebar-overlay{background:rgba(0,0,0,0.35);}
body.light-mode .auth-card{background:#fff;border-color:rgba(154,122,53,0.2);}
body.light-mode .score-in,
body.light-mode .input{background:rgba(0,0,0,0.03);border-color:rgba(0,0,0,0.12);color:var(--text);}
body.light-mode .team-btn{background:rgba(0,0,0,0.03);border-color:rgba(0,0,0,0.1);color:var(--muted);}
body.light-mode .admin-select,
body.light-mode .admin-score{background:#f0ece4;border-color:rgba(255,112,67,.3);color:var(--text);}
body.light-mode .spin{color:var(--gold);}
body.light-mode .stat-card,
body.light-mode .highlight-card{background:#fff;}
body.light-mode .bracket-match{background:rgba(0,0,0,0.02);}

/* ── Dark mode toggle button ──────────────────────────────────── */
.theme-toggle-btn{width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:rgba(255,255,255,0.03);
  border:1px solid var(--border2);color:var(--muted);cursor:pointer;
  font-size:10px;font-family:var(--mono);letter-spacing:0.12em;
  text-transform:uppercase;transition:all .15s;}
body.light-mode .theme-toggle-btn{background:rgba(0,0,0,0.03);border-color:rgba(0,0,0,0.1);}
.theme-toggle-btn:hover{border-color:var(--gold);color:var(--gold);}
.toggle-track{width:40px;height:22px;border-radius:11px;position:relative;
  flex-shrink:0;transition:background 0.3s;background:#2a2a2a;}
body.light-mode .toggle-track{background:var(--gold);}

// Convert UTC ISO string → datetime-local input value (local time)
function toDatetimeLocal(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// Returns a human-readable countdown string (e.g. "in 2h 30m", "in 4d 3h", "PASSED")
function scheduleCountdown(isoStr) {
  if (!isoStr) return '';
  const diff = new Date(isoStr).getTime() - Date.now();
  if (diff <= 0) return 'PASSED';
  const totalMins = Math.floor(diff / 60000);
  const hrs = Math.floor(totalMins / 60);
  const mins = totalMins % 60;
  if (hrs >= 48) return `in ${Math.floor(hrs/24)}d ${hrs%24}h`;
  if (hrs >= 1)  return `in ${hrs}h ${mins}m`;
  return `in ${mins}m`;
}

async function checkLockSchedules() {
  const now = Date.now();
  let changed = false;
  for (const rid of Object.keys(ROUNDS)) {
    const sched = S.lockSchedules[rid];
    if (!sched) continue;
    const locked = S.roundSettings[rid]?.locked || false;

    if (sched.lockAt && !locked && now >= new Date(sched.lockAt).getTime()) {
      // Time to auto-lock
      if (!S.roundSettings[rid]) S.roundSettings[rid] = {};
      S.roundSettings[rid].locked = true;
      try {
        await sb.from('round_settings').upsert({ round_id: rid, locked: true }, { onConflict: 'round_id' });
      } catch(e) { S.roundSettings[rid].locked = false; }
      delete S.lockSchedules[rid].lockAt;
      changed = true;
    }

    if (sched.unlockAt && locked && now >= new Date(sched.unlockAt).getTime()) {
      // Time to auto-unlock
      if (!S.roundSettings[rid]) S.roundSettings[rid] = {};
      S.roundSettings[rid].locked = false;
      try {
        await sb.from('round_settings').upsert({ round_id: rid, locked: false }, { onConflict: 'round_id' });
      } catch(e) { S.roundSettings[rid].locked = true; }
      delete S.lockSchedules[rid].unlockAt;
      changed = true;
    }
  }
  if (changed) { saveLockSchedules(); render(); }
}

function matchCountdown(kickoff) {
  if (!kickoff) return '';
  const kickoffDate = new Date(kickoff);
  const lockTime = kickoffDate.getTime() - 3600000; // 1 hr before kickoff
  const diff = lockTime - Date.now();
  // Local kickoff time in browser's own timezone — automatically correct for everyone
  const localTime = kickoffDate.toLocaleString(undefined, {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  if (diff <= 0) return `<span class="lock-badge locked" title="Kicked off ${localTime} (your time)">🔒 Locked</span>`;
  const totalMins = Math.floor(diff / 60000);
  const hrs = Math.floor(totalMins / 60);
  const mins = totalMins % 60;
  const tip = `title="Kicks off ${localTime} (your local time)"`;
  if (hrs >= 48) return `<span class="lock-badge countdown" ${tip}>🕐 Locks in ${Math.floor(hrs/24)}d ${hrs%24}h</span>`;
  if (hrs >= 1)  return `<span class="lock-badge ${hrs < 3 ? 'urgent' : 'countdown'}" ${tip}>🕐 Locks in ${hrs}h ${mins}m</span>`;
  return `<span class="lock-badge urgent" ${tip}>⚠️ Locks in ${mins}m</span>`;
}

// 6. SCORING
// ════════════════════════════════════════════════════════════════
function calcScore(uid) {
  let total = 0, correctPicks = 0, exactScores = 0;

  // Pre-tournament picks scoring
  const ptBa = S.bonusAnswers[uid]?.['pt'] || {};
  const ptBr = S.bonusResults['pt'] || {};
  for (const g of Object.keys(GROUPS)) {
    const p1 = ptBa[`pt_${g}_1`]?.answer, p2 = ptBa[`pt_${g}_2`]?.answer;
    const r1 = ptBr[`pt_${g}_1`]?.answer,  r2 = ptBr[`pt_${g}_2`]?.answer;
    if (!r1 && !r2) continue;
    const qualified = new Set([r1, r2].filter(Boolean));
    if (p1) { if (p1 === r1) total += 2; else if (r1 && qualified.has(p1)) total += 1; }
    if (p2) { if (p2 === r2) total += 2; else if (r2 && qualified.has(p2)) total += 1; }
  }
  const winPts = S.ptSettings?.winnerPts ?? 10;
  const winPick = ptBa['pt_winner']?.answer, winRes = ptBr['pt_winner']?.answer;
  if (winPick && winRes && winPick === winRes) total += winPts;

  for (const round of Object.values(ROUNDS)) {
    if (round.special === 'pretournament') continue;
    const rid = round.id;
    const { match: mMult, bonus: bMult } = getMultipliers(rid);
    for (const m of round.matches) {
      const pick   = S.picks[uid]?.[rid]?.[m.id];
      const result = S.results[rid]?.[m.id];
      if (!pick || !result || !result.winner) continue;
      if (pick.winner && pick.winner === result.winner) { total += 2 * mMult; correctPicks++; }
      // Exact score is independent of winner pick
      const sh = String(pick.score_home ?? ''), sa = String(pick.score_away ?? '');
      const rh = String(result.score_home ?? ''), ra = String(result.score_away ?? '');
      if (sh !== '' && rh !== '' && sh === rh && sa === ra) { total += 1 * mMult; exactScores++; }
    }
    for (const bq of getActiveQuestions(rid)) {
      const ans     = S.bonusAnswers[uid]?.[rid]?.[bq.id];
      const correct = S.bonusResults[rid]?.[bq.id];
      if (!ans || !correct || !correct.answer || !ans.answer) continue;
      if (ans.answer === correct.answer) {
        const wager = round.knockout ? (Number(ans.wager) || 0) : 0;
        total += (bq.pts * bMult) + wager;
      } else if (round.knockout && Number(ans.wager) > 0) {
        total -= Number(ans.wager);
      }
    }
  }
  return { total, correctPicks, exactScores };
}

function getLeaderboard() {
  return S.profiles
    .map(p => ({ ...p, ...calcScore(p.id) }))
    .sort((a,b) => b.total - a.total || b.correctPicks - a.correctPicks || b.exactScores - a.exactScores)
    .map((p, i, arr) => {
      const tied = i > 0 && p.total === arr[i-1].total && p.correctPicks === arr[i-1].correctPicks && p.exactScores === arr[i-1].exactScores;
      return { ...p, rank: tied ? arr[i-1].rank : i + 1 };
    });
}

async function loadAllData() {
  // profiles
  const { data: profiles } = await sb.from('profiles').select('*');
  S.profiles = profiles || [];

  // picks (admin sees all, others see own + locked rounds via RLS)
  const { data: picks } = await sb.from('picks').select('*');

    if (!S.picks[p.user_id][p.round_id]) S.picks[p.user_id][p.round_id] = {};
    S.picks[p.user_id][p.round_id][p.match_id] = { winner: p.winner, score_home: p.score_home, score_away: p.score_away };
  }

  // bonus answers
  const { data: bans } = await sb.from('bonus_answers').select('*');
  S.bonusAnswers = {};
  for (const b of (bans || [])) {
    if (!S.bonusAnswers[b.user_id]) S.bonusAnswers[b.user_id] = {};
    if (!S.bonusAnswers[b.user_id][b.round_id]) S.bonusAnswers[b.user_id][b.round_id] = {};
    S.bonusAnswers[b.user_id][b.round_id][b.question_id] = { answer: b.answer, wager: b.wager };
  }

  // results
  const { data: results } = await sb.from('results').select('*');
  S.results = {};
  for (const r of (results || [])) {
    if (!S.results[r.round_id]) S.results[r.round_id] = {};
    S.results[r.round_id][r.match_id] = { winner: r.winner, score_home: r.score_home, score_away: r.score_away };
  }

  // bonus results
  const { data: bres } = await sb.from('bonus_results').select('*');
  S.bonusResults = {};
  for (const b of (bres || [])) {
    if (!S.bonusResults[b.round_id]) S.bonusResults[b.round_id] = {};
    S.bonusResults[b.round_id][b.question_id] = { answer: b.answer };
  }

  // round settings
  const { data: rs } = await sb.from('round_settings').select('*');
  S.roundSettings = {};
  for (const r of (rs || [])) S.roundSettings[r.round_id] = { locked: r.locked, deadline: r.deadline };
}

async function upsertPick(rid, mid, winner, sh, sa) {
  await sb.from('picks').upsert({
    user_id: S.user.id, round_id: rid, match_id: mid,
    winner, score_home: String(sh), score_away: String(sa),
  }, { onConflict: 'user_id,round_id,match_id' });
  if (!S.picks[S.user.id]) S.picks[S.user.id] = {};
  if (!S.picks[S.user.id][rid]) S.picks[S.user.id][rid] = {};
  S.picks[S.user.id][rid][mid] = { winner, score_home: String(sh), score_away: String(sa) };

  await sb.from('bonus_answers').upsert({
    user_id: S.user.id, round_id: rid, question_id: qid, answer, wager: Number(wager) || 0,
  }, { onConflict: 'user_id,round_id,question_id' });
  if (!S.bonusAnswers[S.user.id]) S.bonusAnswers[S.user.id] = {};
  if (!S.bonusAnswers[S.user.id][rid]) S.bonusAnswers[S.user.id][rid] = {};
  S.bonusAnswers[S.user.id][rid][qid] = { answer, wager: Number(wager) || 0 };

async function upsertResult(rid, mid, winner, sh, sa) {
  // Update local state immediately so scoring preview works even if DB write fails
  if (!S.results[rid]) S.results[rid] = {};
  S.results[rid][mid] = { winner, score_home: String(sh), score_away: String(sa) };

  const { error } = await sb.from('results').upsert(
    { round_id: rid, match_id: mid, winner, score_home: String(sh), score_away: String(sa) },
    { onConflict: 'round_id,match_id' }
  );
  if (error) {
    console.error('upsertResult failed:', error);
    showAdminError(`❌ DB write failed: ${error.message} — Run the Supabase SQL fix (see scoring preview card).`);
  }
}

function showAdminError(msg) {
  let el = document.getElementById('admin-err-banner');
  if (!el) {
    el = document.createElement('div');
    el.id = 'admin-err-banner';
    el.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9999;' +
      'background:#1a0000;border:1px solid var(--red);color:#e88a80;padding:10px 18px;' +
      'font-size:12px;font-family:var(--mono);max-width:90vw;cursor:pointer;';
    el.onclick = () => el.remove();
    document.body.appendChild(el);
  }
  el.textContent = msg + '  (click to dismiss)';
  setTimeout(() => el?.remove(), 8000);
}

async function upsertBonusResult(rid, qid, answer) {
  await sb.from('bonus_results').upsert(
    { round_id: rid, question_id: qid, answer },
    { onConflict: 'round_id,question_id' }
  );
  if (!S.bonusResults[rid]) S.bonusResults[rid] = {};
  S.bonusResults[rid][qid] = { answer };
}

async function toggleLock(rid) {
  const current = S.roundSettings[rid]?.locked || false;
  if (!S.roundSettings[rid]) S.roundSettings[rid] = {};
  S.roundSettings[rid].locked = !current;
  render(); // optimistic UI update
  try {
    const { error } = await sb.from('round_settings').upsert(
      { round_id: rid, locked: !current },
      { onConflict: 'round_id' }
    );
    if (error) throw error;
  } catch (e) {
    // Revert and show error
    S.roundSettings[rid].locked = current;
    render();
    alert(`Lock failed: ${e.message || e}\n\nMake sure the round_settings table exists in Supabase and allows writes.`);
  }
}

async function awardAchievement(profileId, type) {
  const prof = S.profiles.find(p => p.id === profileId);
  if (!prof) return;
  const existing = prof.achievements || [];
  const updated  = [...existing, { type, awardedAt: new Date().toISOString() }];
  await sb.from('profiles').update({ achievements: updated }).eq('id', profileId);
  prof.achievements = updated;
}

  const updated = (prof.achievements || []).filter((_, i) => i !== index);
  await sb.from('profiles').update({ achievements: updated }).eq('id', profileId);
  prof.achievements = updated;
}

        <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.07);padding:5px 14px;border-radius:20px">
          <span style="font-size:${rank<=3?20:14}px;color:${rankColor}">${typeof rank==='number'&&rank<=3?['🥇','🥈','🥉'][rank-1]:'#'+rank}</span>
          <span style="color:${rankColor};font-size:13px;font-weight:bold">${typeof rank==='number'&&rank<=3?['Champion','Runner-up','3rd Place'][rank-1]:'Rank '+rank}</span>
        </div>
      </div>
      <div style="padding:16px 20px 20px">
        <div class="modal-stat-row">
          <div class="modal-stat"><div class="modal-stat-val" style="color:#4CAF50">${total}</div><div class="modal-stat-lbl">Points</div></div>
          <div class="modal-stat"><div class="modal-stat-val" style="color:#90caf9">${correctPicks}</div><div class="modal-stat-lbl">Correct Picks</div></div>
          <div class="modal-stat"><div class="modal-stat-val" style="color:#ce93d8">${exactScores}</div><div class="modal-stat-lbl">Exact Scores</div></div>
        </div>
        <h4 style="color:var(--gold);margin:0 0 10px;font-size:13px">🏅 Achievements</h4>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">${achBadges}</div>
        ${awardSelect}
      </div>
    </div>`;

  el.onclick = () => { el.remove(); S.selectedPlayer = null; };
  document.body.appendChild(el);

  document.getElementById('modal-close-btn').onclick = () => { el.remove(); S.selectedPlayer = null; };

  el.querySelectorAll('[data-remove-ach]').forEach(btn => {
    btn.onclick = async e => {
      e.stopPropagation();
      await removeAchievement(profile.id, Number(btn.dataset.removeAch));
      el.remove();
      showPlayerModal(S.profiles.find(p => p.id === profile.id) || profile);
    };
  });

  if (isAdmin) {
    document.getElementById('ach-award-btn').onclick = async () => {
      const type = document.getElementById('ach-select').value;
      if (!type) return;
      await awardAchievement(profile.id, type);
      el.remove();
      showPlayerModal(S.profiles.find(p => p.id === profile.id) || profile);
    };
  }
}

// ── Auth ─────────────────────────────────────────────────────────

  document.getElementById('app').innerHTML = `

            background:${isPlayer?'rgba(255,215,0,0.1)':'transparent'};color:${isPlayer?'var(--gold)':'var(--muted)'};
            cursor:pointer;font-size:13px;font-weight:700;font-family:Arial,sans-serif">Player</button>
          <button id="tab-admin" style="flex:1;padding:9px;border-radius:10px;border:2px solid ${isAdmin?'#ff7043':'var(--faint)'};

        <div id="auth-msg"></div>

        ${isAdmin ? `
          <div class="auth-sub" style="margin-bottom:16px">Enter the admin PIN to access the control panel</div>
          <div class="field"><label class="label">Admin PIN</label>
            <input class="input" id="a-pin" type="password" placeholder="••••••••" autocomplete="off"></div>

            Enter as Admin →
          </button>
        ` : `
          <div class="auth-sub" style="margin-bottom:16px">${isLogin ? 'Sign in to make your picks' : 'Create your account'}</div>
          ${!isLogin ? `
            <div class="field"><label class="label">Display name</label>
              <input class="input" id="a-name" placeholder="e.g. Alex" autocomplete="off"></div>` : ''}
          <div class="field"><label class="label">Email address</label>
            <input class="input" id="a-email" type="email" placeholder="you@example.com" autocomplete="email"></div>
          <div class="field"><label class="label">Password</label>
            <input class="input" id="a-pw" type="password" placeholder="${isLogin ? 'Your password' : 'At least 6 characters'}" autocomplete="${isLogin ? 'current-password' : 'new-password'}"></div>
          <button class="btn btn-gold" id="a-submit" style="width:100%;margin-top:4px">
            ${isLogin ? 'Sign In →' : 'Create Account →'}
          </button>
          <div class="auth-switch">
            ${isLogin ? "Don't have an account? <span id='a-toggle'>Register here</span>"
                      : "Already registered? <span id='a-toggle'>Sign in</span>"}
          </div>
        `}
      </div>
    </div>`;

  document.getElementById('tab-player').onclick = () => {
    if (S.authMode === 'admin') S.authMode = 'login';
    renderAuth();
  };
  document.getElementById('tab-admin').onclick = () => { S.authMode = 'admin'; renderAuth(); };

  if (isAdmin) {
    document.getElementById('a-pin').onkeydown = e => { if (e.key === 'Enter') doAdminPin(); };
    document.getElementById('a-submit').onclick = doAdminPin;
  } else {
    document.getElementById('a-toggle').onclick = () => { S.authMode = isLogin ? 'register' : 'login'; renderAuth(); };
    document.getElementById('a-pw').onkeydown = e => { if (e.key === 'Enter') doAuth(); };
    document.getElementById('a-submit').onclick = doAuth;
  }
}

async function doAdminPin() {
  const pin   = document.getElementById('a-pin').value;
  const msgEl = document.getElementById('auth-msg');
  const btn   = document.getElementById('a-submit');
  if (pin !== 'admin2026') { showMsg(msgEl, 'Wrong PIN.', 'err'); btn.style.background = '#c0392b'; setTimeout(() => btn.style.background = '#ff7043', 500); return; }
  btn.disabled = true; btn.textContent = 'Loading…';
  S.user    = { id: 'admin_pin' };
  S.profile = { is_admin: true, name: 'Admin', nickname: 'Admin' };
  await loadAllData();
  S.page = 'admin';
  render();
}

async function doAuth() {
  const email = document.getElementById('a-email').value.trim();
  const pw    = document.getElementById('a-pw').value;
  const msgEl = document.getElementById('auth-msg');
  const btn   = document.getElementById('a-submit');

  if (!email || !pw) { showMsg(msgEl, 'Please fill in all fields.', 'err'); return; }
  btn.disabled = true; btn.textContent = 'Please wait…';

  if (S.authMode === 'login') {
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) { showMsg(msgEl, error.message, 'err'); btn.disabled = false; btn.textContent = 'Sign In →'; }
  } else {
    const name = document.getElementById('a-name').value.trim();
    if (!name) { showMsg(msgEl, 'Please enter a display name.', 'err'); btn.disabled = false; btn.textContent = 'Create Account →'; return; }
    const { data, error } = await sb.auth.signUp({ email, password: pw });
    if (error) { showMsg(msgEl, error.message, 'err'); btn.disabled = false; btn.textContent = 'Create Account →'; return; }
    await sb.from('profiles').insert({ id: data.user.id, name });
    showMsg(msgEl, 'Account created! Signing you in…', 'ok');
  }
}

// ── Picks page ───────────────────────────────────────────────────
function renderPicks() {
  const round    = ROUNDS[S.activeRound];
  const rid      = round.id;
  const uid      = S.user.id;
  const locked   = S.roundSettings[rid]?.locked || false;
  const isAdmin  = S.profile?.is_admin;
  const isPinAdmin = S.user?.id === 'admin_pin';
  const readOnly = (locked && !isAdmin) || isAdmin || isPinAdmin;

  const pillsHtml = Object.values(ROUNDS).map(r => {
    const lk = S.roundSettings[r.id]?.locked;
    const shortLabel = r.id === 'pt' ? 'Pre-Tournament' : r.label.replace('Group Stage – Round ','GS ');
    return `<button class="pill ${lk?'locked':''} ${S.activeRound===r.id?'active':''}" data-r="${r.id}">
      ${shortLabel} ${lk?'🔒':''}
    </button>`;
  }).join('');

  // Admin-locked round: hide everything from regular users
  if (locked && !isAdmin && !isPinAdmin) {
    return `
      <div class="page-title">My Picks</div>
      <div class="pill-row">${pillsHtml}</div>
      ${round.dateRange ? `<div class="round-dates">📅 ${round.dateRange}</div>` : ''}
      <div class="card" style="text-align:center;padding:56px 24px;border-color:rgba(255,112,67,0.2)">
        <div style="font-size:52px;margin-bottom:20px">🔒</div>
        <div style="font-family:var(--display);font-size:36px;letter-spacing:0.06em;color:#ff7043;margin-bottom:12px">ROUND LOCKED</div>
        <p style="color:var(--muted);font-size:13px;max-width:320px;margin:0 auto;line-height:1.7">
          This round is currently locked. Picks are hidden until the admin opens it.
        </p>
      </div>`;
  }

  // ── Pre-Tournament special render ──────────────────────────────
  if (round.special === 'pretournament') {
    const winPts = S.ptSettings?.winnerPts ?? 10;
    const allTeams = Object.values(GROUPS).flat().sort();
    const maxGroupPts = Object.keys(GROUPS).length * 4; // 12 × 4 = 48
    const totalMax = maxGroupPts + winPts;

    const groupHtml = Object.entries(GROUPS).map(([g, teams]) => {
      const p1 = S.bonusAnswers[uid]?.['pt']?.[`pt_${g}_1`]?.answer || '';
      const p2 = S.bonusAnswers[uid]?.['pt']?.[`pt_${g}_2`]?.answer || '';
      const r1 = S.bonusResults['pt']?.[`pt_${g}_1`]?.answer || '';
      const r2 = S.bonusResults['pt']?.[`pt_${g}_2`]?.answer || '';
      const qualified = new Set([r1, r2].filter(Boolean));

      const badge = (pick, correctPos, hasResults) => {
        if (!hasResults || !pick) return '';
        if (pick === correctPos) return `<span class="pts-badge pts-ok">+2 pts ✅</span>`;
        if (qualified.has(pick)) return `<span class="pts-badge pts-part">+1 pt 🎯</span>`;
        return `<span class="pts-badge pts-bad">0 pts ❌</span>`;
      };
      const hasResults = !!(r1 || r2);

      const opts1 = teams.map(t => `<option value="${t}" ${p1===t?'selected':''}>${F(t)} ${t}</option>`).join('');
      const opts2 = teams.map(t => `<option value="${t}" ${p2===t?'selected':''}>${F(t)} ${t}</option>`).join('');

      return `<div class="bonus-q">
        <div class="bonus-q-text" style="font-weight:500;margin-bottom:8px">
          Group ${g}
          <span style="font-size:11px;color:var(--muted);font-weight:300"> — ${teams.map(t=>F(t)+' '+t).join(' · ')}</span>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
          <div>
            <div style="font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:0.15em;margin-bottom:4px">1ST PLACE</div>
            <select class="input" data-action="pt-group" data-g="${g}" data-pos="1"
              style="padding:7px 10px;font-size:12px;width:auto;cursor:pointer" ${readOnly?'disabled':''}>
              <option value="">— Select team —</option>${opts1}
            </select>
          </div>
          <div>
            <div style="font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:0.15em;margin-bottom:4px">2ND PLACE</div>
            <select class="input" data-action="pt-group" data-g="${g}" data-pos="2"
              style="padding:7px 10px;font-size:12px;width:auto;cursor:pointer" ${readOnly?'disabled':''}>
              <option value="">— Select team —</option>${opts2}
            </select>
          </div>
          ${badge(p1, r1, hasResults)}
          ${badge(p2, r2, hasResults)}
        </div>
      </div>`;
    }).join('');

    const winnerPick = S.bonusAnswers[uid]?.['pt']?.['pt_winner']?.answer || '';
    const winnerRes  = S.bonusResults['pt']?.['pt_winner']?.answer || '';
    let wBadge = '';
    if (winnerRes) {
      wBadge = winnerPick === winnerRes
        ? `<span class="pts-badge pts-ok">+${winPts} pts ✅</span>`
        : winnerPick ? `<span class="pts-badge pts-bad">0 pts ❌</span>` : '';
    }
    const allTeamOpts = allTeams.map(t => `<option value="${t}" ${winnerPick===t?'selected':''}>${F(t)} ${t}</option>`).join('');

    return `
      <div class="page-title">My Picks</div>
      ${isAdmin || isPinAdmin ? `<div class="notice">👁 Admin view — picks are read-only.</div>` : ''}
      <div class="pill-row">${pillsHtml}</div>
      <div class="round-dates">📅 Before Jun 11 · Lock in your pre-tournament predictions</div>
      <div class="notice" style="margin-bottom:16px">
        🏆 Up for grabs: <strong>${totalMax} pts</strong> — ${maxGroupPts} from group picks (12 groups × max 4 pts) + ${winPts} from tournament winner
      </div>
      <div class="card">
        <div class="card-title">🏆 Group Stage Predictions</div>
        <p style="color:var(--muted);font-size:12px;margin-bottom:16px;line-height:1.7">
          Pick the top 2 finishers from each group <strong style="color:var(--text)">in order</strong>.
          Correct team in the correct spot = <strong style="color:var(--gold)">2 pts</strong>.
          Correct team but wrong spot = <strong style="color:#90caf9">1 pt</strong>.
          Wrong team = 0 pts.
        </p>
        <div class="bonus-section" style="padding:0;background:transparent;border:none;margin-top:0">
          ${groupHtml}
        </div>
      </div>
      <div class="card" style="border-color:rgba(232,213,163,0.2)">
        <div class="card-title" style="color:var(--gold)">🏆 Tournament Winner</div>
        <p style="color:var(--muted);font-size:12px;margin-bottom:12px">
          Who will lift the 2026 World Cup trophy?
          <strong style="color:var(--gold)">${winPts} pts</strong> for the correct pick.
        </p>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <select class="input" data-action="pt-winner" style="max-width:300px;font-size:13px;padding:10px 12px;cursor:pointer" ${readOnly?'disabled':''}>
            <option value="">— Select champion —</option>${allTeamOpts}
          </select>
          ${wBadge}
        </div>
      </div>`;
  }

  // ── Regular round render ───────────────────────────────────────
  const isMatchLocked = m => {
    if (locked) return true;
    const ko = getKickoff(m.id, m.kickoff);
    if (!ko) return false;
    return Date.now() >= new Date(ko).getTime() - 3600000;
  };
  const matchRO = m => isAdmin || isPinAdmin || isMatchLocked(m);

  const { match: mMult, bonus: bMult } = getMultipliers(rid);
  const bonusQs = getActiveQuestions(rid);
  const matchMaxPts = round.matches.length * 3 * mMult;
  const bonusMaxPts = bonusQs.reduce((sum, q) => sum + q.pts * bMult, 0);
  const totalMax = matchMaxPts + bonusMaxPts;
  const multNote = (mMult !== 1 || bMult !== 1)
    ? ` <span style="color:#ff7043;font-size:9px">(×${mMult} match · ×${bMult} bonus multipliers active)</span>` : '';
  const bonusNote = bonusQs.length
    ? ` + ${bonusMaxPts} pts (${bonusQs.length} bonus Q${bonusQs.length>1?'s':''})` : '';
  const ptsHtml = `<div style="background:rgba(232,213,163,0.04);border:1px solid rgba(232,213,163,0.1);
    padding:8px 14px;margin-bottom:12px;font-size:11px;font-family:var(--mono);color:var(--muted)">
    🏆 Up for grabs: <strong style="color:var(--gold)">${totalMax} pts</strong> —
    ${round.matches.length} matches × max 3 pts = ${matchMaxPts}${bonusNote}${multNote}
  </div>`;

  const matchesHtml = round.matches.map(m => {
    const homeTeam = getBracketTeam(m.id, 'home', m.home);
    const awayTeam = getBracketTeam(m.id, 'away', m.away);
    const pick   = S.picks[uid]?.[rid]?.[m.id] || {};
    const result = S.results[rid]?.[m.id] || {};
    const winner = pick.winner || '';
    const sh     = pick.score_home ?? '';
    const sa     = pick.score_away ?? '';
    const rw     = result.winner || '';
    const rsh    = result.score_home ?? '';
    const rsa    = result.score_away ?? '';
    const hasResult = !!rw;
    const ro = matchRO(m);

    const teamBtn = (team, isDraw) => {
      const isSel = winner === team;
      let cls = isDraw ? 'draw' : '';
      if (isSel && hasResult) cls += rw === team ? ' correct' : ' wrong';
      else if (isSel) cls += ' sel';
      const label = isDraw ? '🤝 Draw' : `${F(team)} ${team}`;
      return `<button class="team-btn ${cls}" data-action="pick" data-rid="${rid}" data-mid="${m.id}" data-team="${team}" ${ro?'disabled':''}>${label}</button>`;
    };

    // Exact score is independent of winner
    const correctWinner = hasResult && winner === rw;
    const exactScore = hasResult && rsh !== '' && String(sh) === String(rsh) && String(sa) === String(rsa) && sh !== '';
    let pts = '';
    if (hasResult && winner) {
      const earned = (correctWinner ? 2 : 0) + (exactScore ? 1 : 0);
      if (earned === 3)      pts = `<span class="pts-badge pts-ok">+3 pts</span>`;
      else if (earned === 2) pts = `<span class="pts-badge pts-part">+2 pts</span>`;
      else if (earned === 1) pts = `<span class="pts-badge pts-part" style="color:#ce93d8;background:rgba(91,33,182,0.2);border-color:rgba(206,147,216,0.3)">+1 pt</span>`;
      else                   pts = `<span class="pts-badge pts-bad">0 pts</span>`;
    }

    const cdBadge = (isAdmin || isPinAdmin) ? '' : matchCountdown(getKickoff(m.id, m.kickoff));

    return `<div class="match-row">
      ${teamBtn(homeTeam,false)}
      <span class="vs">vs</span>
      ${teamBtn(awayTeam,false)}
      ${!round.knockout ? teamBtn('Draw',true) : ''}
      <div class="score-wrap" style="flex-direction:column;gap:2px;align-items:center">
        <div style="display:flex;gap:2px;align-items:center">
          <span style="font-size:9px;color:var(--muted);font-family:var(--mono);width:34px;text-align:center">H</span>
          <span style="font-size:9px;color:var(--faint);font-family:var(--mono);padding:0 2px"> </span>
          <span style="font-size:9px;color:var(--muted);font-family:var(--mono);width:34px;text-align:center">A</span>
        </div>
        <div style="display:flex;gap:4px;align-items:center">
          <input class="score-in" type="number" min="0" max="20" value="${sh}" placeholder="–"
            data-action="score" data-rid="${rid}" data-mid="${m.id}" data-side="h" ${ro?'disabled':''}>
          <span class="vs">–</span>
          <input class="score-in" type="number" min="0" max="20" value="${sa}" placeholder="–"
            data-action="score" data-rid="${rid}" data-mid="${m.id}" data-side="a" ${ro?'disabled':''}>
        </div>
      </div>
      ${pts}
      ${cdBadge}
    </div>`;
  }).join('');

  const bonusHtml = bonusQs.map(bq => {
    const ans   = S.bonusAnswers[uid]?.[rid]?.[bq.id] || {};
    const bres  = S.bonusResults[rid]?.[bq.id]?.answer || '';
    const wager = ans.wager || 0;
    const maxW  = bq.pts * 2;

    const optsHtml = bq.opts.map(opt => {
      const isSel = ans.answer === opt;
      let cls = '';
      if (isSel && bres) cls = bres===opt ? 'correct' : 'wrong';
      else if (isSel) cls = 'sel';
      return `<button class="bopt ${cls}" data-action="bonus" data-rid="${rid}" data-qid="${bq.id}" data-opt="${opt}" ${readOnly?'disabled':''}>${opt}</button>`;
    }).join('');

    const wagerHtml = round.knockout ? `
      <div class="wager-row">
        <span class="wager-hint">💰 Wager:</span>
        <input class="wager-in" type="number" min="0" max="${maxW}" value="${wager||''}" placeholder="0"
          data-action="wager" data-rid="${rid}" data-qid="${bq.id}" ${readOnly?'disabled':''}>
        <span class="wager-hint">max ${maxW} · correct +${bq.pts+(wager||0)} · wrong −${wager||0}</span>
      </div>` : '';

    return `<div class="bonus-q">
      <div class="bonus-q-text">${bq.text} <span style="color:var(--gold);font-size:10px">[${bq.pts} pts]</span></div>
      <div class="bonus-opts">${optsHtml}</div>
      ${wagerHtml}
    </div>`;
  }).join('');

  return `
    <div class="page-title">My Picks</div>
    ${isAdmin || isPinAdmin ? `<div class="notice">👁 Admin view — picks are read-only. Admins cannot submit picks.</div>` : ''}
    <div class="pill-row">${pillsHtml}</div>
    ${round.dateRange ? `<div class="round-dates">📅 ${round.dateRange}</div>` : ''}
    ${ptsHtml}
    <div class="card">
      <div class="card-title">${round.label}</div>
      <p style="color:var(--muted);font-size:11px;margin-bottom:12px">
        Pick the winner <span style="color:var(--gold)">(2 pts)</span> — then enter the exact score for a bonus
        <span style="color:#ce93d8">(+1 pt, even if your winner pick is wrong)</span>
      </p>
      ${matchesHtml}
    </div>
    ${bonusQs.length ? `<div class="bonus-section">
      <div class="bonus-title">⭐ Bonus Questions</div>
      ${bonusHtml}
    </div>` : ''}`;
}

// ── Leaderboard ───────────────────────────────────────────────────
function renderLeaderboard() {
  const lb = getLeaderboard();
  const maxPts = lb[0]?.total || 1;
  const medal = r => ['🥇','🥈','🥉'][r-1] || `#${r}`;
  const isAdmin  = S.profile?.is_admin;
  const isPinAdmin = S.user?.id === 'admin_pin';
  const meId = (!isAdmin && !isPinAdmin) ? S.user?.id : null;
  const me = meId ? lb.find(p => p.id === meId) : null;

  const achIcons = p => (p.achievements || []).slice(0,4)
    .map(a => ACHIEVEMENTS[a.type] ? `<span class="ach-icon" title="${ACHIEVEMENTS[a.type].label}">${ACHIEVEMENTS[a.type].icon}</span>` : '')
    .join('');

  const rows = lb.map((p,i) => {
    const barW = Math.round((p.total/maxPts)*100);
    const isMe = p.id === meId;
    return `<tr class="${i===0?'gold-row':''} ${isMe?'me-row':''}" data-uid="${p.id}" style="cursor:pointer${isMe?';outline:1px solid rgba(232,213,163,0.35)':''}">
      <td><span class="rank-icon">${medal(p.rank)}</span></td>
      <td>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span${isMe?' style="color:var(--gold);font-weight:500"':''}>${p.nickname||p.name}${isMe?' <span style="font-size:9px;font-family:var(--mono);color:var(--muted)">(you)</span>':''}</span>
          <span class="ach-icons">${achIcons(p)}</span>
        </div>
      </td>
      <td style="color:#90caf9">${p.correctPicks}</td>
      <td style="color:#ce93d8">${p.exactScores}</td>
      <td><span class="lb-bar-wrap"><span class="lb-bar" style="width:${barW}%"></span></span></td>
      <td><span class="lb-pts">${p.total}</span></td>
    </tr>`;
  }).join('');

  // Your standing card — shown to regular players only
  const myCard = me ? (() => {
    const rankColor = me.rank===1?'#FFD700':me.rank===2?'#C0C0C0':me.rank===3?'#CD7F32':'var(--gold)';
    const rankLabel = me.rank===1?'🥇 1st':me.rank===2?'🥈 2nd':me.rank===3?'🥉 3rd':`#${me.rank}`;
    const nextUp = lb[lb.findIndex(p=>p.id===meId)-1];
    const gap = nextUp ? nextUp.total - me.total : 0;
    return `<div class="card" style="border-color:rgba(232,213,163,0.35);margin-bottom:16px">
      <div class="card-title" style="color:var(--gold)">Your Standing</div>
      <div style="display:flex;align-items:center;gap:0;flex-wrap:wrap">
        <div style="flex:0 0 auto;padding:0 24px 0 0;border-right:1px solid var(--border2);margin-right:24px">
          <div style="font-family:var(--display);font-size:52px;line-height:1;color:${rankColor}">${rankLabel}</div>
          <div style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.15em;margin-top:4px">POSITION</div>
        </div>
        <div style="display:flex;gap:24px;flex-wrap:wrap">
          <div>
            <div style="font-family:var(--display);font-size:40px;line-height:1;color:#4CAF50">${me.total}</div>
            <div style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.15em;margin-top:4px">POINTS</div>
          </div>
          <div>
            <div style="font-family:var(--display);font-size:40px;line-height:1;color:#90caf9">${me.correctPicks}</div>
            <div style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.15em;margin-top:4px">CORRECT</div>
          </div>
          <div>
            <div style="font-family:var(--display);font-size:40px;line-height:1;color:#ce93d8">${me.exactScores}</div>
            <div style="font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:0.15em;margin-top:4px">EXACT</div>
          </div>
          ${nextUp ? `<div style="align-self:flex-end;padding-bottom:4px">
            <div style="font-size:11px;color:var(--muted);font-family:var(--mono)">
              ${gap > 0 ? `<span style="color:#e88a80">−${gap} pts</span> behind ${nextUp.nickname||nextUp.name}` : `<span style="color:#4CAF50">You're leading! 🎉</span>`}
            </div>
          </div>` : `<div style="align-self:flex-end;padding-bottom:4px;font-size:11px;color:#4CAF50;font-family:var(--mono)">You're leading! 🎉</div>`}
        </div>
      </div>
    </div>`;
  })() : '';

  return `
    <div class="page-title">🏆 Leaderboard</div>
    ${myCard}
    <div class="card">
      <table class="lb-table">
        <thead><tr>
          <th>Rank</th><th>Player</th><th>Correct</th><th>Exact</th><th></th><th>Pts</th>
        </tr></thead>
        <tbody>${rows||'<tr><td colspan="6" style="color:var(--muted);padding:20px;text-align:center">No players yet.</td></tr>'}</tbody>
      </table>
      <p style="font-size:10px;color:var(--faint);margin-top:12px">Tiebreaker: most correct picks → most exact scores · Click a player to view profile</p>
    </div>`;
}

// ── Admin page ────────────────────────────────────────────────────
function renderAdmin() {
  const adminTab = S.adminTab || 'results';

  const ADMIN_TABS = [
    { id:'results',   label:'📝 Results'  },
    { id:'lock',      label:'🔒 Lock'     },
    { id:'picks',     label:'👁 Picks'    },
    { id:'questions', label:'❓ Bank'     },
    { id:'players',   label:'👥 Players'  },
    { id:'sync',      label:'🔄 Sync'     },
  ];

  const tabsHtml = ADMIN_TABS.map(t =>
    `<button class="pill ${adminTab===t.id?'active':''}" data-admin-tab="${t.id}">${t.label}</button>`
  ).join('');

  const roundLabel = r => r.label.replace('Group Stage – Round ', 'Group Stage ');

  let tabContent = '';

  // ── Results tab ──────────────────────────────────────────────
  if (adminTab === 'results') {
    const round = ROUNDS[S.activeRound];
    const rid   = round.id;

    const pillsHtml = Object.values(ROUNDS).map(r => {
      const lk = S.roundSettings[r.id]?.locked;
      const shortLabel = r.id === 'pt' ? 'Pre-Tournament' : roundLabel(r);
      return `<button class="pill ${lk?'locked':''} ${S.activeRound===r.id?'active':''}" data-r="${r.id}">
        ${shortLabel} ${lk?'🔒':''}
      </button>`;
    }).join('');

    // ── Pre-tournament results panel ─────────────────────────────
    if (round.special === 'pretournament') {
      const winPts = S.ptSettings?.winnerPts ?? 10;
      const winnerRes = S.bonusResults['pt']?.['pt_winner']?.answer || '';
      const allTeams = Object.values(GROUPS).flat().sort();

      const groupResultsHtml = Object.entries(GROUPS).map(([g, teams]) => {
        const r1 = S.bonusResults['pt']?.[`pt_${g}_1`]?.answer || '';
        const r2 = S.bonusResults['pt']?.[`pt_${g}_2`]?.answer || '';
        const opts1 = teams.map(t => `<option value="${t}" ${r1===t?'selected':''}>${F(t)} ${t}</option>`).join('');
        const opts2 = teams.map(t => `<option value="${t}" ${r2===t?'selected':''}>${F(t)} ${t}</option>`).join('');
        return `<div class="admin-match-row" style="flex-wrap:wrap;gap:10px;align-items:center">
          <span class="admin-match-label">Group ${g}
            <span style="color:var(--faint);font-size:9px;font-family:var(--mono)"> ${teams.join(' / ')}</span>
          </span>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">1ST</span>
            <select class="admin-select" data-action="pt-result-group" data-g="${g}" data-pos="1" style="min-width:140px">
              <option value="">— Team —</option>${opts1}
            </select>
            <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">2ND</span>
            <select class="admin-select" data-action="pt-result-group" data-g="${g}" data-pos="2" style="min-width:140px">
              <option value="">— Team —</option>${opts2}
            </select>
          </div>
        </div>`;
      }).join('');

      const allTeamOpts = allTeams.map(t => `<option value="${t}" ${winnerRes===t?'selected':''}>${F(t)} ${t}</option>`).join('');

      tabContent = `
        <div class="pill-row">${pillsHtml}</div>
        <div class="card" style="border-color:rgba(255,215,0,0.2);margin-bottom:12px">
          <div class="card-title" style="color:var(--gold)">⚙️ Pre-Tournament Settings</div>
          <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
            <div>
              <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px">Tournament winner points</label>
              <input id="pt-winner-pts-input" class="admin-score" type="number" min="1" max="100"
                value="${winPts}" style="width:64px;font-size:14px;font-weight:700;text-align:center">
            </div>
            <button class="btn btn-gold btn-sm" id="save-pt-winner-pts-btn">Save</button>
          </div>
        </div>
        <div class="card">
          <div class="card-title">🏆 Group Standings Results</div>
          <p style="color:var(--muted);font-size:11px;margin-bottom:12px">Set the actual 1st and 2nd place finisher for each group to auto-score all player predictions.</p>
          ${groupResultsHtml}
        </div>
        <div class="card" style="border-color:rgba(232,213,163,0.2)">
          <div class="card-title">🏆 Tournament Winner Result</div>
          <div class="admin-match-row">
            <span class="admin-match-label">Who will win the 2026 World Cup?</span>
            <select class="admin-select" data-action="pt-result-winner" style="min-width:180px">
              <option value="">— Winner —</option>${allTeamOpts}
            </select>
          </div>
        </div>
        ${(() => {
          const players = S.profiles.filter(p => !p.is_admin);
          const ptBr = S.bonusResults['pt'] || {};
          const groupsWithResults = Object.keys(GROUPS).filter(g => ptBr[`pt_${g}_1`]?.answer || ptBr[`pt_${g}_2`]?.answer).length;
          const winnerSet = !!ptBr['pt_winner']?.answer;

          const previewRows = players.map(p => {
            const ptBa = S.bonusAnswers[p.id]?.['pt'] || {};
            let groupPts = 0, winnerPtsEarned = 0;
            const groupDetails = Object.entries(GROUPS).map(([g, teams]) => {
              const p1 = ptBa[`pt_${g}_1`]?.answer, p2 = ptBa[`pt_${g}_2`]?.answer;
              const r1 = ptBr[`pt_${g}_1`]?.answer,  r2 = ptBr[`pt_${g}_2`]?.answer;
              if (!r1 && !r2) return null;
              const qualified = new Set([r1, r2].filter(Boolean));
              let gPts = 0;
              if (p1) { if (p1 === r1) gPts += 2; else if (r1 && qualified.has(p1)) gPts += 1; }
              if (p2) { if (p2 === r2) gPts += 2; else if (r2 && qualified.has(p2)) gPts += 1; }
              groupPts += gPts;
              return `<span title="Group ${g}: ${p1||'—'} / ${p2||'—'}" style="font-size:10px;font-family:var(--mono);
                color:${gPts===4?'#66bb6a':gPts>0?'#90caf9':'var(--faint)'}">${g}:${gPts}</span>`;
            }).filter(Boolean).join(' ');
            const wPick = ptBa['pt_winner']?.answer, wRes = ptBr['pt_winner']?.answer;
            if (wPick && wRes && wPick === wRes) winnerPtsEarned = winPts;
            const totalPt = groupPts + winnerPtsEarned;
            return `<tr>
              <td style="padding:8px;color:var(--text)">${p.nickname||p.name}</td>
              <td style="padding:8px;font-size:10px;font-family:var(--mono)">${groupDetails || '<span style="color:var(--faint)">no picks</span>'}</td>
              <td style="padding:8px;text-align:center;color:#90caf9;font-family:var(--mono)">${groupPts}</td>
              <td style="padding:8px;text-align:center;color:${winnerPtsEarned>0?'#66bb6a':'var(--muted)'};font-family:var(--mono)">
                ${wPick ? (wRes ? (winnerPtsEarned > 0 ? `+${winnerPtsEarned} ✅` : '0 ❌') : wPick) : '—'}
              </td>
              <td style="padding:8px;text-align:right;font-weight:700;color:#4CAF50;font-family:var(--mono)">${totalPt}</td>
            </tr>`;
          }).join('');

          return `<div class="card" style="border-color:rgba(76,175,80,0.2);margin-top:4px">
            <div class="card-title" style="color:#66bb6a;margin-bottom:10px">📊 Live Score Preview</div>
            <p style="color:var(--muted);font-size:11px;margin-bottom:10px">
              Groups with results set: <strong style="color:var(--text)">${groupsWithResults} / 12</strong>
              · Tournament winner: <strong style="color:${winnerSet?'#66bb6a':'var(--faint)'}">${winnerSet ? ptBr['pt_winner'].answer : 'not set'}</strong>
            </p>
            ${players.length === 0
              ? '<p style="color:var(--muted);font-size:13px">No players registered yet.</p>'
              : `<table style="width:100%;border-collapse:collapse;font-size:12px">
                <thead><tr style="border-bottom:1px solid var(--gold)">
                  <th style="padding:5px 8px;text-align:left;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:0.1em">PLAYER</th>
                  <th style="padding:5px 8px;color:var(--muted);font-family:var(--mono);font-size:10px">GROUP BREAKDOWN</th>
                  <th style="padding:5px 8px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:10px">GROUP PTS</th>
                  <th style="padding:5px 8px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:10px">WINNER</th>
                  <th style="padding:5px 8px;text-align:right;color:var(--muted);font-family:var(--mono);font-size:10px">TOTAL</th>
                </tr></thead>
                <tbody>${previewRows}</tbody>
              </table>`}
          </div>`;
        })()}`;

    } else {
      // ── Regular round results panel ────────────────────────────
      const matchResultsHtml = round.matches.map(m => {
        const res  = S.results[rid]?.[m.id] || {};
        const homeTeam = getBracketTeam(m.id, 'home', m.home);
        const awayTeam = getBracketTeam(m.id, 'away', m.away);
        const opts = [homeTeam, ...(!round.knockout?['Draw']:[]), awayTeam];
        const selOpts = opts.map(o => `<option value="${o}" ${res.winner===o?'selected':''}>${o}</option>`).join('');
        const matchLabel = m.label ? `<span style="font-size:10px;color:#ff7043;margin-left:6px">[${m.label}]</span>` : '';
        return `<div class="admin-match-row">
          <span class="admin-match-label">${F(homeTeam)} ${homeTeam} vs ${F(awayTeam)} ${awayTeam}${matchLabel}</span>
          <select class="admin-select" data-action="result-winner" data-rid="${rid}" data-mid="${m.id}">
            <option value="">– Winner –</option>${selOpts}
          </select>
          <input class="admin-score" type="number" min="0" placeholder="H" value="${res.score_home??''}"
            data-action="result-sh" data-rid="${rid}" data-mid="${m.id}">
          <span class="vs">–</span>
          <input class="admin-score" type="number" min="0" placeholder="A" value="${res.score_away??''}"
            data-action="result-sa" data-rid="${rid}" data-mid="${m.id}">
        </div>`;
      }).join('');

      const bonusResultsHtml = getActiveQuestions(rid).map(bq => {
        const correct = S.bonusResults[rid]?.[bq.id]?.answer || '';
        const opts = bq.opts.map(o => `<option value="${o}" ${correct===o?'selected':''}>${o}</option>`).join('');
        return `<div class="admin-match-row">
          <span class="admin-match-label" style="font-size:11px">${bq.text}</span>
          <select class="admin-select" data-action="bonus-result" data-rid="${rid}" data-qid="${bq.id}">
            <option value="">– Answer –</option>${opts}
          </select>
        </div>`;
      }).join('');

      const { match: mMult, bonus: bMult } = getMultipliers(rid);
      tabContent = `
        <div class="pill-row">${pillsHtml}</div>
        <div class="card" style="border-color:rgba(100,150,255,0.2);margin-bottom:12px">
          <div class="card-title" style="color:#90caf9">✖ Points Multipliers — ${roundLabel(round)}</div>
          <p style="color:var(--muted);font-size:11px;margin-bottom:14px">Multiply base points for this round. Knockout wagers are never multiplied.</p>
          <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end">
            <div>
              <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px">Match picks (×)</label>
              <input id="mult-match" class="admin-score" type="number" min="0.5" max="10" step="0.5"
                value="${mMult}" style="width:64px;font-size:14px;font-weight:700;text-align:center">
            </div>
            <div>
              <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px">Bonus questions (×)</label>
              <input id="mult-bonus" class="admin-score" type="number" min="0.5" max="10" step="0.5"
                value="${bMult}" style="width:64px;font-size:14px;font-weight:700;text-align:center">
            </div>
            <button class="btn btn-gold btn-sm" id="save-mult-btn" data-rid="${rid}">Save multipliers</button>
          </div>
          <p style="color:var(--faint);font-size:10px;margin-top:10px">
            Current: correct pick = ${2*mMult} pts · exact score = ${1*mMult} pts · bonus base pts × ${bMult}
          </p>
        </div>
        ${round.knockout ? `
        <div class="card" style="border-color:rgba(100,160,220,0.3)">
          <div class="card-title" style="color:#90caf9">🔗 Bracket Team Names</div>
          <p style="color:var(--muted);font-size:11px;margin-bottom:14px">
            Fill in the actual team names for each slot as they qualify.
            These replace placeholders (like "1A") everywhere in the app — picks, bracket, and result dropdowns.
            The API cannot determine these automatically.
          </p>
          ${round.matches.map(m => {
            const homeVal = S.bracketTeams[m.id]?.home || '';
            const awayVal = S.bracketTeams[m.id]?.away || '';
            const matchLabel = m.label ? ` [${m.label}]` : '';
            return `<div class="admin-match-row" style="flex-wrap:wrap;gap:8px;align-items:center">
              <span class="admin-match-label" style="color:var(--muted);font-size:10px">${m.home} vs ${m.away}${matchLabel}</span>
              <input class="admin-score" type="text" placeholder="${m.home}" value="${homeVal}"
                style="width:130px;font-size:11px" data-action="bracket-team" data-mid="${m.id}" data-side="home">
              <span class="vs">vs</span>
              <input class="admin-score" type="text" placeholder="${m.away}" value="${awayVal}"
                style="width:130px;font-size:11px" data-action="bracket-team" data-mid="${m.id}" data-side="away">
              ${(homeVal || awayVal) ? `<button class="btn btn-sm btn-outline" style="font-size:9px;padding:3px 8px"
                data-action="clear-bracket-team" data-mid="${m.id}">✕ Clear</button>` : ''}
            </div>`;
          }).join('')}
        </div>` : ''}
        <div class="card" style="border-color:rgba(255,112,67,0.2)">
          <div class="card-title" style="color:#ff7043">⏱ Kickoff Times & Auto-Lock</div>
          <p style="color:var(--muted);font-size:11px;margin-bottom:14px">
            Each match auto-locks 1 hour before kickoff. Adjust times here if a match is delayed — changes are saved locally on this device.
          </p>
          ${round.matches.map(m => {
            const ko = getKickoff(m.id, m.kickoff);
            const localVal = toDatetimeLocal(ko);
            const isOverridden = !!S.kickoffOverrides[m.id];
            const localDisplay = ko ? new Date(ko).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : 'No time set';
            return `<div class="admin-match-row" style="flex-wrap:wrap;gap:10px;align-items:center">
              <span class="admin-match-label">${F(m.home)} ${m.home} vs ${F(m.away)} ${m.away}${isOverridden ? ' <span style="color:#ff7043;font-size:9px;font-family:var(--mono)">ADJUSTED</span>' : ''}</span>
              <input type="datetime-local" class="admin-score" style="width:190px;font-family:var(--mono);font-size:11px"
                value="${localVal}" data-action="set-kickoff" data-mid="${m.id}">

// ── Dashboard ─────────────────────────────────────────────────────
function calcRoundScore(uid, rid) {
  if (rid === 'pt') {
    let pts = 0;
    const ptBa = S.bonusAnswers[uid]?.['pt'] || {};
    const ptBr = S.bonusResults['pt'] || {};
    for (const g of Object.keys(GROUPS)) {
      const p1 = ptBa[`pt_${g}_1`]?.answer, p2 = ptBa[`pt_${g}_2`]?.answer;
      const r1 = ptBr[`pt_${g}_1`]?.answer,  r2 = ptBr[`pt_${g}_2`]?.answer;
      if (!r1 && !r2) continue;
      const qualified = new Set([r1, r2].filter(Boolean));
      if (p1) { if (p1 === r1) pts += 2; else if (r1 && qualified.has(p1)) pts += 1; }
      if (p2) { if (p2 === r2) pts += 2; else if (r2 && qualified.has(p2)) pts += 1; }
    }
    const winPts = S.ptSettings?.winnerPts ?? 10;
    const winPick = ptBa['pt_winner']?.answer, winRes = ptBr['pt_winner']?.answer;
    if (winPick && winRes && winPick === winRes) pts += winPts;
    return pts;
  }
  const round = ROUNDS[rid];
  if (!round) return 0;
  let pts = 0;
  const { match: mMult, bonus: bMult } = getMultipliers(rid);
  for (const m of round.matches) {
    const pick   = S.picks[uid]?.[rid]?.[m.id];
    const result = S.results[rid]?.[m.id];
    if (!pick || !result || !result.winner) continue;
    if (pick.winner && pick.winner === result.winner) pts += 2 * mMult;
    const sh = String(pick.score_home ?? ''), sa = String(pick.score_away ?? '');
    const rh = String(result.score_home ?? ''), ra = String(result.score_away ?? '');
    if (sh !== '' && rh !== '' && sh === rh && sa === ra) pts += 1 * mMult;
  }
  for (const bq of getActiveQuestions(rid)) {
    const ans     = S.bonusAnswers[uid]?.[rid]?.[bq.id];
    const correct = S.bonusResults[rid]?.[bq.id];
    if (!ans || !correct || !correct.answer || !ans.answer) continue;
    if (ans.answer === correct.answer) {
      const wager = round.knockout ? (Number(ans.wager) || 0) : 0;
      pts += (bq.pts * bMult) + wager;
    } else if (round.knockout && Number(ans.wager) > 0) {
      pts -= Number(ans.wager);
    }
  }
  return pts;
}

// ── Group Standings ───────────────────────────────────────────────
function computeGroupStandings() {
  const standings = {};
  for (const [g, teams] of Object.entries(GROUPS)) {
    standings[g] = teams.map(t => ({ team: t, played:0, won:0, drawn:0, lost:0, gf:0, ga:0, gd:0, pts:0 }));
  }
  for (const rid of ['gs1','gs2','gs3']) {
    const round = ROUNDS[rid];
    if (!round) continue;
    for (const m of round.matches) {
      const result = S.results[rid]?.[m.id];
      if (!result?.winner || result.score_home === '' || result.score_home == null) continue;
      const sh = parseInt(result.score_home), sa = parseInt(result.score_away);
      if (isNaN(sh) || isNaN(sa)) continue;
      let grp = null;
      for (const [g, teams] of Object.entries(GROUPS)) {
        if (teams.includes(m.home) && teams.includes(m.away)) { grp = g; break; }
      }
      if (!grp) continue;
      const home = standings[grp].find(t => t.team === m.home);
      const away = standings[grp].find(t => t.team === m.away);
      if (!home || !away) continue;
      home.played++; away.played++;
      home.gf += sh; home.ga += sa;
      away.gf += sa; away.ga += sh;
      if (sh > sa)      { home.won++; home.pts += 3; away.lost++; }
      else if (sa > sh) { away.won++; away.pts += 3; home.lost++; }
      else              { home.drawn++; home.pts++; away.drawn++; away.pts++; }
    }
  }
  for (const g of Object.keys(standings)) {
    for (const t of standings[g]) t.gd = t.gf - t.ga;
    standings[g].sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.team.localeCompare(b.team));
  }
  return standings;
}

        ? Math.round((t.pts / (teams[0].pts || 1)) * 100) : 0;
      return `<tr style="border-bottom:1px solid var(--border2)">
        <td style="padding:7px 8px;width:20px">

          ${F(t.team)} ${t.team}

      </div>

        <thead><tr style="border-bottom:1px solid var(--border2)">
          <th style="padding:5px 8px;width:20px"></th>

          <th style="padding:5px 6px;text-align:center;color:var(--muted);font-size:10px;font-family:var(--mono)" title="Played">P</th>
          <th style="padding:5px 6px;text-align:center;color:var(--muted);font-size:10px;font-family:var(--mono)" title="Won">W</th>
          <th style="padding:5px 6px;text-align:center;color:var(--muted);font-size:10px;font-family:var(--mono)" title="Drawn">D</th>
          <th style="padding:5px 6px;text-align:center;color:var(--muted);font-size:10px;font-family:var(--mono)" title="Lost">L</th>
          <th style="padding:5px 6px;text-align:center;color:var(--muted);font-size:10px;font-family:var(--mono)" title="Goal Difference">GD</th>
          <th style="padding:5px 8px;text-align:right;color:var(--muted);font-size:10px;font-family:var(--mono)" title="Points">PTS</th>

  }).join('');

  return `

    </p>
    ${!anyResults ? `<div class="notice" style="margin-bottom:16px">No group stage results have been entered yet.</div>` : '<div style="margin-bottom:16px"></div>'}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:8px">
      ${groupCards}
    </div>`;
}

function renderDashboard() {
  const lb      = getLeaderboard();
  const maxPts  = lb[0]?.total || 1;
  const medal   = r => ['🥇','🥈','🥉'][r-1] || `#${r}`;
  const getName = p => p?.nickname || p?.name || '—';

  const playedRounds = Object.values(ROUNDS).filter(round =>
    round.matches.some(m => S.results[round.id]?.[m.id]?.winner)
  );
  const lastRound = playedRounds[playedRounds.length - 1];

  let roundLeader = null, roundLeaderPts = 0;
  if (lastRound) {
    S.profiles.forEach(p => {
      const pts = calcRoundScore(p.id, lastRound.id);
      if (pts > roundLeaderPts) { roundLeaderPts = pts; roundLeader = p; }
    });
  }

  let mostCorrect = null, mostCorrectN = -1;
  let exactKing   = null, exactKingN   = -1;
  S.profiles.forEach(p => {
    const { correctPicks, exactScores } = calcScore(p.id);
    if (correctPicks > mostCorrectN) { mostCorrectN = correctPicks; mostCorrect = p; }
    if (exactScores  > exactKingN)   { exactKingN   = exactScores;  exactKing   = p; }
  });

  const statsCards = [
    { icon:'👥', value: S.profiles.length,  label:'Total Players', color:'#1565c0' },
    { icon:'🥇', value: getName(lb[0]),      label:'Leader',        color:'#b8860b' },
    { icon:'⚡', value: lb[0]?.total ?? 0,   label:'Top Score',     color:'#2e7d32' },
    { icon:'📅', value: playedRounds.length, label:'Rounds Played', color:'#6a1b9a' },
  ].map(s => `<div class="stat-card">
    <div class="stat-icon">${s.icon}</div>
    <div class="stat-value" style="color:${s.color}">${s.value}</div>
    <div class="stat-label">${s.label}</div>

  const standingsRows = lb.length
    ? lb.map((p, i) => {
        const barW = Math.round((p.total / maxPts) * 100);
        return `<div class="player-row">
          <span style="width:28px;font-size:${i<3?18:13}px;text-align:center;flex-shrink:0">${medal(p.rank)}</span>
          <span style="color:var(--text);font-size:13px;min-width:80px;flex-shrink:0">${getName(p)}</span>
          <div class="mini-bar-wrap"><div class="mini-bar" style="width:${barW}%"></div></div>
          <span style="color:var(--green);font-weight:700;font-size:15px;min-width:32px;text-align:right">${p.total}</span>
        </div>`;
      }).join('')
    : '<p style="color:var(--muted);text-align:center;font-size:13px">No data yet.</p>';

  const hlCard = (icon, title, player, stat) => `<div class="highlight-card">
    <div class="highlight-label">${icon} ${title}</div>
    ${player
      ? `<div class="highlight-name">${getName(player)}</div><div class="highlight-stat">${stat}</div>`
      : `<div style="color:var(--muted);font-size:12px">No data yet</div>`}
  </div>`;

  let roundsTableHtml = '';
  if (playedRounds.length > 0) {
    const headerCells = playedRounds.map(r => `<th>${r.id.toUpperCase()}</th>`).join('');
    const rows = lb.map(p => {
      const cells = playedRounds.map(r =>
        `<td style="color:#90caf9">${calcRoundScore(p.id, r.id)}</td>`
      ).join('');
      return `<tr>
        <td>${getName(p)}</td>${cells}
        <td style="color:var(--green);font-weight:700">${p.total}</td>
      </tr>`;
    }).join('');
    roundsTableHtml = `<div class="card" style="margin-top:4px">
      <div class="card-title">📊 Points by Round</div>
      <div style="overflow-x:auto">
        <table class="rounds-table">
          <thead><tr>
            <th>Player</th>${headerCells}<th style="color:var(--gold)">Total</th>
          </tr></thead>
          <tbody>${rows}</tbody>
